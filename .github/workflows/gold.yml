name: gold-monthly
on:
  schedule:
    - cron: '23 10 * * *'   # 17:23 เวลาไทย ทุกวัน
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/gold.py
      - name: commit
        run: |
          git diff --quiet stocks/gold.json && exit 0
          git config user.name "gold-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks/gold.json
          git commit -m "gold: อัปเดตราคาทองสูงสุดรายเดือน"
          git push
