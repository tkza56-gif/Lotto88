// วาดใบโพยลง canvas (รูป PNG / หน้า PDF) · คืน { canvas, breaks } — breaks = จุดตัดหน้าที่ไม่ผ่ากลางแถว
async function drawSlipCanvas(slip) {
  try {
    await Promise.all(['700 30px Cinzel', '700 30px Mitr', '600 26px Mitr', '400 24px "Bai Jamjuree"', '700 24px "Bai Jamjuree"']
      .map((f) => document.fonts.load(f, 'ROYAL ๘๘๘ ฿0')));
  } catch (e) {}
  const W = 720, PAD = 28;
  const H_HEAD = 96, H_META = 62, H_SEC = 56, H_ROW = 60, H_TOT = 72, H_EXTRA = 54, H_FOOT = 56;
  let H = H_HEAD + H_META + H_TOT + H_FOOT + slip.extra.length * H_EXTRA;
  slip.sections.forEach((s) => { H += (s.title ? H_SEC : 0) + s.rows.length * H_ROW; });
  // จำกัดขนาด canvas (iOS ~16 ล้านพิกเซล · Chrome สูงไม่เกิน 32767)
  const scale = Math.max(0.5, Math.min(2, Math.sqrt(15e6 / (W * H)), 32000 / H));
  const cv = document.createElement('canvas');
  cv.width = Math.round(W * scale); cv.height = Math.round(H * scale);
  const g = cv.getContext('2d');
  g.scale(scale, scale);
  const TH = '"Bai Jamjuree", "Noto Sans Thai", sans-serif', NUM = 'Mitr, "Bai Jamjuree", sans-serif';
  const fit = (t, maxW) => { t = String(t); if (g.measureText(t).width <= maxW) return t; while (t.length > 1 && g.measureText(t + '…').width > maxW) t = t.slice(0, -1); return t + '…'; };
  // ยาวเกินช่อง → ย่อขนาดตัวอักษรลงก่อน (ไม่ต่ำกว่า 60%) ค่อยตัด … เป็นทางสุดท้าย
  const text = (t, x, y, font, color, align = 'left', maxW = W) => {
    g.font = font; g.fillStyle = color; g.textAlign = align; g.textBaseline = 'middle';
    const m = font.match(/(\d+)px/), base = m ? +m[1] : 24;
    for (let px = base; px >= Math.round(base * 0.6) && g.measureText(String(t)).width > maxW; px--) g.font = font.replace(/\d+px/, px + 'px');
    g.fillText(fit(t, maxW), x, y);
  };
  const breaks = [];
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
  // หัว
  const hg = g.createLinearGradient(0, 0, 0, H_HEAD); hg.addColorStop(0, '#2f2f2f'); hg.addColorStop(1, '#1f1f1f');
  g.fillStyle = hg; g.fillRect(0, 0, W, H_HEAD);
  text('♛ ROYAL 888', PAD, 36, '700 30px Cinzel, serif', SLIP_C.gold);
  text(slip.kind, PAD, 70, '400 22px ' + TH, 'rgba(245,232,200,.8)');
  text(slip.lottery, W - PAD, 34, '400 22px ' + TH, 'rgba(245,232,200,.8)', 'right', 300);
  text(slip.draw, W - PAD, 66, '700 28px ' + NUM, SLIP_C.cream, 'right', 300);
  let y = H_HEAD;
  g.fillStyle = '#fcfaf4'; g.fillRect(0, y, W, H_META);
  g.font = '400 22px ' + TH; const lw = g.measureText(slip.whoLabel + ' ').width;
  text(slip.whoLabel, PAD, y + H_META / 2, '400 22px ' + TH, SLIP_C.sub);
  text(slip.who, PAD + lw, y + H_META / 2, '700 26px ' + TH, SLIP_C.ink, 'left', W - PAD * 2 - lw - 220);
  text(slip.time + ' · ' + slip.count + ' รายการ', W - PAD, y + H_META / 2, '400 22px ' + TH, SLIP_C.sub, 'right');
  g.fillStyle = SLIP_C.line; g.fillRect(0, y + H_META - 1, W, 1);
  y += H_META; breaks.push(y);
  for (const sec of slip.sections) {
    if (sec.title) {
      g.fillStyle = '#f3eee2'; g.fillRect(0, y, W, H_SEC);
      text('👤 ' + sec.title, PAD, y + H_SEC / 2, '700 26px ' + TH, SLIP_C.ink, 'left', W - PAD * 2 - 260);
      text(sec.sub, W - PAD, y + H_SEC / 2, '600 24px ' + NUM, SLIP_C.g3, 'right');
      y += H_SEC;
    }
    for (const r of sec.rows) {
      const cy = y + H_ROW / 2;
      if (r.win) { g.fillStyle = '#f2fbf5'; g.fillRect(0, y, W, H_ROW); }
      g.globalAlpha = r.dim ? 0.55 : 1;
      if (sec.nameRows) {
        text(r.name, PAD, cy, '700 26px ' + TH, SLIP_C.ink, 'left', 330);
        text(r.types, 400, cy, '400 22px ' + TH, SLIP_C.sub);
      } else {
        text(r.num, PAD, cy, '700 38px ' + NUM, r.num.length === 3 ? SLIP_C.g3 : SLIP_C.g2);
        text(r.types + (r.half ? '  · จ่ายครึ่ง' : ''), 150, cy, '400 24px ' + TH, r.half ? SLIP_C.half : SLIP_C.sub, 'left', 300);
      }
      text(r.amts, W - PAD, cy, '600 26px ' + NUM, r.win ? '#15803d' : SLIP_C.ink, 'right', 260);
      g.globalAlpha = 1;
      g.strokeStyle = '#eee4cc'; g.setLineDash([2, 4]); g.beginPath(); g.moveTo(PAD, y + H_ROW - 0.5); g.lineTo(W - PAD, y + H_ROW - 0.5); g.stroke(); g.setLineDash([]);
      y += H_ROW; breaks.push(y);
    }
  }
  g.fillStyle = '#fbf6ea'; g.fillRect(0, y, W, H_TOT);
  text(slip.totalLabel || 'รวม', PAD, y + H_TOT / 2, '700 26px ' + TH, SLIP_C.ink, 'left', 360);
  text('฿' + fmt(slip.total), W - PAD, y + H_TOT / 2, '700 36px ' + NUM, slip.totalColor || SLIP_C.g3, 'right');
  y += H_TOT; breaks.push(y);
  for (const [k, v] of slip.extra) {
    g.fillStyle = SLIP_C.line; g.fillRect(0, y, W, 1);
    text(k, PAD, y + H_EXTRA / 2, '400 22px ' + TH, SLIP_C.sub, 'left', 470);
    text(v, W - PAD, y + H_EXTRA / 2, '700 24px ' + NUM, SLIP_C.ink, 'right');
    y += H_EXTRA; breaks.push(y);
  }
  text(slip.footer || 'ตรวจรายการก่อนออกผล · Royal 888', W / 2, y + H_FOOT / 2, '400 20px ' + TH, '#a99c7d', 'center');
  breaks.push(H);
  return { canvas: cv, breaks, scale, W, H };
}

const canvasBlob = (cv, type = 'image/png', q) => new Promise((res, rej) => cv.toBlob((b) => (b ? res(b) : rej(new Error('blob'))), type, q));
const safeName = (s) => String(s).replace(/[\\/:*?"<>|\s]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 60) || 'โพย';

async function deliverFile(blob, filename, preferShare) {
  const file = new File([blob], filename, { type: blob.type });
  if (preferShare && navigator.canShare && navigator.share) {
    try {
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return 'shared'; }
    } catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return 'downloaded';
}

async function slipToPdfBlob(slip) {
  const lib = await loadLib('pdf');
  const { canvas, breaks, scale, W, H } = await drawSlipCanvas(slip);
  const doc = new lib.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
  const M = 10, PW = 210 - M * 2, PH = 297 - M * 2;
  const pageCss = W * (PH / PW);                 // ความสูง (px ใบโพย) ที่ใส่ได้ 1 หน้า
  let top = 0, first = true;
  while (top < H - 1) {
    let bottom = Math.min(H, top + pageCss);
    if (bottom < H) { const ok = breaks.filter((b) => b > top && b <= bottom); if (ok.length) bottom = ok[ok.length - 1]; }
    const part = document.createElement('canvas');
    part.width = canvas.width; part.height = Math.max(1, Math.round((bottom - top) * scale));
    const pg = part.getContext('2d'); pg.fillStyle = '#fff'; pg.fillRect(0, 0, part.width, part.height);
    pg.drawImage(canvas, 0, Math.round(top * scale), canvas.width, part.height, 0, 0, part.width, part.height);
    if (!first) doc.addPage();
    doc.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', M, M, PW, (bottom - top) * (PW / W));
    first = false; top = bottom;
  }
  return doc.output('blob');
}

async function betsToXlsxBlob(bets, lottery, drawDate) {
  const XLSX = await loadLib('xlsx');
  const sorted = [...bets].sort((a, b) => custOf(a).localeCompare(custOf(b), 'th') || (a.createdAt || 0) - (b.createdAt || 0));
  const rows = [['ลูกค้า', 'เลข', 'ประเภท', 'ราคา (บาท)', 'อัตราจ่าย', 'จ่ายครึ่ง', 'งวด', 'หวย']];
  for (const b of sorted) rows.push([custOf(b), String(b.number), typeFullName(b.type), parseFloat(b.amount) || 0, parseFloat(b.rate) || 0, b.halfPay ? 'ใช่' : '', formatDrawDateShort(drawDate), lottery.name]);
  rows.push(['รวม', '', sorted.length + ' รายการ', sumAmt(sorted), '', '', '', '']);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch: 18 }, { wch: 7 }, { wch: 11 }, { wch: 11 }, { wch: 9 }, { wch: 8 }, { wch: 11 }, { wch: 12 }];
  for (let r = 1; r < rows.length - 1; r++) { const c = ws[XLSX.utils.encode_cell({ r, c: 1 })]; if (c) { c.t = 's'; c.z = '@'; } }
  const custs = getUniqueCustomers(sorted);
  const srows = [['ลูกค้า', 'รายการ', 'ยอด (บาท)']];
  for (const c of custs) { const it = sorted.filter((b) => custOf(b) === c); srows.push([c, it.length, sumAmt(it)]); }
  srows.push(['รวม', sorted.length, sumAmt(sorted)]);
  const ws2 = XLSX.utils.aoa_to_sheet(srows);
  ws2['!cols'] = [{ wch: 20 }, { wch: 8 }, { wch: 12 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'โพย');
  XLSX.utils.book_append_sheet(wb, ws2, 'สรุป');
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  return new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

function ExportContent({ bets, lottery, drawDate, caps = [], rates = {} }) {
  const toast = useToast();
  const enriched = useMemo(() => enrichBetsWithCaps(bets, caps, rates), [bets, caps, rates]);
  const customers = useMemo(() => getUniqueCustomers(enriched), [enriched]);
  const [mode, setMode] = useState('customer');
  const [cust, setCust] = useState(customers[0] || null);
  const [busy, setBusy] = useState('');
  const custSel = customers.includes(cust) ? cust : customers[0];
  const slip = useMemo(() => buildSlip(mode, enriched, lottery, drawDate, custSel), [mode, enriched, lottery, drawDate, custSel]);
  const scopeBets = useMemo(() => (mode === 'customer' ? enriched.filter((b) => custOf(b) === custSel) : enriched), [mode, enriched, custSel]);
  const baseName = safeName('โพย_' + lottery.name + '_' + drawDate + (mode === 'customer' ? '_' + custSel : mode === 'list' ? '_ทุกคน' : '_สรุป'));

  // เตรียมรูปไว้ก่อน → กดแล้วแชร์ได้ทันที (iOS ต้องแชร์ภายในจังหวะที่นิ้วแตะ)
  const pngRef = useRef(null);
  useEffect(() => {
    let alive = true; pngRef.current = null;
    const t = setTimeout(async () => {
      try { const { canvas } = await drawSlipCanvas(slip); const b = await canvasBlob(canvas); if (alive) pngRef.current = b; } catch (e) {}
    }, 150);
    return () => { alive = false; clearTimeout(t); };
  }, [slip]);

  const text = useMemo(() => {
    if (mode === 'customer') return formatPerCustomerForLine(enriched, lottery, drawDate, custSel);
    if (mode === 'list') return formatListForLine(enriched, lottery, drawDate);
    return formatSummaryForLine(enriched, lottery, drawDate);
  }, [mode, enriched, lottery, drawDate, custSel]);

  const run = async (key, fn) => {
    if (busy) return;
    setBusy(key);
    try { await fn(); }
    catch (e) { toast.show(e && e.message === 'load' ? 'ต้องต่อเน็ตครั้งแรกเพื่อโหลดตัวสร้างไฟล์' : 'สร้างไฟล์ไม่สำเร็จ ลองใหม่', 'error', 4000); }
    finally { setBusy(''); }
  };
  const doImage = () => run('img', async () => {
    let blob = pngRef.current;
    if (!blob) { const { canvas } = await drawSlipCanvas(slip); blob = await canvasBlob(canvas); }
    const r = await deliverFile(blob, baseName + '.png', true);
    if (r === 'downloaded') toast.show('บันทึกรูปแล้ว · ส่งใน LINE ได้เลย', 'success');
  });
  const copyText = async () => {
    try { await navigator.clipboard.writeText(text); }
    catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    toast.show('คัดลอกแล้ว · ไปวางใน LINE ได้เลย', 'success');
  };
  const doText = async () => {
    if (navigator.share) { try { await navigator.share({ text }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    copyText();
  };
  const doXlsx = () => run('xlsx', async () => {
    const blob = await betsToXlsxBlob(scopeBets, lottery, drawDate);
    await deliverFile(blob, baseName + '.xlsx', false);
    toast.show('ดาวน์โหลด Excel แล้ว', 'success');
  });
  const doPdf = () => run('pdf', async () => {
    const blob = await slipToPdfBlob(slip);
    await deliverFile(blob, baseName + '.pdf', false);
    toast.show('ดาวน์โหลด PDF แล้ว', 'success');
  });

  const segBtn = (key, label) => (
    <button key={key} onClick={() => setMode(key)} data-testid={'exp-' + key}
      className="py-2.5 rounded-lg text-base font-display font-bold"
      style={mode === key ? { background: '#fff', color: '#2a2a2a', boxShadow: '0 2px 6px rgba(184,150,90,.18)' } : { color: '#6b6357' }}>{label}</button>
  );
  const opt = (key, icon, label, small, onClick, line) => (
    <button key={key} onClick={onClick} disabled={!!busy} data-testid={'exp-' + key}
      className="rounded-2xl border px-2 py-3 text-center font-display font-bold text-base active:scale-95 disabled:opacity-60"
      style={line ? { background: '#effcf3', borderColor: '#a7e9be', color: '#047a37' } : { background: '#fff', borderColor: '#e8dfc8', color: '#2a2a2a' }}>
      <span className="block text-2xl leading-tight">{busy === key ? '⏳' : icon}</span>{label}

// ==================== ผลออกแล้ว · ใบได้/เสีย ====================
function settleDraw(bets, results, caps, rates) {
  const rows = bets.map((b) => ({ b, ...betPayout(b, results, caps, rates) }));
  const byCust = new Map();
  for (const r of rows) {
    const c = custOf(r.b);
    if (!byCust.has(c)) byCust.set(c, { name: c, buy: 0, won: 0, wins: 0, rows: [] });
    const g = byCust.get(c);
    g.buy += r.amt; g.won += r.payout; g.wins += r.hit ? 1 : 0; g.rows.push(r);
  }
  const customers = [...byCust.values()].map((g) => ({ ...g, net: g.won - g.buy }))
    .sort((a, b) => (a.name === NO_NAME) - (b.name === NO_NAME) || b.won - a.won || a.name.localeCompare(b.name, 'th'));
  const intake = rows.reduce((s, r) => s + r.amt, 0), payout = rows.reduce((s, r) => s + r.payout, 0);
  return { rows, wins: rows.filter((r) => r.hit), customers, intake, payout };
}

const resultLine = (lottery, results) => {
  const r3 = results['3บน'] || results['3ตัว'];
  return [r3, results['2ล่าง']].filter(Boolean).join(' · ');
};
const signMoney = (n) => (n >= 0 ? '+' : '-') + '฿' + fmt(Math.abs(n));

function buildSettleSlip(mode, settle, lottery, drawDate, draw, custName, isSeller) {
  const res = resultLine(lottery, draw.results || {});
  const head = { lottery: lottery.name, draw: 'งวด ' + formatDrawDateShort(drawDate), kind: 'ใบได้/เสีย', time: 'ผล ' + res, footer: 'คิดตามผลออก ' + res + ' · Royal 888' };
  if (mode === 'customer') {
    const g = settle.customers.find((c) => c.name === custName) || settle.customers[0];
    const rows = [...g.rows].sort((a, b) => b.hit - a.hit || b.b.number.length - a.b.number.length || a.b.number.localeCompare(b.b.number))
      .map((r) => ({ num: r.b.number, types: typeShort(r.b.type) + ' ฿' + fmt(r.amt) + (r.hit ? ' ✓' : ''), amts: r.hit ? '฿' + fmt(r.payout) : '–', half: r.half && r.hit, win: r.hit, dim: !r.hit }));
    return { ...head, whoLabel: 'ลูกค้า', who: g.name, count: g.rows.length, sections: [{ rows }],
      total: Math.abs(g.net), totalLabel: g.net >= 0 ? 'ลูกค้าได้สุทธิ' : 'ลูกค้าเสียสุทธิ', totalColor: g.net >= 0 ? '#15803d' : '#b91c1c',
      extra: [['ซื้อรวม', '฿' + fmt(g.buy)], ['ถูกรวม · ' + g.wins + ' ใบ', '฿' + fmt(g.won)]] };
  }
  const net = settle.intake - settle.payout;
  const rows = settle.customers.map((g) => ({ name: g.name, types: g.wins ? 'ถูก ' + g.wins + ' ใบ' : 'ไม่ถูก', amts: (g.net >= 0 ? 'ได้ ' : 'เสีย ') + '฿' + fmt(Math.abs(g.net)), win: g.net > 0 }));
  return { ...head, whoLabel: 'ลูกค้า', who: settle.customers.length + ' คน', count: settle.rows.length, sections: [{ rows, nameRows: true }],
    total: Math.abs(isSeller ? net : -net), totalLabel: isSeller ? (net >= 0 ? 'เจ้ามือกำไร' : 'เจ้ามือขาดทุน') : (net <= 0 ? 'ได้สุทธิ' : 'เสียสุทธิ'),
    totalColor: (isSeller ? net >= 0 : net <= 0) ? '#15803d' : '#b91c1c',
    extra: [[isSeller ? 'รับรวม' : 'ซื้อรวม', '฿' + fmt(settle.intake)], [(isSeller ? 'จ่ายรวม' : 'ถูกรวม') + ' · ' + settle.wins.length + ' ใบ', '฿' + fmt(settle.payout)]] };
}

function settleText(mode, settle, lottery, drawDate, draw, custName, isSeller) {
  const L = ['🎰 Royal 888 · ใบได้/เสีย', `📋 ${lottery.name}`, `🗓 งวด ${formatDrawDateLong(drawDate)}`, `🏆 ผล ${resultLine(lottery, draw.results || {})}`, '─────────────'];
  if (mode === 'customer') {
    const g = settle.customers.find((c) => c.name === custName) || settle.customers[0];
    L.splice(4, 0, `👤 ${g.name}`);
    for (const r of g.rows) L.push(`${r.b.number}  ${typeShort(r.b.type)} ${fmt(r.amt)}${r.hit ? '  ✓ ถูก ฿' + fmt(r.payout) : ''}`);
    L.push('─────────────', `ซื้อรวม ฿${fmt(g.buy)} · ถูก ฿${fmt(g.won)}`, g.net >= 0 ? `💰 ได้สุทธิ ฿${fmt(g.net)}` : `💸 เสียสุทธิ ฿${fmt(-g.net)}`);
  } else {
    for (const g of settle.customers) L.push(`${g.name}: ${g.net >= 0 ? 'ได้' : 'เสีย'} ฿${fmt(Math.abs(g.net))} (ซื้อ ${fmt(g.buy)} · ถูก ${fmt(g.won)})`);
    const net = settle.intake - settle.payout;
    L.push('─────────────', `${isSeller ? 'รับรวม' : 'ซื้อรวม'} ฿${fmt(settle.intake)} · ${isSeller ? 'จ่าย' : 'ได้'} ฿${fmt(settle.payout)}`,
      isSeller ? `💰 ${net >= 0 ? 'กำไร' : 'ขาดทุน'} ฿${fmt(Math.abs(net))}` : `💰 สุทธิ ${signMoney(-net)}`);
  }
  return L.join('\n');
}

  const pngRef = useRef(null);
  useEffect(() => {
    let alive = true; pngRef.current = null;
    const t = setTimeout(async () => { try { const { canvas } = await drawSlipCanvas(slip); const b = await canvasBlob(canvas); if (alive) pngRef.current = b; } catch (e) {} }, 150);
    return () => { alive = false; clearTimeout(t); };
  }, [slip]);
  const fname = safeName('ได้เสีย_' + lottery.name + '_' + drawDate + (mode === 'customer' ? '_' + cust : '_ทุกคน'));

    if (busy) return; setBusy(true);

      const r = await deliverFile(blob, fname + '.png', true);
      if (r === 'downloaded') toast.show('บันทึกรูปแล้ว · ส่งใน LINE ได้เลย', 'success');

  };
  const copyText = async () => {
    try { await navigator.clipboard.writeText(text); }
    catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    toast.show('คัดลอกแล้ว · ไปวางใน LINE ได้เลย', 'success');

    <button key={k} onClick={() => setMode(k)} data-testid={'settle-mode-' + k} className="py-2.5 rounded-lg text-base font-display font-bold"

  );
  return (
    <div className="space-y-3">
      <div className="grid grid-cols-2 gap-1 rounded-xl p-1" style={{ background: '#efe8d6' }}>{seg('all', 'ทุกคน')}{seg('customer', 'รายคน')}</div>
      <div className="bg-white rounded-2xl border px-3.5 py-1" style={{ borderColor: '#e8dfc8' }} data-testid="settle-customers">
        {settle.customers.map((g, i) => {
          const on = mode === 'customer' && g.name === cust;
          return (
            <button key={g.name} onClick={() => { setMode('customer'); setCust(g.name); }}
              className="w-full grid gap-x-2 items-center py-2 text-left" style={{ gridTemplateColumns: '1fr auto', borderBottom: i < settle.customers.length - 1 ? '1px dashed #eee4cc' : 0 }}>
              <b className="font-display text-lg min-w-0" style={{ overflowWrap: 'anywhere', color: on ? '#8a6d36' : '#2a2a2a' }}>{on ? '▸ ' : ''}{g.name}</b>
              <span className="font-numeric font-bold text-lg text-right num-wrap" style={{ color: g.net >= 0 ? '#15803d' : '#b91c1c' }}>{g.net >= 0 ? 'ได้' : 'เสีย'} ฿{fmt(Math.abs(g.net))}</span>
              <span className="text-sm font-display" style={{ color: '#6b6357' }}>ซื้อ ฿{fmt(g.buy)} · {g.wins ? 'ถูก ' + g.wins + ' ใบ ฿' + fmt(g.won) : 'ไม่ถูก'}</span>
            </button>
          );
        })}
      </div>
      <div className="grid grid-cols-2 gap-2">
        <button onClick={sendImage} disabled={busy} data-testid="settle-img" className="rounded-2xl border-2 py-3 font-display font-bold text-base active:scale-95"
          style={{ background: '#effcf3', borderColor: '#a7e9be', color: '#047a37' }}>{busy ? '⏳' : '🖼'} {mode === 'customer' ? 'ส่งรูปให้ ' + cust : 'ส่งรูปสรุป'}</button>
        <button onClick={copyText} data-testid="settle-text" className="rounded-2xl border py-3 font-display font-bold text-base active:scale-95"
          style={{ background: '#fff', borderColor: '#e8dfc8', color: '#2a2a2a' }}>💬 คัดลอกข้อความ</button>
      </div>
      <div className="text-base font-display font-semibold pt-1" style={{ color: '#8a6d36' }}>ตัวอย่าง</div>
      <SlipView slip={slip}/>

  );
}

function RiskTab({ lottery, drawDate, bets, allBets, setBets, isSeller, caps, setCaps, rates, cuts, setCuts, forwards, setForwards, forwardSettings, setForwardSettings }) {
  const toast = useToast();
  const [manageCombo, setManageCombo] = useState(null);

  // Enrich bets with halfPay + current rates + forwarding (kept amount, not full intake)
  const enrichedBets = useMemo(() =>
    enrichBetsWithCaps(bets, caps, rates, forwards, forwardSettings),
    [bets, caps, rates, forwards, forwardSettings]
  );

  // Also compute intake-based view for display (showing original amounts pre-forward)
  const enrichedIntakeBets = useMemo(() =>
    bets.map(b => ({
      ...b,
      rate: rates[b.type] || b.rate || 90,
      halfPay: isCombosHalfPay(caps, lottery.id, drawDate, b.number, b.type)
    })),
    [bets, caps, lottery.id, drawDate, rates]
  );

  // Forwards summary for "เลขส่งต่อ" section
  const forwardsSummary = useMemo(() =>
    computeForwardsSummary(enrichedIntakeBets, forwards, forwardSettings),
    [enrichedIntakeBets, forwards, forwardSettings]
  );

  const scenarios = useMemo(() => computeScenarios(enrichedBets), [enrichedBets]);
  const totalIntake = scenarios.intake;
  const totalMaxPayout = enrichedBets.reduce((s, b) =>
    s + (parseFloat(b.amount) || 0) * (parseFloat(b.rate) || 0) * (b.halfPay ? 0.5 : 1), 0);

  const perCombo = useMemo(() => {
    const map = {};
    const fullAmt = new Map(bets.map(b => [b.id, parseFloat(b.amount) || 0]));
    enrichedBets.forEach(b => {
      const key = b.number + '|' + b.type;
      if (!map[key]) map[key] = {
        number: b.number, type: b.type, intake: 0, fullIntake: 0, payout: 0, ids: [], halfPay: b.halfPay
      };
      const amt = parseFloat(b.amount) || 0;
      const rate = parseFloat(b.rate) || 0;
      const halfMult = b.halfPay ? 0.5 : 1;
      map[key].intake += amt;                       // ยอดที่เก็บไว้เอง (หลังส่งต่อ)
      map[key].fullIntake += fullAmt.get(b.id) || 0; // ยอดที่ลูกค้าซื้อจริง (ใช้ตอนลด/ตัด)
      map[key].payout += amt * rate * halfMult;
      map[key].ids.push(b.id);
    });
    return Object.values(map).sort((a, b) => b.payout - a.payout);
  }, [enrichedBets, bets]);

  const [cutThreshold, setCutThreshold] = useState('');
  const [simNumber, setSimNumber] = useState('');
  const [simNumber2low, setSimNumber2low] = useState('');

  // Get current draw's cuts only
  const currentCuts = useMemo(() =>
    cuts.filter(c => c.lotteryId === lottery.id && c.drawDate === drawDate),
    [cuts, lottery.id, drawDate]
  );

  // Helper: add a cut log entry
  const logCut = (kind, items) => {
    // items: [{ number, type, amount, count }]
    if (!items || items.length === 0) return;
    setCuts(prev => [...prev, {
      id: uid(),
      lotteryId: lottery.id, drawDate,
      kind, // 'cut-threshold' | 'cut-combo' | 'reduce'
      items,
      createdAt: Date.now()
    }]);
  };

  const cutAboveThreshold = async () => {
    const th = parseFloat(cutThreshold);
    if (!th || th <= 0) { toast.show('ใส่ยอดให้ถูกต้อง', 'info'); return; }
    const idsToCut = new Set();
    const cutItems = [];
    perCombo.forEach(c => {
      if (c.payout > th) {
        c.ids.forEach(id => idsToCut.add(id));
        cutItems.push({ number: c.number, type: c.type, amount: c.fullIntake, count: c.ids.length }); // ตัดทั้งใบ = ยอดที่ลูกค้าซื้อ
      }
    });
    if (idsToCut.size === 0) { toast.show('ไม่มีโพยที่จ่ายเกิน ฿' + fmt(th), 'info'); return; }
    const ok = await toast.askConfirm('ตัดโพย ' + idsToCut.size + ' รายการที่จ่ายเกิน ฿' + fmt(th) + ' ?', { danger: true, confirmLabel: 'ตัด' });
    if (!ok) return;
    setBets(prev => prev.filter(b => !idsToCut.has(b.id)));
    logCut('cut-threshold', cutItems);
    setCutThreshold('');
    toast.show('ตัด ' + idsToCut.size + ' รายการ', 'success');
  };

  const cutOneCombo = async (combo) => {
    const idsToCut = new Set(combo.ids);
    const ok = await toast.askConfirm('ตัดโพย "' + combo.number + ' ' + typeShort(combo.type) + '"\n(' + combo.ids.length + ' รายการ)', { danger: true, confirmLabel: 'ตัด' });
    if (!ok) return;
    setBets(prev => prev.filter(b => !idsToCut.has(b.id)));
    setCaps(prev => prev.filter(c => !(c.lotteryId === lottery.id && c.drawDate === drawDate && c.number === combo.number && c.type === combo.type)));
    logCut('cut-combo', [{ number: combo.number, type: combo.type, amount: combo.fullIntake ?? combo.intake, count: combo.ids.length }]);
    toast.show('ตัดเลข ' + combo.number + ' สำเร็จ', 'success');
  };

  const toggleHalfPay = (combo) => {
    setCaps(prev => {
      const same = (c) => c.lotteryId === lottery.id && c.drawDate === drawDate && c.type === combo.type &&
        (c.number === combo.number || (combo.type === 'โต๊ด' && toadKey(c.number) === toadKey(combo.number)));
      const exists = prev.find(same);
      if (exists) {
        return prev.filter(c => !same(c)); // โต๊ด: ยกเลิกครั้งเดียวได้ทั้งชุด
      } else {
        return [...prev, {
          id: uid(),
          lotteryId: lottery.id, drawDate,
          number: combo.number, type: combo.type,
          halfPay: true,
          createdAt: Date.now()
        }];
      }
    });
  };

  const reduceCombo = (combo, factor) => {
    if (factor <= 0 || factor > 1) return;
    const idsInCombo = new Set(combo.ids);
    const reducedAmt = (combo.fullIntake ?? combo.intake) * (1 - factor); // ลดจากยอดที่ลูกค้าซื้อจริง
    setBets(prev => prev.map(b => {
      if (!idsInCombo.has(b.id)) return b;
      const newAmt = (parseFloat(b.amount) || 0) * factor;
      return { ...b, amount: Math.round(newAmt * 100) / 100 };
    }));
    logCut('reduce', [{ number: combo.number, type: combo.type, amount: reducedAmt, count: combo.ids.length, keepPercent: Math.round(factor * 100) }]);
  };

  const removeCutLog = (id) => {
    setCuts(prev => prev.filter(c => c.id !== id));
  };

  const clearAllCuts = async () => {
    if (currentCuts.length === 0) return;
    const ok = await toast.askConfirm('ลบบันทึกการตัดทั้งหมด ?\n(' + currentCuts.length + ' รายการ)\n\n* ไม่ได้คืนโพย แค่ลบบันทึก', { danger: true, confirmLabel: 'ลบบันทึก' });
    if (!ok) return;
    setCuts(prev => prev.filter(c => !(c.lotteryId === lottery.id && c.drawDate === drawDate)));
    toast.show('ลบบันทึกแล้ว', 'success');
  };

  const simResult = useMemo(() => {
    // Need at least one of: 3-digit upper OR 2-digit lower
    const has3 = simNumber.length === 3;
    const has2low = simNumber2low.length === 2;
    if (!has3 && !has2low) return null;
    const r3 = has3 ? simNumber : null;
    const r2low = has2low ? simNumber2low : null;
    const payout3 = r3 ? computePayoutFor3D(r3, enrichedBets) : { total: 0, breakdown: { direct: 0, two_up: 0, toad: 0 } };
    const payout2low = r2low ? computePayoutFor2DLow(r2low, enrichedBets) : 0;
    const totalPay = payout3.total + payout2low;
    return {
      num3: r3,
      num2up: r3 ? r3.slice(-2) : null,
      num2low: r2low,
      payout: totalPay,
      breakdown: payout3.breakdown,
      low: payout2low,
      net: totalIntake - totalPay
    };
  }, [simNumber, simNumber2low, enrichedBets, totalIntake]);

  if (bets.length === 0) {
    return (
      <div className="glass rounded-2xl p-8 text-center slide-in">
        <div className="text-gray-400 text-base font-display tracking-wider">— ยังไม่มีโพยในงวดนี้ —</div>
        <div className="text-gray-300 text-base mt-2">จดโพยที่แท็บ "จดโพย" ก่อน</div>
      </div>
    );
  }

  const best = scenarios.best;
  const worst = scenarios.worst;

  return (
    <div className="space-y-4 slide-in">
      {/* Summary */}
      <div className="glass-strong rounded-2xl p-4">
        <div className="flex items-center gap-2 mb-3">
          <div className="w-1 h-4 rounded-full" style={{background:'linear-gradient(180deg, #d4b572, #b8965a)'}}/>
          <h2 className="font-display text-xl font-bold tracking-wide text-stone-900">วิเคราะห์ความเสี่ยง</h2>
          {caps.filter(c => c.lotteryId === lottery.id && c.drawDate === drawDate).length > 0 && (
            <div className="ml-auto px-2 py-0.5 rounded-full text-base font-display bg-orange-100 text-orange-700 border border-orange-300">
              ½ อั้น {caps.filter(c => c.lotteryId === lottery.id && c.drawDate === drawDate).length}
            </div>
          )}
        </div>

        <div className="grid grid-cols-2 gap-2 mb-3">
          <div className="num-tile rounded-xl p-3 min-w-0 overflow-hidden">
            <div className="text-base uppercase tracking-wider font-display font-semibold" style={{color:'#8a6d36'}}>รับเข้ารวม</div>
            <div className="font-numeric font-bold gold-text mt-1 num-wrap" style={{fontSize: 'clamp(1rem, 5vw, 1.5rem)', lineHeight: 1.2}}>฿{fmt(totalIntake)}</div>
          </div>
          <div className="risk-tile rounded-xl p-3 min-w-0 overflow-hidden">
            <div className="text-base uppercase tracking-wider font-display font-semibold" style={{color:'#8a6d36'}}>จ่ายเพดาน</div>
            <div className="font-numeric font-bold text-red-600 mt-1 num-wrap" style={{fontSize: 'clamp(1rem, 5vw, 1.5rem)', lineHeight: 1.2}}>฿{fmt(totalMaxPayout)}</div>
          </div>
        </div>

        <div className="space-y-2">
          {/* Scenario 1: ไม่มีใครถูก — เสี่ยงได้สูงสุด (always show) */}
          <div className="rounded-xl p-3 border-2 overflow-hidden" style={{
            background: 'linear-gradient(135deg, rgba(34, 197, 94, 0.10) 0%, rgba(22, 163, 74, 0.04) 100%)',
            borderColor: '#86efac'
          }}>
            <div className="flex items-center gap-1.5 mb-1">
              <span className="text-base">🟢</span>
              <div className="text-base uppercase tracking-wider font-display font-semibold" style={{color:'#15803d'}}>ไม่มีใครถูกเลย</div>
            </div>
            <div className="font-numeric font-bold num-wrap" style={{color:'#15803d', fontSize: 'clamp(1.1rem, 6vw, 1.5rem)', lineHeight: 1.2}}>+฿{fmt(scenarios.scenarios.noWin.net)}</div>
            <div className="text-base mt-1 font-display" style={{color:'#16a34a'}}>
              จ่าย ฿0 · เก็บเต็มที่รับมา
            </div>
          </div>

          {/* Scenario 2: ถูกแค่บน — show only if has upper bets */}
          {scenarios.hasUpper && (
            <div className="rounded-xl p-3 border-2 overflow-hidden" style={{
              background: scenarios.scenarios.onlyUpper.net >= 0
                ? 'linear-gradient(135deg, rgba(217, 119, 6, 0.10) 0%, rgba(180, 83, 9, 0.04) 100%)'

                <span className="text-base">🟡</span>

                  {scenarios.hasLower ? 'ถูกแค่ข้างบน' : (scenarios.hasUpper3 ? 'ถูก 3 ตัวบน/โต๊ด' : 'ถูก 2 ตัวบน')}
                </div>
              </div>
              <div className="font-numeric font-bold num-wrap" style={{color: scenarios.scenarios.onlyUpper.net >= 0 ? '#a16207' : '#b91c1c', fontSize: 'clamp(1.1rem, 6vw, 1.5rem)', lineHeight: 1.2}}>{scenarios.scenarios.onlyUpper.net >= 0 ? '+' : '-'}฿{fmt(Math.abs(scenarios.scenarios.onlyUpper.net))}</div>
              <div className="text-base mt-1 font-display break-words" style={{color: scenarios.scenarios.onlyUpper.net >= 0 ? '#a16207' : '#b91c1c'}}>
                ถ้าออก <span className="font-numeric font-bold">{scenarios.scenarios.onlyUpper.num3 || '—'}</span>

          {/* Scenario 3: ถูกแค่ล่าง — show only if has lower bets */}

              <div className="font-numeric font-bold num-wrap" style={{color: scenarios.scenarios.onlyLower.net >= 0 ? '#a16207' : '#b91c1c', fontSize: 'clamp(1.1rem, 6vw, 1.5rem)', lineHeight: 1.2}}>{scenarios.scenarios.onlyLower.net >= 0 ? '+' : '-'}฿{fmt(Math.abs(scenarios.scenarios.onlyLower.net))}</div>
              <div className="text-base mt-1 font-display break-words" style={{color: scenarios.scenarios.onlyLower.net >= 0 ? '#a16207' : '#b91c1c'}}>

          {/* Scenario 4: ถูกทั้งบนทั้งล่าง — show only if has BOTH upper AND lower */}

              <div className="flex items-center gap-1.5 mb-1">

                <div className="text-base uppercase tracking-wider font-display font-semibold" style={{color: scenarios.scenarios.bothWin.net >= 0 ? '#a16207' : '#b91c1c'}}>ถูกทั้งบนและล่าง</div>
              </div>
              <div className="font-numeric font-bold num-wrap" style={{color: scenarios.scenarios.bothWin.net >= 0 ? '#a16207' : '#b91c1c', fontSize: 'clamp(1.1rem, 6vw, 1.5rem)', lineHeight: 1.2}}>{scenarios.scenarios.bothWin.net >= 0 ? '+' : '-'}฿{fmt(Math.abs(scenarios.scenarios.bothWin.net))}</div>
              <div className="text-base mt-1 font-display break-words" style={{color: scenarios.scenarios.bothWin.net >= 0 ? '#a16207' : '#b91c1c'}}>
                ถ้าออก <span className="font-numeric font-bold">{scenarios.scenarios.bothWin.num3 || '—'}</span>
                {scenarios.scenarios.bothWin.num2low && <> / <span className="font-numeric font-bold">{scenarios.scenarios.bothWin.num2low}</span></>}
                {' '}· จ่าย ฿{fmt(scenarios.scenarios.bothWin.payout)}
              </div>
            </div>
          )}
        </div>
      </div>

      {/* Half-pay capping section */}
      <HalfPaySection
        lottery={lottery}
        drawDate={drawDate}
        caps={caps}
        setCaps={setCaps}
        rates={rates}
        toast={toast}/>

      {/* Cuts log section */}
      <CutsSection
        lottery={lottery}
        drawDate={drawDate}
        cuts={currentCuts}
        onRemove={removeCutLog}
        onClearAll={clearAllCuts}
        toast={toast}/>

      {/* Forwarding — ส่งยอดต่อให้เจ้ามือใหญ่ */}
      <ForwardingSection
        lottery={lottery}
        drawDate={drawDate}
        forwards={forwards}
        setForwards={setForwards}
        forwardSettings={forwardSettings}
        setForwardSettings={setForwardSettings}
        forwardsSummary={forwardsSummary}
        intakeBets={enrichedIntakeBets}

      {/* Quick threshold cut */}
      <div className="glass rounded-2xl p-4">
        <div className="flex items-center gap-2 mb-3">
          <div className="w-1 h-4 rounded-full" style={{background:'linear-gradient(180deg, #d4b572, #b8965a)'}}/>
          <h2 className="font-display text-xl font-bold tracking-wide text-stone-900">ตัดเลขเสี่ยงเป็นกลุ่ม</h2>
        </div>
        <div className="num-tile rounded-xl p-3 mb-2 flex items-center gap-3">
          <div className="text-base uppercase tracking-widest text-red-700 font-display w-24">ตัดที่จ่ายเกิน</div>
          <input type="number" inputMode="decimal" value={cutThreshold}
            onChange={e => setCutThreshold(e.target.value)} placeholder="0"
            className="flex-1 min-w-0 bg-transparent outline-none font-numeric text-2xl font-bold text-red-700 text-right placeholder-rose-100/15"/>
          <span className="text-base text-red-400 font-display flex-shrink-0">บาท</span>
        </div>
        <button onClick={cutAboveThreshold} disabled={!cutThreshold}
          className="w-full py-2.5 rounded-xl bg-red-100 border border-red-500 text-red-700 font-display text-lg tracking-wider flex items-center justify-center gap-2 disabled:opacity-40">
          <Scissors size={14}/> ตัดเลขที่เสี่ยงเกิน
        </button>
      </div>

      {/* Per-combo */}
      <div className="glass rounded-2xl p-4">
        <div className="flex items-center gap-2 mb-3">
          <div className="w-1 h-4 rounded-full" style={{background:'linear-gradient(180deg, #d4b572, #b8965a)'}}/>
          <h2 className="font-display text-xl font-bold tracking-wide text-stone-900">สรุปทุกโพย</h2>
          <span className="text-base text-gray-400 font-display">({perCombo.length})</span>
        </div>
        <div className="text-base text-gray-400 font-display mb-2 leading-relaxed">
          แต่ละแถวมี <span className="text-orange-700">½</span> อั้นครึ่ง · <span className="text-red-600">📉</span> ลดยอด · <span className="text-red-700">✂️</span> ตัดทั้งหมด
        </div>
        <div className="space-y-1.5 max-h-96 overflow-y-auto">
          {perCombo.map((c, i) => (
            <div key={i} className={`rounded-lg px-2.5 py-2 border ${
              c.halfPay
                ? 'bg-orange-50 border-orange-300'
                : 'bg-white border-gray-200'
            }`}>
              <div className="flex items-center gap-1.5 mb-1.5 flex-wrap">
                <div className="font-numeric text-xl font-bold gold-text leading-none">{c.number}</div>
                <div className="px-1.5 py-0.5 rounded text-base font-display bg-red-50 text-gray-700 border border-red-200">{typeShort(c.type)}</div>
                {c.halfPay && (
                  <div className="px-1.5 py-0.5 rounded text-base font-display bg-orange-100 text-orange-700 border border-orange-400 font-bold">½ อั้น</div>

                <div className="ml-auto flex items-center gap-1">
                  <button onClick={() => toggleHalfPay(c)}

                      c.halfPay
                        ? 'bg-orange-200 text-orange-800 border border-orange-400'

                    ½

                  <button onClick={() => setManageCombo(c)}
                    className="w-10 h-10 rounded-lg flex items-center justify-center text-red-500 hover:bg-red-500/15 border border-red-100"
                    title="ลดยอด">
                    <TrendingDown size={17}/>
                  </button>
                  <button onClick={() => cutOneCombo(c)}
                    className="w-10 h-10 rounded-lg flex items-center justify-center text-red-500 hover:text-red-500 hover:bg-red-50 border border-red-100"
                    title="ตัดทั้งหมด">
                    <Scissors size={17}/>
                  </button>
                </div>
              </div>
              <div className="grid grid-cols-2 gap-2 text-right text-base">
                <div>
                  <span className="text-base uppercase text-red-300 font-display mr-1">รับ</span>
                  <span className="font-numeric font-semibold text-gray-900">฿{fmt(c.intake)}</span>
                </div>
                <div>
                  <span className="text-base uppercase text-red-500 font-display mr-1">จ่าย</span>
                  <span className="font-numeric font-semibold text-red-600">฿{fmt(c.payout)}</span>
                </div>
              </div>
            </div>
          ))}

      </div>

      {/* Sim */}
      <div className="glass rounded-2xl p-4">
        <div className="flex items-center gap-2 mb-3">
          <div className="w-1.5 h-5 rounded-full" style={{ background: 'linear-gradient(180deg, #fb923c 0%, #ea580c 100%)' }}/>
          <h2 className="font-display text-xl font-bold tracking-wide text-stone-900">ลองสมมุติ</h2>

        <div className="text-base text-stone-600 font-display mb-3 leading-relaxed">

        </div>

        <div className="grid grid-cols-2 gap-2 mb-3">
          {/* 3 ตัวบน */}
          <div className="num-tile rounded-xl p-3">
            <div className="text-base uppercase tracking-wider text-red-700 font-display font-semibold mb-1">3 ตัวบน</div>
            <input type="tel" inputMode="numeric" value={simNumber}
              onChange={e => setSimNumber(e.target.value.replace(/\D/g, '').slice(0, 3))} placeholder="000"
              className="w-full bg-transparent outline-none font-numeric text-3xl font-black gold-text placeholder-red-200 tracking-[0.2em] text-center"/>
            {simNumber.length === 3 && (
              <div className="text-base text-stone-500 font-display mt-1 text-center">
                2 บน = <span className="font-numeric font-bold text-red-700">{simNumber.slice(-2)}</span>
              </div>

          </div>
          {/* 2 ตัวล่าง */}
          <div className="rounded-xl p-3 bg-gradient-to-br from-green-50 to-white border border-green-200">
            <div className="text-base uppercase tracking-wider text-green-700 font-display font-semibold mb-1">2 ตัวล่าง</div>

        {simResult ? (
          <div className="space-y-2">
            {simResult.num3 && (
              <>
                <SimRow label="3 ตัวบน (ตรง)" value={simResult.breakdown.direct}/>

            <div className="border-t border-stone-200 pt-2 grid grid-cols-2 gap-2">
              <div className="bg-red-50 rounded-lg p-2.5 border border-red-200 min-w-0 overflow-hidden">
                <div className="text-base uppercase text-red-700 font-display font-semibold tracking-wider">จ่ายรวม</div>
                <div className="font-numeric font-bold text-red-700 mt-0.5 num-wrap" style={{fontSize: 'clamp(0.95rem, 4.5vw, 1.25rem)', lineHeight: 1.2}}>฿{fmt(simResult.payout)}</div>

              <div className={`rounded-lg p-2.5 border min-w-0 overflow-hidden ${simResult.net >= 0 ? 'bg-green-50 border-green-300' : 'bg-red-50 border-red-300'}`}>
                <div className={`text-base uppercase font-display font-semibold tracking-wider ${simResult.net >= 0 ? 'text-green-700' : 'text-red-700'}`}>กำไร/ขาดทุน</div>
                <div className={`font-numeric font-bold mt-0.5 num-wrap ${simResult.net >= 0 ? 'text-green-700' : 'text-red-700'}`} style={{fontSize: 'clamp(0.95rem, 4.5vw, 1.25rem)', lineHeight: 1.2}}>{simResult.net >= 0 ? '+' : '-'}฿{fmt(Math.abs(simResult.net))}</div>
              </div>
            </div>

        ) : (
          <div className="text-center py-4 bg-stone-50 rounded-xl border border-dashed border-stone-200">
            <div className="text-stone-400 text-base font-display">ใส่เลขในช่องด้านบนเพื่อดูผล</div>
          </div>
        )}
      </div>

      {/* Manage Reduce Sheet */}
      {manageCombo && (
        <BottomSheet onClose={() => setManageCombo(null)} title={'ลดยอด ' + manageCombo.number + ' ' + typeShort(manageCombo.type)}>
          <ReduceSheet combo={manageCombo}
            onReduce={(factor) => { reduceCombo(manageCombo, factor); setManageCombo(null); }}
            onClose={() => setManageCombo(null)}/>
        </BottomSheet>
      )}
    </div>
  );
}

function ReduceSheet({ combo, onReduce, onClose }) {
  const toast = useToast();
  const [custom, setCustom] = useState('');
  // ลดยอด = ลดยอดที่ลูกค้าซื้อจริง (เดิมใช้ยอดหลังส่งต่อ → ตั้ง "เหลือ ฿200" แต่โพยลูกค้าลดไม่ตรง)
  const currentIntake = combo.fullIntake ?? combo.intake;
  const currentPayout = combo.payout;

  const applyPreset = async (keepPercent) => {
    const factor = keepPercent / 100;
    const ok = await toast.askConfirm('ลดยอดเหลือ ' + keepPercent + '%\n฿' + fmt(currentIntake) + '  →  ฿' + fmt(currentIntake * factor), { confirmLabel: 'ลด' });
    if (!ok) return;
    onReduce(factor);
    toast.show('ลดยอดสำเร็จ', 'success');
  };

  const applyCustom = async () => {
    const targetIntake = parseFloat(custom);
    if (isNaN(targetIntake) || targetIntake <= 0) { toast.show('ใส่ยอดให้ถูกต้อง', 'error'); return; }
    if (targetIntake >= currentIntake) { toast.show('ยอดใหม่ต้องน้อยกว่ายอดเดิม', 'error'); return; }
    const factor = targetIntake / currentIntake;
    const ok = await toast.askConfirm('ลดยอดเหลือ ฿' + fmt(targetIntake), { confirmLabel: 'ลด' });
    if (!ok) return;
    onReduce(factor);
    toast.show('ลดยอดสำเร็จ', 'success');
  };

  return (
    <div className="space-y-3">
      <div className="num-tile rounded-xl p-3">
        <div className="text-base uppercase tracking-wider font-display font-semibold mb-1" style={{color:'#8a6d36'}}>ยอดปัจจุบัน</div>
        <div className="grid grid-cols-2 gap-2 text-right">
          <div className="min-w-0 overflow-hidden">
            <div className="text-base uppercase font-display" style={{color:'#8a6d36'}}>รับ</div>
            <div className="font-numeric font-bold text-gray-900 num-wrap" style={{fontSize: 'clamp(0.95rem, 4.5vw, 1.25rem)', lineHeight: 1.2}}>฿{fmt(currentIntake)}</div>
          </div>
          <div className="min-w-0 overflow-hidden">
            <div className="text-base uppercase text-red-500 font-display">จ่ายเพดาน</div>
            <div className="font-numeric font-bold text-red-600 num-wrap" style={{fontSize: 'clamp(0.95rem, 4.5vw, 1.25rem)', lineHeight: 1.2}}>฿{fmt(currentPayout)}</div>
          </div>
        </div>
        {combo.fullIntake != null && Math.abs(combo.fullIntake - combo.intake) > 0.009 && (
          <div data-testid="reduce-kept" className="text-base font-display mt-2" style={{color:'#0e7490'}}>
            ส่งต่อแล้ว · เก็บไว้เอง ฿{fmt(combo.intake)}
          </div>
        )}
      </div>

      <div>
        <div className="text-base uppercase tracking-wider font-display font-semibold mb-2" style={{color:'#8a6d36'}}>ลดเหลือกี่ %</div>
        <div className="grid grid-cols-3 gap-2">
          {[75, 50, 25].map(p => (
            <button key={p} onClick={() => applyPreset(p)}
              className="num-tile rounded-xl p-3 active:scale-95 min-w-0 overflow-hidden">
              <div className="font-numeric text-2xl font-bold gold-text">{p}%</div>
              <div className="text-base text-gray-500 font-display mt-1 num-wrap">
                ฿{fmt(currentIntake * p / 100)}
              </div>
            </button>
          ))}
        </div>
      </div>

      <div>
        <div className="text-base uppercase tracking-wider font-display font-semibold mb-2" style={{color:'#8a6d36'}}>หรือกำหนดยอดเอง</div>
        <div className="flex items-center gap-2">
          <div className="flex-1 min-w-0 bg-white rounded-lg px-3 py-2 border border-gray-200 focus-within:border-red-300 flex items-baseline gap-1">
            <span className="text-gray-400 text-lg flex-shrink-0">฿</span>
            <input type="number" inputMode="decimal" value={custom}
              onChange={e => setCustom(e.target.value)} placeholder="ลดเหลือ"
              className="w-full min-w-0 bg-transparent outline-none font-numeric text-xl font-bold text-gray-900 placeholder-yellow-100/20"/>
          </div>
          <button onClick={applyCustom} disabled={!custom}
            className="py-2 px-4 rounded-lg bg-red-100 border border-red-400 text-red-600 font-display text-lg disabled:opacity-40">
            ลด
          </button>
        </div>
      </div>

      <button onClick={onClose}
        className="w-full py-2.5 rounded-xl bg-gray-100 text-gray-600 font-display text-lg tracking-wider border border-gray-300">
        ยกเลิก
      </button>
    </div>
  );
}

function HalfPaySection({ lottery, drawDate, caps, setCaps, rates, toast }) {
  const [expanded, setExpanded] = useState(true);
  const [num, setNum] = useState('');
  const [pickedTypes, setPickedTypes] = useState({});
  const [reverse3, setReverse3] = useState(false);
  const [reverse2, setReverse2] = useState(false);

  // Caps for this lottery+drawDate only
  const currentCaps = useMemo(() =>
    caps.filter(c => c.lotteryId === lottery.id && c.drawDate === drawDate && c.halfPay),
    [caps, lottery.id, drawDate]
  );

  const t3 = lottery.types.includes('3ตัว') ? '3ตัว' : '3บน';
  const t3Label = lottery.types.includes('3ตัว') ? '3 ตัว' : '3 ตัวบน';
  const has3 = pickedTypes[t3] || pickedTypes['โต๊ด'];
  const has2 = pickedTypes['2บน'] || pickedTypes['2ล่าง'];
  const digitsNeeded = has3 ? 3 : has2 ? 2 : null;

  const toggleType = (key) => {
    const isG3 = key === t3 || key === 'โต๊ด';
    setPickedTypes(prev => {
      if ((isG3 && (prev['2บน'] || prev['2ล่าง'])) || (!isG3 && (prev[t3] || prev['โต๊ด']))) {
        // Switching groups - reset
        setNum('');
        if (isG3) setReverse2(false); else setReverse3(false);
        return { [key]: true };
      }
      return { ...prev, [key]: !prev[key] };
    });
  };

  const onReverse3 = () => {
    if (has2) {
      setPickedTypes({});
      setReverse2(false);
      setReverse3(true);
      setNum('');
    } else setReverse3(r => !r);
  };

  const onReverse2 = () => {
    if (has3) {
      setPickedTypes({});
      setReverse3(false);
      setReverse2(true);
      setNum('');
    } else setReverse2(r => !r);
  };

  // Compute what numbers will be generated (preview)
  const previewNumbers = useMemo(() => {
    if (!num || (digitsNeeded && num.length !== digitsNeeded)) return [];
    const out = [num];
    if (num.length === 3 && reverse3) {
      const perms = getToadVariations(num);
      perms.forEach(p => { if (!out.includes(p)) out.push(p); });
    } else if (num.length === 2 && reverse2) {
      const rev = reverseDigits(num);
      if (rev !== num) out.push(rev);
    }
    return out;
  }, [num, reverse3, reverse2, digitsNeeded]);

  const addCap = () => {
    if (!num || (digitsNeeded && num.length !== digitsNeeded)) {
      toast.show('ใส่เลขให้ครบ ' + (digitsNeeded || '?') + ' หลัก', 'info');
      return;
    }
    const activeTypes = Object.keys(pickedTypes).filter(k => pickedTypes[k]);
    if (activeTypes.length === 0) {
      toast.show('เลือกประเภทอย่างน้อย 1', 'info');
      return;
    }
    let added = 0, skipped = 0;
    const newCaps = [...caps];
    for (const n of previewNumbers) {
      for (const type of activeTypes) {
        // For โต๊ด, only the original number (toad covers all perms)
        if (type === 'โต๊ด' && n !== num) continue;
        const exists = newCaps.some(c =>
          c.lotteryId === lottery.id && c.drawDate === drawDate &&
          c.number === n && c.type === type && c.halfPay
        );
        if (exists) { skipped++; continue; }
        newCaps.push({
          id: uid(),
          lotteryId: lottery.id, drawDate,
          number: n, type,
          halfPay: true,
          createdAt: Date.now() + Math.random(),
        });
        added++;
      }
    }
    setCaps(newCaps);
    setNum('');
    if (added > 0) toast.show('อั้น ' + added + ' รายการ' + (skipped > 0 ? ' (ซ้ำ ' + skipped + ')' : ''), 'success');
    else if (skipped > 0) toast.show('เลขนี้อั้นไว้แล้ว', 'info');
  };

  const removeCap = (cap) => {
    setCaps(prev => prev.filter(c => c.id !== cap.id));
  };

  const removeAll = async () => {
    if (currentCaps.length === 0) return;
    const ok = await toast.askConfirm('ยกเลิกอั้นทั้งหมด ?\n(' + currentCaps.length + ' รายการ)', { danger: true, confirmLabel: 'ลบทั้งหมด' });
    if (!ok) return;
    setCaps(prev => prev.filter(c => !(c.lotteryId === lottery.id && c.drawDate === drawDate && c.halfPay)));
    toast.show('ยกเลิกอั้นทั้งหมดแล้ว', 'success');
  };

  // Group current caps by type for display
  const capsByType = useMemo(() => {
    const map = { '3บน': [], '3ตัว': [], 'โต๊ด': [], '2บน': [], '2ล่าง': [] };
    currentCaps.forEach(c => {
      if (!map[c.type]) map[c.type] = [];
      map[c.type].push(c);
    });
    return Object.entries(map)
      .filter(([_, items]) => items.length > 0)
      .map(([type, items]) => ({
        type,
        items: items.sort((a, b) => a.number.localeCompare(b.number))
      }));
  }, [currentCaps]);

  return (
    <div className="glass rounded-2xl p-4">
      <button onClick={() => setExpanded(e => !e)} className="w-full flex items-center gap-2 mb-3 text-left">
        <div className="w-1.5 h-5 rounded-full" style={{ background: 'linear-gradient(180deg, #ea580c 0%, #c2410c 100%)' }}/>
        <h2 className="font-display text-xl font-bold tracking-wide text-orange-900">เลขอั้นจ่ายครึ่ง</h2>
        <span className="text-base font-display font-semibold bg-orange-100 text-orange-800 border border-orange-300 rounded-full px-2.5 py-0.5">
          {currentCaps.length}
        </span>
        <span className="ml-auto text-orange-700 text-xl font-bold">{expanded ? '▴' : '▾'}</span>
      </button>

      {expanded && (
        <div className="space-y-3">
          <div className="text-base text-stone-600 font-display leading-relaxed">
            เลขที่อั้นไว้ — ถ้าออกตรง ระบบจะคำนวณจ่ายแค่<strong className="text-orange-700"> ครึ่งของอัตราปกติ</strong>
          </div>

          {/* Input section */}
          <div className="bg-orange-50 border-2 border-orange-200 rounded-2xl p-3 space-y-3">
            {/* Type chips */}
            <div>
              <div className="text-base uppercase tracking-[0.2em] text-stone-700 font-display font-semibold mb-2">ประเภท</div>
              <div className="grid grid-cols-2 gap-1.5">
                {[
                  { k: t3, label: t3Label, color: 'red' },
                  { k: 'โต๊ด', label: 'โต๊ด', color: 'red' },
                  { k: '2บน', label: '2 ตัวบน', color: 'green' },
                  { k: '2ล่าง', label: '2 ตัวล่าง', color: 'green' },
                ].map(opt => {
                  const isG3 = opt.k === t3 || opt.k === 'โต๊ด';
                  const dimmed = isG3 ? has2 : has3;
                  const active = !!pickedTypes[opt.k];
                  return (
                    <button key={opt.k} onClick={() => toggleType(opt.k)}
                      className={'rounded-xl px-3 py-2.5 text-lg font-display font-semibold border-2 transition-all active:scale-95 ' + (
                        active
                          ? (opt.color === 'red' ? 'bg-red-600 text-white border-red-700 shadow-md shadow-red-200' : 'bg-green-600 text-white border-green-700 shadow-md shadow-green-200')
                          : dimmed
                            ? 'bg-gray-50 text-gray-300 border-gray-200'
                            : (opt.color === 'red' ? 'bg-white text-red-700 border-red-200' : 'bg-white text-green-700 border-green-200')
                      )}>
                      {active && <Check size={12} strokeWidth={3} className="inline mr-1"/>}{opt.label}
                    </button>
                  );
                })}
              </div>
              {/* Reverse options */}
              <div className="grid grid-cols-2 gap-1.5 mt-1.5">
                <button onClick={onReverse3}
                  className={'rounded-xl px-3 py-2 text-base font-display font-semibold border-2 transition-all active:scale-95 flex items-center justify-center gap-1 ' + (
                    reverse3
                      ? 'bg-red-100 text-red-800 border-red-400'
                      : has2
                        ? 'bg-gray-50 text-gray-300 border-gray-200'
                        : 'bg-white text-red-600 border-red-200'
                  )}>
                  <Shuffle size={11}/>{reverse3 && '✓ '}กลับ 3 ตัว
                </button>
                <button onClick={onReverse2}
                  className={'rounded-xl px-3 py-2 text-base font-display font-semibold border-2 transition-all active:scale-95 flex items-center justify-center gap-1 ' + (
                    reverse2
                      ? 'bg-green-100 text-green-800 border-green-400'
                      : has3
                        ? 'bg-gray-50 text-gray-300 border-gray-200'
                        : 'bg-white text-green-600 border-green-200'
                  )}>
                  <Shuffle size={11}/>{reverse2 && '✓ '}กลับ 2 ตัว
                </button>
              </div>
            </div>

            {/* Number input */}
            <div>
              <div className="text-base uppercase tracking-[0.2em] text-stone-700 font-display font-semibold mb-2">
                ระบุตัวเลข {digitsNeeded ? digitsNeeded + ' หลัก' : ''}
              </div>
              <div className="flex items-center gap-2">
                <input type="tel" inputMode="numeric" value={num}
                  onChange={e => setNum(e.target.value.replace(/\D/g, '').slice(0, digitsNeeded || 3))}
                  placeholder={digitsNeeded ? '0'.repeat(digitsNeeded) : 'เลือกประเภทก่อน'}
                  disabled={!digitsNeeded}
                  className="flex-1 min-w-0 bg-white rounded-xl px-3 py-3 outline-none font-numeric text-3xl font-black text-orange-900 text-center tracking-[0.2em] border-2 border-orange-300 placeholder-orange-200 disabled:bg-gray-100 disabled:placeholder-gray-300"/>
                <button onClick={addCap} disabled={!num || (digitsNeeded && num.length !== digitsNeeded)}
                  className="flex-shrink-0 py-3 px-5 rounded-xl bg-orange-600 text-white font-display text-lg font-bold border-2 border-orange-700 active:scale-95 disabled:opacity-40 flex items-center gap-1"
                  style={{ boxShadow: '0 4px 8px rgba(234,88,12,0.3)' }}>
                  <Plus size={16} strokeWidth={3}/> อั้น
                </button>
              </div>

              {/* Preview when reverse is on */}
              {previewNumbers.length > 1 && (
                <div className="mt-2 bg-white rounded-lg px-2.5 py-2 border border-orange-200">
                  <div className="text-base uppercase tracking-wider text-orange-700 font-display font-semibold mb-1">จะอั้น {previewNumbers.length} เลข</div>
                  <div className="flex flex-wrap gap-1">
                    {previewNumbers.map(n => (
                      <span key={n} className="bg-orange-50 border border-orange-200 rounded px-2 py-0.5 font-numeric text-lg font-bold text-orange-800">{n}</span>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* Current caps list — grouped by type */}
          {capsByType.length > 0 ? (
            <div className="space-y-2">
              <div className="flex items-center justify-between">
                <div className="text-lg font-display font-bold text-orange-900">
                  เลขที่อั้นไว้ <span className="text-base font-semibold text-stone-500">({currentCaps.length})</span>
                </div>
                <button onClick={removeAll} className="text-base text-red-600 font-display font-semibold flex items-center gap-1 active:scale-95 px-2 py-1 rounded-lg bg-red-50">
                  <Trash2 size={12}/> ลบทั้งหมด
                </button>
              </div>
              {capsByType.map(group => (
                <div key={group.type} className="bg-white rounded-xl border border-orange-200 p-2.5">
                  <div className="text-base uppercase tracking-wider text-orange-700 font-display font-bold mb-2 flex items-center gap-1.5">
                    <div className="w-1 h-3 rounded-full bg-orange-500"/>
                    {typeFullName(group.type)}
                    <span className="text-stone-500 font-numeric font-semibold">· {group.items.length}</span>
                  </div>
                  <div className="flex flex-wrap gap-1.5">
                    {group.items.map(c => (
                      <div key={c.id}
                        className="bg-orange-100 border border-orange-300 rounded-lg pl-2.5 pr-1 py-1 flex items-center gap-1.5 active:scale-95 transition-transform">
                        <span className="font-numeric font-bold text-orange-900 text-xl">{c.number}</span>
                        <button onClick={() => removeCap(c)} className="text-orange-600 active:text-red-600 p-1 -ml-0.5">
                          <X size={13} strokeWidth={2.5}/>
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          ) : (
            <div className="text-center py-6 bg-stone-50 rounded-xl border border-dashed border-stone-200">
              <div className="text-stone-400 text-base font-display">— ยังไม่ได้อั้นเลขใด —</div>
              <div className="text-stone-300 text-base font-display mt-1">เลือกประเภท → ใส่เลข → กดอั้น</div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function ForwardingSection({ lottery, drawDate, forwards, setForwards, forwardSettings, setForwardSettings, forwardsSummary, intakeBets, toast }) {
  const [expanded, setExpanded] = useState(false);
  const [mode, setMode] = useState('view'); // 'view' | 'default' | 'perCombo'
  const [def3D, setDef3D] = useState(forwardSettings?.defaultMaxKeep3D ?? '');
  const [def2D, setDef2D] = useState(forwardSettings?.defaultMaxKeep2D ?? '');
  const [overrideNum, setOverrideNum] = useState('');
  const [overrideType, setOverrideType] = useState(null);
  const [overrideMax, setOverrideMax] = useState('');
  const [copied, setCopied] = useState(false);

  // Sync settings inputs when forwardSettings changes
  useEffect(() => {
    setDef3D(forwardSettings?.defaultMaxKeep3D ?? '');
    setDef2D(forwardSettings?.defaultMaxKeep2D ?? '');
  }, [forwardSettings?.defaultMaxKeep3D, forwardSettings?.defaultMaxKeep2D]);

  // Filter forwards to current lottery/drawDate
  const currentOverrides = useMemo(() =>
    forwards.filter(f => f.lotteryId === lottery.id && f.drawDate === drawDate),
    [forwards, lottery.id, drawDate]
  );

  // Group intakeBets by number+type for combo selector
  const availableCombos = useMemo(() => {
    const map = {};
    intakeBets.forEach(b => {
      const key = b.number + '|' + b.type;
      if (!map[key]) map[key] = { number: b.number, type: b.type, intake: 0 };
      map[key].intake += parseFloat(b.amount) || 0;
    });
    return Object.values(map).sort((a, b) => {
      const ta = ({ '3บน': 1, '3ตัว': 2, 'โต๊ด': 3, '2บน': 4, '2ล่าง': 5 })[a.type] || 99;
      const tb = ({ '3บน': 1, '3ตัว': 2, 'โต๊ด': 3, '2บน': 4, '2ล่าง': 5 })[b.type] || 99;
      if (ta !== tb) return ta - tb;
      return a.number.localeCompare(b.number);
    });
  }, [intakeBets]);

  const totalForwarded = forwardsSummary.reduce((s, f) => s + f.forwarded, 0);
  const totalKept = forwardsSummary.reduce((s, f) => s + f.kept, 0);
  const totalIntake = forwardsSummary.reduce((s, f) => s + f.intake, 0);

  const saveDefaults = () => {
    const d3 = parseFloat(def3D);
    const d2 = parseFloat(def2D);
    setForwardSettings({
      defaultMaxKeep3D: !isNaN(d3) && d3 > 0 ? d3 : null,
      defaultMaxKeep2D: !isNaN(d2) && d2 > 0 ? d2 : null,
    });
    toast.show('บันทึกเพดานเริ่มต้นแล้ว', 'success');
    setMode('view');
  };

  const clearDefaults = () => {
    setForwardSettings({ defaultMaxKeep3D: null, defaultMaxKeep2D: null });
    setDef3D(''); setDef2D('');
    toast.show('ยกเลิกเพดานเริ่มต้นแล้ว', 'info');
  };

  const addOverride = () => {
    if (!overrideNum || !overrideType) { toast.show('เลือกเลข + ประเภท', 'info'); return; }
    const m = parseFloat(overrideMax);
    if (isNaN(m) || m < 0) { toast.show('ใส่ยอดให้ถูกต้อง', 'info'); return; }
    // Remove existing for same combo
    setForwards(prev => {
      const filtered = prev.filter(f => !(
        f.lotteryId === lottery.id && f.drawDate === drawDate &&
        f.number === overrideNum && f.type === overrideType
      ));
      return [...filtered, {
        id: uid(),
        lotteryId: lottery.id, drawDate,
        number: overrideNum, type: overrideType,
        maxKeep: m, createdAt: Date.now()
      }];
    });
    toast.show('ตั้งเพดาน ' + overrideNum + ' ' + typeShort(overrideType) + ' ที่ ฿' + fmt(m), 'success');
    setOverrideNum(''); setOverrideMax(''); setOverrideType(null);
  };

  const removeOverride = (id) => {
    setForwards(prev => prev.filter(f => f.id !== id));
  };

  const clearAllOverrides = async () => {
    if (currentOverrides.length === 0) return;
    const ok = await toast.askConfirm('ลบเพดานเฉพาะเลขทั้งหมด ?\n(' + currentOverrides.length + ' รายการ)', { danger: true, confirmLabel: 'ลบ' });
    if (!ok) return;
    setForwards(prev => prev.filter(f => !(f.lotteryId === lottery.id && f.drawDate === drawDate)));
    toast.show('ลบเพดานเฉพาะเลขแล้ว', 'success');
  };

  // Build LINE share text — for bookie boss
  const lineText = useMemo(() => {
    if (forwardsSummary.length === 0) return '';
    const lines = [
      '🎰 Royal 888',
      '➡️ เลขส่งต่อ',
      `📋 ${lottery.name}`,
      `🗓 งวด ${formatDrawDateLong(drawDate)}`,
      '━━━━━━━━━━━━━━━',
    ];
    const grouped = {};
    forwardsSummary.forEach(f => {
      if (!grouped[f.type]) grouped[f.type] = [];
      grouped[f.type].push(f);
    });
    ['3บน', '3ตัว', 'โต๊ด', '2บน', '2ล่าง'].forEach(type => {
      if (!grouped[type]) return;
      lines.push('');
      lines.push(`◆ ${typeFullName(type)} (${grouped[type].length} เลข)`);
      grouped[type].forEach(f => {
        lines.push(`   ${f.number}  ฿${fmt(f.forwarded)}`);
      });
    });
    lines.push('');
    lines.push('━━━━━━━━━━━━━━━');
    lines.push(`💰 ยอดส่งต่อรวม ฿${fmt(totalForwarded)}`);
    lines.push('#Royal888');
    return lines.join('\n');
  }, [forwardsSummary, lottery.name, drawDate, totalForwarded]);

  const copy = async () => {
    try { await navigator.clipboard.writeText(lineText); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = lineText; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
    }

function CutsSection({ lottery, drawDate, cuts, onRemove, onClearAll, toast }) {
  const [expanded, setExpanded] = useState(true);
  const [copied, setCopied] = useState(false);

  // Aggregate by type+number for display
  const grouped = useMemo(() => {
    const map = {};
    cuts.forEach(c => {
      c.items.forEach(it => {
        const key = it.type + '|' + it.number;
        if (!map[key]) {
          map[key] = {
            type: it.type, number: it.number,
            amount: 0, count: 0,
            kinds: [], cutIds: [],
            reduceLatest: null,
            capToLatest: null,
          };
        }
        map[key].amount += it.amount || 0;
        map[key].count += it.count || 0;
        map[key].kinds.push(c.kind);
        map[key].cutIds.push(c.id);
        if (c.kind === 'reduce' && it.keepPercent !== undefined) {
          map[key].reduceLatest = it.keepPercent;
        }
        if (c.kind === 'cap-intake' && it.capTo !== undefined) {
          map[key].capToLatest = it.capTo;
        }
      });
    });
    // Sort by type order, then number
    const typeOrder = { '3บน': 1, '3ตัว': 2, 'โต๊ด': 3, '2บน': 4, '2ล่าง': 5 };
    return Object.values(map).sort((a, b) => {
      const ta = typeOrder[a.type] || 99;
      const tb = typeOrder[b.type] || 99;
      if (ta !== tb) return ta - tb;
      return a.number.localeCompare(b.number);
    });
  }, [cuts]);

  // Group display by type
  const byType = useMemo(() => {
    const map = {};
    grouped.forEach(item => {
      if (!map[item.type]) map[item.type] = [];
      map[item.type].push(item);
    });
    return Object.entries(map);
  }, [grouped]);

  const totalAmount = grouped.reduce((s, g) => s + g.amount, 0);
  const totalCount = grouped.reduce((s, g) => s + g.count, 0);

  const text = useMemo(() => formatCutsForLine(cuts, lottery, drawDate), [cuts, lottery, drawDate]);

  const copy = async () => {
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
    }
    setCopied(true);
    toast.show('คัดลอกแล้ว', 'success');
    setTimeout(() => setCopied(false), 2000);
  };

  const shareApi = async () => {
    if (navigator.share) {
      try { await navigator.share({ text }); } catch (e) {}
    } else { copy(); }
  };

  return (
    <div className="glass rounded-2xl p-4">
      <button onClick={() => setExpanded(e => !e)} className="w-full flex items-center gap-2 mb-3 text-left">
        <div className="w-1.5 h-5 rounded-full" style={{ background: 'linear-gradient(180deg, #b91c1c 0%, #7f1d1d 100%)' }}/>
        <h2 className="font-display text-xl font-bold tracking-wide text-stone-900">เลขที่ตัด/ลดออก</h2>
        <span className="text-base font-display font-semibold bg-red-100 text-red-800 border border-red-300 rounded-full px-2.5 py-0.5">
          {grouped.length}
        </span>
        <span className="ml-auto text-red-700 text-xl font-bold">{expanded ? '▴' : '▾'}</span>
      </button>

      {expanded && (
        cuts.length === 0 ? (
          <div className="text-center py-6 bg-stone-50 rounded-xl border border-dashed border-stone-200">
            <div className="text-stone-400 text-base font-display">— ยังไม่ได้ตัดเลขใด —</div>
            <div className="text-stone-300 text-base font-display mt-1">ตัด/ลดเลขจาก "สรุปทุกโพย" ด้านล่าง</div>
          </div>
        ) : (
          <div className="space-y-3">
            {/* Summary */}
            <div className="grid grid-cols-2 gap-2">
              <div className="num-tile rounded-xl p-3">
                <div className="text-base uppercase tracking-wider font-display font-semibold" style={{color:'#8a6d36'}}>ตัดออก/ลด</div>
                <div className="font-numeric text-2xl font-bold gold-text mt-1">฿{fmt(totalAmount)}</div>
              </div>
              <div className="rounded-xl p-3 bg-red-50 border border-red-200">
                <div className="text-base uppercase tracking-wider font-display font-semibold" style={{color:'#8a6d36'}}>รายการ</div>
                <div className="font-numeric text-2xl font-bold text-red-700 mt-1">{totalCount}</div>
              </div>
            </div>

            {/* Grouped by type */}
            <div className="space-y-2">
              {byType.map(([type, items]) => (
                <div key={type} className="bg-white rounded-xl border border-red-200 p-2.5">
                  <div className="text-base uppercase tracking-wider text-red-700 font-display font-bold mb-2 flex items-center gap-1.5">
                    <div className="w-1 h-3 rounded-full bg-red-500"/>
                    {typeFullName(type)}
                    <span className="text-stone-500 font-numeric font-semibold">· {items.length} เลข</span>
                  </div>
                  <div className="space-y-1">
                    {items.map(item => {
                      const isCap = item.kinds.includes('cap-intake') && !item.kinds.includes('cut-combo') && !item.kinds.includes('cut-threshold');
                      const isReduce = item.kinds.includes('reduce') && !item.kinds.includes('cut-combo') && !item.kinds.includes('cut-threshold') && !isCap;
                      return (
                        <div key={item.type + item.number}
                          className="bg-red-50 border border-red-200 rounded-lg px-2.5 py-1.5 flex items-center gap-2">
                          <div className="font-numeric font-bold text-red-900 text-xl flex-shrink-0">{item.number}</div>
                          <div className="flex-1 min-w-0">
                            <div className="font-numeric text-lg font-semibold text-red-800">฿{fmt(item.amount)}</div>
                            <div className="text-base text-stone-600 font-display flex items-center gap-1 flex-wrap">
                              {isCap
                                ? <span className="bg-amber-100 text-amber-800 rounded px-1.5 py-0.5 text-base font-semibold">📏 จำกัด ฿{fmt(item.capToLatest)}</span>
                                : isReduce
                                  ? <span className="bg-amber-100 text-amber-800 rounded px-1.5 py-0.5 text-base font-semibold">📉 เหลือ {item.reduceLatest}%</span>
                                  : <span className="bg-red-100 text-red-800 rounded px-1.5 py-0.5 text-base font-semibold">✂ ตัดทิ้ง</span>}
                              <span>{item.count} โพย</span>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>

            {/* Actions */}
            <div className="grid grid-cols-3 gap-2">
              <button onClick={copy}
                className="py-2.5 rounded-xl bg-white border border-red-300 text-red-700 font-display text-base tracking-wider flex items-center justify-center gap-1.5 active:scale-95">
                {copied ? <Check size={13} strokeWidth={3}/> : <Copy size={13}/>}
                {copied ? 'คัดลอก' : 'คัดลอก'}
              </button>
              <button onClick={shareApi}
                className="py-2.5 rounded-xl btn-premium font-display text-base tracking-wider flex items-center justify-center gap-1.5 active:scale-95">
                <Share2 size={13} strokeWidth={3}/>
                ส่ง LINE
              </button>
              <button onClick={onClearAll}
                className="py-2.5 rounded-xl bg-stone-100 text-stone-600 font-display text-base tracking-wider border border-stone-300 flex items-center justify-center gap-1.5 active:scale-95">
                <Trash2 size={13}/>
                ล้าง
              </button>
            </div>

            {/* Preview text */}
            <details className="bg-stone-50 rounded-lg">
              <summary className="cursor-pointer px-3 py-2 text-base text-stone-500 font-display tracking-wider uppercase">ดูข้อความที่จะส่ง</summary>
              <div className="px-3 pb-3 pt-1 font-numeric text-base text-stone-700 whitespace-pre-wrap leading-relaxed max-h-48 overflow-y-auto">{text}</div>
            </details>
          </div>
        )
      )}
    </div>
  );
}

function SimRow({ label, value }) {
  if (!value) return null;
  return (

// ==================== PICK TAB ====================
// ==================== คัดเลข: สถิติจากผลจริง ====================
// หวยที่มีผลอัตโนมัติ (ไทย/ลาว/ฮานอยปกติ/พิเศษ/VIP) → ดึงประวัติทั้งหมดจากฐานข้อมูล (หน้าละ 1,000 แถว) + เก็บสำรองในเครื่อง
// หวยอื่น → ใช้ผลที่กรอกเองในเครื่อง
const HIST_KEY = 'lotto888-hist-v3';   // v3 (v4.7): ฮานอยพิเศษ/VIP เติมย้อนหลังถึง 1 ส.ค. 67 → ทิ้งแคชเก่า (v2 มีแค่ 85 งวด)
try { localStorage.removeItem('lotto888-hist-v1'); localStorage.removeItem('lotto888-hist-v2'); } catch (e) {}
const HIST_TTL = 6 * 3600e3;
const HIST_COLS = { gov: 'draw_date,first_prize,last2', lao: 'draw_date,top3,top2,bottom2', hanoi: 'draw_date,top3,top2,bottom2', hanoi_sp: 'draw_date,top3,top2,bottom2', hanoi_vip: 'draw_date,top3,top2,bottom2' };
const _histMem = {};
function readHistCache(lid) {
  if (_histMem[lid]) return _histMem[lid];
  try { const all = JSON.parse(localStorage.getItem(HIST_KEY) || '{}'); return all[lid] || null; } catch (e) { return null; }
}
function writeHistCache(lid, entry) {
  _histMem[lid] = entry;
  try { const all = JSON.parse(localStorage.getItem(HIST_KEY) || '{}'); all[lid] = entry; localStorage.setItem(HIST_KEY, JSON.stringify(all)); } catch (e) {}
}
async function fetchHistory(lid) {
  const A = AUTO_LOTTERIES[lid], rows = [];
  for (let off = 0; off < 50000; off += 1000) {
    const page = await supaGet(A.table + '?select=' + HIST_COLS[lid] + '&order=draw_date.desc&limit=1000&offset=' + off, 20000);
    rows.push(...page);
    if (page.length < 1000) break;
  }
  // [วันที่, 3ตัวบน, 2ตัวบน, 2ตัวล่าง] ใหม่ → เก่า
  return rows.map(r => autoRowToDraw(lid, r)).filter(Boolean)
    .map(d => [d.date, d.results['3บน'] || d.results['3ตัว'], d.results['2บน'], d.results['2ล่าง']]);
}

function useResultHistory(lottery, draws) {
  const lid = lottery.id, isAuto = AUTO_IDS.includes(lid);
  const [st, setSt] = useState({ lid, rows: null, at: 0, loading: false, error: false });
  useEffect(() => {
    if (!isAuto) { setSt({ lid, rows: null, at: 0, loading: false, error: false }); return; }
    let alive = true;
    const c = readHistCache(lid);
    const fresh = c && Date.now() - c.at < HIST_TTL;
    setSt({ lid, rows: c ? c.rows : null, at: c ? c.at : 0, loading: !fresh, error: false });
    if (fresh) return;
    fetchHistory(lid)
      .then(rows => { const e = { rows, at: Date.now() }; writeHistCache(lid, e); if (alive) setSt({ lid, ...e, loading: false, error: false }); })
      .catch(() => { if (alive) setSt(s => ({ ...s, loading: false, error: true })); });
    return () => { alive = false; };
  }, [lid]);
  const rows = useMemo(() => {
    const map = new Map();
    if (st.lid === lid) (st.rows || []).forEach(r => map.set(r[0], r));
    const today = todayISO();
    draws.forEach(d => {
      if (d.lotteryId !== lid || !d.results || d.date > today) return;
      const r3 = d.results['3บน'] || d.results['3ตัว'] || '', r2d = d.results['2ล่าง'] || '';
      const r2u = d.results['2บน'] || (r3 ? r3.slice(-2) : '');
      if (!r3 && !r2d) return;
      if (d.source === 'manual' || !map.has(d.date)) map.set(d.date, [d.date, r3, r2u, r2d]);
    });
    return [...map.values()].sort((a, b) => b[0].localeCompare(a[0]));
  }, [st, draws, lid]);
  return { rows, isAuto, loading: st.loading && st.lid === lid, error: st.error && st.lid === lid };
}

const PICK_POS = [
  { id: '2ล่าง', label: '2 ตัวล่าง', col: 3, len: 2 },
  { id: '2บน',  label: '2 ตัวบน',  col: 2, len: 2 },
  { id: '3',    label: '3 ตัวบน',  col: 1, len: 3 },
];
const HOT_WINDOW = 30;

// สถิติ: hot = นับใน 30 งวดล่าสุด (เสมอกัน → ออกล่าสุดก่อน) · cold = ไม่ออกนานสุด นับจากประวัติทั้งหมด
function computePickStats(rows, pos) {
  const P = PICK_POS.find(p => p.id === pos), vals = rows.map(r => r[P.col]).filter(v => v && v.length === P.len);
  const recent = vals.slice(0, HOT_WINDOW), cnt = {}, lastIdx = {};
  recent.forEach((v, i) => { cnt[v] = (cnt[v] || 0) + 1; if (lastIdx[v] === undefined) lastIdx[v] = i; });
  const hot = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || lastIdx[a] - lastIdx[b] || a.localeCompare(b))
    .slice(0, 8).map(n => ({ n, c: cnt[n] }));
  let cold = [], neverCount = 0;
  if (P.len === 2) {
    const seen = {};
    vals.forEach((v, i) => { if (seen[v] === undefined) seen[v] = i; });
    const all = [];
    for (let i = 0; i < 100; i++) { const k = String(i).padStart(2, '0'); all.push({ n: k, gap: seen[k] === undefined ? vals.length : seen[k], never: seen[k] === undefined }); }
    neverCount = all.filter(x => x.never).length;
    cold = all.sort((a, b) => b.gap - a.gap || a.n.localeCompare(b.n)).slice(0, 8);
  }
  return { hot, cold, total: vals.length, recentN: recent.length, neverCount, len: P.len };
}

function QuickRoll3({ onSendToJot }) {
  const [digits, setDigits] = useState(['?', '?', '?']);
  const [rolling, setRolling] = useState(false);
  const [result, setResult] = useState('');
  const [history, setHistory] = useState([]);
  const timer = useRef(null);
  useEffect(() => () => clearInterval(timer.current), []);
  const roll = () => {
    if (rolling) return;
    const final = String(Math.floor(Math.random() * 1000)).padStart(3, '0');
    const start = Date.now();
    setRolling(true); setResult('');
    timer.current = setInterval(() => {
      const t = Date.now() - start;
      const locked = t >= 1200 ? 3 : t >= 900 ? 2 : t >= 600 ? 1 : 0;   // หลักที่หยุดแล้ว
      setDigits([0, 1, 2].map(i => (i < locked ? final[i] : String(Math.floor(Math.random() * 10)))));
      if (locked === 3) {
        clearInterval(timer.current);
        setRolling(false); setResult(final);
        setHistory(h => [final, ...h].slice(0, 8));
      }
    }, 60);
  };
  return (
    <div className="rounded-2xl p-1.5 mb-3" data-testid="quick-roll3"
      style={{ background: 'linear-gradient(135deg, #e3cf9e, #f7eed8 45%, #d4b572)', boxShadow: '0 6px 18px rgba(138,109,54,.16)' }}>

        </div>
        <div className="grid grid-cols-3 gap-2.5 mb-4">
          {digits.map((d, i) => (
            <div key={i} className="rounded-xl text-center flex items-center justify-center" data-testid="roll-digit"
              style={{ aspectRatio: '0.85', background: 'linear-gradient(160deg, #f9ecc9, #edd7a2)', border: '1.5px solid #d9bd80',

          style={{ background: '#2a2a2a', color: '#fff', border: '1.5px solid #d4b572', opacity: rolling ? 0.7 : 1 }}>

        </button>

        )}

    </div>
  );

async function fetchWithTimeout(url, ms = 15000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    return r;
  } finally {
    clearTimeout(timer);
  }
}
