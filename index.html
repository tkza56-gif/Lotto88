// ==================== CAPS / HALF-PAY HELPER ====================
// caps: [{ lotteryId, drawDate, number, type, halfPay: true }]
function isCombosHalfPay(caps, lotteryId, drawDate, number, type) {
  return caps.some(c =>
    c.lotteryId === lotteryId &&
    c.drawDate === drawDate &&
    c.number === number &&
    c.type === type &&
    c.halfPay
  );
}
function enrichBetsWithCaps(bets, caps, currentRates, forwards, forwardSettings) {
  // Step 1: Add rates + halfPay flags
  const withCaps = bets.map(b => ({
    ...b,
    rate: (currentRates && currentRates[b.type]) || b.rate || 90,
    halfPay: isCombosHalfPay(caps, b.lotteryId, b.drawDate, b.number, b.type)
  }));
  // Step 2: Adjust amount per forwarding rules (if any)
  if (!forwards || forwards.length === 0) {
    if (!forwardSettings ||
        ((forwardSettings.defaultMaxKeep3D === null || forwardSettings.defaultMaxKeep3D === undefined || forwardSettings.defaultMaxKeep3D <= 0) &&
         (forwardSettings.defaultMaxKeep2D === null || forwardSettings.defaultMaxKeep2D === undefined || forwardSettings.defaultMaxKeep2D <= 0))) {
      return withCaps;
    }
  }
  const comboMap = computeIntakePerCombo(withCaps);
  return withCaps.map(b => {
    const comboKey = b.lotteryId + '|' + b.drawDate + '|' + b.number + '|' + b.type;
    const combo = comboMap[comboKey];
    const maxKeep = getMaxKeep(b.lotteryId, b.drawDate, b.number, b.type, forwards, forwardSettings);
    const intake = combo?.intake || 0;
    let keptAmount = parseFloat(b.amount) || 0;
    if (maxKeep !== null && intake > maxKeep) {
      const factor = maxKeep / intake;
      keptAmount = keptAmount * factor;
    }
    return { ...b, amount: keptAmount };
  });
}

// Helper: apply current rates to bet list for calc
function applyCurrentRates(bets, rates) {
  if (!rates) return bets;
  return bets.map(b => ({ ...b, rate: rates[b.type] || b.rate || 90 }));
}


// ==================== GOV DRAW DATE HELPERS ====================
// Thai Government Lottery draws: typically 1st and 16th of each month
// Sometimes shifted to end of previous month if 1st/16th falls on holiday
// Generate next ~12 likely draw dates from a base date
function getGovDrawDates(baseDateISO, monthsAhead = 12) {
  const dates = new Set();
  const base = new Date(baseDateISO + 'T00:00:00');

  // Add a few past months too (for recording past draws)
  for (let m = -3; m < monthsAhead; m++) {
    const d = new Date(base.getFullYear(), base.getMonth() + m, 1);
    const year = d.getFullYear();
    const month = d.getMonth();

    // 1st of month
    dates.add(`${year}-${String(month + 1).padStart(2, '0')}-01`);
    // 16th of month
    dates.add(`${year}-${String(month + 1).padStart(2, '0')}-16`);
    // Last day of month (handles holiday shift case — gov shifts to 30/31)
    const lastDay = new Date(year, month + 1, 0).getDate();
    dates.add(`${year}-${String(month + 1).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`);
    // 2nd-to-last day (sometimes)
    if (lastDay - 1 !== 16) {
      dates.add(`${year}-${String(month + 1).padStart(2, '0')}-${String(lastDay - 1).padStart(2, '0')}`);
    }
  }
  return [...dates].sort();
}

function getNextDrawDate(todayISO, lotteryId) {
  // Pick next upcoming "official" draw date
  if (lotteryId === 'gov') {
    // Gov lottery draws on 1st or 16th only (most of the time)
    const d = new Date(todayISO + 'T00:00:00');
    const day = d.getDate();
    if (day <= 1) {
      // Today is 1st or before — next draw = today's month 1st (if today is 1st) or wait
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
    }
    if (day < 16) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-16`;
    }
    if (day === 16) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-16`;
    }
    // After 16th — next draw is 1st of next month
    const next = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    return `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}-01`;
  }
  // Other lotteries: default to today (they draw daily/weekly)
  return todayISO;
}

function formatDrawDateShort(iso) {
  if (!iso) return '-';
  const d = new Date(iso + 'T00:00:00');
  const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  return `${d.getDate()} ${months[d.getMonth()]} ${(d.getFullYear() + 543) % 100}`;
}

function formatDrawDateLong(iso) {
  if (!iso) return '-';
  const d = new Date(iso + 'T00:00:00');
  const months = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
}

function formatBackupTime(timestamp) {
  if (!timestamp) return '-';
  const d = new Date(timestamp);
  const now = new Date();
  const diff = now - d;
  const seconds = Math.floor(diff / 1000);
  const minutes = Math.floor(seconds / 60);
  const hours = Math.floor(minutes / 60);
  const days = Math.floor(hours / 24);

  if (seconds < 60) return 'เมื่อสักครู่';
  if (minutes < 60) return minutes + ' นาทีที่แล้ว';
  if (hours < 24) return hours + ' ชม.ที่แล้ว';
  if (days < 7) return days + ' วันที่แล้ว';

  const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${d.getDate()} ${months[d.getMonth()]} ${hh}:${mm}`;
}

const getToadVariations = (num) => {
  const digits = num.split('');
  const perms = new Set();
  const permute = (arr, current = []) => {
    if (arr.length === 0) { perms.add(current.join('')); return; }
    for (let i = 0; i < arr.length; i++) {
      const rest = [...arr.slice(0, i), ...arr.slice(i + 1)];
      permute(rest, [...current, arr[i]]);
    }
  };
  permute(digits);
  return [...perms];
};

const reverseDigits = (s) => s.split('').reverse().join('');

const checkWin = (bet, results) => {
  if (!results) return null;
  const r3 = results['3บน'] || results['3ตัว'] || '';
  const r2u = results['2บน'] || '';
  const r2d = results['2ล่าง'] || '';
  switch (bet.type) {
    case '3บน': case '3ตัว': return bet.number === r3;
    case '2บน': return bet.number === r2u || (r3 && bet.number === r3.slice(-2));
    case '2ล่าง': return bet.number === r2d;
    case 'โต๊ด': {
      if (!r3 || r3.length !== 3) return false;
      return getToadVariations(r3).includes(bet.number) && bet.number !== r3;
    }
    default: return false;
  }
};

function genericToType(generic, len, lottery) {
  if (len === 3) {
    if (generic === 'โต๊ด') return 'โต๊ด';
    return lottery.types.includes('3ตัว') ? '3ตัว' : '3บน';
  }
  return generic === 'ล่าง' ? '2ล่าง' : '2บน';
}

// ==================== FORWARDING HELPERS ====================
// computeIntakePerCombo: คำนวณยอดรวมต่อเลข+type ก่อนหัก forward
function computeIntakePerCombo(bets) {
  const map = {}; // key = lotteryId|drawDate|number|type
  bets.forEach(b => {
    const key = b.lotteryId + '|' + b.drawDate + '|' + b.number + '|' + b.type;
    if (!map[key]) {
      map[key] = {
        lotteryId: b.lotteryId, drawDate: b.drawDate,
        number: b.number, type: b.type,
        intake: 0, betIds: []
      };
    }
    map[key].intake += parseFloat(b.amount) || 0;
    map[key].betIds.push(b.id);
  });
  return map;
}

// getMaxKeep: หา max keep ของเลข+type นี้ (เฉพาะของ override หรือ default)
function getMaxKeep(lotteryId, drawDate, number, type, forwards, settings) {
  // 1) Check explicit override per combo
  const explicit = forwards.find(f =>
    f.lotteryId === lotteryId && f.drawDate === drawDate &&
    f.number === number && f.type === type
  );
  if (explicit && explicit.maxKeep !== null && explicit.maxKeep !== undefined) {
    return explicit.maxKeep;
  }
  // 2) Default per group
  const is2digit = (type === '2บน' || type === '2ล่าง');
  const def = is2digit ? settings?.defaultMaxKeep2D : settings?.defaultMaxKeep3D;
  if (def !== null && def !== undefined && def > 0) return def;
  // 3) No cap
  return null;
}

// enrichBetsWithForwards: ปรับ b.amount เป็น kept amount + bake in rates
// Each bet's amount becomes the kept portion proportional to maxKeep/intake
function enrichBetsWithForwards(bets, forwards, settings, rates) {
  if (!bets || bets.length === 0) return [];
  const comboMap = computeIntakePerCombo(bets);
  // Use first bet to derive lottery/drawDate context for caps look-up — but we have it in b itself.
  return bets.map(b => {
    const comboKey = b.lotteryId + '|' + b.drawDate + '|' + b.number + '|' + b.type;
    const combo = comboMap[comboKey];
    const maxKeep = getMaxKeep(b.lotteryId, b.drawDate, b.number, b.type, forwards, settings);
    const intake = combo?.intake || 0;
    let keptAmount = parseFloat(b.amount) || 0;
    if (maxKeep !== null && intake > maxKeep) {
      // Proportional: this bet's share of kept = (b.amount / intake) * maxKeep
      const factor = maxKeep / intake;
      keptAmount = keptAmount * factor;
    }
    const currentRate = rates?.[b.type] ?? b.rate ?? 90;
    return { ...b, amount: keptAmount, rate: currentRate };
  });
}

// computeForwardsSummary: รวมยอดส่งต่อต่อเลข (สำหรับ section "เลขส่งต่อ" + ส่ง LINE)
function computeForwardsSummary(bets, forwards, settings) {
  if (!bets || bets.length === 0) return [];
  const comboMap = computeIntakePerCombo(bets);
  const result = [];
  Object.values(comboMap).forEach(combo => {
    const maxKeep = getMaxKeep(combo.lotteryId, combo.drawDate, combo.number, combo.type, forwards, settings);
    if (maxKeep === null || combo.intake <= maxKeep) return;
    const forwarded = combo.intake - maxKeep;
    result.push({
      lotteryId: combo.lotteryId, drawDate: combo.drawDate,
      number: combo.number, type: combo.type,
      intake: combo.intake, maxKeep, kept: maxKeep, forwarded,
      betCount: combo.betIds.length
    });
  });
  // Sort: 3บน/3ตัว/โต๊ด first, then 2บน/2ล่าง — within each by number
  const typeOrder = { '3บน': 1, '3ตัว': 2, 'โต๊ด': 3, '2บน': 4, '2ล่าง': 5 };
  result.sort((a, b) => {
    const ta = typeOrder[a.type] || 99;
    const tb = typeOrder[b.type] || 99;
    if (ta !== tb) return ta - tb;
    return a.number.localeCompare(b.number);
  });
  return result;
}

function computePayoutFor3D(num3, bets) {
  if (!num3 || num3.length !== 3) return { total: 0, breakdown: { direct: 0, two_up: 0, toad: 0 } };
  let total = 0;
  const breakdown = { direct: 0, two_up: 0, toad: 0 };
  const last2 = num3.slice(-2);
  const perms = new Set(getToadVariations(num3));
  bets.forEach(b => {
    const amt = parseFloat(b.amount) || 0;
    const rate = parseFloat(b.rate) || 0;
    const halfMult = b.halfPay ? 0.5 : 1;
    const pay = amt * rate * halfMult;
    if ((b.type === '3บน' || b.type === '3ตัว') && b.number === num3) {
      breakdown.direct += pay; total += pay;
    } else if (b.type === '2บน' && b.number === last2) {
      breakdown.two_up += pay; total += pay;
    } else if (b.type === 'โต๊ด' && perms.has(b.number) && b.number !== num3) {
      breakdown.toad += pay; total += pay;
    }
  });
  return { total, breakdown };
}

function computePayoutFor2DLow(num2, bets) {
  if (!num2 || num2.length !== 2) return 0;
  let total = 0;
  bets.forEach(b => {
    if (b.type === '2ล่าง' && b.number === num2) {
      const halfMult = b.halfPay ? 0.5 : 1;
      total += (parseFloat(b.amount) || 0) * (parseFloat(b.rate) || 0) * halfMult;
    }
  });
  return total;
}

function computeScenarios(bets) {
  if (bets.length === 0) return { best: null, worst: null, intake: 0 };
  const totalIntake = bets.reduce((s, b) => s + (parseFloat(b.amount) || 0), 0);

  // Collect 3-digit candidates from bets (ตรง, โต๊ด, 2บน — derived 3-digit)
  // Only check numbers that exist in the bet list. Each 3-digit number that someone bet on
  // is a real risk scenario. Don't check 000-999 randomly.
  const candidates3D = new Set();
  bets.forEach(b => {
    if (b.type === '3บน' || b.type === '3ตัว') {
      candidates3D.add(b.number);
    } else if (b.type === 'โต๊ด') {
      // Toad bets cover all permutations
      getToadVariations(b.number).forEach(p => candidates3D.add(p));
    } else if (b.type === '2บน') {
      // 2บน triggers on last 2 of 3-digit prize. We need to know which 3-digit prize
      // could trigger this 2บน. Since we only test bets that exist, we can derive:
      // any number ending in this 2-digit string. We'll skip exhaustive search here —
      // because if no 3-digit bet exists for it, the worst case is just 2บน hit alone.
      // To be safe, add at least one representative 3-digit ending with this 2บน.
      candidates3D.add('0' + b.number);
    }
  });

  let min3 = { num: null, pay: 0 };
  let max3 = { num: null, pay: 0 };
  if (candidates3D.size > 0) {
    min3 = { num: null, pay: Infinity };
    max3 = { num: null, pay: -Infinity };
    candidates3D.forEach(n => {
      const p = computePayoutFor3D(n, bets).total;
      if (p < min3.pay) min3 = { num: n, pay: p };
      if (p > max3.pay) max3 = { num: n, pay: p };
    });
    if (min3.pay === Infinity) min3 = { num: null, pay: 0 };
    if (max3.pay === -Infinity) max3 = { num: null, pay: 0 };
  }

  // 2 ล่าง — collect candidates from bets only
  const candidates2L = new Set();
  bets.forEach(b => {
    if (b.type === '2ล่าง') candidates2L.add(b.number);
  });

  let min2 = { num: null, pay: 0 };
  let max2 = { num: null, pay: 0 };
  if (candidates2L.size > 0) {
    min2 = { num: null, pay: Infinity };
    max2 = { num: null, pay: -Infinity };
    candidates2L.forEach(n => {
      const p = computePayoutFor2DLow(n, bets);
      if (p < min2.pay) min2 = { num: n, pay: p };
      if (p > max2.pay) max2 = { num: n, pay: p };
    });
    if (min2.pay === Infinity) min2 = { num: null, pay: 0 };
    if (max2.pay === -Infinity) max2 = { num: null, pay: 0 };
  }

  return {
    intake: totalIntake,
    best: { num3: min3.num, num2low: min2.num, payout: min3.pay + min2.pay, net: totalIntake - (min3.pay + min2.pay) },
    worst: { num3: max3.num, num2low: max2.num, payout: max3.pay + max2.pay, net: totalIntake - (max3.pay + max2.pay) },
  };
}

// ==================== LINE PARSERS ====================
function parseLineText(text, lottery, defaultAmount, rates) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const out = [];
  const typeMap = {
    'ตรง':'ตรง','บน':'บน','ล่าง':'ล่าง','โต๊ด':'โต๊ด','โตด':'โต๊ด',
    'ลาง':'ล่าง','tod':'โต๊ด','top':'ตรง','bot':'ล่าง',
  };

  for (const line of lines) {
    if (/^[#\-=]/.test(line)) continue;
    const numMatch = line.match(/\d{2,3}/);
    if (!numMatch) continue;
    const number = numMatch[0];
    const after = line.slice(numMatch.index + numMatch[0].length);

    const shortMatch = after.match(/^[\s=\-:]*(\d+(?:\.\d+)?(?:\s*[×x*\/]\s*\d+(?:\.\d+)?)+)\s*$/i);
    if (shortMatch) {
      const amts = shortMatch[1].split(/[×x*\/]/i).map(s => parseFloat(s.trim())).filter(n => !isNaN(n) && n > 0);
      const lineBets = [];
      if (number.length === 3) {
        const perms = [...getToadVariations(number)].sort();
        const N = amts.length;
        const P = perms.length;
        if (N === P && N >= 2) {
          amts.forEach((amt, i) => lineBets.push({ number: perms[i], generic: 'ตรง', amount: amt }));
        } else {
          const slots = ['ตรง', 'โต๊ด', '2ล่าง', '2บน'];
          amts.forEach((amt, i) => {
            if (i >= slots.length) return;
            const slot = slots[i];
            if (slot === 'ตรง' || slot === 'โต๊ด') lineBets.push({ number, generic: slot, amount: amt });
            else if (slot === '2ล่าง') lineBets.push({ number: number.slice(-2), generic: 'ล่าง', amount: amt });
            else if (slot === '2บน') lineBets.push({ number: number.slice(-2), generic: 'บน', amount: amt });
          });
        }
      } else {
        const slots = ['บน', 'ล่าง'];
        amts.forEach((amt, i) => { if (i < slots.length) lineBets.push({ number, generic: slots[i], amount: amt }); });
      }
      for (const b of lineBets) {
        const type = genericToType(b.generic, b.number.length, lottery);
        if (out.some(o => o.number === b.number && o.type === type)) continue;
        out.push({ id: uid(), number: b.number, type, amount: b.amount, rate: rates[type] || 90 });
      }
      continue;
    }

    const tokens = after.match(/[ก-๙a-zA-Z]+|\d+(?:\.\d+)?/g) || [];
    let pendingAmt = null, pendingType = null, reverse = false;
    const lineBets = [];
    for (const tok of tokens) {
      if (/^\d/.test(tok)) {
        const amt = parseFloat(tok);
        if (pendingType) { lineBets.push({ number, generic: pendingType, amount: amt }); pendingType = null; }
        else {
          if (pendingAmt !== null) {
            const dt = number.length === 3 ? 'ตรง' : 'บน';
            lineBets.push({ number, generic: dt, amount: pendingAmt });
          }
          pendingAmt = amt;
        }
      } else if (tok === 'กลับ' || tok.toLowerCase() === 'reverse') { reverse = true; }
      else if (typeMap[tok]) {
        const t = typeMap[tok];
        if (pendingAmt !== null) { lineBets.push({ number, generic: t, amount: pendingAmt }); pendingAmt = null; }
        else { pendingType = t; }
      }
    }
    if (pendingAmt !== null) {
      const dt = number.length === 3 ? 'ตรง' : 'บน';
      lineBets.push({ number, generic: dt, amount: pendingAmt });
    }
    if (lineBets.length === 0 && defaultAmount > 0) {
      const dt = number.length === 3 ? 'ตรง' : 'บน';
      lineBets.push({ number, generic: dt, amount: defaultAmount });
    }
    if (reverse) {
      if (number.length === 3) {
        // กลับ 3 ตัว = ทุก permutation (เช่น 223 → 223, 232, 322)
        // ใช้กับ ตรง เท่านั้น — โต๊ด คุ้มทุก perm อยู่แล้ว
        const allPerms = getToadVariations(number);
        const extraPerms = allPerms.filter(p => p !== number);
        const nonToadBets = lineBets.filter(b => b.generic !== 'โต๊ด');
        for (const perm of extraPerms) {
          for (const b of nonToadBets) {
            lineBets.push({ ...b, number: perm });
          }
        }
      } else {
        const rev = reverseDigits(number);
        if (rev !== number) lineBets.push(...lineBets.map(b => ({ ...b, number: rev })));
      }
    }
    for (const b of lineBets) {
      const type = genericToType(b.generic, b.number.length, lottery);
      if (out.some(o => o.number === b.number && o.type === type)) continue;
      out.push({ id: uid(), number: b.number, type, amount: b.amount, rate: rates[type] || 90 });
    }
  }
  return out;
}

function formatListForLine(bets, lottery, drawDate) {
  if (bets.length === 0) return '';
  const byCust = {};
  bets.forEach(b => {
    const c = b.customer || '— ไม่ระบุชื่อ —';
    if (!byCust[c]) byCust[c] = [];
    byCust[c].push(b);
  });
  const lines = [
    `🎰 Royal 888`,
    `📋 ${lottery.name}`,
    `🗓 งวด ${formatDrawDateLong(drawDate)}`,
    '─────────────',
  ];
  let total = 0;
  const sortedCusts = Object.keys(byCust).sort((a, b) => {
    if (a.startsWith('—')) return 1;
    if (b.startsWith('—')) return -1;
    return a.localeCompare(b, 'th');
  });
  sortedCusts.forEach(cust => {
    const items = byCust[cust];
    lines.push('');
    lines.push(`👤 ${cust}`);
    const byNum = {};
    items.forEach(b => { if (!byNum[b.number]) byNum[b.number] = []; byNum[b.number].push(b); });
    let custTotal = 0;
    Object.entries(byNum).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([num, group]) => {
      const parts = group.map(b => `${typeShort(b.type)} ${fmt(b.amount)}`).join(' / ');
      lines.push(`  ${num}  ${parts}`);
      group.forEach(b => { custTotal += b.amount; });
    });
    lines.push(`  รวม: ฿${fmt(custTotal)} (${items.length} รายการ)`);
    total += custTotal;
  });
  lines.push('');
  lines.push('─────────────');
  lines.push(`💰 รวมทั้งหมด ฿${fmt(total)} · ${bets.length} รายการ`);
  return lines.join('\n');
}

function formatSummaryForLine(bets, lottery, drawDate) {
  if (bets.length === 0) return 'ยังไม่มีโพยในงวดนี้';
  const s = computeScenarios(bets);
  const totalMaxPayout = bets.reduce((s, b) => s + (parseFloat(b.amount) || 0) * (parseFloat(b.rate) || 0), 0);
  const fmtSigned = (n) => (n >= 0 ? '+' : '-') + '฿' + fmt(Math.abs(n));

  // Customer breakdown
  const byCust = {};
  bets.forEach(b => {
    const c = b.customer || '— ไม่ระบุ —';
    if (!byCust[c]) byCust[c] = { intake: 0, count: 0 };
    byCust[c].intake += parseFloat(b.amount) || 0;
    byCust[c].count++;
  });
  const custList = Object.entries(byCust).sort((a, b) => b[1].intake - a[1].intake);

  const lines = [
    '🎰 Royal 888',
    `📋 ${lottery.name}`,
    `🗓 งวด ${formatDrawDateLong(drawDate)}`,
    '━━━━━━━━━━━━━━━',
    '',
    '💰 ยอดเงิน',
    `   รับเข้ารวม:   ฿${fmt(s.intake)}`,
    `   จ่ายเพดาน:    ฿${fmt(totalMaxPayout)}`,
    '',
    '📊 ความเสี่ยง',
    `   เสี่ยงได้สูงสุด: ${fmtSigned(s.best.net)}`,
    `      (ถ้าออก ${s.best.num3}${s.best.num2low ? ' / ' + s.best.num2low : ''})`,
    `   เสี่ยงเสียสุด:  ${fmtSigned(s.worst.net)}`,
    `      (ถ้าออก ${s.worst.num3}${s.worst.num2low ? ' / ' + s.worst.num2low : ''})`,
    '',
  ];
  if (custList.length > 1 || (custList.length === 1 && !custList[0][0].startsWith('—'))) {
    lines.push(`👥 โพยแยกตามลูกค้า (${custList.length})`);
    custList.forEach(([name, info]) => {
      lines.push(`   ${name}: ฿${fmt(info.intake)} (${info.count} รายการ)`);
    });
    lines.push('');
  }

  // Half-pay summary
  const halfPayCombos = {};
  bets.forEach(b => {
    if (b.halfPay) {
      const key = b.number + '|' + b.type;
      halfPayCombos[key] = (halfPayCombos[key] || 0) + 1;
    }
  });
  if (Object.keys(halfPayCombos).length > 0) {
    lines.push('½ เลขอั้นจ่ายครึ่ง');
    Object.keys(halfPayCombos).forEach(key => {
      const [num, type] = key.split('|');
      lines.push('   ' + num + ' ' + typeShort(type));
    });
    lines.push('');
  }

  lines.push(`🎯 จำนวนโพยทั้งหมด: ${bets.length} รายการ`);
  lines.push('━━━━━━━━━━━━━━━');
  lines.push('#Royal888');
  return lines.join('\n');
}

function formatCutsForLine(cuts, lottery, drawDate) {
  if (cuts.length === 0) return '';
  const lines = [
    '🎰 Royal 888',
    '✂️ สรุปเลขที่ตัด',
    `📋 ${lottery.name}`,
    `🗓 งวด ${formatDrawDateLong(drawDate)}`,
    '━━━━━━━━━━━━━━━',
  ];

  // Aggregate by type for clarity
  // Group: { '3บน': { '223': {amount, count, reduceLogs, capToLatest} }, ... }
  const grouped = {};
  cuts.forEach(c => {
    c.items.forEach(it => {
      if (!grouped[it.type]) grouped[it.type] = {};
      const key = it.number;
      if (!grouped[it.type][key]) {
        grouped[it.type][key] = { amount: 0, count: 0, reduceLogs: [], capToLatest: null };
      }
      grouped[it.type][key].amount += it.amount || 0;
      grouped[it.type][key].count += it.count || 0;
      if (c.kind === 'reduce' && it.keepPercent !== undefined) {
        grouped[it.type][key].reduceLogs.push(it.keepPercent);
      }
      if (c.kind === 'cap-intake' && it.capTo !== undefined) {
        grouped[it.type][key].capToLatest = it.capTo;
      }
    });
  });

  let totalAmount = 0, totalCount = 0;
  const typeOrder = ['3บน', '3ตัว', 'โต๊ด', '2บน', '2ล่าง'];

  typeOrder.forEach(type => {
    if (!grouped[type]) return;
    const items = grouped[type];
    const entries = Object.entries(items).sort((a, b) => a[0].localeCompare(b[0]));
    if (entries.length === 0) return;
    lines.push('');
    lines.push(`◆ ${typeFullName(type)} (${entries.length} เลข)`);
    entries.forEach(([num, data]) => {
      let tag = '';
      if (data.capToLatest !== null) {
        tag = ` (จำกัด ฿${fmt(data.capToLatest)})`;
      } else if (data.reduceLogs.length > 0) {
        tag = ` (เหลือ ${data.reduceLogs[data.reduceLogs.length-1]}%)`;
      }
      lines.push(`   ${num}  ฿${fmt(data.amount)}${tag}`);
      totalAmount += data.amount;
      totalCount += data.count;
    });
  });

  lines.push('');
  lines.push('━━━━━━━━━━━━━━━');
  lines.push(`💰 ตัดออก/ลด รวม ฿${fmt(totalAmount)}`);
  lines.push(`📦 ${totalCount} รายการ`);
  lines.push('#Royal888');
  return lines.join('\n');
}

// ==================== STORAGE HOOK (localStorage) ====================
const useStorage = (key, initial) => {
  const [value, setValue] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      return raw !== null ? JSON.parse(raw) : initial;
    } catch { return initial; }
  });
  const save = (next) => {
    setValue(prev => {
      const v = typeof next === 'function' ? next(prev) : next;
      try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) { console.error(e); }
      return v;
    });
  };
  return [value, save];
};

// ==================== TOAST / CONFIRM SYSTEM ====================
const ToastContext = React.createContext(null);

function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const [confirmState, setConfirmState] = useState(null);

  const show = (msg, type = 'info', duration = 2800) => {
    const id = uid();
    setToasts(prev => [...prev, { id, msg, type }]);
    setTimeout(() => {
      setToasts(prev => prev.map(t => t.id === id ? { ...t, out: true } : t));
      setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 200);
    }, duration);
  };

  const askConfirm = (msg, opts = {}) => {
    return new Promise(resolve => {
      setConfirmState({
        msg,
        confirmLabel: opts.confirmLabel || 'ยืนยัน',
        cancelLabel: opts.cancelLabel || 'ยกเลิก',
        danger: opts.danger,
        onResolve: (v) => { setConfirmState(null); resolve(v); }
      });
    });
  };

  // Render toasts via portal-like approach in DOM
  useEffect(() => {
    const container = document.getElementById('toast-container');
    if (!container) return;
    container.innerHTML = '';
    toasts.forEach(t => {
      const div = document.createElement('div');
      const colors = {
        success: { bg: '#ffffff', border: '#86efac', text: '#15803d', icon: '✓' },
        error:   { bg: '#ffffff', border: '#fca5a5', text: '#b91c1c', icon: '⚠' },
        info:    { bg: '#ffffff', border: '#fcd34d', text: '#92400e', icon: 'ℹ' },
      };
      const c = colors[t.type] || colors.info;
      div.className = t.out ? 'toast-out' : 'toast-in';
      div.style.cssText = [
        'background:' + c.bg,
        'border:1px solid ' + c.border,
        'border-radius:14px',
        'padding:12px 18px',
        'color:' + c.text,
        'font-family:"Bai Jamjuree",sans-serif',
        'font-size:13px',
        'font-weight:500',
        'box-shadow:0 8px 20px rgba(0,0,0,0.08),0 2px 6px rgba(0,0,0,0.04)',
        'max-width:380px',
        'pointer-events:auto',
        'display:flex',
        'align-items:center',
        'gap:10px',
        'min-width:200px',
      ].join(';');
      div.innerHTML = '<span style="font-size:16px;font-weight:bold;flex-shrink:0">' + c.icon + '</span><span style="flex:1">' + t.msg.replace(/</g, '&lt;') + '</span>';
      container.appendChild(div);
    });
  }, [toasts]);

  return (
    <ToastContext.Provider value={{ show, askConfirm }}>
      {children}
      {confirmState && (
        <div className="fixed inset-0 z-[9990] flex items-center justify-center p-5" onClick={() => confirmState.onResolve(false)}>
          <div className="absolute inset-0 bg-stone-900/40 backdrop-blur-sm"/>
          <div onClick={e => e.stopPropagation()}
            className="relative max-w-sm w-full bg-white rounded-2xl shadow-2xl overflow-hidden toast-in"
            style={{ boxShadow: '0 20px 60px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.05)' }}>
            <div className="p-6">
              <div className={'w-12 h-12 rounded-full mx-auto mb-3 flex items-center justify-center ' + (confirmState.danger ? 'bg-red-50 text-red-600' : 'bg-stone-100 text-stone-700')}>
                {confirmState.danger
                  ? <AlertTriangle size={22}/>
                  : <AlertCircle size={22}/>}
              </div>
              <p className="text-center text-stone-800 font-display text-lg leading-relaxed whitespace-pre-line">{confirmState.msg}</p>
            </div>
            <div className="grid grid-cols-2 border-t border-stone-100">
              <button onClick={() => confirmState.onResolve(false)}
                className="py-4 text-stone-600 font-display text-lg border-r border-stone-100 active:bg-stone-50">
                {confirmState.cancelLabel}
              </button>
              <button onClick={() => confirmState.onResolve(true)}
                className={'py-4 font-display text-lg font-semibold active:bg-stone-50 ' + (confirmState.danger ? 'text-red-600' : 'text-red-700')}>
                {confirmState.confirmLabel}
              </button>
            </div>
          </div>
        </div>
      )}
    </ToastContext.Provider>
  );
}

// Simple hash for PIN (not cryptographically secure but enough for local PIN)
function hashPin(pin) {
  let hash = 5381;
  const str = 'lotto888-salt-' + pin;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) + hash) + str.charCodeAt(i);
    hash = hash & 0xFFFFFFFF;
  }
  return hash.toString(36) + '-' + str.length;
}

function LoginScreen({ auth, onSuccess, onSetup, onReset, onExport, onResetPinOnly, onSkip }) {
  const toast = useToast();
  const [pin, setPin] = useState('');
  const [confirmPin, setConfirmPin] = useState('');
  const [step, setStep] = useState(auth?.pinHash ? 'login' : 'setup'); // 'setup' | 'setup-confirm' | 'login'
  const [error, setError] = useState('');
  const [attempts, setAttempts] = useState(0);

  const handleDigit = (d) => {
    setError('');
    if (step === 'setup' || step === 'setup-confirm') {
      const target = step === 'setup' ? pin : confirmPin;
      const setter = step === 'setup' ? setPin : setConfirmPin;
      if (target.length < 6) setter(target + d);
    } else {
      // login
      if (pin.length < 6) {
        const newPin = pin + d;
        setPin(newPin);
        // Auto-submit at 6 digits
        if (newPin.length === 6) {
          checkLogin(newPin);
        }
      }
    }
  };

  const checkLogin = (p) => {
    const h = hashPin(p);
    if (h === auth.pinHash) {
      onSuccess();
    } else {
      setError('PIN ไม่ถูกต้อง');
      setPin('');
      setAttempts(a => a + 1);
      if (navigator.vibrate) navigator.vibrate(200);
    }
  };

  const handleClear = () => {
    setError('');
    if (step === 'setup') setPin('');
    else if (step === 'setup-confirm') setConfirmPin('');
    else setPin('');
  };

  const handleBack = () => {
    setError('');
    if (step === 'setup') setPin(p => p.slice(0, -1));
    else if (step === 'setup-confirm') setConfirmPin(p => p.slice(0, -1));
    else setPin(p => p.slice(0, -1));

  const proceedSetup = () => {

function DrawDateList({ dates, selected, onSelect }) {
  // Group by year-month
  const groups = useMemo(() => {
    const map = {};
    dates.forEach(d => {
      const ym = d.slice(0, 7);
      if (!map[ym]) map[ym] = [];
      map[ym].push(d);
    });
    return Object.entries(map).sort((a, b) => a[0].localeCompare(b[0]));
  }, [dates]);

  const today = todayISO();

  const months = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];

  return (
    <div className="space-y-3 max-h-80 overflow-y-auto -mx-1 px-1">
      {groups.map(([ym, dayList]) => {
        const [y, mo] = ym.split('-');
        const monthName = months[parseInt(mo) - 1];
        const yearBE = parseInt(y) + 543;
        return (
          <div key={ym}>
            <div className="text-base uppercase tracking-widest text-stone-400 font-display mb-1.5">
              {monthName} {yearBE}
            </div>
            <div className="grid grid-cols-2 gap-1.5">
              {dayList.map(d => {
                const day = parseInt(d.slice(-2));
                const isPast = d < today;
                const isSelected = d === selected;
                const isToday = d === today;
                return (
                  <button key={d} onClick={() => onSelect(d)}
                    className={'rounded-lg px-3 py-2 text-left transition-all active:scale-95 border ' + (
                      isSelected
                        ? 'btn-premium border-red-900 font-semibold'
                        : isPast
                          ? 'bg-stone-50 border-stone-200 text-stone-400'
                          : 'bg-white border-stone-200 text-stone-700 active:bg-stone-50'
                    )}>
                    <div className="flex items-baseline justify-between gap-1">
                      <span className="font-numeric font-bold text-xl">{day}</span>
                      {isToday && (
                        <span className={'text-base font-display ' + (isSelected ? 'text-red-100' : 'text-red-600')}>วันนี้</span>
                      )}
                      {isPast && !isToday && (
                        <span className="text-base font-display opacity-60">ผ่านมา</span>
                      )}
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}


function App() {
  const [tab, setTab] = useStorage('lotto888-tab', 'jot');
  const [bets, setBets] = useStorage(STORAGE.bets, []);
  const [draws, setDraws] = useStorage(STORAGE.draws, []);
  const [config, setConfig] = useStorage(STORAGE.current, { lotteryId: 'gov', drawDate: getNextDrawDate(todayISO(), 'gov'), mode: 'seller' });
  const [rates, setRates] = useStorage(STORAGE.rates, INITIAL_RATES);
  const [caps, setCaps] = useStorage(STORAGE.caps, []);
  const [cuts, setCuts] = useStorage(STORAGE.cuts, []);
  const [forwards, setForwards] = useStorage(STORAGE.forwards, []);
  const [forwardSettings, setForwardSettings] = useStorage(STORAGE.forwardSettings, { defaultMaxKeep3D: null, defaultMaxKeep2D: null });
  const [auth, setAuth] = useStorage(STORAGE.auth, { pinHash: null, autoLockMinutes: 15, autoBackup: 'daily', lastBackupAt: 0, downloadReminderAt: 0 });
  const [backups, setBackups] = useStorage(STORAGE.backups, []);
  const [locked, setLocked] = useState(() => !!auth?.pinHash); // start locked if PIN exists
  const [showAuthSheet, setShowAuthSheet] = useState(false);
  const [showDownloadReminder, setShowDownloadReminder] = useState(false);
  const lastActiveRef = React.useRef(Date.now());

  // Auto-lock timer
  useEffect(() => {
    if (!auth?.pinHash || locked) return;
    const minutes = auth.autoLockMinutes || 15;
    if (minutes === 0) return; // never
    const check = () => {
      const idle = Date.now() - lastActiveRef.current;
      if (idle >= minutes * 60 * 1000) {
        setLocked(true);
      }
    };
    const interval = setInterval(check, 30000); // check every 30s
    return () => clearInterval(interval);
  }, [auth?.pinHash, auth?.autoLockMinutes, locked]);

  // Reset activity on any user interaction
  useEffect(() => {
    if (!auth?.pinHash || locked) return;
    const reset = () => { lastActiveRef.current = Date.now(); };
    window.addEventListener('touchstart', reset, { passive: true });
    window.addEventListener('mousedown', reset);
    window.addEventListener('keydown', reset);
    return () => {
      window.removeEventListener('touchstart', reset);
      window.removeEventListener('mousedown', reset);
      window.removeEventListener('keydown', reset);
    };
  }, [auth?.pinHash, locked]);

  // (Removed: auto-lock on tab hide. Use idle timer only.)

  const setupPin = (pinHash) => {
    setAuth({ ...auth, pinHash });
    setLocked(false);
    lastActiveRef.current = Date.now();
  };

  const unlockApp = () => {
    setLocked(false);
    lastActiveRef.current = Date.now();
  };

  const skipPinSetup = () => {
    // User chose to skip PIN — persist this so reload doesn't re-prompt
    setAuth({ ...auth, skipped: true });
    setLocked(false);
    lastActiveRef.current = Date.now();
  };

  const lockApp = () => {
    setLocked(true);
  };

  // Export all data as JSON for backup
  // === Auto-backup System ===
  // Backup interval options: hourly | daily | weekly | off
  const BACKUP_INTERVAL_MS = {
    hourly: 60 * 60 * 1000,
    daily: 24 * 60 * 60 * 1000,
    weekly: 7 * 24 * 60 * 60 * 1000,
  };

  // Snapshot current data into backups list (auto)
  const saveAutoBackup = () => {
    const snapshot = {
      id: uid(),
      createdAt: Date.now(),
      data: { bets, draws, config, rates, caps, cuts },
    };
    setBackups(prev => {
      const next = [snapshot, ...prev];
      // Keep last 7 snapshots only
      return next.slice(0, 7);
    });
    setAuth(prev => ({ ...prev, lastBackupAt: Date.now() }));
  };

  // Restore from auto-backup snapshot
  const restoreFromBackup = (backupId) => {
    const snap = backups.find(b => b.id === backupId);
    if (!snap || !snap.data) return false;
    const d = snap.data;
    if (d.bets) setBets(d.bets);
    if (d.draws) setDraws(d.draws);
    if (d.config) setConfig(d.config);
    if (d.rates) setRates(d.rates);
    if (d.caps) setCaps(d.caps);
    if (d.cuts) setCuts(d.cuts);
    return true;
  };

  const deleteBackup = (backupId) => {
    setBackups(prev => prev.filter(b => b.id !== backupId));
  };

  // Auto-backup runner — check every 5 min
  useEffect(() => {
    const interval = (auth?.autoBackup === 'off') ? null : (BACKUP_INTERVAL_MS[auth?.autoBackup || 'daily']);
    if (!interval) return;
    const check = () => {
      const sinceBackup = Date.now() - (auth?.lastBackupAt || 0);
      if (sinceBackup >= interval) {
        // Only backup if there's actual data
        if (bets.length > 0 || draws.length > 0) {
          saveAutoBackup();
        }
      }
    };
    check(); // Run once on mount
    const timer = setInterval(check, 5 * 60 * 1000); // Re-check every 5 min
    return () => clearInterval(timer);
  }, [auth?.autoBackup, auth?.lastBackupAt, bets.length, draws.length]);

  // Periodic reminder to download manual backup (every 7 days)
  useEffect(() => {
    if (locked || !bets.length) return;
    const lastReminder = auth?.downloadReminderAt || 0;
    const daysSince = (Date.now() - lastReminder) / (24 * 60 * 60 * 1000);
    if (lastReminder === 0) {
      // First time: set baseline, don't remind yet
      setAuth(prev => ({ ...prev, downloadReminderAt: Date.now() }));
      return;
    }
    if (daysSince >= 7) {
      setShowDownloadReminder(true);
    }
  }, [locked]);

  const dismissDownloadReminder = () => {
    setAuth(prev => ({ ...prev, downloadReminderAt: Date.now() }));
    setShowDownloadReminder(false);
  };

  const exportBackup = () => {
    const backup = {
      version: 1,
      exportedAt: new Date().toISOString(),
      data: {
        bets: bets,
        draws: draws,
        config: config,
        rates: rates,
        caps: caps,
        cuts: cuts,
      },
    };
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `lotto888-backup-${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return true;
  };

  // Restore from JSON file
  const restoreBackup = (file) => {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const backup = JSON.parse(e.target.result);
          if (!backup.data || backup.version !== 1) {
            reject(new Error('ไฟล์ไม่ถูกต้อง'));
            return;
          }
          const d = backup.data;
          if (d.bets) setBets(d.bets);
          if (d.draws) setDraws(d.draws);
          if (d.config) setConfig(d.config);
          if (d.rates) setRates(d.rates);
          if (d.caps) setCaps(d.caps);
          if (d.cuts) setCuts(d.cuts);
          resolve(backup);
        } catch (err) {
          reject(err);
        }
      };
      reader.onerror = () => reject(new Error('อ่านไฟล์ไม่ได้'));
      reader.readAsText(file);
    });
  };

  // Reset PIN only — keeps all data
  const resetPinOnly = () => {
    setAuth({ ...auth, pinHash: null, skipped: true });
    setLocked(false);
  };

  const resetAllData = () => {
    // wipe everything except remember user has skipped PIN setup
    Object.values(STORAGE).forEach(key => {
      try { localStorage.removeItem(key); } catch (e) {}

              <div className="font-bodoni text-lg font-bold tracking-[0.3em] mt-0.5" style={{color:'#b8965a'}}>8 8 8</div>

            <div className="flex items-center gap-1.5 flex-shrink-0">
              {auth?.pinHash && (
                <button
                  onClick={lockApp}
                  className="glass rounded-full w-11 h-11 flex items-center justify-center active:scale-95"
                  title="ล็อกแอป">
                  <Lock size={18} style={{color:'#8a6d36'}} strokeWidth={2.5}/>
                </button>
              )}
              <button
                onClick={() => setShowAuthSheet(true)}
                className="glass rounded-full w-11 h-11 flex items-center justify-center active:scale-95"
                title="ตั้งค่าความปลอดภัย">
                <Settings size={17} style={{color:'#8a6d36'}} strokeWidth={2.5}/>
              </button>
              <button
                onClick={shareApp}
                className="glass rounded-full w-11 h-11 flex items-center justify-center active:scale-95"
                title="แชร์แอป">
                <Share2 size={17} style={{color:'#8a6d36'}} strokeWidth={2.5}/>
              </button>
              <button
                onClick={() => setConfig({ ...config, mode: isSeller ? 'buyer' : 'seller' })}
                className="glass rounded-full px-3 py-2 flex items-center gap-1.5 text-base font-display active:scale-95"
              >
                {isSeller ? <Store size={16} style={{color:'#8a6d36'}}/> : <UserCircle2 size={16} style={{color:'#8a6d36'}}/>}
                <span className="font-semibold" style={{color:'#2a2a2a'}}>{isSeller ? 'ผู้ขาย' : 'ผู้ซื้อ'}</span>
              </button>
            </div>
          </div>
          <div className="mt-3 flex items-center justify-between gap-2">
            <div className="font-display text-base tracking-wider uppercase truncate" style={{color:'#8a6d36'}}>
              {currentBets.length} โพย · {isSeller ? 'รับเข้า' : 'ซื้อ'}
            </div>
            <div className="font-numeric text-2xl font-bold flex-shrink-0" style={{color:'#2a2a2a'}}>฿{fmt(totalAmt)}</div>
          </div>
        </div>

        <div className="px-4 pb-3">
          <div className="grid grid-cols-3 gap-1.5">
            {DEFAULT_LOTTERIES.map(l => (
              <button key={l.id} type="button" onClick={() => setConfig({ ...config, lotteryId: l.id })}
                className={'px-2 py-2.5 rounded-xl text-base font-display font-semibold tracking-wide transition-all whitespace-nowrap active:scale-95 leading-tight ' + (
                  config.lotteryId === l.id
                    ? 'btn-premium'
                    : 'glass'
                )} style={config.lotteryId !== l.id ? { color: '#1c1917' } : {}}>{l.name}</button>
            ))}
          </div>
        </div>

        <div className="px-4 pb-3">
          <DrawDateSelector config={config} setConfig={setConfig} isGov={currentLottery.id === 'gov'}/>
        </div>
      </div>

      {/* Tabs */}
      <div className="px-4 mb-4 sticky top-0 z-30 pt-1 pb-2 backdrop-blur-lg" style={{ background: 'linear-gradient(180deg, rgba(250, 247, 240, 0.95) 0%, rgba(250, 247, 240, 0.70) 100%)' }}>
        <div className="glass rounded-2xl p-1 grid grid-cols-5 gap-0.5">
          {[
            { id: 'jot', label: 'จดโพย', icon: BookOpen },
            { id: 'risk', label: 'เสี่ยง', icon: AlertTriangle },
            { id: 'pick', label: 'คัดเลข', icon: Sparkles },
            { id: 'result', label: 'ผลออก', icon: Trophy },
            { id: 'stats', label: 'สรุป', icon: BarChart3 },
          ].map(t => {
            const Ic = t.icon;
            const active = tab === t.id;
            const isRisk = t.id === 'risk';
            return (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={`py-3 px-1 rounded-xl text-base font-display font-semibold tracking-wide transition-all flex flex-col items-center gap-1 min-w-0 ${
                  active
                    ? isRisk ? 'bg-gradient-to-b from-red-500/25 to-red-600/10 text-red-700'
                             : 'bg-gradient-to-b from-red-500/20 to-red-600/10 text-gray-800 glow'
                    : isRisk ? 'text-red-400' : 'text-gray-500'
                }`}>
                <Ic size={18} strokeWidth={active ? 2.5 : 2}/>{t.label}
              </button>
            );
          })}
        </div>
      </div>

      <div className="px-4 pb-24">
        {tab === 'jot' && <JotTab lottery={currentLottery} drawDate={config.drawDate} purchaseDate={config.purchaseDate || todayISO()} bets={currentBets} allBets={bets} setBets={setBets} rates={rates} setRates={setRates} currentDraw={currentDraw} isSeller={isSeller} caps={caps}/>}
        {tab === 'risk' && <RiskTab lottery={currentLottery} drawDate={config.drawDate} bets={currentBets} allBets={bets} setBets={setBets} isSeller={isSeller} caps={caps} setCaps={setCaps} rates={rates} cuts={cuts} setCuts={setCuts} forwards={forwards} setForwards={setForwards} forwardSettings={forwardSettings} setForwardSettings={setForwardSettings}/>}
        {tab === 'pick' && <PickTab lottery={currentLottery} draws={draws}/>}
        {tab === 'result' && <ResultTab lottery={currentLottery} drawDate={config.drawDate} draws={draws} setDraws={setDraws} currentDraw={currentDraw}/>}
        {tab === 'stats' && <StatsTab bets={bets} draws={draws} isSeller={isSeller} caps={caps} rates={rates} forwards={forwards} forwardSettings={forwardSettings}/>}
      </div>

      {showShareSheet && (
        <ShareAppSheet onClose={() => setShowShareSheet(false)}/>
      )}

      {showAuthSheet && (
        <AuthSettingsSheet
          auth={auth}
          setAuth={setAuth}
          backups={backups}
          onRestoreFromBackup={(id) => {
            const ok = restoreFromBackup(id);
            if (ok) {
              appToast.show('กู้คืนข้อมูลสำเร็จ', 'success');
              setShowAuthSheet(false);
            } else {
              appToast.show('กู้คืนไม่สำเร็จ', 'error');
            }
          }}
          onDeleteBackup={deleteBackup}
          onBackupNow={() => {
            saveAutoBackup();
            appToast.show('สำรองข้อมูลแล้ว', 'success');
          }}
          onClose={() => setShowAuthSheet(false)}
          onLockNow={() => { setShowAuthSheet(false); lockApp(); }}
          onExport={() => {
            exportBackup();
            appToast.show('ดาวน์โหลดไฟล์สำรองแล้ว', 'success');
          }}
          onRestore={async (file) => {
            try {
              await restoreBackup(file);
              appToast.show('นำเข้าข้อมูลสำเร็จ', 'success');
              setShowAuthSheet(false);
            } catch (err) {
              appToast.show('นำเข้าไม่สำเร็จ: ' + err.message, 'error');
            }
          }}
          onReset={async () => {
            const ok = await appToast.askConfirm('ลบข้อมูลทั้งหมด ?\n\n— โพยทั้งหมดจะหาย\n— ผลรางวัลที่จดไว้จะหาย\n— ตั้งค่าทั้งหมดจะหาย\n\nรีเซ็ตแอปเริ่มใหม่', { danger: true, confirmLabel: 'ลบทั้งหมด' });
            if (ok) resetAllData();
          }}/>
      )}

      {showDownloadReminder && (
        <DownloadReminderModal
          onClose={dismissDownloadReminder}
          onDownload={() => {
            exportBackup();
            dismissDownloadReminder();
            appToast.show('ดาวน์โหลดไฟล์สำรองแล้ว — เก็บไว้ปลอดภัย', 'success', 3500);
          }}/>
      )}
    </div>
  );
}

function AuthSettingsSheet({ auth, setAuth, backups, onRestoreFromBackup, onDeleteBackup, onBackupNow, onClose, onLockNow, onReset, onExport, onRestore }) {
  const toast = useToast();
  const [mode, setMode] = useState('main'); // 'main' | 'set-pin' | 'change-pin-old' | 'change-pin-new'
  const [oldPin, setOldPin] = useState('');
  const [newPin, setNewPin] = useState('');
  const [confirmPin, setConfirmPin] = useState('');
  const [error, setError] = useState('');

  const hasPin = !!auth?.pinHash;
  const autoLockMinutes = auth?.autoLockMinutes ?? 15;

  const setAutoLock = (mins) => {
    setAuth({ ...auth, autoLockMinutes: mins });
    toast.show(mins === 0 ? 'ปิดล็อกอัตโนมัติ' : 'ตั้ง ' + mins + ' นาที', 'success');
  };

  const handleSetPin = () => {
    setError('');
    if (newPin.length < 4) { setError('PIN ต้องอย่างน้อย 4 หลัก'); return; }
    if (newPin !== confirmPin) { setError('PIN ไม่ตรงกัน'); return; }
    setAuth({ ...auth, pinHash: hashPin(newPin) });
    toast.show('ตั้ง PIN สำเร็จ', 'success');
    setMode('main');
    setNewPin(''); setConfirmPin('');
  };

  const handleChangePin = () => {
    setError('');
    if (hashPin(oldPin) !== auth.pinHash) { setError('PIN เดิมไม่ถูกต้อง'); return; }
    setMode('change-pin-new');
    setOldPin('');
  };

  const handleSaveNewPin = () => {
    setError('');
    if (newPin.length < 4) { setError('PIN ใหม่ต้องอย่างน้อย 4 หลัก'); return; }
    if (newPin !== confirmPin) { setError('PIN ใหม่ไม่ตรงกัน'); return; }
    setAuth({ ...auth, pinHash: hashPin(newPin) });
    toast.show('เปลี่ยน PIN สำเร็จ', 'success');
    setMode('main');
    setNewPin(''); setConfirmPin('');
  };

  const removePin = async () => {
    const ok = await toast.askConfirm('ปิดระบบล็อก ?\n\nใครก็ตามที่เปิดมือถือนี้จะเห็นโพยของคุณได้', { danger: true, confirmLabel: 'ปิดล็อก' });
    if (!ok) return;
    setAuth({ ...auth, pinHash: null, skipped: true });
    toast.show('ปิดระบบล็อกแล้ว', 'info');
  };

  if (mode === 'set-pin') {
    return (
      <BottomSheet onClose={() => { setMode('main'); setNewPin(''); setConfirmPin(''); setError(''); }} title="ตั้ง PIN ใหม่">
        <div className="space-y-4">
          <div>
            <div className="text-base uppercase tracking-wider text-stone-600 font-display font-semibold mb-2">PIN ใหม่ (4-6 หลัก)</div>
            <input type="tel" inputMode="numeric" value={newPin} maxLength={6}
              onChange={e => setNewPin(e.target.value.replace(/\D/g, '').slice(0, 6))}
              placeholder="• • • •"
              className="w-full bg-white rounded-xl px-4 py-4 outline-none font-numeric text-3xl font-black text-stone-900 text-center tracking-[0.3em] border-2 border-stone-300"/>
          </div>
          <div>
            <div className="text-base uppercase tracking-wider text-stone-600 font-display font-semibold mb-2">ยืนยัน PIN อีกครั้ง</div>
            <input type="tel" inputMode="numeric" value={confirmPin} maxLength={6}
              onChange={e => setConfirmPin(e.target.value.replace(/\D/g, '').slice(0, 6))}
              placeholder="• • • •"
              className="w-full bg-white rounded-xl px-4 py-4 outline-none font-numeric text-3xl font-black text-stone-900 text-center tracking-[0.3em] border-2 border-stone-300"/>
          </div>
          {error && <div className="text-base text-red-600 font-display text-center">{error}</div>}
          <button onClick={handleSetPin}
            className="w-full py-4 rounded-xl btn-premium font-display text-lg font-semibold tracking-wide">
            บันทึก PIN
          </button>
        </div>
      </BottomSheet>
    );
  }

  if (mode === 'change-pin-old') {
    return (
      <BottomSheet onClose={() => { setMode('main'); setOldPin(''); setError(''); }} title="ยืนยัน PIN เดิม">
        <div className="space-y-4">
          <div>
            <div className="text-base uppercase tracking-wider text-stone-600 font-display font-semibold mb-2">PIN เดิม</div>
            <input type="tel" inputMode="numeric" value={oldPin} maxLength={6}
              onChange={e => setOldPin(e.target.value.replace(/\D/g, '').slice(0, 6))}
              placeholder="• • • •"
              className="w-full bg-white rounded-xl px-4 py-4 outline-none font-numeric text-3xl font-black text-stone-900 text-center tracking-[0.3em] border-2 border-stone-300"/>
          </div>
          {error && <div className="text-base text-red-600 font-display text-center">{error}</div>}
          <button onClick={handleChangePin}
            className="w-full py-4 rounded-xl btn-premium font-display text-lg font-semibold tracking-wide">
            ถัดไป
          </button>
        </div>
      </BottomSheet>
    );
  }

  if (mode === 'change-pin-new') {
    return (
      <BottomSheet onClose={() => { setMode('main'); setNewPin(''); setConfirmPin(''); setError(''); }} title="ตั้ง PIN ใหม่">
        <div className="space-y-4">
          <div>
            <div className="text-base uppercase tracking-wider text-stone-600 font-display font-semibold mb-2">PIN ใหม่</div>
            <input type="tel" inputMode="numeric" value={newPin} maxLength={6}
              onChange={e => setNewPin(e.target.value.replace(/\D/g, '').slice(0, 6))}
              placeholder="• • • •"
              className="w-full bg-white rounded-xl px-4 py-4 outline-none font-numeric text-3xl font-black text-stone-900 text-center tracking-[0.3em] border-2 border-stone-300"/>
          </div>
          <div>
            <div className="text-base uppercase tracking-wider text-stone-600 font-display font-semibold mb-2">ยืนยัน PIN ใหม่</div>
            <input type="tel" inputMode="numeric" value={confirmPin} maxLength={6}
              onChange={e => setConfirmPin(e.target.value.replace(/\D/g, '').slice(0, 6))}
              placeholder="• • • •"
              className="w-full bg-white rounded-xl px-4 py-4 outline-none font-numeric text-3xl font-black text-stone-900 text-center tracking-[0.3em] border-2 border-stone-300"/>
          </div>
          {error && <div className="text-base text-red-600 font-display text-center">{error}</div>}
          <button onClick={handleSaveNewPin}
            className="w-full py-4 rounded-xl btn-premium font-display text-lg font-semibold tracking-wide">
            บันทึก PIN ใหม่
          </button>
        </div>
      </BottomSheet>
    );
  }

  return (
    <BottomSheet onClose={onClose} title="ตั้งค่าความปลอดภัย">
      <div className="space-y-4">
        {/* Status */}
        <div className={'rounded-2xl p-4 border-2 ' + (hasPin
          ? 'bg-gradient-to-br from-green-50 to-white border-green-200'
          : 'bg-gradient-to-br from-amber-50 to-white border-amber-300')}>
          <div className="flex items-center gap-3">
            <div className={'w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0 ' + (hasPin ? 'bg-green-100' : 'bg-amber-100')}>
              {hasPin
                ? <Lock size={22} className="text-green-700" strokeWidth={2.5}/>
                : <Unlock size={22} className="text-amber-700" strokeWidth={2.5}/>}
            </div>
            <div className="flex-1">
              <div className={'font-display text-lg font-bold ' + (hasPin ? 'text-green-800' : 'text-amber-800')}>
                {hasPin ? 'ป้องกันด้วย PIN' : 'ยังไม่มี PIN'}
              </div>
              <div className="text-base text-stone-600 font-display">
                {hasPin ? 'ต้องใส่ PIN ทุกครั้งที่เปิด' : 'ใครเปิดมือถือก็เห็นโพยได้'}
              </div>
            </div>
          </div>
        </div>

        {/* PIN actions */}
        <div className="space-y-2">
          {!hasPin ? (
            <button onClick={() => setMode('set-pin')}
              className="w-full py-4 rounded-xl btn-premium font-display text-lg font-semibold tracking-wide flex items-center justify-center gap-2 active:scale-95">
              <Lock size={18} strokeWidth={2.5}/>
              ตั้ง PIN ป้องกัน
            </button>
          ) : (
            <>
              <button onClick={onLockNow}
                className="w-full py-4 rounded-xl btn-premium font-display text-lg font-semibold tracking-wide flex items-center justify-center gap-2 active:scale-95">
                <LogOut size={18} strokeWidth={2.5}/>
                ล็อกแอปทันที
              </button>
              <button onClick={() => setMode('change-pin-old')}
                className="w-full py-3.5 rounded-xl bg-white border-2 border-stone-300 text-stone-800 font-display text-lg font-semibold flex items-center justify-center gap-2 active:scale-95">
                <Settings size={16} strokeWidth={2.5}/>
                เปลี่ยน PIN
              </button>
              <button onClick={removePin}
                className="w-full py-3 rounded-xl bg-white border border-red-200 text-red-700 font-display text-base flex items-center justify-center gap-2 active:scale-95">
                <Unlock size={14} strokeWidth={2.5}/>
                ปิดระบบล็อก
              </button>
            </>
          )}
        </div>

        {/* Auto-lock settings */}
        {hasPin && (
          <div className="bg-stone-50 rounded-2xl p-4 border border-stone-200">
            <div className="text-base uppercase tracking-wider text-stone-700 font-display font-bold mb-1">ล็อกอัตโนมัติ</div>
            <div className="text-base text-stone-600 font-display mb-3">หลังไม่ใช้งานนานเท่าไหร่ ให้ล็อกแอปอัตโนมัติ</div>
            <div className="grid grid-cols-3 gap-2">
              {[
                { v: 1, label: '1 นาที' },
                { v: 5, label: '5 นาที' },
                { v: 15, label: '15 นาที' },
                { v: 30, label: '30 นาที' },
                { v: 60, label: '1 ชม.' },
                { v: 0, label: 'ปิดล็อก\nอัตโนมัติ' },
              ].map(opt => {
                const active = autoLockMinutes === opt.v;
                return (
                  <button key={opt.v} onClick={() => setAutoLock(opt.v)}
                    className={'py-3 px-2 rounded-xl text-base font-display font-semibold border-2 transition-all active:scale-95 whitespace-pre-line leading-tight ' + (
                      active
                        ? 'btn-premium border-red-900'
                        : 'bg-white text-stone-700 border-stone-200'
                    )}>
                    {opt.label}
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {/* Auto-backup setting */}
        <div className="bg-gradient-to-br from-green-50 to-white rounded-2xl p-4 border border-green-200">
          <div className="flex items-center justify-between mb-1">
            <div className="text-base uppercase tracking-wider text-green-800 font-display font-bold">สำรองอัตโนมัติ</div>
            <button onClick={onBackupNow}
              className="text-base text-green-700 font-display font-semibold bg-white border border-green-300 rounded-full px-3 py-1 active:scale-95">
              สำรองเลย
            </button>
          </div>
          <div className="text-base text-stone-600 font-display mb-3">บันทึก snapshot อัตโนมัติ — ใช้กู้คืนข้อมูลย้อนหลังได้ (เก็บล่าสุด 7 จุด)</div>
          <div className="grid grid-cols-4 gap-1.5 mb-2">
            {[
              { v: 'hourly', label: 'ทุก 1 ชม.' },
              { v: 'daily', label: 'ทุกวัน' },
              { v: 'weekly', label: 'ทุก 7 วัน' },
              { v: 'off', label: 'ปิด' },
            ].map(opt => {
              const active = (auth?.autoBackup || 'daily') === opt.v;
              return (
                <button key={opt.v} onClick={() => setAuth(prev => ({ ...prev, autoBackup: opt.v }))}
                  className={'py-2.5 px-1 rounded-xl text-base font-display font-semibold border-2 transition-all active:scale-95 leading-tight ' + (
                    active
                      ? 'bg-green-600 text-white border-green-700 shadow-md shadow-green-200'
                      : 'bg-white text-stone-700 border-stone-200'
                  )}>
                  {opt.label}
                </button>
              );
            })}
          </div>
          <div className="text-base text-stone-500 font-display">
            ล่าสุด: {auth?.lastBackupAt ? formatBackupTime(auth.lastBackupAt) : '— ยังไม่เคยสำรอง —'}
          </div>
        </div>

        {/* Auto-backup list — restore points */}
        {backups && backups.length > 0 && (
          <div className="bg-white rounded-2xl p-4 border border-stone-200">
            <div className="text-base uppercase tracking-wider text-stone-700 font-display font-bold mb-1">จุดกู้คืนที่บันทึกอัตโนมัติ</div>
            <div className="text-base text-stone-500 font-display mb-3">เลือกย้อนกลับไปจุดเวลาที่ต้องการ</div>
            <div className="space-y-2 max-h-72 overflow-y-auto">
              {backups.map(b => {
                const d = b.data || {};
                const total = (d.bets?.length || 0);
                return (
                  <div key={b.id} className="bg-stone-50 rounded-xl p-3 border border-stone-200 flex items-center gap-2">
                    <div className="flex-1 min-w-0">
                      <div className="font-display text-lg font-semibold text-stone-900">
                        {formatBackupTime(b.createdAt)}
                      </div>
                      <div className="text-base text-stone-500 font-display">
                        {total} โพย · {(d.draws?.length || 0)} ผลรางวัล
                      </div>
                    </div>
                    <button onClick={() => onRestoreFromBackup(b.id)}
                      className="text-base font-display font-semibold bg-red-600 text-white border border-red-700 rounded-lg px-3 py-2 active:scale-95">
                      กู้คืน
                    </button>
                    <button onClick={() => onDeleteBackup(b.id)}
                      className="text-stone-400 active:text-red-600 p-1">
                      <X size={16} strokeWidth={2.5}/>
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Backup / Restore */}
        <div className="bg-gradient-to-br from-red-50 to-white rounded-2xl p-4 border border-red-200">
          <div className="text-base uppercase tracking-wider text-red-700 font-display font-bold mb-1">สำรอง / กู้คืน เป็นไฟล์</div>
          <div className="text-base text-stone-600 font-display mb-3">ดาวน์โหลดไฟล์เก็บนอกแอป (แชต LINE / Google Drive) — ปลอดภัยกว่า</div>
          <div className="grid grid-cols-2 gap-2">
            <button onClick={onExport}
              className="py-3 rounded-xl bg-white border-2 border-red-300 text-red-700 font-display text-lg font-semibold flex items-center justify-center gap-2 active:scale-95">
              <Download size={16} strokeWidth={2.5}/>
              ดาวน์โหลด

function JotTab({ lottery, drawDate, purchaseDate, bets, allBets, setBets, rates, setRates, currentDraw, isSeller, caps }) {
  const toast = useToast();
  const [customer, setCustomer] = useState('');
  const [step, setStep] = useState('select');
  const [pickedTypes, setPickedTypes] = useState({});
  const [reverse3, setReverse3] = useState(false);
  const [reverse2, setReverse2] = useState(false);
  const [number, setNumber] = useState('');
  const [pending, setPending] = useState([]);
  const [bulkPrice, setBulkPrice] = useState('');
  const [error, setError] = useState('');
  const [sheet, setSheet] = useState(null);

  const t3 = lottery.types.includes('3ตัว') ? '3ตัว' : '3บน';
  const t3Label = lottery.types.includes('3ตัว') ? '3 ตัว' : '3 ตัวบน';

  useEffect(() => {
    setPickedTypes({ [t3]: true });
    setPending([]);
    setNumber('');
    setStep('select');
    setBulkPrice('');
  }, [lottery.id]);

  const has3Active = pickedTypes[t3] || pickedTypes['โต๊ด'];
  const has2Active = pickedTypes['2บน'] || pickedTypes['2ล่าง'];
  const digits = has3Active ? 3 : has2Active ? 2 : 3;

  const togglePickType = (key) => {
    const isGroup3 = key === t3 || key === 'โต๊ด';
    if ((isGroup3 && has2Active) || (!isGroup3 && has3Active)) {
      // Switching groups - reset
      setPickedTypes({ [key]: true });
      setNumber('');
      if (isGroup3) setReverse2(false);
      else setReverse3(false);
    } else {
      setPickedTypes(prev => ({ ...prev, [key]: !prev[key] }));
    }
    setError('');
  };

  const onReverse3 = () => {
    if (has2Active) {
      setPickedTypes({});
      setReverse2(false);
      setReverse3(true);
      setNumber('');
    } else {
      setReverse3(r => !r);
    }
    setError('');
  };

  const onReverse2 = () => {
    if (has3Active) {
      setPickedTypes({});
      setReverse3(false);
      setReverse2(true);
      setNumber('');
    } else {
      setReverse2(r => !r);
    }
    setError('');
  };

  const addToPending = (num) => {
    const len = num.length;
    const activeTypes = Object.keys(pickedTypes).filter(k => pickedTypes[k]);
    if (activeTypes.length === 0) { setError('เลือกประเภทอย่างน้อย 1'); setNumber(''); return; }
    const matching = activeTypes.filter(t => {
      const is3 = t === t3 || t === 'โต๊ด';
      return (len === 3) === is3;
    });
    if (matching.length === 0) { setError('ประเภทที่เลือกต้องการเลข ' + (len === 3 ? '2' : '3') + ' หลัก'); setNumber(''); return; }

    const numbers = [num];
    if (len === 3 && reverse3) {
      // กลับ 3 ตัว = ทุก permutation (เช่น 223 → 223, 232, 322)
      const perms = getToadVariations(num);
      perms.forEach(p => { if (!numbers.includes(p)) numbers.push(p); });
    } else if (len === 2 && reverse2) {
      const rev = reverseDigits(num);
      if (rev !== num) numbers.push(rev);
    }

    const newItems = [];
    for (const t of matching) {
      // โต๊ด คุ้มทุก perm อยู่แล้ว — ไม่ต้อง multiply เลขกลับ
      const isToad = t === 'โต๊ด';
      const numsForType = isToad ? [num] : numbers;
      for (const n of numsForType) {
        const exists = pending.some(p => p.number === n && p.type === t) ||
                       newItems.some(p => p.number === n && p.type === t);
        if (exists) continue;
        newItems.push({ id: uid(), number: n, type: t, amount: bulkPrice || '', rate: rates[t] || 90 });
      }
    }
    if (newItems.length > 0) setPending(prev => [...prev, ...newItems]);
    setNumber('');
  };

  const onDigit = (d) => {
    setError('');
    const newNum = (number + d).slice(0, digits);
    setNumber(newNum);
    if (newNum.length === digits) setTimeout(() => addToPending(newNum), 80);
  };

  const onBackspace = () => { setNumber(n => n.slice(0, -1)); setError(''); };
  const onClear = () => { setNumber(''); setError(''); };

  const removePending = (id) => setPending(prev => prev.filter(p => p.id !== id));
  const clearAllPending = async () => {
    if (pending.length === 0) return;
    const ok = await toast.askConfirm('ล้างโพยที่กำลังเลือก ?', { confirmLabel: 'ล้าง' });
    if (!ok) return;
    setPending([]); setBulkPrice('');
  };
  const updatePendingAmount = (id, amount) => setPending(prev => prev.map(p => p.id === id ? { ...p, amount } : p));
  const fillAllPrices = (amt) => {
    const v = parseFloat(amt);
    if (isNaN(v)) return;
    setBulkPrice(String(v));
    setPending(prev => prev.map(p => ({ ...p, amount: v })));
  };

  const totalIntake = useMemo(() => pending.reduce((s, p) => s + (parseFloat(p.amount) || 0), 0), [pending]);
  const totalMaxPayout = useMemo(() => pending.reduce((s, p) => s + (parseFloat(p.amount) || 0) * (parseFloat(p.rate) || 0), 0), [pending]);

  const saveBets = async () => {
    const valid = pending.filter(p => parseFloat(p.amount) > 0);
    if (valid.length === 0) { setError('ใส่ราคาก่อน'); return; }
    if (valid.length !== pending.length) {
      const ok = await toast.askConfirm('มี ' + (pending.length - valid.length) + ' รายการที่ไม่ใส่ราคา\nข้ามไปเลยไหม ?', { confirmLabel: 'ข้ามไป' });
      if (!ok) return;
    }
    const newBets = valid.map(p => ({
      id: p.id, lotteryId: lottery.id, drawDate,
      purchaseDate: purchaseDate,
      customer: customer.trim() || null,
      number: p.number, type: p.type,
      amount: parseFloat(p.amount), rate: parseFloat(p.rate) || 90,
      createdAt: Date.now() + Math.random(),
    }));
    setBets(prev => {
      const filtered = newBets.filter(nb =>
        !prev.some(b => b.lotteryId === nb.lotteryId && b.drawDate === nb.drawDate && b.number === nb.number && b.type === nb.type && (b.customer || '') === (nb.customer || ''))
      );
      return [...prev, ...filtered];
    });
    setPending([]); setBulkPrice(''); setNumber(''); setStep('select');
  };

  const removeBet = (id) => setBets(prev => prev.filter(b => b.id !== id));
  const updateBet = (id, field, value) => setBets(prev => prev.map(b => b.id === id ? { ...b, [field]: value } : b));
  const clearAllSaved = async () => {
    if (bets.length === 0) return;
    const ok = await toast.askConfirm('ลบโพยทั้งหมดในงวดนี้ ?\n(' + bets.length + ' รายการ)', { danger: true, confirmLabel: 'ลบทั้งหมด' });
    if (!ok) return;
    setBets(prev => prev.filter(b => !(b.lotteryId === lottery.id && b.drawDate === drawDate)));
  };

  const handlePasted = (parsed) => {
    if (parsed.length === 0) return;
    const newPending = [];
    for (const p of parsed) {
      if (pending.some(x => x.number === p.number && x.type === p.type)) continue;
      newPending.push({ id: uid(), number: p.number, type: p.type, amount: p.amount || '', rate: p.rate || rates[p.type] || 90 });
    }
    setPending(prev => [...prev, ...newPending]);
    setSheet(null);
    if (newPending.length > 0) setStep('pricing');
  };

  const savedTotalAmt = bets.reduce((s, b) => s + (parseFloat(b.amount) || 0), 0);
  const savedTotalPayout = bets.reduce((s, b) => s + (parseFloat(b.amount) || 0) * (parseFloat(rates[b.type] || b.rate) || 0), 0);

  return (
    <div className="space-y-3 slide-in">
      {/* Step indicator */}
      <div className="glass rounded-xl p-1 grid grid-cols-2 gap-1">
        <button onClick={() => setStep('select')}
          className={`py-2 rounded-lg text-base font-display tracking-wide flex items-center justify-center gap-1.5 transition-all ${
            step === 'select' ? 'bg-red-100 text-gray-800 border border-red-300' : 'text-gray-400'
          }`}>
          <span className={`w-4 h-4 rounded-full text-base flex items-center justify-center font-bold ${step === 'select' ? 'bg-red-400 text-white' : 'bg-red-50 text-gray-800'}`}>1</span>
          เลือกเลข
        </button>
        <button onClick={() => pending.length > 0 && setStep('pricing')} disabled={pending.length === 0}
          className={`py-2 rounded-lg text-base font-display tracking-wide flex items-center justify-center gap-1.5 transition-all disabled:opacity-30 ${
            step === 'pricing' ? 'bg-red-100 text-gray-800 border border-red-300' : 'text-gray-400'
          }`}>
          <span className={`w-4 h-4 rounded-full text-base flex items-center justify-center font-bold ${step === 'pricing' ? 'bg-red-400 text-white' : 'bg-red-50 text-gray-800'}`}>2</span>
          ใส่ราคา{pending.length > 0 && <span className="text-base opacity-70 font-numeric">({pending.length})</span>}
        </button>
      </div>

      {step === 'select' && (<>

function BetGroupedList({ bets, caps, rates, currentDraw, isSeller, onUpdateBet, onRemoveBet }) {
  // Group bets by customer
  const groups = useMemo(() => {
    const map = {};
    bets.forEach(b => {
      const key = b.customer || '— ไม่ระบุ —';
      if (!map[key]) map[key] = [];
      map[key].push(b);
    });
    // Sort: real names first, "— ไม่ระบุ —" last; by latest createdAt within group
    const entries = Object.entries(map).map(([name, items]) => {
      items.sort((a, b) => b.createdAt - a.createdAt);
      const totalAmt = items.reduce((s, b) => s + (parseFloat(b.amount) || 0), 0);
      const totalPay = items.reduce((s, b) => {
        const rate = rates[b.type] || b.rate || 0;
        const isHalf = isCombosHalfPay(caps, b.lotteryId, b.drawDate, b.number, b.type);
        return s + (parseFloat(b.amount) || 0) * rate * (isHalf ? 0.5 : 1);
      }, 0);
      const latestAt = Math.max(...items.map(b => b.createdAt));
      return { name, items, totalAmt, totalPay, latestAt };
    });
    entries.sort((a, b) => {
      if (a.name.startsWith('—') && !b.name.startsWith('—')) return 1;
      if (!a.name.startsWith('—') && b.name.startsWith('—')) return -1;
      return b.latestAt - a.latestAt;
    });
    return entries;
  }, [bets, caps, rates]);

  const [expandedSet, setExpandedSet] = useState(() => new Set());
  const toggle = (name) => {
    setExpandedSet(prev => {
      const next = new Set(prev);
      if (next.has(name)) next.delete(name); else next.add(name);
      return next;
    });
  };

  return (
    <div className="space-y-2 mb-1">
      {groups.map(g => {
        const isOpen = expandedSet.has(g.name);
        const noName = g.name.startsWith('—');
        // Check if any bet in this group hit
        const anyHit = currentDraw && g.items.some(b => checkWin(b, currentDraw.results));
        return (
          <div key={g.name} className="rounded-xl bg-white border border-gray-200 overflow-hidden">
            <button onClick={() => toggle(g.name)}
              className="w-full px-3 py-2.5 flex items-center gap-2 text-left active:bg-gray-50 transition-colors">
              <div className={'w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 ' + (
                noName ? 'bg-gray-100' : 'bg-red-50'
              )}>
                <UserCircle2 size={16} className={noName ? 'text-gray-400' : 'text-red-600'}/>
              </div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-1.5">
                  <span className={'font-display text-lg font-semibold truncate ' + (noName ? 'text-gray-500' : 'text-gray-900')}>
                    {g.name}
                  </span>
                  {anyHit && (
                    <span className={'text-base font-display px-1.5 py-0.5 rounded ' + (
                      isSeller ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'
                    )}>
                      {isSeller ? '✗ มีถูก' : '✓ ถูก'}
                    </span>
                  )}
                </div>
                <div className="text-base text-gray-400 font-display flex items-center gap-2">
                  <span>{g.items.length} รายการ</span>
                  <span>·</span>
                  <span>รับ ฿{fmt(g.totalAmt)}</span>
                  <span>·</span>
                  <span className="text-red-600">จ่าย ฿{fmt(g.totalPay)}</span>
                </div>
              </div>
              <span className="text-gray-400 text-xl flex-shrink-0">{isOpen ? '▴' : '▾'}</span>
            </button>
            {isOpen && (
              <div className="px-3 pb-3 pt-1 space-y-1.5 border-t border-gray-100 bg-gray-50/40">
                {g.items.map(b => {
                  const halfPay = isCombosHalfPay(caps, b.lotteryId, b.drawDate, b.number, b.type);
                  const currentRate = rates[b.type] || b.rate || 90;
                  return (
                    <BetRow key={b.id} bet={{...b, rate: currentRate, halfPay}} draw={currentDraw} isSeller={isSeller}
                      onUpdate={(field, val) => onUpdateBet(b.id, field, val)} onRemove={() => onRemoveBet(b.id)}/>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function BetRow({ bet, draw, isSeller, onUpdate, onRemove }) {
  const win = draw ? checkWin(bet, draw.results) : null;
  const amt = parseFloat(bet.amount) || 0;
  const rate = parseFloat(bet.rate) || 0;
  const halfMult = bet.halfPay ? 0.5 : 1;
  const payout = amt * rate * halfMult;
  const hit = win === true;
  const sellerLose = isSeller && hit;
  const buyerWin = !isSeller && hit;

  return (
    <div className={`rounded-xl p-2.5 ${
      sellerLose ? 'bg-gradient-to-r from-red-500/15 to-rose-500/5 border border-red-300'
      : buyerWin ? 'bg-gradient-to-r from-green-500/15 to-emerald-500/5 border border-green-300'
      : win === false ? 'bg-gray-50 border border-gray-200 opacity-60'
      : 'bg-white border border-gray-200'
    }`}>
      <div className="flex items-center gap-2 mb-2 flex-wrap">
        <div className="font-numeric text-2xl font-bold gold-text leading-none">{bet.number}</div>
        <div className="px-1.5 py-0.5 rounded text-base font-display tracking-wider bg-red-50 text-gray-700 border border-red-200">{typeShort(bet.type)}</div>
        {bet.halfPay && (
          <div className="px-1.5 py-0.5 rounded text-base font-display bg-orange-100 text-orange-700 border border-orange-400 font-bold">½ อั้น</div>
        )}
        {bet.customer && (
          <div className="px-1.5 py-0.5 rounded text-base font-display bg-orange-100 text-orange-700 border border-orange-200 truncate max-w-[100px]">👤 {bet.customer}</div>
        )}
        {hit && <span className={`text-base font-display tracking-wider ${sellerLose ? 'text-red-600' : 'text-green-600'}`}>{sellerLose ? '✗ ต้องจ่าย' : '✓ ถูก'}</span>}
        <button onClick={onRemove} className="ml-auto text-gray-400 hover:text-red-500 p-1 flex-shrink-0"><Trash2 size={13}/></button>
      </div>
      <div className="grid grid-cols-3 gap-1.5">
        <MiniField label={isSeller ? 'รับ' : 'ซื้อ'} value={bet.amount} onChange={v => onUpdate('amount', v)} prefix="฿"/>
        <div className="bg-white rounded-lg px-2 py-1.5 border border-gray-200">
          <div className="text-base uppercase tracking-wider text-red-500 font-display flex items-center justify-between">
            <span>จ่าย/บ.</span><span className="text-red-300">×</span>
          </div>
          <div className="font-numeric text-lg font-semibold text-gray-900">{bet.rate}</div>
        </div>
        <div className={`bg-white rounded-lg px-2 py-1.5 border ${isSeller ? 'border-red-200' : 'border-green-200'}`}>
          <div className="text-base uppercase tracking-wider text-gray-400 font-display">{isSeller ? 'จ่ายถ้าออก' : 'ได้'}</div>
          <div className={`font-numeric text-lg font-bold truncate ${isSeller ? 'text-red-600' : 'text-green-600'}`}>฿{fmt(payout)}</div>
        </div>
      </div>
    </div>
  );
}
