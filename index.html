function DrawDateList({ dates, selected, onSelect }) {
  // Group by year-month
  const groups = useMemo(() => {
    const map = {};
    dates.forEach(d => {
      const ym = d.slice(0, 7);
      if (!map[ym]) map[ym] = [];
      map[ym].push(d);
    });
    return Object.entries(map).sort((a, b) => a[0].localeCompare(b[0]));
  }, [dates]);

  const today = todayISO();

  const months = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];

  return (
    <div className="space-y-3 max-h-80 overflow-y-auto -mx-1 px-1">
      {groups.map(([ym, dayList]) => {
        const [y, mo] = ym.split('-');
        const monthName = months[parseInt(mo) - 1];
        const yearBE = parseInt(y) + 543;
        return (
          <div key={ym}>
            <div className="text-base uppercase tracking-widest text-stone-400 font-display mb-1.5">
              {monthName} {yearBE}
            </div>
            <div className="grid grid-cols-2 gap-1.5">
              {dayList.map(d => {
                const day = parseInt(d.slice(-2));
                const isPast = d < today;
                const isSelected = d === selected;
                const isToday = d === today;
                return (
                  <button key={d} onClick={() => onSelect(d)}
                    className={'rounded-lg px-3 py-2 text-left transition-all active:scale-95 border ' + (
                      isSelected
                        ? 'btn-premium border-red-900 font-semibold'
                        : isPast
                          ? 'bg-stone-50 border-stone-200 text-stone-400'
                          : 'bg-white border-stone-200 text-stone-700 active:bg-stone-50'
                    )}>
                    <div className="flex items-baseline justify-between gap-1">
                      <span className="font-numeric font-bold text-xl">{day}</span>
                      {isToday && (
                        <span className={'text-base font-display ' + (isSelected ? 'text-red-100' : 'text-red-600')}>วันนี้</span>
                      )}
                      {isPast && !isToday && (
                        <span className="text-base font-display opacity-60">ผ่านมา</span>
                      )}
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}


function App() {
  const [tab, setTab] = useStorage('lotto888-tab', 'jot');
  const [bets, setBets] = useStorage(STORAGE.bets, []);
  const [draws, setDraws] = useStorage(STORAGE.draws, []);
  const [config, setConfig] = useStorage(STORAGE.current, { lotteryId: 'gov', drawDate: getNextDrawDate(todayISO(), 'gov'), mode: 'seller' });
  const [rates, setRates] = useStorage(STORAGE.rates, INITIAL_RATES);
  const [caps, setCaps] = useStorage(STORAGE.caps, []);
  const [cuts, setCuts] = useStorage(STORAGE.cuts, []);
  const [forwards, setForwards] = useStorage(STORAGE.forwards, []);
  const [forwardSettings, setForwardSettings] = useStorage(STORAGE.forwardSettings, { defaultMaxKeep3D: null, defaultMaxKeep2D: null });
  const [auth, setAuth] = useStorage(STORAGE.auth, { pinHash: null, autoLockMinutes: 30, autoBackup: 'daily', lastBackupAt: 0, downloadReminderAt: 0 });
  const [backups, setBackups] = useStorage(STORAGE.backups, []);
  // ล็อกตอนเปิดแอป/รีเฟรช: เฉพาะเมื่อไม่ได้ใช้งานนานเกินเวลาที่ตั้ง "ล็อกอัตโนมัติ" หรือกดล็อกเอง
  // (เดิมล็อกทุกครั้งที่รีเฟรช แม้เพิ่งใส่ PIN ไปไม่กี่วินาที)
  const [locked, setLocked] = useState(() => {
    if (!auth?.pinHash) return false;
    const last = readActiveAt();
    if (!last) return true;                       // ไม่เคยปลดล็อก / กดล็อกเอง
    const mins = auth.autoLockMinutes ?? 30;
    if (mins === 0) return false;                 // ปิดล็อกอัตโนมัติ
    return Date.now() - last >= mins * 60 * 1000;
  });
  const [showAuthSheet, setShowAuthSheet] = useState(false);
  const [showDownloadReminder, setShowDownloadReminder] = useState(false);
  const lastActiveRef = React.useRef(Date.now());
  const savedActiveRef = React.useRef(0);
  const touchActive = (force) => {
    lastActiveRef.current = Date.now();
    if (force || Date.now() - savedActiveRef.current > 10000) { savedActiveRef.current = Date.now(); writeActiveAt(Date.now()); }
  };
  useEffect(() => { if (!locked && auth?.pinHash) touchActive(true); }, []); // รีเฟรชแล้วไม่ล็อก = นับเป็นการใช้งาน

  // ===== ผลอัตโนมัติ: ดึงตอนเปิดแอป · ทุก 10 นาทีระหว่างเปิดอยู่ · ตอนกลับมาที่แอป =====
  const [autoState, setAutoState] = useState({ at: 0, ok: null, error: '', busy: false });
  const syncingRef = React.useRef(false);
  const betsRef = React.useRef(bets);
  betsRef.current = bets;
  const syncAuto = async () => {
    if (syncingRef.current) return;
    syncingRef.current = true;
    setAutoState(s => ({ ...s, busy: true }));
    try {
      const lists = await Promise.all(AUTO_IDS.map(id =>
        supaGet(AUTO_LOTTERIES[id].table + '?select=' + AUTO_LOTTERIES[id].cols + '&draw_date=gte.' + autoCutDate(id) + '&order=draw_date.desc&limit=200')
          .then(rows => rows.map(r => autoRowToDraw(id, r)).filter(Boolean))));
      const all = lists.flat();
      const betKeys = new Set((betsRef.current || []).map(b => b.lotteryId + '|' + b.drawDate));
      setDraws(prev => mergeAutoDraws(prev, all, betKeys));
      setAutoState({ at: Date.now(), ok: true, error: '', busy: false });
      return all;
    } catch (e) {
      setAutoState(s => ({ ...s, ok: false, error: e.name === 'AbortError' ? 'หมดเวลา' : (e.message || 'เชื่อมต่อไม่ได้'), busy: false }));
      return null;
    } finally { syncingRef.current = false; }
  };
  const lastSyncRef = React.useRef(0);
  useEffect(() => { lastSyncRef.current = autoState.at; }, [autoState.at]);
  useEffect(() => {
    syncAuto();
    const iv = setInterval(() => { if (document.visibilityState === 'visible') syncAuto(); }, 10 * 60 * 1000);
    const onVis = () => { if (document.visibilityState === 'visible' && Date.now() - lastSyncRef.current > 5 * 60 * 1000) syncAuto(); };
    document.addEventListener('visibilitychange', onVis);
    return () => { clearInterval(iv); document.removeEventListener('visibilitychange', onVis); };
  }, []);

  // Auto-lock timer
  useEffect(() => {
    if (!auth?.pinHash || locked) return;
    // เดิม `|| 15` ทำให้ตัวเลือก "ปิดล็อกอัตโนมัติ" (0) กลายเป็น 15 นาที → ใช้ ?? แทน
    const minutes = auth.autoLockMinutes ?? 30;
    if (minutes === 0) return; // never
    const check = () => {
      const idle = Date.now() - lastActiveRef.current;
      if (idle >= minutes * 60 * 1000) {
        clearActiveAt();
        setLocked(true);
      }
    };
    const interval = setInterval(check, 30000); // check every 30s
    const onVis = () => { if (document.visibilityState === 'visible') check(); }; // กลับเข้าแอป → ตรวจทันที ไม่รอ 30 วิ
    document.addEventListener('visibilitychange', onVis);
    return () => { clearInterval(interval); document.removeEventListener('visibilitychange', onVis); };
  }, [auth?.pinHash, auth?.autoLockMinutes, locked]);

  // Reset activity on any user interaction (จำเวลาไว้ในเครื่อง ให้รีเฟรชแล้วรู้ว่าเพิ่งใช้งาน)
  // ติดตามการใช้งานตลอด แม้ยังไม่ตั้ง PIN (เดิมตั้ง PIN จากหน้าตั้งค่าหลังใช้แอปมา >15 นาที → โดนล็อกใน 30 วิ)
  useEffect(() => { if (auth?.pinHash && !locked) touchActive(true); }, [auth?.pinHash]);
  useEffect(() => {
    if (locked) return;
    const reset = () => touchActive(false);
    window.addEventListener('touchstart', reset, { passive: true });
    window.addEventListener('mousedown', reset);
    window.addEventListener('keydown', reset);
    return () => {
      window.removeEventListener('touchstart', reset);
      window.removeEventListener('mousedown', reset);
      window.removeEventListener('keydown', reset);
    };
  }, [locked]);

  // (Removed: auto-lock on tab hide. Use idle timer only.)

  const setupPin = (pinHash) => {
    setAuth({ ...auth, pinHash });
    setLocked(false);
    touchActive(true);
  };

  const unlockApp = () => {
    setLocked(false);
    touchActive(true);
  };

  const skipPinSetup = () => {
    // User chose to skip PIN — persist this so reload doesn't re-prompt
    setAuth({ ...auth, skipped: true });
    setLocked(false);
    lastActiveRef.current = Date.now();
  };

  const lockApp = () => {
    clearActiveAt(); // กดล็อกเอง → รีเฟรชแล้วต้องใส่ PIN
    setLocked(true);
  };

  // Export all data as JSON for backup
  // === Auto-backup System ===
  // Backup interval options: hourly | daily | weekly | off
  const BACKUP_INTERVAL_MS = {
    hourly: 60 * 60 * 1000,
    daily: 24 * 60 * 60 * 1000,
    weekly: 7 * 24 * 60 * 60 * 1000,
  };

  // ข้อมูลล่าสุดเสมอ (เดิมรอบสำรองทุก 5 นาทีใช้ข้อมูลเก่าตอนที่จำนวนโพยเปลี่ยนครั้งล่าสุด → แก้ยอด/อั้น/อัตรา ไม่ติดไปในไฟล์สำรอง)
  const dataRef = React.useRef(null);
  dataRef.current = { bets, draws, config, rates, caps, cuts, forwards, forwardSettings };
  const applyBackupData = (d) => {
    if (d.bets) setBets(d.bets);
    if (d.draws) setDraws(d.draws);
    if (d.config) setConfig(d.config);
    if (d.rates) setRates(d.rates);
    if (d.caps) setCaps(d.caps);
    if (d.cuts) setCuts(d.cuts);
    if (d.forwards) setForwards(d.forwards);               // เดิมไม่ได้สำรอง "เลขส่งต่อ" → กู้คืนแล้วหาย
    if (d.forwardSettings) setForwardSettings(d.forwardSettings);
  };

  // Snapshot current data into backups list (auto)
  const saveAutoBackup = () => {
    const snapshot = {
      id: uid(),
      createdAt: Date.now(),
      data: { ...dataRef.current },
    };
    setBackups(prev => {
      const next = [snapshot, ...prev];
      // Keep last 7 snapshots only
      return next.slice(0, 7);
    });
    setAuth(prev => ({ ...prev, lastBackupAt: Date.now() }));
  };

  // Restore from auto-backup snapshot
  const restoreFromBackup = (backupId) => {
    const snap = backups.find(b => b.id === backupId);
    if (!snap || !snap.data) return false;
    applyBackupData(snap.data);
    return true;
  };

  const deleteBackup = (backupId) => {
    setBackups(prev => prev.filter(b => b.id !== backupId));
  };

  // Auto-backup runner — check every 5 min
  useEffect(() => {
    const interval = (auth?.autoBackup === 'off') ? null : (BACKUP_INTERVAL_MS[auth?.autoBackup || 'daily']);
    if (!interval) return;
    const check = () => {
      const sinceBackup = Date.now() - (auth?.lastBackupAt || 0);
      if (sinceBackup >= interval) {
        // Only backup if there's actual data
        if (bets.length > 0 || draws.length > 0) {
          saveAutoBackup();
        }
      }
    };
    check(); // Run once on mount
    const timer = setInterval(check, 5 * 60 * 1000); // Re-check every 5 min
    return () => clearInterval(timer);
  }, [auth?.autoBackup, auth?.lastBackupAt, bets.length, draws.length]);

  // Periodic reminder to download manual backup (every 7 days)
  useEffect(() => {
    if (locked || !bets.length) return;
    const lastReminder = auth?.downloadReminderAt || 0;
    const daysSince = (Date.now() - lastReminder) / (24 * 60 * 60 * 1000);
    if (lastReminder === 0) {
      // First time: set baseline, don't remind yet
      setAuth(prev => ({ ...prev, downloadReminderAt: Date.now() }));
      return;
    }
    if (daysSince >= 7) {
      setShowDownloadReminder(true);
    }
  }, [locked]);

  const dismissDownloadReminder = () => {
    setAuth(prev => ({ ...prev, downloadReminderAt: Date.now() }));
    setShowDownloadReminder(false);
  };

  const exportBackup = () => {
    const backup = {
      version: 1,
      exportedAt: new Date().toISOString(),
      data: { ...dataRef.current },
    };
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = todayISO(); // เดิม toISOString → ก่อน 7 โมงเช้าได้วันที่ของเมื่อวาน
    a.href = url;
    a.download = `lotto888-backup-${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return true;
  };

  // Restore from JSON file
  const restoreBackup = (file) => {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const backup = JSON.parse(e.target.result);
          if (!backup.data || backup.version !== 1) {
            reject(new Error('ไฟล์ไม่ถูกต้อง'));
            return;
          }
          resolve(backup);
        } catch (err) {
          reject(err);
        }
      };
      reader.onerror = () => reject(new Error('อ่านไฟล์ไม่ได้'));
      reader.readAsText(file);
    });
  };

  // Reset PIN only — keeps all data
  const resetPinOnly = () => {
    setAuth({ ...auth, pinHash: null, skipped: true });
    setLocked(false);
  };

  const resetAllData = () => {
    // wipe everything except remember user has skipped PIN setup
    Object.values(STORAGE).forEach(key => {
      try { localStorage.removeItem(key); } catch (e) {}
    });
    // also clear extras
    try { localStorage.removeItem('lotto888-tab'); localStorage.removeItem('lotto888-hist-v1'); localStorage.removeItem(ACTIVE_KEY); } catch (e) {}
    // Pre-seed auth so we don't bounce to PIN setup screen after reload
    try {
      localStorage.setItem(STORAGE.auth, JSON.stringify({
        pinHash: null, autoLockMinutes: 30, autoBackup: 'daily',
        lastBackupAt: 0, downloadReminderAt: Date.now(), skipped: true
      }));
    } catch (e) {}
    window.location.reload();
  };

  const isSeller = config.mode !== 'buyer';
  const currentLottery = DEFAULT_LOTTERIES.find(l => l.id === config.lotteryId) || DEFAULT_LOTTERIES[0];
  const currentDraw = draws.find(d => d.lotteryId === config.lotteryId && d.date === config.drawDate);
  const [jotPrefill, setJotPrefill] = useState(null);
  const [shareText, setShareText] = useState(() => { try { return sessionStorage.getItem(SHARE_KEY) || ''; } catch (e) { return ''; } });
  useEffect(() => { if (shareText) setTab('jot'); }, [shareText]);
  const latestDraw = useMemo(() => {
    const today = todayISO();
    return draws.filter(d => d.lotteryId === config.lotteryId && d.date <= today && d.results && (d.results['3บน'] || d.results['3ตัว'] || d.results['2ล่าง']))
      .sort((a, b) => b.date.localeCompare(a.date))[0] || null;
  }, [draws, config.lotteryId]);
  const currentBets = bets.filter(b => b.lotteryId === config.lotteryId && b.drawDate === config.drawDate);
  const totalAmt = currentBets.reduce((s, b) => s + (parseFloat(b.amount) || 0), 0);

  const appToast = useToast();
  useEffect(() => {
    const onFull = () => appToast.show('พื้นที่เก็บข้อมูลในเครื่องเต็ม — รายการล่าสุดบันทึกไม่ลง · ดาวน์โหลดไฟล์สำรองไว้ก่อน (ตั้งค่า → ดาวน์โหลด)', 'error', 8000);
    window.addEventListener('lotto-storage-full', onFull);
    return () => window.removeEventListener('lotto-storage-full', onFull);
  }, []);
  const [showShareSheet, setShowShareSheet] = useState(false);

  const shareApp = async () => {
    const url = window.location.origin + window.location.pathname;
    const shareText = `🎰 Royal 888 — ระบบจัดการโพยหวยพรีเมียม\n\n📱 เปิดใช้งานได้ที่:\n${url}\n\n• ไม่ต้องติดตั้ง — เปิดได้ทันที\n• ใช้บนมือถือทุกเครื่อง\n• ข้อมูลเก็บในเครื่องของแต่ละคน`;
    if (navigator.share) {
      try {
        await navigator.share({ title: 'Royal 888', text: shareText, url });
        return;
      } catch (e) {
        // user cancelled or share failed
        if (e.name === 'AbortError') return;
      }
    }
    // Fallback: open share sheet with copy options
    setShowShareSheet(true);
  };

  // วันที่ซื้อ: เปิดแอปวันใหม่ → เป็นวันนี้ (เดิมค้างวันแรกที่ใช้ → โพยทุกใบได้วันที่ซื้อเก่า)
  // ถ้าวันนี้ผู้ใช้เลือกวันเองแล้ว → คงไว้ (รีเฟรชไม่รีเซ็ต)
  useEffect(() => {
    const today = todayISO();
    setConfig(prev => (prev && prev.purchaseDate !== today && prev.purchasePickedOn !== today) ? { ...prev, purchaseDate: today } : prev);
  }, []);

  // เปลี่ยนหวย: จำงวดของแต่ละหวยไว้ (เดิมใช้งวดเดียวกันทุกหวย → กดหวยลาวแล้วโพยลงวันที่งวดรัฐบาล 1 พ.ย.)
  // งวดที่จำไว้ผ่านไปแล้ว (และไม่ได้เลือกเองวันนี้) → ไปงวดถัดไปของหวยนั้น
  const switchLottery = (id) => setConfig(prev => {
    if (prev.lotteryId === id) return prev;
    const today = todayISO();
    const mem = { ...(prev.drawMem || {}), [prev.lotteryId]: { d: prev.drawDate, on: prev.drawPickedOn || '' } };
    const m = mem[id];
    const keep = m && m.d && (m.d >= today || m.on === today);
    return { ...prev, lotteryId: id, drawDate: keep ? m.d : getNextDrawDate(today, id), drawPickedOn: keep ? m.on : '', drawMem: mem };
  });
  // เคยเลือกหวยที่เลิกจดไว้ (หุ้น/มาเลย์/ยี่กี) → สลับไปหวยรัฐบาล
  useEffect(() => { if (HIDDEN_LOTTERIES.includes(config.lotteryId)) switchLottery('gov'); }, [config.lotteryId]);
  const nextDrawDate = getNextDrawDate(todayISO(), config.lotteryId);
  const drawIsPast = !!config.drawDate && config.drawDate < todayISO();

  // Hide loader after mount
  useEffect(() => {
    const loader = document.getElementById('loader');
    if (loader) {
      setTimeout(() => loader.classList.add('hidden'), 100);
      setTimeout(() => loader.remove(), 700);
    }
  }, []);

  // Show login screen if locked or PIN not set up yet (but allow skip on setup)
  if (locked || (auth?.pinHash === null && !auth?.skipped)) {
    return (
      <LoginScreen
        auth={auth}
        onSuccess={unlockApp}
        onSetup={setupPin}
        onReset={resetAllData}
        onExport={exportBackup}
        onResetPinOnly={resetPinOnly}
        onSkip={skipPinSetup}/>
    );
  }

  return (
    <div className="app-bg text-stone-900 w-full overflow-x-hidden">
      {/* Decorative orbs — floating champagne bokeh */}
      <div className="fixed pointer-events-none" style={{ top: '-100px', right: '-80px', width: '280px', height: '280px', borderRadius: '50%', background: 'radial-gradient(circle, rgba(201, 169, 97, 0.18) 0%, transparent 70%)', filter: 'blur(45px)', zIndex: 0 }}/>
      <div className="fixed pointer-events-none" style={{ top: '30%', left: '-80px', width: '220px', height: '220px', borderRadius: '50%', background: 'radial-gradient(circle, rgba(212, 181, 114, 0.14) 0%, transparent 70%)', filter: 'blur(50px)', zIndex: 0 }}/>
      <div className="fixed pointer-events-none" style={{ bottom: '15%', right: '-100px', width: '260px', height: '260px', borderRadius: '50%', background: 'radial-gradient(circle, rgba(184, 150, 90, 0.16) 0%, transparent 70%)', filter: 'blur(55px)', zIndex: 0 }}/>

      {/* Header */}
      <div className="relative safe-top">
        {/* Top gold accent line */}
        <div className="absolute top-0 left-0 right-0 h-px pointer-events-none" style={{ background: 'linear-gradient(90deg, transparent 0%, rgba(184, 134, 11, 0.4) 30%, rgba(184, 134, 11, 0.6) 50%, rgba(184, 134, 11, 0.4) 70%, transparent 100%)' }}/>
        {/* Subtle red glow at very top */}
        <div className="absolute top-0 left-0 right-0 h-32 pointer-events-none opacity-50" style={{ background: 'radial-gradient(ellipse 60% 100% at 50% 0%, rgba(184, 150, 90, 0.12) 0%, transparent 70%)' }}/>
        <div className="relative px-4 pt-6 pb-3">
          <div className="flex items-start justify-between gap-2">
            <div className="min-w-0 flex-1">
              <div className="font-cinzel text-xs font-semibold tracking-[0.35em] uppercase truncate" style={{color:'#8a6d36'}}>
                {isSeller ? 'Bookie · Risk' : 'Player · Picks'}
              </div>
              <div className="flex items-center gap-2 mt-1">
                <span className="text-2xl leading-none flex-shrink-0" style={{color:'#b8965a'}}>♛</span>
                <h1 className="font-cinzel text-2xl font-bold tracking-[0.15em] leading-none" style={{color:'#2a2a2a'}}>ROYAL</h1>
                <span className="text-2xl leading-none flex-shrink-0" style={{color:'#b8965a'}}>♛</span>
              </div>
              <div className="flex items-center gap-2 mt-0.5">
                <span className="font-bodoni text-lg font-bold tracking-[0.3em]" style={{color:'#b8965a'}}>8 8 8</span>
                <span className="font-display text-xs font-semibold rounded-full px-2 py-0.5 whitespace-nowrap" style={{ background: '#f3eee2', color: '#8a6d36' }} data-testid="app-version">{APP_VERSION}</span>
              </div>
            </div>
            <div className="flex items-center gap-1.5 flex-shrink-0">
              {auth?.pinHash && (
                <button
                  onClick={lockApp}
                  className="glass rounded-full w-11 h-11 flex items-center justify-center active:scale-95"
                  title="ล็อกแอป">
                  <Lock size={18} style={{color:'#8a6d36'}} strokeWidth={2.5}/>
                </button>
              )}
              <button
                onClick={() => setShowAuthSheet(true)}
                className="glass rounded-full w-11 h-11 flex items-center justify-center active:scale-95"
                title="ตั้งค่าความปลอดภัย">
                <Settings size={17} style={{color:'#8a6d36'}} strokeWidth={2.5}/>
              </button>
              <button
                onClick={shareApp}
                className="glass rounded-full w-11 h-11 flex items-center justify-center active:scale-95"
                title="แชร์แอป">
                <Share2 size={17} style={{color:'#8a6d36'}} strokeWidth={2.5}/>
              </button>
            </div>
          </div>
          <div className="mt-3 flex items-center justify-between gap-2">
            <button
              onClick={() => setConfig({ ...config, mode: isSeller ? 'buyer' : 'seller' })}
              className="glass rounded-full px-3 py-2 flex items-center gap-1.5 text-base font-display active:scale-95 flex-shrink-0"
            >
              {isSeller ? <Store size={16} style={{color:'#8a6d36'}}/> : <UserCircle2 size={16} style={{color:'#8a6d36'}}/>}
              <span className="font-semibold" style={{color:'#2a2a2a'}}>{isSeller ? 'ผู้ขาย' : 'ผู้ซื้อ'}</span>
            </button>
            <div className="flex items-center gap-2 min-w-0 flex-1 justify-end">
              <span className="font-display text-sm tracking-wider uppercase flex-shrink-0" style={{color:'#8a6d36'}}>
                {currentBets.length} โพย
              </span>
              <span className="font-numeric font-bold num-wrap" style={{color:'#2a2a2a', fontSize: 'clamp(0.95rem, 4.5vw, 1.25rem)', lineHeight: 1.2, minWidth: 0}}>฿{fmt(totalAmt)}</span>
            </div>
          </div>
        </div>

        <div className="px-4 pb-3">
          <div className="grid grid-cols-3 gap-1.5">
            {DEFAULT_LOTTERIES.map(l => (
              <button key={l.id} type="button" onClick={() => switchLottery(l.id)}
                className="px-1 py-3 rounded-xl text-sm font-display font-semibold transition-all active:scale-95 leading-tight border-2 text-center whitespace-nowrap"
                style={config.lotteryId === l.id ? {
                  background: '#2a2a2a', color: '#f5e8c8', borderColor: '#1a1a1a',
                  boxShadow: '0 2px 6px rgba(42,42,42,0.18)'
                } : {
                  background: '#ffffff', color: '#2a2a2a', borderColor: '#dccfa6'
                }}>{l.name}</button>
            ))}
          </div>
        </div>

        <div className="px-4 pb-3">
          <DrawDateSelector config={config} setConfig={setConfig} isGov={currentLottery.id === 'gov'}/>
          {tab === 'jot' && drawIsPast && nextDrawDate > config.drawDate && (
            <div data-testid="past-draw-warn" className="mt-2 rounded-xl px-3 py-2 flex items-center gap-2 flex-wrap"
              style={{ background: '#fff7ed', border: '1px solid #fdba74' }}>
              <AlertTriangle size={16} className="flex-shrink-0" style={{ color: '#c2410c' }}/>
              <span className="font-display text-base font-semibold flex-1 min-w-0" style={{ color: '#9a3412' }}>
                งวด {formatDrawDateShort(config.drawDate)} ผ่านไปแล้ว · โพยที่จดจะลงงวดนี้
              </span>
              <button data-testid="go-next-draw" onClick={() => setConfig(prev => ({ ...prev, drawDate: nextDrawDate, drawPickedOn: todayISO() }))}
                className="rounded-full px-3 py-1.5 font-display text-base font-bold active:scale-95 whitespace-nowrap"
                style={{ background: '#c2410c', color: '#fff' }}>
                ไปงวด {formatDrawDateShort(nextDrawDate)}
              </button>
            </div>
          )}
        </div>
      </div>

      {/* Tabs */}
      <div className="px-4 mb-4 sticky top-0 z-30 pt-1 pb-2 backdrop-blur-lg" style={{ background: 'linear-gradient(180deg, rgba(250, 247, 240, 0.95) 0%, rgba(250, 247, 240, 0.70) 100%)' }}>
        <div className="glass rounded-2xl p-1 grid grid-cols-6 gap-0.5">
          {[
            { id: 'jot', label: 'จดโพย', icon: BookOpen },
            { id: 'risk', label: 'เสี่ยง', icon: AlertTriangle },
            { id: 'pick', label: 'คัดเลข', icon: Sparkles },
            { id: 'result', label: 'ผลออก', icon: Trophy },
            { id: 'stats', label: 'สรุป', icon: BarChart3 },
            { id: 'lotstats', label: 'สถิติ', icon: TrendingUp },
          ].map(t => {
            const Ic = t.icon;
            const active = tab === t.id;
            const isRisk = t.id === 'risk';
            const activeColor = isRisk ? '#b91c1c' : '#2a2a2a';
            const inactiveColor = isRisk ? '#dc8c8c' : '#8a7e5e';
            return (
              <button key={t.id} onClick={() => setTab(t.id)}
                className="py-3 px-0.5 rounded-xl text-[13px] font-display font-semibold transition-all flex flex-col items-center gap-1 min-w-0"
                style={active ? {
                  background: 'linear-gradient(180deg, rgba(184, 150, 90, 0.16) 0%, rgba(184, 150, 90, 0.06) 100%)',
                  color: activeColor,
                  boxShadow: '0 0 0 1px rgba(184, 150, 90, 0.18), 0 2px 6px rgba(184, 150, 90, 0.10)'
                } : {
                  color: inactiveColor
                }}>
                <Ic size={20} strokeWidth={active ? 2.5 : 2}/>
                <span className="leading-tight whitespace-nowrap">{t.label}</span>
              </button>
            );
          })}
        </div>
      </div>

      <div className="px-4 pb-24">
        {tab === 'jot' && <JotTab lottery={currentLottery} drawDate={config.drawDate} purchaseDate={config.purchaseDate || todayISO()} bets={currentBets} allBets={bets} setBets={setBets} rates={rates} setRates={setRates} currentDraw={currentDraw} isSeller={isSeller} caps={caps}
          latestDraw={latestDraw} onOpenResults={() => { setTab('result'); window.scrollTo({ top: 0 }); }} prefill={jotPrefill} onPrefillDone={() => setJotPrefill(null)}
          forwards={forwards} forwardSettings={forwardSettings}
          incomingShare={shareText} onShareTaken={() => { setShareText(''); try { sessionStorage.removeItem(SHARE_KEY); } catch (e) {} }}/>}
        {tab === 'risk' && <RiskTab lottery={currentLottery} drawDate={config.drawDate} bets={currentBets} allBets={bets} setBets={setBets} isSeller={isSeller} caps={caps} setCaps={setCaps} rates={rates} cuts={cuts} setCuts={setCuts} forwards={forwards} setForwards={setForwards} forwardSettings={forwardSettings} setForwardSettings={setForwardSettings}/>}
        {tab === 'pick' && <PickTab lottery={currentLottery} draws={draws}
          onSendToJot={(numbers, pos) => { setJotPrefill({ numbers, pos, at: Date.now() }); setTab('jot'); window.scrollTo({ top: 0 }); }}/>}
        {tab === 'result' && <ResultTab lottery={currentLottery} drawDate={config.drawDate} draws={draws} setDraws={setDraws} currentDraw={currentDraw}
          autoState={autoState} onSync={async () => {
            // กดดึงเอง → บอกผลให้รู้ว่าทำงานแล้ว (เดิมกดแล้วเงียบ ไม่รู้ว่าอัปเดตหรือยัง)
            const all = await syncAuto();
            if (all === undefined) return; // กำลังดึงอยู่แล้ว
            if (!all) { appToast.show('ดึงผลไม่ได้ · ตรวจเน็ตแล้วลองใหม่', 'error'); return; }
            const mine = all.filter(d => d.lotteryId === config.lotteryId).sort((a, b) => b.date.localeCompare(a.date))[0];
            appToast.show('อัปเดตผลแล้ว' + (mine ? ' · ' + currentLottery.name + ' ล่าสุด ' + formatDrawDateShort(mine.date) : ''), 'success');
          }}
          onCheck={(lotteryId, date) => { setConfig({ ...config, lotteryId, drawDate: date, drawPickedOn: todayISO() }); setTab('jot'); window.scrollTo({ top: 0 }); }}/>}
        {tab === 'lotstats' && <LotteryStatsTab/>}
        {tab === 'stats' && <StatsTab bets={bets} draws={draws} isSeller={isSeller} caps={caps} rates={rates} forwards={forwards} forwardSettings={forwardSettings}/>}
      </div>

      {showShareSheet && (
        <ShareAppSheet onClose={() => setShowShareSheet(false)}/>
      )}

      {showAuthSheet && (
        <AuthSettingsSheet
          auth={auth}
          setAuth={setAuth}
          backups={backups}
          onRestoreFromBackup={async (id) => {
            const snap = backups.find(x => x.id === id);
            const go = await appToast.askConfirm('กู้คืนข้อมูลชุดนี้ ?\nโพย ' + fmt((snap?.data?.bets || []).length) + ' รายการ\n\nข้อมูลในเครื่องตอนนี้ (โพย ' + fmt(bets.length) + ' รายการ) จะถูกแทนที่', { danger: true, confirmLabel: 'กู้คืน' });
            if (!go) return;
            const ok = restoreFromBackup(id);
            if (ok) {
              appToast.show('กู้คืนข้อมูลสำเร็จ', 'success');
              setShowAuthSheet(false);
            } else {
              appToast.show('กู้คืนไม่สำเร็จ', 'error');
            }
          }}
          onDeleteBackup={deleteBackup}
          onBackupNow={() => {
            saveAutoBackup();
            appToast.show('สำรองข้อมูลแล้ว', 'success');
          }}
          onClose={() => setShowAuthSheet(false)}
          onLockNow={() => { setShowAuthSheet(false); lockApp(); }}
          onExport={() => {
            exportBackup();
            appToast.show('ดาวน์โหลดไฟล์สำรองแล้ว', 'success');
          }}
          onRestore={async (file) => {
            try {
              const backup = await restoreBackup(file);
              // ยืนยันก่อนแทนที่ (เดิมเลือกไฟล์ปุ๊บ ข้อมูลในเครื่องถูกแทนทันที — เลือกไฟล์ผิด = โพยปัจจุบันหาย)
              const d = backup.data, when = backup.exportedAt ? new Date(backup.exportedAt) : null;
              const ok = await appToast.askConfirm('นำเข้าไฟล์สำรอง' + (when && !isNaN(when) ? ' (' + formatDrawDateShort(when.getFullYear() + '-' + String(when.getMonth() + 1).padStart(2, '0') + '-' + String(when.getDate()).padStart(2, '0')) + ')' : '') +
                '\nโพย ' + fmt((d.bets || []).length) + ' รายการ\n\nข้อมูลในเครื่องตอนนี้ (โพย ' + fmt(bets.length) + ' รายการ) จะถูกแทนที่', { danger: true, confirmLabel: 'นำเข้า' });
              if (!ok) return;
              applyBackupData(d);
              appToast.show('นำเข้าข้อมูลสำเร็จ', 'success');
              setShowAuthSheet(false);
            } catch (err) {
              appToast.show('นำเข้าไม่สำเร็จ: ' + err.message, 'error');
            }
          }}
          onReset={async () => {
            const ok = await appToast.askConfirm('ลบข้อมูลทั้งหมด ?\n\n— โพยทั้งหมดจะหาย\n— ผลรางวัลที่จดไว้จะหาย\n— ตั้งค่าทั้งหมดจะหาย\n\nรีเซ็ตแอปเริ่มใหม่', { danger: true, confirmLabel: 'ลบทั้งหมด' });
            if (ok) resetAllData();
          }}/>
      )}

      {showDownloadReminder && (
        <DownloadReminderModal
          onClose={dismissDownloadReminder}
          onDownload={() => {
            exportBackup();
            dismissDownloadReminder();
            appToast.show('ดาวน์โหลดไฟล์สำรองแล้ว — เก็บไว้ปลอดภัย', 'success', 3500);
          }}/>
      )}
    </div>
  );
}

function AuthSettingsSheet({ auth, setAuth, backups, onRestoreFromBackup, onDeleteBackup, onBackupNow, onClose, onLockNow, onReset, onExport, onRestore }) {
  const toast = useToast();
  const [mode, setMode] = useState('main'); // 'main' | 'set-pin' | 'change-pin-old' | 'change-pin-new'
  const [oldPin, setOldPin] = useState('');
  const [newPin, setNewPin] = useState('');
  const [confirmPin, setConfirmPin] = useState('');
  const [error, setError] = useState('');

  const hasPin = !!auth?.pinHash;
  const autoLockMinutes = auth?.autoLockMinutes ?? 30;

  const setAutoLock = (mins) => {
    setAuth({ ...auth, autoLockMinutes: mins });
    toast.show(mins === 0 ? 'ปิดล็อกอัตโนมัติ' : 'ตั้ง ' + mins + ' นาที', 'success');
  };

  const handleSetPin = () => {
    setError('');
    if (newPin.length < 4) { setError('PIN ต้องอย่างน้อย 4 หลัก'); return; }
    if (newPin !== confirmPin) { setError('PIN ไม่ตรงกัน'); return; }
    setAuth({ ...auth, pinHash: hashPin(newPin) });
    toast.show('ตั้ง PIN สำเร็จ', 'success');
    setMode('main');
    setNewPin(''); setConfirmPin('');
  };

  const handleChangePin = () => {
    setError('');
    if (hashPin(oldPin) !== auth.pinHash) { setError('PIN เดิมไม่ถูกต้อง'); return; }
    setMode('change-pin-new');
    setOldPin('');
  };

  const handleSaveNewPin = () => {
    setError('');
    if (newPin.length < 4) { setError('PIN ใหม่ต้องอย่างน้อย 4 หลัก'); return; }
    if (newPin !== confirmPin) { setError('PIN ใหม่ไม่ตรงกัน'); return; }
    setAuth({ ...auth, pinHash: hashPin(newPin) });
    toast.show('เปลี่ยน PIN สำเร็จ', 'success');
    setMode('main');
    setNewPin(''); setConfirmPin('');
  };

  const removePin = async () => {
    const ok = await toast.askConfirm('ปิดระบบล็อก ?\n\nใครก็ตามที่เปิดมือถือนี้จะเห็นโพยของคุณได้', { danger: true, confirmLabel: 'ปิดล็อก' });
    if (!ok) return;
    setAuth({ ...auth, pinHash: null, skipped: true });
    toast.show('ปิดระบบล็อกแล้ว', 'info');
  };

  if (mode === 'set-pin') {
    return (
      <BottomSheet onClose={() => { setMode('main'); setNewPin(''); setConfirmPin(''); setError(''); }} title="ตั้ง PIN ใหม่">
        <div className="space-y-4">
          <div>
            <div className="text-base uppercase tracking-wider text-stone-600 font-display font-semibold mb-2">PIN ใหม่ (4-6 หลัก)</div>
            <input type="tel" inputMode="numeric" value={newPin} maxLength={6}
              onChange={e => setNewPin(e.target.value.replace(/\D/g, '').slice(0, 6))}
              placeholder="• • • •"
              className="w-full bg-white rounded-xl px-4 py-4 outline-none font-numeric text-3xl font-black text-stone-900 text-center tracking-[0.3em] border-2 border-stone-300"/>
          </div>
          <div>
            <div className="text-base uppercase tracking-wider text-stone-600 font-display font-semibold mb-2">ยืนยัน PIN อีกครั้ง</div>
            <input type="tel" inputMode="numeric" value={confirmPin} maxLength={6}
              onChange={e => setConfirmPin(e.target.value.replace(/\D/g, '').slice(0, 6))}
              placeholder="• • • •"
              className="w-full bg-white rounded-xl px-4 py-4 outline-none font-numeric text-3xl font-black text-stone-900 text-center tracking-[0.3em] border-2 border-stone-300"/>
          </div>
          {error && <div className="text-base text-red-600 font-display text-center">{error}</div>}
          <button onClick={handleSetPin}
            className="w-full py-4 rounded-xl btn-premium font-display text-lg font-semibold tracking-wide">
            บันทึก PIN
          </button>
        </div>
      </BottomSheet>
    );
  }

  if (mode === 'change-pin-old') {
    return (
      <BottomSheet onClose={() => { setMode('main'); setOldPin(''); setError(''); }} title="ยืนยัน PIN เดิม">
        <div className="space-y-4">
          <div>
            <div className="text-base uppercase tracking-wider text-stone-600 font-display font-semibold mb-2">PIN เดิม</div>
            <input type="tel" inputMode="numeric" value={oldPin} maxLength={6}
              onChange={e => setOldPin(e.target.value.replace(/\D/g, '').slice(0, 6))}
              placeholder="• • • •"
              className="w-full bg-white rounded-xl px-4 py-4 outline-none font-numeric text-3xl font-black text-stone-900 text-center tracking-[0.3em] border-2 border-stone-300"/>
          </div>
          {error && <div className="text-base text-red-600 font-display text-center">{error}</div>}
          <button onClick={handleChangePin}
            className="w-full py-4 rounded-xl btn-premium font-display text-lg font-semibold tracking-wide">
            ถัดไป
          </button>
        </div>
      </BottomSheet>
    );
  }

  if (mode === 'change-pin-new') {
    return (
      <BottomSheet onClose={() => { setMode('main'); setNewPin(''); setConfirmPin(''); setError(''); }} title="ตั้ง PIN ใหม่">
        <div className="space-y-4">
          <div>
            <div className="text-base uppercase tracking-wider text-stone-600 font-display font-semibold mb-2">PIN ใหม่</div>
            <input type="tel" inputMode="numeric" value={newPin} maxLength={6}
              onChange={e => setNewPin(e.target.value.replace(/\D/g, '').slice(0, 6))}
              placeholder="• • • •"
              className="w-full bg-white rounded-xl px-4 py-4 outline-none font-numeric text-3xl font-black text-stone-900 text-center tracking-[0.3em] border-2 border-stone-300"/>
          </div>
          <div>
            <div className="text-base uppercase tracking-wider text-stone-600 font-display font-semibold mb-2">ยืนยัน PIN ใหม่</div>
            <input type="tel" inputMode="numeric" value={confirmPin} maxLength={6}
              onChange={e => setConfirmPin(e.target.value.replace(/\D/g, '').slice(0, 6))}
              placeholder="• • • •"
              className="w-full bg-white rounded-xl px-4 py-4 outline-none font-numeric text-3xl font-black text-stone-900 text-center tracking-[0.3em] border-2 border-stone-300"/>
          </div>
          {error && <div className="text-base text-red-600 font-display text-center">{error}</div>}
          <button onClick={handleSaveNewPin}
            className="w-full py-4 rounded-xl btn-premium font-display text-lg font-semibold tracking-wide">
            บันทึก PIN ใหม่
          </button>
        </div>
      </BottomSheet>
    );
  }

  return (
    <BottomSheet onClose={onClose} title="ตั้งค่าความปลอดภัย">
      <div className="space-y-4">
        {/* Status */}
        <div className={'rounded-2xl p-4 border-2 ' + (hasPin
          ? 'bg-gradient-to-br from-green-50 to-white border-green-200'
          : 'bg-gradient-to-br from-amber-50 to-white border-amber-300')}>
          <div className="flex items-center gap-3">
            <div className={'w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0 ' + (hasPin ? 'bg-green-100' : 'bg-amber-100')}>
              {hasPin
                ? <Lock size={22} className="text-green-700" strokeWidth={2.5}/>
                : <Unlock size={22} className="text-amber-700" strokeWidth={2.5}/>}
            </div>
            <div className="flex-1">
              <div className={'font-display text-lg font-bold ' + (hasPin ? 'text-green-800' : 'text-amber-800')}>
                {hasPin ? 'ป้องกันด้วย PIN' : 'ยังไม่มี PIN'}
              </div>
              <div className="text-base text-stone-600 font-display">
                {hasPin ? 'ต้องใส่ PIN ทุกครั้งที่เปิด' : 'ใครเปิดมือถือก็เห็นโพยได้'}
              </div>
            </div>
          </div>
        </div>

        {/* PIN actions */}
        <div className="space-y-2">
          {!hasPin ? (
            <button onClick={() => setMode('set-pin')}
              className="w-full py-4 rounded-xl btn-premium font-display text-lg font-semibold tracking-wide flex items-center justify-center gap-2 active:scale-95">
              <Lock size={18} strokeWidth={2.5}/>
              ตั้ง PIN ป้องกัน
            </button>
          ) : (
            <>
              <button onClick={onLockNow}
                className="w-full py-4 rounded-xl btn-premium font-display text-lg font-semibold tracking-wide flex items-center justify-center gap-2 active:scale-95">
                <LogOut size={18} strokeWidth={2.5}/>
                ล็อกแอปทันที
              </button>
              <button onClick={() => setMode('change-pin-old')}
                className="w-full py-3.5 rounded-xl bg-white border-2 border-stone-300 text-stone-800 font-display text-lg font-semibold flex items-center justify-center gap-2 active:scale-95">
                <Settings size={16} strokeWidth={2.5}/>
                เปลี่ยน PIN
              </button>
              <button onClick={removePin}
                className="w-full py-3 rounded-xl bg-white border border-red-200 text-red-700 font-display text-base flex items-center justify-center gap-2 active:scale-95">
                <Unlock size={14} strokeWidth={2.5}/>
                ปิดระบบล็อก
              </button>
            </>
          )}
        </div>

        {/* Auto-lock settings */}
        {hasPin && (
          <div className="bg-stone-50 rounded-2xl p-4 border border-stone-200">
            <div className="text-base uppercase tracking-wider text-stone-700 font-display font-bold mb-1">ล็อกอัตโนมัติ</div>
            <div className="text-base text-stone-600 font-display mb-3">หลังไม่ใช้งานนานเท่าไหร่ ให้ล็อกแอปอัตโนมัติ</div>
            <div className="grid grid-cols-3 gap-2">
              {[
                { v: 5, label: '5 นาที' },
                { v: 15, label: '15 นาที' },
                { v: 20, label: '20 นาที' },
                { v: 30, label: '30 นาที' },
                { v: 60, label: '1 ชม.' },
                { v: 0, label: 'ปิดล็อก\nอัตโนมัติ' },
              ].map(opt => {
                const active = autoLockMinutes === opt.v;
                return (
                  <button key={opt.v} onClick={() => setAutoLock(opt.v)}
                    className={'py-3 px-2 rounded-xl text-base font-display font-semibold border-2 transition-all active:scale-95 whitespace-pre-line leading-tight ' + (
                      active
                        ? 'btn-premium border-red-900'
                        : 'bg-white text-stone-700 border-stone-200'
                    )}>
                    {opt.label}
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {/* Auto-backup setting */}
        <div className="bg-gradient-to-br from-green-50 to-white rounded-2xl p-4 border border-green-200">
          <div className="flex items-center justify-between mb-1">
            <div className="text-base uppercase tracking-wider text-green-800 font-display font-bold">สำรองอัตโนมัติ</div>
            <button onClick={onBackupNow}
              className="text-base text-green-700 font-display font-semibold bg-white border border-green-300 rounded-full px-3 py-1 active:scale-95">
              สำรองเลย
            </button>
          </div>
          <div className="text-base text-stone-600 font-display mb-3">บันทึก snapshot อัตโนมัติ — ใช้กู้คืนข้อมูลย้อนหลังได้ (เก็บล่าสุด 7 จุด)</div>
          <div className="grid grid-cols-4 gap-1.5 mb-2">
            {[
              { v: 'hourly', label: 'ทุก 1 ชม.' },
              { v: 'daily', label: 'ทุกวัน' },
              { v: 'weekly', label: 'ทุก 7 วัน' },
              { v: 'off', label: 'ปิด' },
            ].map(opt => {
              const active = (auth?.autoBackup || 'daily') === opt.v;
              return (
                <button key={opt.v} onClick={() => setAuth(prev => ({ ...prev, autoBackup: opt.v }))}
                  className={'py-2.5 px-1 rounded-xl text-base font-display font-semibold border-2 transition-all active:scale-95 leading-tight ' + (
                    active
                      ? 'bg-green-600 text-white border-green-700 shadow-md shadow-green-200'
                      : 'bg-white text-stone-700 border-stone-200'
                  )}>
                  {opt.label}
                </button>
              );
            })}
          </div>
          <div className="text-base text-stone-500 font-display">
            ล่าสุด: {auth?.lastBackupAt ? formatBackupTime(auth.lastBackupAt) : '— ยังไม่เคยสำรอง —'}
          </div>
        </div>

        {/* Auto-backup list — restore points */}
        {backups && backups.length > 0 && (
          <div className="bg-white rounded-2xl p-4 border border-stone-200">
            <div className="text-base uppercase tracking-wider text-stone-700 font-display font-bold mb-1">จุดกู้คืนที่บันทึกอัตโนมัติ</div>
            <div className="text-base text-stone-500 font-display mb-3">เลือกย้อนกลับไปจุดเวลาที่ต้องการ</div>
            <div className="space-y-2 max-h-72 overflow-y-auto">
              {backups.map(b => {
                const d = b.data || {};
                const total = (d.bets?.length || 0);
                return (
                  <div key={b.id} className="bg-stone-50 rounded-xl p-3 border border-stone-200 flex items-center gap-2">
                    <div className="flex-1 min-w-0">
                      <div className="font-display text-lg font-semibold text-stone-900">
                        {formatBackupTime(b.createdAt)}
                      </div>
                      <div className="text-base text-stone-500 font-display">
                        {total} โพย · {(d.draws?.length || 0)} ผลรางวัล
                      </div>
                    </div>
                    <button onClick={() => onRestoreFromBackup(b.id)}
                      className="text-base font-display font-semibold bg-red-600 text-white border border-red-700 rounded-lg px-3 py-2 active:scale-95">
                      กู้คืน
                    </button>
                    <button onClick={() => onDeleteBackup(b.id)}
                      className="text-stone-400 active:text-red-600 p-1">
                      <X size={16} strokeWidth={2.5}/>
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Backup / Restore */}
        <div className="rounded-2xl p-4 border" style={{background:'linear-gradient(135deg, #fdf9ed, #ffffff)', borderColor:'#dccfa6'}}>
          <div className="text-base uppercase tracking-wider font-display font-bold mb-1" style={{color:'#8a6d36'}}>สำรอง / กู้คืน เป็นไฟล์</div>
          <div className="text-base text-stone-600 font-display mb-3">ดาวน์โหลดไฟล์เก็บนอกแอป (แชต LINE / Google Drive) — ปลอดภัยกว่า</div>
          <div className="grid grid-cols-2 gap-2">
            <button onClick={onExport}
              className="py-3 rounded-xl bg-white border-2 font-display text-lg font-semibold flex items-center justify-center gap-2 active:scale-95" style={{color:'#8a6d36', borderColor:'#b8965a'}}>
              <Download size={16} strokeWidth={2.5}/>
              ดาวน์โหลด
            </button>
            <label className="py-3 rounded-xl bg-white border-2 border-red-300 text-red-700 font-display text-lg font-semibold flex items-center justify-center gap-2 active:scale-95 cursor-pointer">
              <Plus size={16} strokeWidth={2.5}/>
              นำเข้าไฟล์
              <input type="file" accept=".json,application/json" onChange={e => {
                const f = e.target.files?.[0];
                if (f) onRestore(f);
                e.target.value = '';
              }} style={{ display: 'none' }}/>
            </label>
          </div>
        </div>

        {/* Reset all */}
        <div className="border-t border-stone-200 pt-3">
          <button onClick={onReset}
            className="w-full py-3 rounded-xl bg-red-50 border border-red-200 text-red-700 font-display text-base font-semibold flex items-center justify-center gap-2 active:scale-95">
            <Trash2 size={14} strokeWidth={2.5}/>
            ลบข้อมูลทั้งหมดและรีเซ็ตแอป
          </button>
        </div>

        {/* Info */}
        <div className="bg-stone-50 rounded-xl p-3 text-base text-stone-600 font-display leading-relaxed">
          <strong className="text-stone-800">หมายเหตุ:</strong> PIN เก็บเฉพาะในเครื่องนี้ — ลืม PIN มีตัวเลือก "เอา PIN ออก เก็บข้อมูลไว้"
        </div>
      </div>
    </BottomSheet>
  );
}

  return (
    <div className="fixed inset-0 z-[9990] flex items-center justify-center p-5" onClick={onClose}>
      <div className="absolute inset-0 bg-stone-900/40 backdrop-blur-sm"/>
      <div onClick={e => e.stopPropagation()}
        className="relative max-w-sm w-full bg-white rounded-2xl shadow-2xl overflow-hidden toast-in"
        style={{ boxShadow: '0 20px 60px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.05)' }}>
        <div className="p-6">
          <div className="w-14 h-14 rounded-full mx-auto mb-4 flex items-center justify-center bg-amber-100 text-amber-700">
            <Download size={26} strokeWidth={2.5}/>
          </div>
          <h3 className="text-center text-stone-900 font-display text-xl font-bold mb-2">ถึงเวลาสำรองข้อมูล</h3>
          <p className="text-center text-stone-600 font-display text-lg leading-relaxed">
            7 วันแล้วที่ยังไม่ได้ดาวน์โหลดไฟล์สำรอง<br/>
            แนะนำเก็บไว้ในแชต LINE หรือ Google Drive
          </p>
        </div>
        <div className="grid grid-cols-2 border-t border-stone-100">
          <button onClick={onClose}
            className="py-4 text-stone-600 font-display text-lg font-semibold border-r border-stone-100 active:bg-stone-50">
            ภายหลัง

// ==================== JOT TAB ====================
function JotTab({ lottery, drawDate, purchaseDate, bets, allBets, setBets, rates, setRates, currentDraw, isSeller, caps, forwards, forwardSettings, latestDraw, onOpenResults, prefill, onPrefillDone, incomingShare, onShareTaken }) {
  const toast = useToast();
  const [customer, setCustomer] = useState('');
  const [step, setStep] = useState('select');
  const [pickedTypes, setPickedTypes] = useState({});
  const [reverse3, setReverse3] = useState(false);
  const [reverse2, setReverse2] = useState(false);
  const [number, setNumber] = useState('');
  const [pending, setPending] = useState([]);
  const [bulkPrice, setBulkPrice] = useState('');
  const [error, setError] = useState('');
  const [sheet, setSheet] = useState(null);

  const t3 = lottery.types.includes('3ตัว') ? '3ตัว' : '3บน';
  const t3Label = lottery.types.includes('3ตัว') ? '3 ตัว' : '3 ตัวบน';

  useEffect(() => {
    setPickedTypes({ [t3]: true });
    setPending([]);
    setNumber('');
    setStep('select');
    setBulkPrice('');
  }, [lottery.id]);

  // ผลงวดนี้ออกแล้ว + มีโพย → การ์ดสรุป (คิดเงินจาก betPayout แหล่งเดียวกับหน้าสรุป)
  const settle = useMemo(() => {
    const r = currentDraw && currentDraw.results;
    if (!r || !(r['3บน'] || r['3ตัว'] || r['2ล่าง']) || bets.length === 0) return null;
    return settleDraw(bets, r, caps, rates);
  }, [currentDraw, bets, caps, rates]);

  // วางจาก LINE: เตือนเลขจ่ายครึ่ง + ยอดรวมเกินเพดานรับ (ยอดเดิมที่บันทึก + ที่ค้างใส่ราคา + บรรทัดก่อนหน้า) · ผู้ขายเท่านั้น · เตือนเฉยๆ ไม่บล็อก
  const capCheck = useMemo(() => {
    if (!isSeller) return null;
    const base = {};
    [...bets, ...pending].forEach(b => { const k = b.number + '|' + b.type; base[k] = (base[k] || 0) + (parseFloat(b.amount) || 0); });
    return (lines) => {
      const run = { ...base }, perLine = {}, half = new Map(), over = new Map();
      for (const L of lines) {
        if (L.status !== 'ok') continue;
        const flags = [];
        for (const b of L.bets) {
          const k = b.number + '|' + b.type;
          run[k] = (run[k] || 0) + (parseFloat(b.amount) || 0);
          if (isCombosHalfPay(caps || [], lottery.id, drawDate, b.number, b.type)) { flags.push({ kind: 'half', b }); half.set(k, b); }
          const mk = getMaxKeep(lottery.id, drawDate, b.number, b.type, forwards || [], forwardSettings);
          if (mk !== null && run[k] > mk) { const o = { kind: 'over', b, total: run[k], over: run[k] - mk, max: mk }; flags.push(o); over.set(k, o); }
        }
        if (flags.length) perLine[L.idx] = flags;
      }
      return { perLine, half: [...half.values()], over: [...over.values()] };
    };
  }, [isSeller, bets, pending, caps, forwards, forwardSettings, lottery.id, drawDate]);

  // ข้อความที่แชร์มาจาก LINE → เปิดแผ่น "วางจาก LINE" พร้อมข้อความ (ล้างคิวเมื่อแผ่นเปิดแล้วเท่านั้น)
  const [pasteInit, setPasteInit] = useState('');
  useEffect(() => {
    if (!incomingShare) return;
    setStep('select'); setPasteInit(incomingShare); setSheet('paste');
    onShareTaken && onShareTaken();
  }, [incomingShare]);

  // รับเลขจากหน้าคัดเลข (ประกาศหลัง effect ด้านบน → ทำงานต่อจากการรีเซ็ตตอนเปิดหน้า)
  useEffect(() => {
    if (!prefill || !prefill.numbers || prefill.numbers.length === 0) return;
    const type = prefill.pos === '3' ? t3 : prefill.pos;
    setStep('select'); setReverse2(false); setReverse3(false); setNumber(''); setError('');
    setPickedTypes({ [type]: true });
    setPending(prev => [...prev, ...prefill.numbers
      .filter(n => !prev.some(p => p.number === n && p.type === type))
      .map(n => ({ id: uid(), number: n, type, amount: '', rate: rates[type] || 90 }))]);
    toast.show('เพิ่ม ' + prefill.numbers.length + ' เลข (' + typeFullName(type) + ') · ใส่ราคาต่อได้เลย', 'success', 3500);
    onPrefillDone && onPrefillDone();
  }, [prefill]);

  const has3Active = pickedTypes[t3] || pickedTypes['โต๊ด'];
  const has2Active = pickedTypes['2บน'] || pickedTypes['2ล่าง'];
  const digits = has3Active ? 3 : has2Active ? 2 : 3;

  const togglePickType = (key) => {
    const isGroup3 = key === t3 || key === 'โต๊ด';
    if ((isGroup3 && has2Active) || (!isGroup3 && has3Active)) {
      // Switching groups - reset
      setPickedTypes({ [key]: true });
      setNumber('');
      if (isGroup3) setReverse2(false);
      else setReverse3(false);
    } else {
      setPickedTypes(prev => ({ ...prev, [key]: !prev[key] }));
    }
    setError('');
  };

  const onReverse3 = () => {
    if (has2Active) {
      setPickedTypes({});
      setReverse2(false);
      setReverse3(true);
      setNumber('');
    } else {
      setReverse3(r => !r);
    }
    setError('');
  };

  const onReverse2 = () => {
    if (has3Active) {
      setPickedTypes({});
      setReverse3(false);
      setReverse2(true);
      setNumber('');
    } else {
      setReverse2(r => !r);
    }
    setError('');
  };

  const addToPending = (num) => {
    const len = num.length;
    const activeTypes = Object.keys(pickedTypes).filter(k => pickedTypes[k]);
    if (activeTypes.length === 0) { setError('เลือกประเภทอย่างน้อย 1'); setNumber(''); return; }
    const matching = activeTypes.filter(t => {
      const is3 = t === t3 || t === 'โต๊ด';
      return (len === 3) === is3;
    });
    if (matching.length === 0) { setError('ประเภทที่เลือกต้องการเลข ' + (len === 3 ? '2' : '3') + ' หลัก'); setNumber(''); return; }

    const numbers = [num];
    if (len === 3 && reverse3) {
      // กลับ 3 ตัว = ทุก permutation (เช่น 223 → 223, 232, 322)
      const perms = getToadVariations(num);
      perms.forEach(p => { if (!numbers.includes(p)) numbers.push(p); });
    } else if (len === 2 && reverse2) {
      const rev = reverseDigits(num);
      if (rev !== num) numbers.push(rev);
    }

    const newItems = [];
    for (const t of matching) {
      // โต๊ด คุ้มทุก perm อยู่แล้ว — ไม่ต้อง multiply เลขกลับ
      const isToad = t === 'โต๊ด';
      const numsForType = isToad ? [num] : numbers;
      for (const n of numsForType) {
        const exists = pending.some(p => p.number === n && p.type === t) ||
                       newItems.some(p => p.number === n && p.type === t);
        if (exists) continue;
        newItems.push({ id: uid(), number: n, type: t, amount: bulkPrice || '', rate: rates[t] || 90 });
      }
    }
    if (newItems.length > 0) setPending(prev => [...prev, ...newItems]);
    setNumber('');
  };

  // กดเร็ว: ตัวเลขครบหลักแล้วรอ 80ms ให้เห็นก่อนเพิ่ม — ถ้ากดตัวถัดไประหว่างรอ → เพิ่มเลขเดิมทันที แล้วเริ่มเลขใหม่
  // (เดิมกดตัวถัดไปเร็ว ตัวนั้นหายและเลขเดิมเข้ารายการซ้ำ 2 ใบ)
  const digitTimerRef = useRef(null);
  const onDigit = (d) => {
    setError('');
    if (digitTimerRef.current) {
      clearTimeout(digitTimerRef.current); digitTimerRef.current = null;
      addToPending(number);
      setNumber(d.slice(0, digits));
      return;
    }
    const newNum = (number + d).slice(0, digits);
    setNumber(newNum);
    if (newNum.length === digits) digitTimerRef.current = setTimeout(() => { digitTimerRef.current = null; addToPending(newNum); }, 80);
  };

  const stopDigitTimer = () => { if (digitTimerRef.current) { clearTimeout(digitTimerRef.current); digitTimerRef.current = null; } };
  const onBackspace = () => { stopDigitTimer(); setNumber(n => n.slice(0, -1)); setError(''); };
  const onClear = () => { stopDigitTimer(); setNumber(''); setError(''); };

  const removePending = (id) => setPending(prev => prev.filter(p => p.id !== id));
  const clearAllPending = async () => {
    if (pending.length === 0) return;
    const ok = await toast.askConfirm('ล้างโพยที่กำลังเลือก ?', { confirmLabel: 'ล้าง' });
    if (!ok) return;
    setPending([]); setBulkPrice('');
  };
  const updatePendingAmount = (id, amount) => setPending(prev => prev.map(p => p.id === id ? { ...p, amount } : p));
  const fillAllPrices = (amt) => {
    const v = parseFloat(amt);
    if (isNaN(v)) return;
    setBulkPrice(String(v));
    setPending(prev => prev.map(p => ({ ...p, amount: v })));
  };

  const totalIntake = useMemo(() => pending.reduce((s, p) => s + (parseFloat(p.amount) || 0), 0), [pending]);
  const totalMaxPayout = useMemo(() => pending.reduce((s, p) => s + (parseFloat(p.amount) || 0) * (parseFloat(p.rate) || 0), 0), [pending]);

  const saveBets = async () => {
    const valid = pending.filter(p => parseFloat(p.amount) > 0);
    if (valid.length === 0) { setError('ใส่ราคาก่อน'); return; }
    if (valid.length !== pending.length) {
      const ok = await toast.askConfirm('มี ' + (pending.length - valid.length) + ' รายการที่ไม่ใส่ราคา\nข้ามไปเลยไหม ?', { confirmLabel: 'ข้ามไป' });
      if (!ok) return;
    }
    const newBets = valid.map(p => ({
      id: p.id, lotteryId: lottery.id, drawDate,
      purchaseDate: purchaseDate,
      customer: customer.trim() || null,
      number: p.number, type: p.type,
      amount: parseFloat(p.amount), rate: parseFloat(p.rate) || 90,
      createdAt: Date.now() + Math.random(),
    }));
    setBets(prev => {
      // กันกดซ้ำ (id เดิม) เท่านั้น — เลขเดียวกันซื้อ 2 ใบ ต้องเก็บครบ
      const filtered = newBets.filter(nb => !prev.some(b => b.id === nb.id));
      return [...prev, ...filtered];
    });
    setPending([]); setBulkPrice(''); setNumber(''); setStep('select');
  };

  const removeBet = (id) => setBets(prev => prev.filter(b => b.id !== id));
  // จำนวน/อัตรา เก็บเป็นตัวเลขเสมอ (เดิมเก็บเป็นข้อความ → ยอดรวมในข้อความ LINE ต่อกันเป็น "10050")
  const updateBet = (id, field, value) => setBets(prev => prev.map(b => b.id === id ? { ...b, [field]: (field === 'amount' || field === 'rate') && value !== '' && !isNaN(Number(value)) ? Number(value) : value } : b));
  const clearAllSaved = async () => {
    if (bets.length === 0) return;
    const ok = await toast.askConfirm('ลบโพยทั้งหมดในงวดนี้ ?\n(' + bets.length + ' รายการ)', { danger: true, confirmLabel: 'ลบทั้งหมด' });

    setBets(prev => prev.filter(b => !(b.lotteryId === lottery.id && b.drawDate === drawDate)));
  };

  // วางจาก LINE: บรรทัดซ้ำ = โพยแยกใบ (ห้ามตัดทิ้ง) · ราคาตามที่อ่านได้
  const handlePasted = ({ bets: parsed, customer: name }) => {

function BetGroupedList({ bets, caps, rates, currentDraw, isSeller, onUpdateBet, onRemoveBet }) {
  // Group bets by customer
  const groups = useMemo(() => {
    const map = {};
    bets.forEach(b => {
      const key = b.customer || '— ไม่ระบุ —';
      if (!map[key]) map[key] = [];
      map[key].push(b);
    });
    // Sort: real names first, "— ไม่ระบุ —" last; by latest createdAt within group
    const entries = Object.entries(map).map(([name, items]) => {
      items.sort((a, b) => b.createdAt - a.createdAt);
      const totalAmt = items.reduce((s, b) => s + (parseFloat(b.amount) || 0), 0);
      const totalPay = items.reduce((s, b) => {
        const rate = rates[b.type] || b.rate || 0;
        const isHalf = isCombosHalfPay(caps, b.lotteryId, b.drawDate, b.number, b.type);
        return s + (parseFloat(b.amount) || 0) * rate * (isHalf ? 0.5 : 1);
      }, 0);
      const latestAt = Math.max(...items.map(b => b.createdAt));
      return { name, items, totalAmt, totalPay, latestAt };
    });
    entries.sort((a, b) => {
      if (a.name.startsWith('—') && !b.name.startsWith('—')) return 1;
      if (!a.name.startsWith('—') && b.name.startsWith('—')) return -1;
      return b.latestAt - a.latestAt;
    });
    return entries;
  }, [bets, caps, rates]);

  const [expandedSet, setExpandedSet] = useState(() => new Set());
  const toggle = (name) => {
    setExpandedSet(prev => {
      const next = new Set(prev);
      if (next.has(name)) next.delete(name); else next.add(name);
      return next;
    });
  };

  return (
    <div className="space-y-2 mb-1">
      {groups.map(g => {
        const isOpen = expandedSet.has(g.name);
        const noName = g.name.startsWith('—');
        // Check if any bet in this group hit
        const anyHit = currentDraw && g.items.some(b => checkWin(b, currentDraw.results));
        return (
          <div key={g.name} className="rounded-xl bg-white border border-gray-200 overflow-hidden">
            <button onClick={() => toggle(g.name)}
              className="w-full px-3 py-2.5 flex items-center gap-2 text-left active:bg-gray-50 transition-colors">
              <div className={'w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 ' + (
                noName ? 'bg-gray-100' : 'bg-red-50'
              )}>
                <UserCircle2 size={16} className={noName ? 'text-gray-400' : 'text-red-600'}/>
              </div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-1.5 flex-wrap">
                  <span className={'font-display text-lg font-semibold min-w-0 break-words ' + (noName ? 'text-gray-500' : 'text-gray-900')} style={{ overflowWrap: 'anywhere' }}>
                    {g.name}
                  </span>
                  {anyHit && (
                    <span className={'text-base font-display px-1.5 py-0.5 rounded ' + (
                      isSeller ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'
                    )}>
                      {isSeller ? '✗ มีถูก' : '✓ ถูก'}
                    </span>
                  )}
                </div>
                <div className="text-base text-gray-400 font-display flex items-center flex-wrap gap-x-2">
                  <span>{g.items.length} รายการ</span>
                  <span>·</span>
                  <span>รับ ฿{fmt(g.totalAmt)}</span>
                  <span>·</span>
                  <span className="text-red-600">จ่าย ฿{fmt(g.totalPay)}</span>
                </div>
              </div>
              <span className="text-gray-400 text-xl flex-shrink-0">{isOpen ? '▴' : '▾'}</span>
            </button>
            {isOpen && (
              <div className="px-3 pb-3 pt-1 space-y-1.5 border-t border-gray-100 bg-gray-50/40">
                {g.items.map(b => {
                  const halfPay = isCombosHalfPay(caps, b.lotteryId, b.drawDate, b.number, b.type);
                  const currentRate = rates[b.type] || b.rate || 90;
                  return (
                    <BetRow key={b.id} bet={{...b, rate: currentRate, halfPay}} draw={currentDraw} isSeller={isSeller}
                      onUpdate={(field, val) => onUpdateBet(b.id, field, val)} onRemove={() => onRemoveBet(b.id)}/>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function BetRow({ bet, draw, isSeller, onUpdate, onRemove }) {
  const win = draw ? checkWin(bet, draw.results) : null;
  const amt = parseFloat(bet.amount) || 0;
  const rate = parseFloat(bet.rate) || 0;
  const halfMult = bet.halfPay ? 0.5 : 1;
  const payout = amt * rate * halfMult;
  const hit = win === true;
  const sellerLose = isSeller && hit;
  const buyerWin = !isSeller && hit;

  return (
    <div className={`rounded-xl p-2.5 ${
      sellerLose ? 'bg-gradient-to-r from-red-500/15 to-rose-500/5 border border-red-300'
      : buyerWin ? 'bg-gradient-to-r from-green-500/15 to-emerald-500/5 border border-green-300'
      : win === false ? 'bg-gray-50 border border-gray-200 opacity-60'
      : 'bg-white border border-gray-200'
    }`}>
      <div className="flex items-center gap-2 mb-2 flex-wrap">
        <div className="font-numeric text-2xl font-bold gold-text leading-none">{bet.number}</div>
        <div className="px-1.5 py-0.5 rounded text-base font-display tracking-wider bg-red-50 text-gray-700 border border-red-200">{typeShort(bet.type)}</div>
        {bet.halfPay && (

        )}
        <span className="text-base font-numeric text-gray-400">×{bet.rate}</span>
        {hit && <span className={`text-base font-display tracking-wider ${sellerLose ? 'text-red-600' : 'text-green-600'}`}>{sellerLose ? '✗ ต้องจ่าย' : '✓ ถูก'}</span>}
        <button onClick={onRemove} className="ml-auto text-gray-400 hover:text-red-500 p-1 flex-shrink-0"><Trash2 size={13}/></button>
      </div>
      {/* อัตราจ่ายย้ายไปหัวแถว (×90) → เหลือ 2 ช่องกว้าง จอเล็ก 320px ตัวเลขไม่ถูกตัด */}

      </div>
    </div>
  );
}

function formatPerCustomerForLine(bets, lottery, drawDate, customerName) {
  const items = bets.filter(b => (b.customer || '— ไม่ระบุ —') === customerName);
  if (items.length === 0) return '';
  const lines = [
    `🎰 Royal 888`,
    `📋 ${lottery.name}`,
    `🗓 งวด ${formatDrawDateLong(drawDate)}`,
    `👤 ${customerName}`,
    '─────────────',
  ];
  const byNum = {};
  items.forEach(b => { if (!byNum[b.number]) byNum[b.number] = []; byNum[b.number].push(b); });
  let total = 0;
  Object.entries(byNum).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([num, group]) => {
    const parts = group.map(b => `${typeShort(b.type)} ${fmt(b.amount)}`).join(' / ');
    lines.push(`${num}  ${parts}`);
    group.forEach(b => { total += parseFloat(b.amount) || 0; });
  });
  lines.push('─────────────');
  lines.push(`💰 รวม ฿${fmt(total)} · ${items.length} รายการ`);
  return lines.join('\n');
}

function getUniqueCustomers(bets) {
  const set = new Set();
  bets.forEach(b => set.add(b.customer || '— ไม่ระบุ —'));
  const list = [...set];
  list.sort((a, b) => {
    if (a.startsWith('—')) return 1;
    if (b.startsWith('—')) return -1;
    return a.localeCompare(b, 'th');
  });
  return list;
}

// ==================== ส่งออกโพย (รูป · ข้อความ · Excel · PDF) ====================
const EXPORT_LIBS = {
  xlsx: { src: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', global: 'XLSX' },
  pdf:  { src: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', global: 'jspdf' },
};
const _libLoads = {};
function loadLib(key) {
  const { src, global } = EXPORT_LIBS[key];
  if (window[global]) return Promise.resolve(window[global]);
  if (!_libLoads[key]) _libLoads[key] = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.async = true; s.crossOrigin = 'anonymous';   // cors → service worker เก็บไว้ใช้ออฟไลน์ได้
    s.onload = () => (window[global] ? resolve(window[global]) : reject(new Error('lib')));
    s.onerror = () => { delete _libLoads[key]; s.remove(); reject(new Error('load')); };
    document.head.appendChild(s);
  });
  return _libLoads[key];
}

const NO_NAME = '— ไม่ระบุ —';
const custOf = (b) => b.customer || NO_NAME;
const sumAmt = (arr) => arr.reduce((s, b) => s + (parseFloat(b.amount) || 0), 0);
const TYPE_ORDER = ['ตรง', 'โต๊ด', 'บน', 'ล่าง'];

// แถวใบโพย: รวมตามเลข · ยอดรวมต่อประเภท (ซื้อซ้ำ 2 ใบ = ยอดรวม 2 ใบ)
function slipRows(bets) {
  const byNum = new Map();
  for (const b of bets) {
    if (!byNum.has(b.number)) byNum.set(b.number, new Map());
    const m = byNum.get(b.number), t = typeShort(b.type);
    const cur = m.get(t) || { amt: 0, half: false };
    cur.amt += parseFloat(b.amount) || 0; cur.half = cur.half || !!b.halfPay;
    m.set(t, cur);
  }
  return [...byNum.entries()]
    .sort((a, b) => b[0].length - a[0].length || a[0].localeCompare(b[0]))
    .map(([num, m]) => {
      const ts = [...m.keys()].sort((a, b) => TYPE_ORDER.indexOf(a) - TYPE_ORDER.indexOf(b));
      return { num, types: ts.join(' · '), amts: ts.map((t) => '฿' + fmt(m.get(t).amt)).join(' · '), half: ts.some((t) => m.get(t).half) };
    });
}

function buildSlip(mode, bets, lottery, drawDate, customer) {
  const now = new Date();
  const head = { lottery: lottery.name, draw: 'งวด ' + formatDrawDateShort(drawDate),
                 time: String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') };
  if (mode === 'customer') {
    const items = bets.filter((b) => custOf(b) === customer);
    return { ...head, kind: 'ใบโพย', whoLabel: 'ลูกค้า', who: customer, count: items.length, total: sumAmt(items), sections: [{ rows: slipRows(items) }], extra: [] };
  }
  const custs = getUniqueCustomers(bets);
  if (mode === 'list') {
    return { ...head, kind: 'โพยทุกคน', whoLabel: 'ลูกค้า', who: custs.length + ' คน', count: bets.length, total: sumAmt(bets), extra: [],
      sections: custs.map((c) => { const it = bets.filter((b) => custOf(b) === c); return { title: c, sub: '฿' + fmt(sumAmt(it)) + ' · ' + it.length + ' รายการ', rows: slipRows(it) }; }) };
  }
  const rows = custs.map((c) => { const it = bets.filter((b) => custOf(b) === c); return { name: c, types: it.length + ' รายการ', amts: '฿' + fmt(sumAmt(it)), v: sumAmt(it) }; })
    .sort((a, b) => b.v - a.v);
  const maxPay = bets.reduce((s, b) => s + (parseFloat(b.amount) || 0) * (parseFloat(b.rate) || 0), 0);
  const sc = computeScenarios(bets);
  const extra = [['จ่ายเพดาน (ถ้าถูกทุกใบ)', '฿' + fmt(maxPay)]];
  if (sc && sc.worst) extra.push(['เสียมากสุด (ถ้าออก ' + scenLabel(sc.worst) + ')',
    (sc.worst.net >= 0 ? '+' : '-') + '฿' + fmt(Math.abs(sc.worst.net))]);
  return { ...head, kind: 'สรุปยอด', whoLabel: 'ลูกค้า', who: custs.length + ' คน', count: bets.length, total: sumAmt(bets), sections: [{ rows, nameRows: true }], extra };
}
