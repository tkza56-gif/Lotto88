function formatPerCustomerForLine(bets, lottery, drawDate, customerName) {
  const items = bets.filter(b => (b.customer || '— ไม่ระบุ —') === customerName);
  if (items.length === 0) return '';
  const lines = [
    `🎰 Royal 888`,
    `📋 ${lottery.name}`,
    `🗓 งวด ${formatDrawDateLong(drawDate)}`,
    `👤 ${customerName}`,
    '─────────────',
  ];
  const byNum = {};
  items.forEach(b => { if (!byNum[b.number]) byNum[b.number] = []; byNum[b.number].push(b); });
  let total = 0;
  Object.entries(byNum).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([num, group]) => {
    const parts = group.map(b => `${typeShort(b.type)} ${fmt(b.amount)}`).join(' / ');
    lines.push(`${num}  ${parts}`);
    group.forEach(b => { total += b.amount; });
  });
  lines.push('─────────────');
  lines.push(`💰 รวม ฿${fmt(total)} · ${items.length} รายการ`);
  return lines.join('\n');
}

function getUniqueCustomers(bets) {
  const set = new Set();
  bets.forEach(b => set.add(b.customer || '— ไม่ระบุ —'));
  const list = [...set];
  list.sort((a, b) => {
    if (a.startsWith('—')) return 1;
    if (b.startsWith('—')) return -1;
    return a.localeCompare(b, 'th');
  });
  return list;
}

function ShareContent({ bets, lottery, drawDate, caps = [], rates = {} }) {

  const enrichedBets = useMemo(() => enrichBetsWithCaps(bets, caps, rates), [bets, caps, rates]);
  const customers = useMemo(() => getUniqueCustomers(enrichedBets), [enrichedBets]);

  const text = useMemo(() => {
    if (mode === 'summary') return formatSummaryForLine(enrichedBets, lottery, drawDate);
    if (mode === 'list') return formatListForLine(enrichedBets, lottery, drawDate);
    if (mode === 'customer' && selectedCustomer) return formatPerCustomerForLine(enrichedBets, lottery, drawDate, selectedCustomer);
    return '';
  }, [enrichedBets, lottery, drawDate, mode, selectedCustomer]);

  const [copied, setCopied] = useState(false);

  const copy = async () => {
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
    }
    setCopied(true);
    toast.show('คัดลอกแล้ว', 'success');
    setTimeout(() => setCopied(false), 2000);

  const shareApi = async () => {

        </button>
        <button onClick={() => { setMode('customer'); if (customers.length > 0 && !selectedCustomer) setSelectedCustomer(customers[0]); }}
          className={'py-2 rounded-lg text-base font-display tracking-wide flex items-center justify-center gap-1 ' + (
            mode === 'customer' ? 'bg-red-100 text-stone-800 border border-red-300' : 'text-stone-400'
          )}>
          <UserCircle2 size={12}/> รายคน
        </button>
      </div>

      <div className="text-base text-stone-400 font-display leading-relaxed">
        {mode === 'summary' && 'รวมรับ/จ่าย กำไรขาดทุน + ความเสี่ยง'}
        {mode === 'list' && 'รายการเลขทุกตัว · แยกตามลูกค้า'}
        {mode === 'customer' && 'แชร์ให้ลูกค้าแต่ละคนแยกใบ'}
      </div>

      {mode === 'customer' && customers.length > 0 && (
        <div className="space-y-1">
          <div className="text-base uppercase tracking-widest text-stone-400 font-display">เลือกลูกค้า</div>
          <div className="grid grid-cols-2 gap-1.5 max-h-32 overflow-y-auto">
            {customers.map(c => {
              const count = enrichedBets.filter(b => (b.customer || '— ไม่ระบุ —') === c).length;
              const isSel = c === selectedCustomer;
              return (

function RiskTab({ lottery, drawDate, bets, allBets, setBets, isSeller, caps, setCaps, rates, cuts, setCuts, forwards, setForwards, forwardSettings, setForwardSettings }) {
  const toast = useToast();
  const [manageCombo, setManageCombo] = useState(null);

  // Enrich bets with halfPay + current rates + forwarding (kept amount, not full intake)
  const enrichedBets = useMemo(() =>
    enrichBetsWithCaps(bets, caps, rates, forwards, forwardSettings),
    [bets, caps, rates, forwards, forwardSettings]
  );

  // Also compute intake-based view for display (showing original amounts pre-forward)
  const enrichedIntakeBets = useMemo(() =>
    bets.map(b => ({
      ...b,
      rate: rates[b.type] || b.rate || 90,
      halfPay: isCombosHalfPay(caps, lottery.id, drawDate, b.number, b.type)
    })),
    [bets, caps, lottery.id, drawDate, rates]
  );

  // Forwards summary for "เลขส่งต่อ" section
  const forwardsSummary = useMemo(() =>
    computeForwardsSummary(enrichedIntakeBets, forwards, forwardSettings),
    [enrichedIntakeBets, forwards, forwardSettings]
  );

  const scenarios = useMemo(() => computeScenarios(enrichedBets), [enrichedBets]);
  const totalIntake = scenarios.intake;
  const totalMaxPayout = enrichedBets.reduce((s, b) =>
    s + (parseFloat(b.amount) || 0) * (parseFloat(b.rate) || 0) * (b.halfPay ? 0.5 : 1), 0);

  const perCombo = useMemo(() => {
    const map = {};
    enrichedBets.forEach(b => {
      const key = b.number + '|' + b.type;
      if (!map[key]) map[key] = {
        number: b.number, type: b.type, intake: 0, payout: 0, ids: [], halfPay: b.halfPay
      };
      const amt = parseFloat(b.amount) || 0;
      const rate = parseFloat(b.rate) || 0;
      const halfMult = b.halfPay ? 0.5 : 1;
      map[key].intake += amt;
      map[key].payout += amt * rate * halfMult;
      map[key].ids.push(b.id);
    });
    return Object.values(map).sort((a, b) => b.payout - a.payout);
  }, [enrichedBets]);

  const [cutThreshold, setCutThreshold] = useState('');
  const [simNumber, setSimNumber] = useState('');
  const [simNumber2low, setSimNumber2low] = useState('');

  // Get current draw's cuts only
  const currentCuts = useMemo(() =>
    cuts.filter(c => c.lotteryId === lottery.id && c.drawDate === drawDate),
    [cuts, lottery.id, drawDate]
  );

  // Helper: add a cut log entry
  const logCut = (kind, items) => {
    // items: [{ number, type, amount, count }]
    if (!items || items.length === 0) return;
    setCuts(prev => [...prev, {
      id: uid(),
      lotteryId: lottery.id, drawDate,
      kind, // 'cut-threshold' | 'cut-combo' | 'reduce'
      items,
      createdAt: Date.now()
    }]);
  };

  const cutAboveThreshold = async () => {
    const th = parseFloat(cutThreshold);
    if (!th || th <= 0) { toast.show('ใส่ยอดให้ถูกต้อง', 'info'); return; }
    const idsToCut = new Set();
    const cutItems = [];
    perCombo.forEach(c => {
      if (c.payout > th) {
        c.ids.forEach(id => idsToCut.add(id));
        cutItems.push({ number: c.number, type: c.type, amount: c.intake, count: c.ids.length });
      }
    });
    if (idsToCut.size === 0) { toast.show('ไม่มีโพยที่จ่ายเกิน ฿' + fmt(th), 'info'); return; }
    const ok = await toast.askConfirm('ตัดโพย ' + idsToCut.size + ' รายการที่จ่ายเกิน ฿' + fmt(th) + ' ?', { danger: true, confirmLabel: 'ตัด' });
    if (!ok) return;
    setBets(prev => prev.filter(b => !idsToCut.has(b.id)));
    logCut('cut-threshold', cutItems);
    setCutThreshold('');
    toast.show('ตัด ' + idsToCut.size + ' รายการ', 'success');
  };

  const cutOneCombo = async (combo) => {
    const idsToCut = new Set(combo.ids);
    const ok = await toast.askConfirm('ตัดโพย "' + combo.number + ' ' + typeShort(combo.type) + '"\n(' + combo.ids.length + ' รายการ)', { danger: true, confirmLabel: 'ตัด' });
    if (!ok) return;
    setBets(prev => prev.filter(b => !idsToCut.has(b.id)));
    setCaps(prev => prev.filter(c => !(c.lotteryId === lottery.id && c.drawDate === drawDate && c.number === combo.number && c.type === combo.type)));
    logCut('cut-combo', [{ number: combo.number, type: combo.type, amount: combo.intake, count: combo.ids.length }]);
    toast.show('ตัดเลข ' + combo.number + ' สำเร็จ', 'success');
  };

  const toggleHalfPay = (combo) => {
    setCaps(prev => {
      const exists = prev.find(c =>
        c.lotteryId === lottery.id && c.drawDate === drawDate &&
        c.number === combo.number && c.type === combo.type
      );
      if (exists) {
        return prev.filter(c => c !== exists);
      } else {
        return [...prev, {
          id: uid(),
          lotteryId: lottery.id, drawDate,
          number: combo.number, type: combo.type,
          halfPay: true,
          createdAt: Date.now()
        }];
      }
    });
  };

  const reduceCombo = (combo, factor) => {
    if (factor <= 0 || factor > 1) return;
    const idsInCombo = new Set(combo.ids);
    const reducedAmt = combo.intake * (1 - factor);
    setBets(prev => prev.map(b => {
      if (!idsInCombo.has(b.id)) return b;
      const newAmt = (parseFloat(b.amount) || 0) * factor;
      return { ...b, amount: Math.round(newAmt * 100) / 100 };
    }));
    logCut('reduce', [{ number: combo.number, type: combo.type, amount: reducedAmt, count: combo.ids.length, keepPercent: Math.round(factor * 100) }]);
  };

  const removeCutLog = (id) => {
    setCuts(prev => prev.filter(c => c.id !== id));
  };

  const clearAllCuts = async () => {
    if (currentCuts.length === 0) return;
    const ok = await toast.askConfirm('ลบบันทึกการตัดทั้งหมด ?\n(' + currentCuts.length + ' รายการ)\n\n* ไม่ได้คืนโพย แค่ลบบันทึก', { danger: true, confirmLabel: 'ลบบันทึก' });

    setCuts(prev => prev.filter(c => !(c.lotteryId === lottery.id && c.drawDate === drawDate)));
    toast.show('ลบบันทึกแล้ว', 'success');

  const simResult = useMemo(() => {
    // Need at least one of: 3-digit upper OR 2-digit lower
    const has3 = simNumber.length === 3;
    const has2low = simNumber2low.length === 2;
    if (!has3 && !has2low) return null;

    const r2low = has2low ? simNumber2low : null;
    const payout3 = r3 ? computePayoutFor3D(r3, enrichedBets) : { total: 0, breakdown: { direct: 0, two_up: 0, toad: 0 } };
    const payout2low = r2low ? computePayoutFor2DLow(r2low, enrichedBets) : 0;
    const totalPay = payout3.total + payout2low;
    return {
      num3: r3,
      num2up: r3 ? r3.slice(-2) : null,
      num2low: r2low,
      payout: totalPay,
      breakdown: payout3.breakdown,
      low: payout2low,
      net: totalIntake - totalPay
    };
  }, [simNumber, simNumber2low, enrichedBets, totalIntake]);

  if (bets.length === 0) {
    return (
      <div className="glass rounded-2xl p-8 text-center slide-in">
        <div className="text-gray-400 text-base font-display tracking-wider">— ยังไม่มีโพยในงวดนี้ —</div>
        <div className="text-gray-300 text-base mt-2">จดโพยที่แท็บ "จดโพย" ก่อน</div>
      </div>
    );
  }

  const best = scenarios.best;
  const worst = scenarios.worst;

  return (
    <div className="space-y-4 slide-in">
      {/* Summary */}
      <div className="glass-strong rounded-2xl p-4">
        <div className="flex items-center gap-2 mb-3">
          <div className="w-1 h-4 bg-gradient-to-b from-red-400 to-red-600 rounded-full"/>
          <h2 className="font-display text-xl font-bold tracking-wide text-stone-900">วิเคราะห์ความเสี่ยง</h2>
          {caps.filter(c => c.lotteryId === lottery.id && c.drawDate === drawDate).length > 0 && (
            <div className="ml-auto px-2 py-0.5 rounded-full text-base font-display bg-orange-100 text-orange-700 border border-orange-300">
              ½ อั้น {caps.filter(c => c.lotteryId === lottery.id && c.drawDate === drawDate).length}
            </div>
          )}
        </div>

        <div className="grid grid-cols-2 gap-2 mb-3">
          <div className="num-tile rounded-xl p-3">
            <div className="text-base uppercase tracking-wider text-red-700 font-display font-semibold">รับเข้ารวม</div>
            <div className="font-numeric text-2xl font-bold gold-text mt-1">฿{fmt(totalIntake)}</div>
          </div>
          <div className="risk-tile rounded-xl p-3">
            <div className="text-base uppercase tracking-wider text-red-700 font-display font-semibold">จ่ายเพดาน</div>
            <div className="font-numeric text-2xl font-bold text-red-600 mt-1">฿{fmt(totalMaxPayout)}</div>

        </div>

        <div className="space-y-2">

          <div className="w-1 h-4 bg-gradient-to-b from-red-400 to-red-600 rounded-full"/>
          <h2 className="font-display text-xl font-bold tracking-wide text-stone-900">สรุปทุกโพย</h2>
          <span className="text-base text-gray-400 font-display">({perCombo.length})</span>
        </div>
        <div className="text-base text-gray-400 font-display mb-2 leading-relaxed">
          แต่ละแถวมี <span className="text-orange-700">½</span> อั้นครึ่ง · <span className="text-red-600">📉</span> ลดยอด · <span className="text-red-700">✂️</span> ตัดทั้งหมด
        </div>
        <div className="space-y-1.5 max-h-96 overflow-y-auto">
          {perCombo.map((c, i) => (
            <div key={i} className={`rounded-lg px-2.5 py-2 border ${
              c.halfPay
                ? 'bg-orange-50 border-orange-300'
                : 'bg-white border-gray-200'
            }`}>
              <div className="flex items-center gap-1.5 mb-1.5 flex-wrap">
                <div className="font-numeric text-xl font-bold gold-text leading-none">{c.number}</div>
                <div className="px-1.5 py-0.5 rounded text-base font-display bg-red-50 text-gray-700 border border-red-200">{typeShort(c.type)}</div>
                {c.halfPay && (
                  <div className="px-1.5 py-0.5 rounded text-base font-display bg-orange-100 text-orange-700 border border-orange-400 font-bold">½ อั้น</div>
                )}
                <div className="ml-auto flex items-center gap-1">
                  <button onClick={() => toggleHalfPay(c)}
                    className={`w-7 h-7 rounded-lg text-base font-bold font-display flex items-center justify-center transition-all ${
                      c.halfPay
                        ? 'bg-orange-200 text-orange-800 border border-orange-400'
                        : 'text-orange-400 hover:bg-orange-100 border border-transparent'
                    }`}
                    title={c.halfPay ? 'ยกเลิกอั้นครึ่ง' : 'อั้นจ่ายครึ่ง'}>
                    ½
                  </button>
                  <button onClick={() => setManageCombo(c)}
                    className="w-7 h-7 rounded-lg flex items-center justify-center text-red-500 hover:bg-red-500/15"
                    title="ลดยอด">
                    <TrendingDown size={13}/>
                  </button>
                  <button onClick={() => cutOneCombo(c)}
                    className="w-7 h-7 rounded-lg flex items-center justify-center text-red-500 hover:text-red-500 hover:bg-red-50"
                    title="ตัดทั้งหมด">
                    <Scissors size={13}/>
                  </button>
                </div>
              </div>
              <div className="grid grid-cols-2 gap-2 text-right text-base">
                <div>
                  <span className="text-base uppercase text-red-300 font-display mr-1">รับ</span>
                  <span className="font-numeric font-semibold text-gray-900">฿{fmt(c.intake)}</span>
                </div>
                <div>
                  <span className="text-base uppercase text-red-500 font-display mr-1">จ่าย</span>
                  <span className="font-numeric font-semibold text-red-600">฿{fmt(c.payout)}</span>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Sim */}
      <div className="glass rounded-2xl p-4">
        <div className="flex items-center gap-2 mb-3">
          <div className="w-1.5 h-5 rounded-full" style={{ background: 'linear-gradient(180deg, #fb923c 0%, #ea580c 100%)' }}/>
          <h2 className="font-display text-xl font-bold tracking-wide text-stone-900">ลองสมมุติ</h2>
        </div>
        <div className="text-base text-stone-600 font-display mb-3 leading-relaxed">
          ใส่เลขที่คิดว่าจะออก เพื่อดูว่าจะจ่ายเท่าไหร่ — กรอกได้ทั้ง 2 ช่องอิสระ
        </div>

        <div className="grid grid-cols-2 gap-2 mb-3">
          {/* 3 ตัวบน */}
          <div className="num-tile rounded-xl p-3">
            <div className="text-base uppercase tracking-wider text-red-700 font-display font-semibold mb-1">3 ตัวบน</div>
            <input type="tel" inputMode="numeric" value={simNumber}
              onChange={e => setSimNumber(e.target.value.replace(/\D/g, '').slice(0, 3))} placeholder="000"
              className="w-full bg-transparent outline-none font-numeric text-3xl font-black gold-text placeholder-red-200 tracking-[0.2em] text-center"/>
            {simNumber.length === 3 && (
              <div className="text-base text-stone-500 font-display mt-1 text-center">
                2 บน = <span className="font-numeric font-bold text-red-700">{simNumber.slice(-2)}</span>
              </div>
            )}
          </div>
          {/* 2 ตัวล่าง */}
          <div className="rounded-xl p-3 bg-gradient-to-br from-green-50 to-white border border-green-200">
            <div className="text-base uppercase tracking-wider text-green-700 font-display font-semibold mb-1">2 ตัวล่าง</div>
            <input type="tel" inputMode="numeric" value={simNumber2low}
              onChange={e => setSimNumber2low(e.target.value.replace(/\D/g, '').slice(0, 2))} placeholder="00"
              className="w-full bg-transparent outline-none font-numeric text-3xl font-black green-text placeholder-green-200 tracking-[0.2em] text-center"/>
            <div className="text-base text-stone-400 font-display mt-1 text-center">เลขอิสระ ไม่เกี่ยว 3 บน</div>
          </div>
        </div>

        {simResult ? (
          <div className="space-y-2">
            {simResult.num3 && (
              <>
                <SimRow label="3 ตัวบน (ตรง)" value={simResult.breakdown.direct}/>
                <SimRow label="3 ตัวโต๊ด" value={simResult.breakdown.toad}/>
                <SimRow label="2 ตัวบน" value={simResult.breakdown.two_up}/>
              </>
            )}
            {simResult.num2low && (
              <SimRow label="2 ตัวล่าง" value={simResult.low}/>
            )}
            <div className="border-t border-stone-200 pt-2 grid grid-cols-2 gap-2">
              <div className="bg-red-50 rounded-lg p-2.5 border border-red-200">
                <div className="text-base uppercase text-red-700 font-display font-semibold tracking-wider">จ่ายรวม</div>
                <div className="font-numeric text-xl font-bold text-red-700 mt-0.5">฿{fmt(simResult.payout)}</div>
              </div>
              <div className={`rounded-lg p-2.5 border ${simResult.net >= 0 ? 'bg-green-50 border-green-300' : 'bg-red-50 border-red-300'}`}>
                <div className={`text-base uppercase font-display font-semibold tracking-wider ${simResult.net >= 0 ? 'text-green-700' : 'text-red-700'}`}>กำไร/ขาดทุน</div>
                <div className={`font-numeric text-xl font-bold mt-0.5 ${simResult.net >= 0 ? 'text-green-700' : 'text-red-700'}`}>{simResult.net >= 0 ? '+' : '-'}฿{fmt(Math.abs(simResult.net))}</div>
              </div>
            </div>
          </div>
        ) : (
          <div className="text-center py-4 bg-stone-50 rounded-xl border border-dashed border-stone-200">
            <div className="text-stone-400 text-base font-display">ใส่เลขในช่องด้านบนเพื่อดูผล</div>
          </div>
        )}
      </div>

      {/* Manage Reduce Sheet */}
      {manageCombo && (
        <BottomSheet onClose={() => setManageCombo(null)} title={'ลดยอด ' + manageCombo.number + ' ' + typeShort(manageCombo.type)}>
          <ReduceSheet combo={manageCombo}
            onReduce={(factor) => { reduceCombo(manageCombo, factor); setManageCombo(null); }}
            onClose={() => setManageCombo(null)}/>
        </BottomSheet>
      )}
    </div>
  );
}

function ReduceSheet({ combo, onReduce, onClose }) {
  const toast = useToast();
  const [custom, setCustom] = useState('');
  const currentIntake = combo.intake;
  const currentPayout = combo.payout;

  const applyPreset = async (keepPercent) => {
    const factor = keepPercent / 100;
    const ok = await toast.askConfirm('ลดยอดเหลือ ' + keepPercent + '%\n฿' + fmt(currentIntake) + '  →  ฿' + fmt(currentIntake * factor), { confirmLabel: 'ลด' });
    if (!ok) return;
    onReduce(factor);
    toast.show('ลดยอดสำเร็จ', 'success');
  };

  const applyCustom = async () => {
    const targetIntake = parseFloat(custom);
    if (isNaN(targetIntake) || targetIntake <= 0) { toast.show('ใส่ยอดให้ถูกต้อง', 'error'); return; }
    if (targetIntake >= currentIntake) { toast.show('ยอดใหม่ต้องน้อยกว่ายอดเดิม', 'error'); return; }
    const factor = targetIntake / currentIntake;
    const ok = await toast.askConfirm('ลดยอดเหลือ ฿' + fmt(targetIntake), { confirmLabel: 'ลด' });
    if (!ok) return;
    onReduce(factor);
    toast.show('ลดยอดสำเร็จ', 'success');
  };

  return (
    <div className="space-y-3">
      <div className="num-tile rounded-xl p-3">
        <div className="text-base uppercase tracking-wider text-red-700 font-display font-semibold mb-1">ยอดปัจจุบัน</div>
        <div className="grid grid-cols-2 gap-2 text-right">
          <div>
            <div className="text-base uppercase text-red-300 font-display">รับ</div>
            <div className="font-numeric font-bold text-gray-900 text-xl">฿{fmt(currentIntake)}</div>
          </div>
          <div>
            <div className="text-base uppercase text-red-500 font-display">จ่ายเพดาน</div>
            <div className="font-numeric font-bold text-red-600 text-xl">฿{fmt(currentPayout)}</div>
          </div>
        </div>
      </div>

      <div>
        <div className="text-base uppercase tracking-[0.25em] text-red-500 font-display mb-2">ลดเหลือกี่ %</div>
        <div className="grid grid-cols-3 gap-2">
          {[75, 50, 25].map(p => (
            <button key={p} onClick={() => applyPreset(p)}
              className="num-tile rounded-xl p-3 active:scale-95">
              <div className="font-numeric text-2xl font-bold gold-text">{p}%</div>
              <div className="text-base text-gray-500 font-display mt-1">
                ฿{fmt(currentIntake * p / 100)}
              </div>
            </button>
          ))}
        </div>
      </div>

      <div>
        <div className="text-base uppercase tracking-[0.25em] text-red-500 font-display mb-2">หรือกำหนดยอดเอง</div>
        <div className="flex items-center gap-2">
          <div className="flex-1 min-w-0 bg-white rounded-lg px-3 py-2 border border-gray-200 focus-within:border-red-300 flex items-baseline gap-1">
            <span className="text-gray-400 text-lg flex-shrink-0">฿</span>
            <input type="number" inputMode="decimal" value={custom}
              onChange={e => setCustom(e.target.value)} placeholder="ลดเหลือ"
              className="w-full min-w-0 bg-transparent outline-none font-numeric text-xl font-bold text-gray-900 placeholder-yellow-100/20"/>
          </div>
          <button onClick={applyCustom} disabled={!custom}
            className="py-2 px-4 rounded-lg bg-red-100 border border-red-400 text-red-600 font-display text-lg disabled:opacity-40">
            ลด
          </button>
        </div>
      </div>

      <button onClick={onClose}
        className="w-full py-2.5 rounded-xl bg-gray-100 text-gray-600 font-display text-lg tracking-wider border border-gray-300">
        ยกเลิก
      </button>
    </div>
  );
}

function HalfPaySection({ lottery, drawDate, caps, setCaps, rates, toast }) {
  const [expanded, setExpanded] = useState(true);
  const [num, setNum] = useState('');
  const [pickedTypes, setPickedTypes] = useState({});
  const [reverse3, setReverse3] = useState(false);
  const [reverse2, setReverse2] = useState(false);

  // Caps for this lottery+drawDate only
  const currentCaps = useMemo(() =>
    caps.filter(c => c.lotteryId === lottery.id && c.drawDate === drawDate && c.halfPay),
    [caps, lottery.id, drawDate]
  );

  const t3 = lottery.types.includes('3ตัว') ? '3ตัว' : '3บน';
  const t3Label = lottery.types.includes('3ตัว') ? '3 ตัว' : '3 ตัวบน';
  const has3 = pickedTypes[t3] || pickedTypes['โต๊ด'];
  const has2 = pickedTypes['2บน'] || pickedTypes['2ล่าง'];
  const digitsNeeded = has3 ? 3 : has2 ? 2 : null;

  const toggleType = (key) => {
    const isG3 = key === t3 || key === 'โต๊ด';
    setPickedTypes(prev => {
      if ((isG3 && (prev['2บน'] || prev['2ล่าง'])) || (!isG3 && (prev[t3] || prev['โต๊ด']))) {
        // Switching groups - reset
        setNum('');
        if (isG3) setReverse2(false); else setReverse3(false);
        return { [key]: true };
      }
      return { ...prev, [key]: !prev[key] };
    });
  };

  const onReverse3 = () => {
    if (has2) {
      setPickedTypes({});
      setReverse2(false);
      setReverse3(true);
      setNum('');
    } else setReverse3(r => !r);
  };

  const onReverse2 = () => {
    if (has3) {
      setPickedTypes({});
      setReverse3(false);
      setReverse2(true);
      setNum('');
    } else setReverse2(r => !r);
  };

  // Compute what numbers will be generated (preview)
  const previewNumbers = useMemo(() => {
    if (!num || (digitsNeeded && num.length !== digitsNeeded)) return [];
    const out = [num];
    if (num.length === 3 && reverse3) {
      const perms = getToadVariations(num);
      perms.forEach(p => { if (!out.includes(p)) out.push(p); });
    } else if (num.length === 2 && reverse2) {
      const rev = reverseDigits(num);
      if (rev !== num) out.push(rev);
    }
    return out;
  }, [num, reverse3, reverse2, digitsNeeded]);

  const addCap = () => {
    if (!num || (digitsNeeded && num.length !== digitsNeeded)) {
      toast.show('ใส่เลขให้ครบ ' + (digitsNeeded || '?') + ' หลัก', 'info');
      return;
    }
    const activeTypes = Object.keys(pickedTypes).filter(k => pickedTypes[k]);
    if (activeTypes.length === 0) {
      toast.show('เลือกประเภทอย่างน้อย 1', 'info');
      return;
    }
    let added = 0, skipped = 0;
    const newCaps = [...caps];
    for (const n of previewNumbers) {
      for (const type of activeTypes) {
        // For โต๊ด, only the original number (toad covers all perms)
        if (type === 'โต๊ด' && n !== num) continue;
        const exists = newCaps.some(c =>
          c.lotteryId === lottery.id && c.drawDate === drawDate &&
          c.number === n && c.type === type && c.halfPay
        );
        if (exists) { skipped++; continue; }
        newCaps.push({
          id: uid(),
          lotteryId: lottery.id, drawDate,
          number: n, type,
          halfPay: true,
          createdAt: Date.now() + Math.random(),
        });
        added++;
      }
    }
    setCaps(newCaps);
    setNum('');
    if (added > 0) toast.show('อั้น ' + added + ' รายการ' + (skipped > 0 ? ' (ซ้ำ ' + skipped + ')' : ''), 'success');
    else if (skipped > 0) toast.show('เลขนี้อั้นไว้แล้ว', 'info');
  };

  const removeCap = (cap) => {
    setCaps(prev => prev.filter(c => c.id !== cap.id));
  };

  const removeAll = async () => {
    if (currentCaps.length === 0) return;
    const ok = await toast.askConfirm('ยกเลิกอั้นทั้งหมด ?\n(' + currentCaps.length + ' รายการ)', { danger: true, confirmLabel: 'ลบทั้งหมด' });
    if (!ok) return;
    setCaps(prev => prev.filter(c => !(c.lotteryId === lottery.id && c.drawDate === drawDate && c.halfPay)));
    toast.show('ยกเลิกอั้นทั้งหมดแล้ว', 'success');
  };

  // Group current caps by type for display
  const capsByType = useMemo(() => {
    const map = { '3บน': [], '3ตัว': [], 'โต๊ด': [], '2บน': [], '2ล่าง': [] };
    currentCaps.forEach(c => {
      if (!map[c.type]) map[c.type] = [];
      map[c.type].push(c);
    });
    return Object.entries(map)
      .filter(([_, items]) => items.length > 0)
      .map(([type, items]) => ({
        type,
        items: items.sort((a, b) => a.number.localeCompare(b.number))
      }));
  }, [currentCaps]);

  return (
    <div className="glass rounded-2xl p-4">
      <button onClick={() => setExpanded(e => !e)} className="w-full flex items-center gap-2 mb-3 text-left">
        <div className="w-1.5 h-5 rounded-full" style={{ background: 'linear-gradient(180deg, #ea580c 0%, #c2410c 100%)' }}/>
        <h2 className="font-display text-xl font-bold tracking-wide text-orange-900">เลขอั้นจ่ายครึ่ง</h2>
        <span className="text-base font-display font-semibold bg-orange-100 text-orange-800 border border-orange-300 rounded-full px-2.5 py-0.5">
          {currentCaps.length}
        </span>
        <span className="ml-auto text-orange-700 text-xl font-bold">{expanded ? '▴' : '▾'}</span>
      </button>

      {expanded && (
        <div className="space-y-3">
          <div className="text-base text-stone-600 font-display leading-relaxed">
            เลขที่อั้นไว้ — ถ้าออกตรง ระบบจะคำนวณจ่ายแค่<strong className="text-orange-700"> ครึ่งของอัตราปกติ</strong>
          </div>

          {/* Input section */}
          <div className="bg-orange-50 border-2 border-orange-200 rounded-2xl p-3 space-y-3">
            {/* Type chips */}
            <div>
              <div className="text-base uppercase tracking-[0.2em] text-stone-700 font-display font-semibold mb-2">ประเภท</div>
              <div className="grid grid-cols-2 gap-1.5">
                {[
                  { k: t3, label: t3Label, color: 'red' },
                  { k: 'โต๊ด', label: 'โต๊ด', color: 'red' },
                  { k: '2บน', label: '2 ตัวบน', color: 'green' },
                  { k: '2ล่าง', label: '2 ตัวล่าง', color: 'green' },
                ].map(opt => {
                  const isG3 = opt.k === t3 || opt.k === 'โต๊ด';
                  const dimmed = isG3 ? has2 : has3;
                  const active = !!pickedTypes[opt.k];
                  return (
                    <button key={opt.k} onClick={() => toggleType(opt.k)}
                      className={'rounded-xl px-3 py-2.5 text-lg font-display font-semibold border-2 transition-all active:scale-95 ' + (
                        active
                          ? (opt.color === 'red' ? 'bg-red-600 text-white border-red-700 shadow-md shadow-red-200' : 'bg-green-600 text-white border-green-700 shadow-md shadow-green-200')
                          : dimmed
                            ? 'bg-gray-50 text-gray-300 border-gray-200'
                            : (opt.color === 'red' ? 'bg-white text-red-700 border-red-200' : 'bg-white text-green-700 border-green-200')
                      )}>
                      {active && <Check size={12} strokeWidth={3} className="inline mr-1"/>}{opt.label}
                    </button>
                  );
                })}
              </div>
              {/* Reverse options */}
              <div className="grid grid-cols-2 gap-1.5 mt-1.5">
                <button onClick={onReverse3}
                  className={'rounded-xl px-3 py-2 text-base font-display font-semibold border-2 transition-all active:scale-95 flex items-center justify-center gap-1 ' + (
                    reverse3
                      ? 'bg-red-100 text-red-800 border-red-400'
                      : has2
                        ? 'bg-gray-50 text-gray-300 border-gray-200'
                        : 'bg-white text-red-600 border-red-200'
                  )}>
                  <Shuffle size={11}/>{reverse3 && '✓ '}กลับ 3 ตัว
                </button>
                <button onClick={onReverse2}
                  className={'rounded-xl px-3 py-2 text-base font-display font-semibold border-2 transition-all active:scale-95 flex items-center justify-center gap-1 ' + (
                    reverse2
                      ? 'bg-green-100 text-green-800 border-green-400'
                      : has3
                        ? 'bg-gray-50 text-gray-300 border-gray-200'
                        : 'bg-white text-green-600 border-green-200'
                  )}>
                  <Shuffle size={11}/>{reverse2 && '✓ '}กลับ 2 ตัว
                </button>
              </div>
            </div>

            {/* Number input */}
            <div>
              <div className="text-base uppercase tracking-[0.2em] text-stone-700 font-display font-semibold mb-2">
                ระบุตัวเลข {digitsNeeded ? digitsNeeded + ' หลัก' : ''}
              </div>
              <div className="flex items-center gap-2">
                <input type="tel" inputMode="numeric" value={num}
                  onChange={e => setNum(e.target.value.replace(/\D/g, '').slice(0, digitsNeeded || 3))}
                  placeholder={digitsNeeded ? '0'.repeat(digitsNeeded) : 'เลือกประเภทก่อน'}
                  disabled={!digitsNeeded}
                  className="flex-1 min-w-0 bg-white rounded-xl px-3 py-3 outline-none font-numeric text-3xl font-black text-orange-900 text-center tracking-[0.2em] border-2 border-orange-300 placeholder-orange-200 disabled:bg-gray-100 disabled:placeholder-gray-300"/>
                <button onClick={addCap} disabled={!num || (digitsNeeded && num.length !== digitsNeeded)}
                  className="flex-shrink-0 py-3 px-5 rounded-xl bg-orange-600 text-white font-display text-lg font-bold border-2 border-orange-700 active:scale-95 disabled:opacity-40 flex items-center gap-1"
                  style={{ boxShadow: '0 4px 8px rgba(234,88,12,0.3)' }}>
                  <Plus size={16} strokeWidth={3}/> อั้น
                </button>
              </div>

              {/* Preview when reverse is on */}
              {previewNumbers.length > 1 && (
                <div className="mt-2 bg-white rounded-lg px-2.5 py-2 border border-orange-200">
                  <div className="text-base uppercase tracking-wider text-orange-700 font-display font-semibold mb-1">จะอั้น {previewNumbers.length} เลข</div>
                  <div className="flex flex-wrap gap-1">
                    {previewNumbers.map(n => (
                      <span key={n} className="bg-orange-50 border border-orange-200 rounded px-2 py-0.5 font-numeric text-lg font-bold text-orange-800">{n}</span>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* Current caps list — grouped by type */}
          {capsByType.length > 0 ? (
            <div className="space-y-2">
              <div className="flex items-center justify-between">
                <div className="text-lg font-display font-bold text-orange-900">
                  เลขที่อั้นไว้ <span className="text-base font-semibold text-stone-500">({currentCaps.length})</span>
                </div>
                <button onClick={removeAll} className="text-base text-red-600 font-display font-semibold flex items-center gap-1 active:scale-95 px-2 py-1 rounded-lg bg-red-50">
                  <Trash2 size={12}/> ลบทั้งหมด
                </button>
              </div>
              {capsByType.map(group => (
                <div key={group.type} className="bg-white rounded-xl border border-orange-200 p-2.5">
                  <div className="text-base uppercase tracking-wider text-orange-700 font-display font-bold mb-2 flex items-center gap-1.5">
                    <div className="w-1 h-3 rounded-full bg-orange-500"/>
                    {typeFullName(group.type)}

                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          ) : (
            <div className="text-center py-6 bg-stone-50 rounded-xl border border-dashed border-stone-200">

          )}
        </div>
      )}
    </div>
  );
}

function ForwardingSection({ lottery, drawDate, forwards, setForwards, forwardSettings, setForwardSettings, forwardsSummary, intakeBets, toast }) {
  const [expanded, setExpanded] = useState(false);

  const [def2D, setDef2D] = useState(forwardSettings?.defaultMaxKeep2D ?? '');
  const [overrideNum, setOverrideNum] = useState('');
  const [overrideType, setOverrideType] = useState(null);
  const [overrideMax, setOverrideMax] = useState('');
  const [copied, setCopied] = useState(false);

  // Sync settings inputs when forwardSettings changes
  useEffect(() => {
    setDef3D(forwardSettings?.defaultMaxKeep3D ?? '');
    setDef2D(forwardSettings?.defaultMaxKeep2D ?? '');
  }, [forwardSettings?.defaultMaxKeep3D, forwardSettings?.defaultMaxKeep2D]);

  // Filter forwards to current lottery/drawDate
  const currentOverrides = useMemo(() =>
    forwards.filter(f => f.lotteryId === lottery.id && f.drawDate === drawDate),
    [forwards, lottery.id, drawDate]
  );

  // Group intakeBets by number+type for combo selector
  const availableCombos = useMemo(() => {
    const map = {};
    intakeBets.forEach(b => {
      const key = b.number + '|' + b.type;
      if (!map[key]) map[key] = { number: b.number, type: b.type, intake: 0 };
      map[key].intake += parseFloat(b.amount) || 0;
    });
    return Object.values(map).sort((a, b) => {
      const ta = ({ '3บน': 1, '3ตัว': 2, 'โต๊ด': 3, '2บน': 4, '2ล่าง': 5 })[a.type] || 99;
      const tb = ({ '3บน': 1, '3ตัว': 2, 'โต๊ด': 3, '2บน': 4, '2ล่าง': 5 })[b.type] || 99;
      if (ta !== tb) return ta - tb;
      return a.number.localeCompare(b.number);
    });
  }, [intakeBets]);

  const totalForwarded = forwardsSummary.reduce((s, f) => s + f.forwarded, 0);
  const totalKept = forwardsSummary.reduce((s, f) => s + f.kept, 0);

function CutsSection({ lottery, drawDate, cuts, onRemove, onClearAll, toast }) {
  const [expanded, setExpanded] = useState(true);
  const [copied, setCopied] = useState(false);

  // Aggregate by type+number for display
  const grouped = useMemo(() => {
    const map = {};
    cuts.forEach(c => {
      c.items.forEach(it => {
        const key = it.type + '|' + it.number;
        if (!map[key]) {
          map[key] = {
            type: it.type, number: it.number,
            amount: 0, count: 0,
            kinds: [], cutIds: [],
            reduceLatest: null,
            capToLatest: null,
          };
        }
        map[key].amount += it.amount || 0;
        map[key].count += it.count || 0;
        map[key].kinds.push(c.kind);
        map[key].cutIds.push(c.id);
        if (c.kind === 'reduce' && it.keepPercent !== undefined) {
          map[key].reduceLatest = it.keepPercent;
        }
        if (c.kind === 'cap-intake' && it.capTo !== undefined) {
          map[key].capToLatest = it.capTo;
        }
      });
    });
    // Sort by type order, then number
    const typeOrder = { '3บน': 1, '3ตัว': 2, 'โต๊ด': 3, '2บน': 4, '2ล่าง': 5 };
    return Object.values(map).sort((a, b) => {
      const ta = typeOrder[a.type] || 99;
      const tb = typeOrder[b.type] || 99;
      if (ta !== tb) return ta - tb;
      return a.number.localeCompare(b.number);
    });
  }, [cuts]);

  // Group display by type
  const byType = useMemo(() => {

async function fetchWithTimeout(url, ms = 15000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    return r;
  } finally {
    clearTimeout(timer);
  }
}

async function fetchGovLatest() {

  const j = await r.json();
  if (j.status !== 'success') throw new Error('API ตอบกลับเป็น ' + j.status);

}

function parseGovResult(apiResponse) {
  const prizeFirst = apiResponse.prizes.find(p => p.id === 'prizeFirst');
  const backTwo = (apiResponse.runningNumbers || []).find(r => r.id === 'runningNumberBackTwo');
  if (!prizeFirst || !prizeFirst.number[0]) throw new Error('ไม่พบรางวัลที่ 1');
  if (!backTwo || !backTwo.number[0]) throw new Error('ไม่พบเลขท้าย 2 ตัว');
  const sixDigit = prizeFirst.number[0];
  return {
    date: apiResponse.date,
    fullPrizeFirst: sixDigit,
    '3บน': sixDigit.slice(-3),
    '2บน': sixDigit.slice(-2),
    '2ล่าง': backTwo.number[0],
  };
}

// Parse Thai date string "1 มิถุนายน 2569" -> "2026-06-01" (Gregorian)
function parseThaiDate(thaiStr) {
  if (!thaiStr) return null;
  const months = {
    'มกราคม': 1, 'กุมภาพันธ์': 2, 'มีนาคม': 3, 'เมษายน': 4,
    'พฤษภาคม': 5, 'มิถุนายน': 6, 'กรกฎาคม': 7, 'สิงหาคม': 8,
    'กันยายน': 9, 'ตุลาคม': 10, 'พฤศจิกายน': 11, 'ธันวาคม': 12,
  };
  const m = thaiStr.match(/(\d{1,2})\s+([ก-๙]+)\s+(\d{4})/);
  if (!m) return null;
  const day = parseInt(m[1]);
  const month = months[m[2]];
  const yearBE = parseInt(m[3]);
  const yearCE = yearBE - 543;
  if (!month) return null;
  return yearCE + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
}

function ResultTab({ lottery, drawDate, draws, setDraws, currentDraw }) {
  const toast = useToast();
  const [results, setResults] = useState(currentDraw?.results || {});
  const [fetching, setFetching] = useState(false);
  const [fetchError, setFetchError] = useState('');
  const [fetchedInfo, setFetchedInfo] = useState(null);
  useEffect(() => {
    setResults(currentDraw?.results || {});
    setFetchedInfo(null);
    setFetchError('');
  }, [currentDraw?.id, drawDate, lottery.id]);

  const isGov = lottery.id === 'gov';

  const fetchLatest = async () => {
    setFetching(true); setFetchError(''); setFetchedInfo(null);
    try {
      const resp = await fetchGovLatest();
      const parsed = parseGovResult(resp);
      const ceDate = parseThaiDate(parsed.date);
      setResults({
        '3บน': parsed['3บน'],
        '2บน': parsed['2บน'],
        '2ล่าง': parsed['2ล่าง'],
      });
      setFetchedInfo({
        thaiDate: parsed.date,
        ceDate: ceDate,
        fullPrize: parsed.fullPrizeFirst,
        matchesDraw: ceDate === drawDate,
      });
    } catch (e) {
      setFetchError('ดึงข้อมูลไม่สำเร็จ: ' + e.message);
    } finally {
      setFetching(false);
    }
  };

  const fetchSpecificDate = async () => {
    setFetching(true); setFetchError(''); setFetchedInfo(null);
    try {
      // drawDate is "YYYY-MM-DD" — convert to Thai format ID "DDMMYYYY+543"
      const [y, m, d] = drawDate.split('-').map(Number);
      const idBE = String(d).padStart(2, '0') + String(m).padStart(2, '0') + String(y + 543);
      const resp = await fetchGovById(idBE);
      const parsed = parseGovResult(resp);
      setResults({
        '3บน': parsed['3บน'],
        '2บน': parsed['2บน'],
        '2ล่าง': parsed['2ล่าง'],
      });
      setFetchedInfo({
        thaiDate: parsed.date,
        ceDate: parseThaiDate(parsed.date),
        fullPrize: parsed.fullPrizeFirst,
        matchesDraw: true,
      });
    } catch (e) {
      setFetchError('ไม่พบผลรางวัลของวันที่ ' + formatDate(drawDate) + ' (หวยรัฐบาลออกวันที่ 1 และ 16 เท่านั้น)');
    } finally {
      setFetching(false);
    }
  };

  const save = () => {
    const cleaned = {};
    Object.entries(results).forEach(([k, v]) => { if (v && v.toString().trim()) cleaned[k] = v.toString().trim(); });
    if (Object.keys(cleaned).length === 0) { toast.show('ใส่ผลรางวัลก่อน', 'info'); return; }
    if (currentDraw) {
      setDraws(prev => prev.map(d => d.id === currentDraw.id ? { ...d, results: cleaned } : d));
    } else {
      setDraws(prev => [...prev, { id: uid(), lotteryId: lottery.id, date: drawDate, results: cleaned, createdAt: Date.now() }]);
    }
    toast.show('บันทึกผลรางวัลแล้ว', 'success');
  };

  const clear = async () => {
    if (!currentDraw) return;
    const ok = await toast.askConfirm('ลบผลรางวัลของงวดนี้ ?', { danger: true, confirmLabel: 'ลบ' });
    if (ok) {
      setDraws(prev => prev.filter(d => d.id !== currentDraw.id));
      setResults({});
      setFetchedInfo(null);
      toast.show('ลบผลรางวัลแล้ว', 'success');
    }
  };

  return (
    <div className="space-y-3 slide-in">
      {isGov && (
        <div className="glass-strong rounded-2xl p-4">
          <div className="flex items-center gap-2 mb-2">
            <div className="w-1 h-4 bg-gradient-to-b from-red-500 to-red-700 rounded-full"/>
            <h2 className="font-display text-xl font-bold tracking-wide text-stone-900">ดึงผลจากกองสลาก</h2>
          </div>
          <div className="text-base text-gray-500 font-display mb-3 leading-relaxed">
            ดึงผลรางวัลที่ 1 + เลขท้าย 2 ตัวอัตโนมัติ (รัฐบาลเท่านั้น · ออกทุก 1 และ 16)
          </div>
          <div className="grid grid-cols-2 gap-2">
            <button onClick={fetchLatest} disabled={fetching}
              className="py-2.5 rounded-xl bg-white border border-red-200 text-red-700 font-display text-lg tracking-wider flex items-center justify-center gap-1.5 disabled:opacity-40">
              {fetching ? <RefreshCw size={13} className="shimmer"/> : <Download size={13}/>}
              งวดล่าสุด
            </button>
            <button onClick={fetchSpecificDate} disabled={fetching}
              className="py-2.5 rounded-xl bg-white border border-red-200 text-red-700 font-display text-lg tracking-wider flex items-center justify-center gap-1.5 disabled:opacity-40">
              {fetching ? <RefreshCw size={13} className="shimmer"/> : <Calendar size={13}/>}
              ตามวันที่
            </button>
          </div>
          {fetchError && (
            <div className="mt-3 bg-red-50 border border-red-200 rounded-lg p-2.5 text-base text-red-700 font-display flex items-start gap-2">
              <AlertCircle size={13} className="flex-shrink-0 mt-0.5"/>
              <div>{fetchError}</div>
            </div>
          )}
          {fetchedInfo && (
            <div className={'mt-3 rounded-lg p-2.5 text-base font-display border ' + (fetchedInfo.matchesDraw ? 'bg-green-50 border-green-200 text-green-700' : 'bg-orange-50 border-orange-300 text-orange-700')}>
              <div className="flex items-start gap-2">
                {fetchedInfo.matchesDraw
                  ? <Check size={13} className="flex-shrink-0 mt-0.5" strokeWidth={3}/>
                  : <AlertTriangle size={13} className="flex-shrink-0 mt-0.5"/>}
                <div className="flex-1 min-w-0">
                  <div className="font-semibold">ดึงสำเร็จ · งวด {fetchedInfo.thaiDate}</div>
                  <div className="opacity-75">รางวัลที่ 1: <span className="font-numeric font-bold">{fetchedInfo.fullPrize}</span></div>
                  {!fetchedInfo.matchesDraw && (
                    <div className="mt-1 text-orange-800">⚠️ ไม่ตรงกับงวด {formatDate(drawDate)} ที่เลือก — กดบันทึกถ้าต้องการใช้ผลนี้</div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      <div className="glass-strong rounded-2xl p-4">
        <div className="flex items-center gap-2 mb-3">
          <Trophy size={14} className="text-red-500"/>
          <h2 className="font-display text-xl font-bold tracking-wide text-stone-900">ใส่ผลรางวัล</h2>
          <span className="text-base text-gray-400 font-display">{formatDate(drawDate)}</span>
        </div>
        <div className="space-y-2">
          {lottery.types.map(t => (
            <div key={t} className="num-tile rounded-xl p-3 flex items-center gap-3">
              <div className="text-base text-gray-600 font-display tracking-wider w-16">{t}</div>
              <input type="tel" inputMode="numeric"
                value={results[t] || ''}
                onChange={e => setResults({ ...results, [t]: e.target.value.replace(/\D/g, '').slice(0, t.startsWith('3') ? 3 : 2) })}
                placeholder={t.startsWith('3') ? '000' : '00'}
                className="flex-1 bg-transparent outline-none font-numeric text-2xl font-bold gold-text text-center placeholder-yellow-100/15 tracking-widest"/>
            </div>
          ))}
        </div>
        <div className="grid grid-cols-2 gap-2 mt-3">
          <button onClick={clear} disabled={!currentDraw}
            className="py-2.5 rounded-xl bg-gray-100 text-red-700 font-display text-lg tracking-wider border border-red-200 disabled:opacity-30">
            ลบผล
          </button>
          <button onClick={save}
            className="py-2.5 rounded-xl bg-gradient-to-r from-red-500 to-red-600 text-white font-semibold font-display text-lg tracking-wider">บันทึก</button>
        </div>
      </div>
    </div>
  );
}

// ==================== STATS TAB ====================
function StatsTab({ bets, draws, isSeller, caps, rates }) {
  const stats = useMemo(() => {
    let totalIntake = 0, totalPayout = 0, wonCount = 0, totalCount = 0;
    const byLottery = {};
    bets.forEach(b => {
      const draw = draws.find(d => d.lotteryId === b.lotteryId && d.date === b.drawDate);
      const amt = parseFloat(b.amount) || 0;
      const rate = (rates && rates[b.type]) || parseFloat(b.rate) || 0;
      const halfMult = isCombosHalfPay(caps, b.lotteryId, b.drawDate, b.number, b.type) ? 0.5 : 1;
      totalIntake += amt;
      totalCount++;
      const hit = draw && checkWin(b, draw.results);
      if (hit) { totalPayout += amt * rate * halfMult; wonCount++; }
      if (!byLottery[b.lotteryId]) byLottery[b.lotteryId] = { intake: 0, payout: 0, won: 0, total: 0, name: DEFAULT_LOTTERIES.find(l=>l.id===b.lotteryId)?.name || b.lotteryId };
      byLottery[b.lotteryId].intake += amt;
      byLottery[b.lotteryId].total++;
      if (hit) { byLottery[b.lotteryId].payout += amt * rate * halfMult; byLottery[b.lotteryId].won++; }
    });
    // Sign flipped based on mode: seller profit = intake - payout; buyer profit = payout - intake
    return {
      totalIntake, totalPayout,
      profit: isSeller ? totalIntake - totalPayout : totalPayout - totalIntake,
      wonCount, totalCount,
      byLottery: Object.values(byLottery),
    };
  }, [bets, draws, isSeller, caps, rates]);

  return (
    <div className="space-y-3 slide-in">
      <div className="glass-strong rounded-2xl p-4">
        <div className="flex items-center gap-2 mb-3">
          <BarChart3 size={14} className="text-red-500"/>
          <h2 className="font-display text-xl font-bold tracking-wide text-stone-900">สรุปทั้งหมด</h2>
        </div>
        <div className="grid grid-cols-2 gap-2 mb-3">
          <div className="num-tile rounded-xl p-3">
            <div className="text-base uppercase tracking-wider text-red-700 font-display font-semibold">{isSeller ? 'รับเข้า' : 'เงินซื้อ'}</div>
            <div className="font-numeric text-2xl font-bold gold-text mt-1">฿{fmt(stats.totalIntake)}</div>
          </div>
          <div className="num-tile rounded-xl p-3">
            <div className="text-base uppercase tracking-wider text-red-700 font-display font-semibold">{isSeller ? 'จ่ายออก' : 'เงินที่ได้'}</div>
            <div className="font-numeric text-2xl font-bold text-red-600 mt-1">฿{fmt(stats.totalPayout)}</div>
          </div>
        </div>
        <div className={`rounded-xl p-3 border ${stats.profit >= 0 ? 'bg-green-50 border-green-300' : 'bg-red-50 border-red-400'}`}>
          <div className={`text-base uppercase tracking-widest font-display ${stats.profit >= 0 ? 'text-green-600' : 'text-red-600'}`}>กำไร/ขาดทุน</div>
          <div className={`font-numeric text-2xl font-bold mt-1 ${stats.profit >= 0 ? 'text-green-600' : 'text-red-600'}`}>{stats.profit >= 0 ? '+' : '-'}฿{fmt(Math.abs(stats.profit))}</div>
          <div className="text-base text-gray-500 mt-1 font-display">{stats.wonCount} / {stats.totalCount} โพยถูก</div>
        </div>
      </div>
      {stats.byLottery.length > 0 && (
        <div className="glass rounded-2xl p-4">
          <div className="flex items-center gap-2 mb-3">
            <FileText size={14} className="text-red-500"/>
            <h3 className="font-display text-xl font-bold tracking-wide text-stone-900">แยกตามหวย</h3>
          </div>
          <div className="space-y-2">
            {stats.byLottery.map((l, i) => {
              const profit = isSeller ? l.intake - l.payout : l.payout - l.intake;
              return (
                <div key={i} className="bg-gray-50 rounded-lg px-3 py-2 border border-gray-200">
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-base text-gray-900 font-display">{l.name}</span>
                    <span className={`font-numeric text-lg font-bold ${profit >= 0 ? 'text-green-600' : 'text-red-600'}`}>{profit >= 0 ? '+' : '-'}฿{fmt(Math.abs(profit))}</span>
                  </div>
                  <div className="flex items-center justify-between text-base text-gray-400 font-display">
                    <span>รับ ฿{fmt(l.intake)} · จ่าย ฿{fmt(l.payout)}</span>
                    <span>{l.won}/{l.total}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// ==================== MOUNT ====================
ReactDOM.createRoot(document.getElementById('root')).render(<ToastProvider><App/></ToastProvider>);
</script>

<script>
// ==================== PWA SERVICE WORKER ====================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => {
        console.log('[PWA] SW registered, scope:', reg.scope);
        // Force update check
        reg.update().catch(()=>{});
      })
      .catch(err => console.warn('[PWA] SW failed:', err));
  });
}

// ==================== INSTALL PROMPT HANDLING ====================
let deferredInstallPrompt = null;
let installBanner = null;

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches ||
         window.matchMedia('(display-mode: minimal-ui)').matches ||
         window.navigator.standalone === true;
}

function createInstallBanner(onClick, text) {
  if (installBanner) installBanner.remove();
  const div = document.createElement('div');
  div.id = 'install-banner';
  div.style.cssText = [
    'position:fixed', 'bottom:16px', 'left:12px', 'right:12px',
    'background:linear-gradient(135deg,#dc2626 0%,#b91c1c 100%)',
    'border:1px solid #991b1b',
    'border-radius:16px', 'padding:14px 16px',
    'color:#ffffff',
    'font-family:"Bai Jamjuree",sans-serif', 'font-size:13px',
    'z-index:9998',
    'box-shadow:0 10px 30px rgba(220,38,38,0.4),0 4px 12px rgba(0,0,0,0.15)',
    'display:flex', 'align-items:center', 'gap:12px',
    'max-width:480px', 'margin:0 auto',
    'animation:slide-in 0.4s ease-out',
  ].join(';');
  div.innerHTML = `
    <div style="font-size:24px;flex-shrink:0">📱</div>
    <div style="flex:1;line-height:1.4">${text}</div>
    <button id="install-btn-yes" style="background:#ffffff;color:#dc2626;border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;font-family:'Mitr',sans-serif;cursor:pointer;flex-shrink:0">ติดตั้ง</button>
    <button id="install-btn-no" style="background:transparent;border:none;color:rgba(255,255,255,0.7);padding:6px;font-size:18px;cursor:pointer;flex-shrink:0;line-height:1">×</button>
  `;
  document.body.appendChild(div);
  installBanner = div;

  div.querySelector('#install-btn-yes').onclick = onClick;
  div.querySelector('#install-btn-no').onclick = () => {
    sessionStorage.setItem('install-dismissed', '1');
    div.remove();
    installBanner = null;
  };
}

// Android: capture native install prompt
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  console.log('[PWA] Install prompt ready');

  if (isStandalone() || sessionStorage.getItem('install-dismissed')) return;

  setTimeout(() => {
    createInstallBanner(async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      const result = await deferredInstallPrompt.userChoice;
      console.log('[PWA] User choice:', result.outcome);
      deferredInstallPrompt = null;
      if (installBanner) { installBanner.remove(); installBanner = null; }
    }, 'ติดตั้ง Royal 888 เป็นแอป — เปิดได้แม้ไม่มีเน็ต');
  }, 3000);
});

window.addEventListener('appinstalled', () => {
  console.log('[PWA] Installed!');
  if (installBanner) { installBanner.remove(); installBanner = null; }
  deferredInstallPrompt = null;
});

// iOS: show manual instructions
window.addEventListener('load', () => {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if (!isIOS || isStandalone()) return;
  if (sessionStorage.getItem('install-dismissed')) return;

  setTimeout(() => {
    const div = document.createElement('div');
    div.style.cssText = [
      'position:fixed', 'bottom:16px', 'left:12px', 'right:12px',
      'background:#ffffff', 'border:1px solid #fca5a5',
      'border-radius:16px', 'padding:14px 16px',
      'color:#111827',
      'font-family:"Bai Jamjuree",sans-serif', 'font-size:13px',
      'z-index:9998',
      'box-shadow:0 10px 30px rgba(0,0,0,0.15)',
      'display:flex', 'align-items:center', 'gap:12px',
      'max-width:480px', 'margin:0 auto',
    ].join(';');
    div.innerHTML = `
      <div style="font-size:22px;flex-shrink:0">📱</div>
      <div style="flex:1;line-height:1.4">
        <div style="font-weight:600;color:#dc2626;font-family:'Mitr',sans-serif;margin-bottom:2px">ติดตั้งบน iPhone</div>
        <div style="font-size:11.5px;color:#4b5563">แตะ <strong>แชร์</strong> ⬆️ ด้านล่าง → "เพิ่มไปยังหน้าจอโฮม"</div>
      </div>
      <button style="background:transparent;border:none;color:#9ca3af;padding:6px;font-size:18px;cursor:pointer;flex-shrink:0;line-height:1">×</button>
    `;
    div.querySelector('button').onclick = () => {
      sessionStorage.setItem('install-dismissed', '1');
      div.remove();
    };
    document.body.appendChild(div);
    setTimeout(() => { if (div.parentNode) div.remove(); }, 15000);
  }, 3000);
});

// Debug: log PWA state
window.addEventListener('load', () => {
  setTimeout(() => {
    const debug = {
      standalone: isStandalone(),
      hasSW: 'serviceWorker' in navigator,
      hasManifest: !!document.querySelector('link[rel="manifest"]'),
      isHTTPS: location.protocol === 'https:',
      hasIcons: document.querySelector('link[rel="icon"]') !== null,
      url: location.href,
    };
    console.log('[PWA] State:', debug);
    window.__PWA_DEBUG__ = debug;
  }, 1500);
});
</script>
