function parseGovResult(apiResponse) {
  const prizeFirst = apiResponse.prizes.find(p => p.id === 'prizeFirst');
  const backTwo = (apiResponse.runningNumbers || []).find(r => r.id === 'runningNumberBackTwo');
  if (!prizeFirst || !prizeFirst.number[0]) throw new Error('ไม่พบรางวัลที่ 1');
  if (!backTwo || !backTwo.number[0]) throw new Error('ไม่พบเลขท้าย 2 ตัว');
  const sixDigit = prizeFirst.number[0];
  return {
    date: apiResponse.date,
    fullPrizeFirst: sixDigit,
    '3บน': sixDigit.slice(-3),
    '2บน': sixDigit.slice(-2),
    '2ล่าง': backTwo.number[0],
  };
}

// Parse Thai date string "1 มิถุนายน 2569" -> "2026-06-01" (Gregorian)
function parseThaiDate(thaiStr) {
  if (!thaiStr) return null;
  const months = {
    'มกราคม': 1, 'กุมภาพันธ์': 2, 'มีนาคม': 3, 'เมษายน': 4,
    'พฤษภาคม': 5, 'มิถุนายน': 6, 'กรกฎาคม': 7, 'สิงหาคม': 8,
    'กันยายน': 9, 'ตุลาคม': 10, 'พฤศจิกายน': 11, 'ธันวาคม': 12,
  };
  const m = thaiStr.match(/(\d{1,2})\s+([ก-๙]+)\s+(\d{4})/);
  if (!m) return null;
  const day = parseInt(m[1]);
  const month = months[m[2]];
  const yearBE = parseInt(m[3]);
  const yearCE = yearBE - 543;
  if (!month) return null;
  return yearCE + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
}

function ManualResultCard({ lottery, drawDate, currentDraw, setDraws, isAuto }) {
  const toast = useToast();
  const t3 = lottery.types.includes('3ตัว') ? '3ตัว' : '3บน';
  const [open, setOpen] = useState(!isAuto);
  const [v3, setV3] = useState(r3Of(currentDraw?.results));
  const [v2, setV2] = useState(currentDraw?.results?.['2ล่าง'] || '');
  useEffect(() => {
    setV3(r3Of(currentDraw?.results)); setV2(currentDraw?.results?.['2ล่าง'] || ''); setOpen(!isAuto);
  }, [currentDraw?.id, currentDraw?.source, drawDate, lottery.id]);
  const th = RESULT_THEME.manual;
  const save = () => {
    if (v3 && v3.length !== 3) { toast.show('3 ตัวบน ต้องมี 3 หลัก', 'info'); return; }
    if (v2 && v2.length !== 2) { toast.show('2 ตัวล่าง ต้องมี 2 หลัก', 'info'); return; }
    if (!v3 && !v2) { toast.show('ใส่ผลรางวัลก่อน', 'info'); return; }
    const results = {};
    if (v3) { results[t3] = v3; results['2บน'] = v3.slice(-2); }
    if (v2) results['2ล่าง'] = v2;
    setDraws(prev => {
      const i = prev.findIndex(d => d.lotteryId === lottery.id && d.date === drawDate);
      const rec = { id: i >= 0 && prev[i].source !== 'auto' ? prev[i].id : uid(), lotteryId: lottery.id, date: drawDate, results, source: 'manual', createdAt: Date.now() };
      if (i < 0) return [...prev, rec];
      const next = prev.slice(); next[i] = rec; return next;
    });
    toast.show('บันทึกผล ' + formatDrawDateShort(drawDate) + ' แล้ว', 'success');
  };
  const clear = async () => {
    if (!currentDraw) return;
    const ok = await toast.askConfirm('ลบผลรางวัลงวด ' + formatDrawDateShort(drawDate) + ' ?', { danger: true, confirmLabel: 'ลบ' });
    if (!ok) return;
    setDraws(prev => prev.filter(d => d.id !== currentDraw.id));
    toast.show('ลบผลแล้ว', 'success');
  };
  if (isAuto && !open) {
    return (
      <button onClick={() => setOpen(true)} className="w-full glass rounded-2xl px-4 py-3 text-base font-display font-semibold text-stone-600 flex items-center justify-between active:scale-95">
        <span>✍️ กรอกผล {lottery.name} เอง</span><span className="text-sm text-stone-400">ถ้ายังดึงไม่ได้</span>
      </button>
    );
  }
  return (
    <div className="glass-strong rounded-2xl overflow-hidden">
      <div className="flex items-center gap-2.5 px-3.5 py-3 border-b" style={{ borderColor: '#e8dfc8', background: `linear-gradient(90deg, ${th.bg}, #fff)` }}>
        <div className="w-10 h-10 rounded-xl grid place-items-center text-2xl flex-shrink-0" style={{ background: th.bg }}>{lottery.id.startsWith('hanoi') ? '🇻🇳' : th.flag}</div>
        <div className="flex-1 min-w-0">
          <div className="font-display text-lg font-bold leading-tight text-stone-900">{lottery.name}</div>
          <div className="text-sm text-stone-500 font-display">{'งวด ' + formatDrawDateShort(drawDate)}</div>
        </div>
        <ResultChip kind="man">กรอกเอง</ResultChip>
      </div>
      <div className="p-3.5 space-y-3">
        <div className="grid grid-cols-2 gap-2.5">
          {[['3 ตัวบน', v3, setV3, 3], ['2 ตัวล่าง', v2, setV2, 2]].map(([label, val, set, n]) => (
            <label key={label} className="block min-w-0">
              <span className="text-sm font-display font-semibold text-stone-500">{label}</span>
              <input type="tel" inputMode="numeric" value={val} maxLength={n}
                onChange={e => set(e.target.value.replace(/\D/g, '').slice(0, n))}
                placeholder={'_'.repeat(n)}

                style={{ borderColor: th.bd, fontSize: '1.75rem', letterSpacing: '0.2em', color: '#2a2a2a' }}/>
            </label>
          ))}
        </div>
        <div className="text-sm text-stone-500 font-display">2 ตัวบน = 2 หลักท้ายของ 3 ตัวบน {v3.length === 3 && <b className="font-numeric text-stone-800">({v3.slice(-2)})</b>}</div>

function StatsTab({ bets, draws, isSeller, caps, rates }) {
  const stats = useMemo(() => {
    let totalIntake = 0, totalPayout = 0, wonCount = 0, totalCount = 0, pendingAmt = 0, pendingCount = 0;
    const byLottery = {};
    const drawMap = new Map(draws.map(d => [d.lotteryId + '|' + d.date, d]));
    bets.forEach(b => {
      const draw = drawMap.get(b.lotteryId + '|' + b.drawDate);
      const r = draw && draw.results;
      // งวดที่ยังไม่ออกผล → ไม่นับในกำไร (เดิมนับยอดรับเป็นกำไรทันที เช่นจด ฿5,000 งวดหน้า = กำไร +฿5,000)
      if (!r || !(r['3บน'] || r['3ตัว'] || r['2ล่าง'])) { pendingAmt += parseFloat(b.amount) || 0; pendingCount++; return; }
      const P = betPayout(b, r, caps, rates);
      const amt = P.amt;
      totalIntake += amt;
      totalCount++;
      const hit = P.hit;
      if (hit) { totalPayout += P.payout; wonCount++; }
      if (!byLottery[b.lotteryId]) byLottery[b.lotteryId] = { intake: 0, payout: 0, won: 0, total: 0, name: ALL_LOTTERIES.find(l=>l.id===b.lotteryId)?.name || b.lotteryId };
      byLottery[b.lotteryId].intake += amt;
      byLottery[b.lotteryId].total++;
      if (hit) { byLottery[b.lotteryId].payout += P.payout; byLottery[b.lotteryId].won++; }
    });
    // Sign flipped based on mode: seller profit = intake - payout; buyer profit = payout - intake
    return {
      totalIntake, totalPayout,
      profit: isSeller ? totalIntake - totalPayout : totalPayout - totalIntake,
      wonCount, totalCount, pendingAmt, pendingCount,
      byLottery: Object.values(byLottery),
    };
  }, [bets, draws, isSeller, caps, rates]);

  return (
    <div className="space-y-3 slide-in">
      <div className="glass-strong rounded-2xl p-4">
        <div className="flex items-center gap-2 mb-3">
          <BarChart3 size={14} className="text-red-500"/>
          <h2 className="font-display text-xl font-bold tracking-wide text-stone-900">สรุปทั้งหมด</h2>
        </div>
        <div className="grid grid-cols-2 gap-2 mb-3">
          <div className="num-tile rounded-xl p-3 min-w-0 overflow-hidden">
            <div className="text-base uppercase tracking-wider font-display font-semibold" style={{color:'#8a6d36'}}>{isSeller ? 'รับเข้า' : 'เงินซื้อ'}</div>
            <div className="font-numeric font-bold gold-text mt-1 num-wrap" style={{fontSize: 'clamp(1rem, 5vw, 1.5rem)', lineHeight: 1.2}}>฿{fmt(stats.totalIntake)}</div>
          </div>
          <div className="num-tile rounded-xl p-3 min-w-0 overflow-hidden">
            <div className="text-base uppercase tracking-wider font-display font-semibold" style={{color:'#8a6d36'}}>{isSeller ? 'จ่ายออก' : 'เงินที่ได้'}</div>
            <div className="font-numeric font-bold text-red-600 mt-1 num-wrap" style={{fontSize: 'clamp(1rem, 5vw, 1.5rem)', lineHeight: 1.2}}>฿{fmt(stats.totalPayout)}</div>
          </div>
        </div>
        <div className={`rounded-xl p-3 border overflow-hidden ${stats.profit >= 0 ? 'bg-green-50 border-green-300' : 'bg-red-50 border-red-400'}`}>
          <div className={`text-base uppercase tracking-widest font-display ${stats.profit >= 0 ? 'text-green-600' : 'text-red-600'}`}>กำไร/ขาดทุน</div>
          <div className={`font-numeric font-bold mt-1 num-wrap ${stats.profit >= 0 ? 'text-green-600' : 'text-red-600'}`} style={{fontSize: 'clamp(1.1rem, 6vw, 1.5rem)', lineHeight: 1.2}}>{stats.profit >= 0 ? '+' : '-'}฿{fmt(Math.abs(stats.profit))}</div>
          <div className="text-base text-gray-500 mt-1 font-display">{stats.wonCount} / {stats.totalCount} โพยถูก · นับเฉพาะงวดที่ออกผลแล้ว</div>
        </div>
        {stats.pendingCount > 0 && (
          <div data-testid="stats-pending" className="mt-2 rounded-xl px-3 py-2 flex items-center justify-between gap-2 flex-wrap"
            style={{ background: '#eff6ff', border: '1px solid #93c5fd' }}>
            <span className="font-display text-base font-semibold" style={{ color: '#1d4ed8' }}>⏳ รอผล {stats.pendingCount} โพย</span>
            <span className="font-numeric font-bold num-wrap" style={{ color: '#1d4ed8' }}>฿{fmt(stats.pendingAmt)}</span>
          </div>
        )}
      </div>
      {stats.byLottery.length > 0 && (
        <div className="glass rounded-2xl p-4">
          <div className="flex items-center gap-2 mb-3">
            <FileText size={14} className="text-red-500"/>
            <h3 className="font-display text-xl font-bold tracking-wide text-stone-900">แยกตามหวย</h3>
          </div>
          <div className="space-y-2">
            {stats.byLottery.map((l, i) => {
              const profit = isSeller ? l.intake - l.payout : l.payout - l.intake;
              return (
                <div key={i} className="bg-gray-50 rounded-lg px-3 py-2 border border-gray-200">
                  <div className="flex items-center justify-between gap-2 mb-1">
                    <span className="text-base text-gray-900 font-display num-wrap">{l.name}</span>
                    <span className={`font-numeric font-bold num-wrap ${profit >= 0 ? 'text-green-600' : 'text-red-600'}`} style={{fontSize: 'clamp(0.9rem, 4vw, 1.125rem)', lineHeight: 1.2}}>{profit >= 0 ? '+' : '-'}฿{fmt(Math.abs(profit))}</span>
                  </div>
                  <div className="flex items-center justify-between gap-2 text-base text-gray-400 font-display flex-wrap">
                    <span className="num-wrap">รับ ฿{fmt(l.intake)} · จ่าย ฿{fmt(l.payout)}</span>
                    <span className="flex-shrink-0">{l.won}/{l.total}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// ตัวเลขเงิน/ป้าย .num-wrap: ยาวเกินกล่อง → ย่อลงทั้งก้อน (ต่ำสุด 60%) ห้ามตัด … ห้ามขึ้นบรรทัดกลางตัวเลข
// ถ้าย่อสุดแล้วยังไม่พอ ค่อยยอมขึ้นบรรทัด · ใช้ zoom (React ไม่ยุ่งกับค่านี้ → ไม่ชนกับ fontSize ที่ตั้งไว้)
(function installNumFit() {
  let raf = 0;
  const fitAll = () => {
    raf = 0;
    document.querySelectorAll('.num-wrap').forEach(el => {
      el.style.zoom = ''; el.classList.remove('num-wrap-multi');
      const w = el.clientWidth;
      if (!w || el.scrollWidth <= w) return;
      const z = Math.max(0.6, Math.floor((w / el.scrollWidth) * 100) / 100);
      el.style.zoom = String(z);
      if (el.scrollWidth * z > w + 1) el.classList.add('num-wrap-multi');
    });
  };
  const schedule = () => { if (!raf) raf = requestAnimationFrame(fitAll); };
  new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true, characterData: true });
  window.addEventListener('resize', schedule);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
  schedule();
})();
</script>

// ==================== INSTALL PROMPT HANDLING ====================
let deferredInstallPrompt = null;
let installBanner = null;

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches ||
         window.matchMedia('(display-mode: minimal-ui)').matches ||
         window.navigator.standalone === true;
}

function createInstallBanner(onClick, text) {
  if (installBanner) installBanner.remove();
  const div = document.createElement('div');
  div.id = 'install-banner';
  div.style.cssText = [
    'position:fixed', 'bottom:16px', 'left:12px', 'right:12px',
    'background:linear-gradient(135deg,#dc2626 0%,#b91c1c 100%)',
    'border:1px solid #991b1b',
    'border-radius:16px', 'padding:14px 16px',
    'color:#ffffff',
    'font-family:"Bai Jamjuree",sans-serif', 'font-size:13px',
    'z-index:9998',
    'box-shadow:0 10px 30px rgba(220,38,38,0.4),0 4px 12px rgba(0,0,0,0.15)',
    'display:flex', 'align-items:center', 'gap:12px',
    'max-width:480px', 'margin:0 auto',
    'animation:slide-in 0.4s ease-out',
  ].join(';');
  div.innerHTML = `
    <div style="font-size:24px;flex-shrink:0">📱</div>
    <div style="flex:1;line-height:1.4">${text}</div>
    <button id="install-btn-yes" style="background:#ffffff;color:#dc2626;border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;font-family:'Mitr',sans-serif;cursor:pointer;flex-shrink:0">ติดตั้ง</button>
    <button id="install-btn-no" style="background:transparent;border:none;color:rgba(255,255,255,0.7);padding:6px;font-size:18px;cursor:pointer;flex-shrink:0;line-height:1">×</button>
  `;
  document.body.appendChild(div);
  installBanner = div;

  div.querySelector('#install-btn-yes').onclick = onClick;
  div.querySelector('#install-btn-no').onclick = () => {
    sessionStorage.setItem('install-dismissed', '1');
    div.remove();
    installBanner = null;
  };
}

// Android: capture native install prompt
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  console.log('[PWA] Install prompt ready');

  if (isStandalone() || sessionStorage.getItem('install-dismissed')) return;

  setTimeout(() => {
    createInstallBanner(async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      const result = await deferredInstallPrompt.userChoice;
      console.log('[PWA] User choice:', result.outcome);
      deferredInstallPrompt = null;
      if (installBanner) { installBanner.remove(); installBanner = null; }
    }, 'ติดตั้ง Royal 888 เป็นแอป — เปิดได้แม้ไม่มีเน็ต');
  }, 3000);
});

window.addEventListener('appinstalled', () => {
  console.log('[PWA] Installed!');
  if (installBanner) { installBanner.remove(); installBanner = null; }
  deferredInstallPrompt = null;
});
