  const next = prev.filter(keep);

  for (const a of autoDraws) {
    const i = next.findIndex(d => d.lotteryId === a.lotteryId && d.date === a.date);

// Thai Government Lottery draws: typically 1st and 16th of each month
// Sometimes shifted to end of previous month if 1st/16th falls on holiday
// Generate next ~12 likely draw dates from a base date
function getGovDrawDates(baseDateISO, monthsAhead = 12) {
  const dates = new Set();
  const base = new Date(baseDateISO + 'T00:00:00');

  // Add a few past months too (for recording past draws)
  for (let m = -3; m < monthsAhead; m++) {
    const d = new Date(base.getFullYear(), base.getMonth() + m, 1);
    const year = d.getFullYear();
    const month = d.getMonth();

    // 1st of month
    dates.add(`${year}-${String(month + 1).padStart(2, '0')}-01`);
    // 16th of month
    dates.add(`${year}-${String(month + 1).padStart(2, '0')}-16`);
    // Last day of month (handles holiday shift case — gov shifts to 30/31)
    const lastDay = new Date(year, month + 1, 0).getDate();
    dates.add(`${year}-${String(month + 1).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`);
    // 2nd-to-last day (sometimes)
    if (lastDay - 1 !== 16) {
      dates.add(`${year}-${String(month + 1).padStart(2, '0')}-${String(lastDay - 1).padStart(2, '0')}`);
    }
  }
  return [...dates].sort();
}

function getNextDrawDate(todayISO, lotteryId) {
  // Pick next upcoming "official" draw date
  if (lotteryId === 'gov') {
    // Gov lottery draws on 1st or 16th only (most of the time)
    const d = new Date(todayISO + 'T00:00:00');
    const day = d.getDate();
    if (day <= 1) {
      // Today is 1st or before — next draw = today's month 1st (if today is 1st) or wait
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
    }
    if (day < 16) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-16`;
    }
    if (day === 16) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-16`;
    }
    // After 16th — next draw is 1st of next month
    const next = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    return `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}-01`;
  }
  // ลาวออก จ.–ศ. เท่านั้น → เสาร์/อาทิตย์ ไปวันจันทร์
  if (lotteryId === 'lao') {
    const d = new Date(todayISO + 'T00:00:00');
    while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  // Other lotteries: default to today (they draw daily/weekly)
  return todayISO;
}

function formatBackupTime(timestamp) {
  if (!timestamp) return '-';
  const d = new Date(timestamp);
  const now = new Date();
  const diff = now - d;
  const seconds = Math.floor(diff / 1000);
  const minutes = Math.floor(seconds / 60);
  const hours = Math.floor(minutes / 60);
  const days = Math.floor(hours / 24);

  if (seconds < 60) return 'เมื่อสักครู่';
  if (minutes < 60) return minutes + ' นาทีที่แล้ว';
  if (hours < 24) return hours + ' ชม.ที่แล้ว';
  if (days < 7) return days + ' วันที่แล้ว';

  const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${d.getDate()} ${months[d.getMonth()]} ${hh}:${mm}`;
}

  }
};

// คิดเงินโพยถูก — แหล่งเดียว (หน้าสรุป · การ์ดผลออก · ใบได้/เสีย): อัตราปัจจุบัน · จ่ายครึ่งตามเลขอั้น
function betPayout(b, results, caps, rates) {
  const amt = parseFloat(b.amount) || 0;
  const rate = (rates && rates[b.type]) || parseFloat(b.rate) || 0;
  const half = isCombosHalfPay(caps || [], b.lotteryId, b.drawDate, b.number, b.type);
  const hit = !!(results && checkWin(b, results));
  return { amt, rate, half, hit, payout: hit ? amt * rate * (half ? 0.5 : 1) : 0 };
}

function genericToType(generic, len, lottery) {
  if (len === 3) {
    if (generic === 'โต๊ด') return 'โต๊ด';
    return lottery.types.includes('3ตัว') ? '3ตัว' : '3บน';
  }
  return generic === 'ล่าง' ? '2ล่าง' : '2บน';
}

// ==================== วางจาก LINE: parseBetText (ทดสอบแยก paste/t2.mjs + fuzz) ====================
const parseBetText = (() => {
const THAI_DIGITS = { '๐':'0','๑':'1','๒':'2','๓':'3','๔':'4','๕':'5','๖':'6','๗':'7','๘':'8','๙':'9' };
const TYPE_WORDS = [ // ยาวก่อนสั้น
  ['บนล่าง', ['บน', 'ล่าง']],
  ['โต๊ด', ['โต๊ด']], ['โต้ด', ['โต๊ด']], ['โตด', ['โต๊ด']], ['โต๋ด', ['โต๊ด']],
  ['ตรง', ['ตรง']], ['บน', ['บน']], ['ล่าง', ['ล่าง']], ['ลาง', ['ล่าง']],
];

function normalize(line) {
  return line
    .replace(/[๐-๙]/g, (c) => THAI_DIGITS[c])
    .replace(/[×xX✕✖*]/g, '×')
    .replace(/^([^=]*)(=.*)?$/, (all, left, right) => {
      // 1,000 → 1000 เฉพาะฝั่งราคา (หลัง =) · ฝั่งเลข "123,456,789=20" คือเลข 3 ตัวหลายตัว ไม่ใช่หลักพัน
      const th = (s) => s.replace(/(\d),(?=\d{3}\b)/g, '$1');
      if (right !== undefined) return left + th(right);
      const m = /[\u0E00-\u0E7F]/.exec(left);             // ไม่มี = → ราคาอยู่หลังคำประเภท (บน/ล่าง/…)
      return m ? left.slice(0, m.index) + th(left.slice(m.index)) : th(left);
    })
    .replace(/[＝]/g, '=')
    .trim();
}

// คำประเภทในบรรทัด (ตามลำดับที่เขียน)
function typeWordsIn(s) {
  const out = [];
  let rest = s;
  while (rest.length) {
    let hit = null;
    for (const [w, slots] of TYPE_WORDS) if (rest.startsWith(w)) { hit = [w, slots]; break; }
    if (hit) { out.push(...hit[1]); rest = rest.slice(hit[0].length); }
    else rest = rest.slice(1);
  }
  return out;
}

// บรรทัดหัวข้อ: ไม่มีตัวเลข และมีแต่คำประเภท + ตัวคั่น (- / , ช่องว่าง)
function asHeader(s) {
  if (/\d/.test(s)) return null;
  const stripped = s.replace(/[\s\-\/,.:|+]+/g, '');
  if (!stripped) return null;
  let rest = stripped, slots = [];
  while (rest.length) {
    const hit = TYPE_WORDS.find(([w]) => rest.startsWith(w));
    if (!hit) return null;              // มีคำอื่นปน → ไม่ใช่หัวข้อ
    slots.push(...hit[1]); rest = rest.slice(hit[0].length);
  }
  return slots.length ? slots : null;
}

const perms = (n) => [...new Set(getToadVariations(n))].sort();

return function parseBetText(text, lottery) {
  const rawLines = String(text || '').split(/\r?\n/);
  let slots2 = ['บน', 'ล่าง'];            // ค่าเริ่มต้น 2 ตัว: A×B = บน×ล่าง
  let slots3 = ['ตรง', 'โต๊ด'];           // ค่าเริ่มต้น 3 ตัว: A×B = ตรง×โต๊ด
  let customer = null, sawBet = false;
  const lines = [];

  for (let idx = 0; idx < rawLines.length; idx++) {
    const raw = rawLines[idx].trim();
    if (!raw) continue;
    // เวลาหน้าข้อความที่ก๊อปจาก LINE เช่น "12:24 พี่แดง 28=100" → ตัด "12:24" ทิ้ง ไม่ให้กลายเป็นเลข 12, 24
    const s = normalize(raw).replace(/^\[?\d{1,2}:\d{2}\]?\s*/, '');
    const L = { idx, raw, status: 'skip', bets: [], note: '' };
    lines.push(L);
    if (!s) { L.note = 'เวลา · ข้าม'; continue; }

    // 1) หัวข้อ
    const hdr = asHeader(s);
    if (hdr) {
      const two = hdr.filter((t) => t === 'บน' || t === 'ล่าง');
      const three = hdr.map((t) => (t === 'บน' ? 'ตรง' : t)).filter((t) => t === 'ตรง' || t === 'โต๊ด');
      // หัวข้อที่ใช้กับกลุ่มไหนไม่ได้ → กลุ่มนั้นต้องระบุเองทุกบรรทัด (null = ห้ามเดา)
      slots2 = two.length === hdr.length ? two : null;
      slots3 = three.length === hdr.length ? three : null;
      L.status = 'header'; L.note = 'หัวข้อ: ' + hdr.join('-');
      continue;
    }

    // 2) ไม่มีตัวเลข → ชื่อลูกค้า (เฉพาะบรรทัดแรกก่อนมีโพย) หรือข้าม
    if (!/\d/.test(s)) {
      if (!customer && !sawBet) { customer = s; L.status = 'name'; L.note = 'ชื่อลูกค้า'; }
      else { L.status = 'skip'; L.note = 'ไม่ใช่โพย · ข้าม'; }
      continue;
    }

    // 3) บรรทัดโพย: "เลข(หลายตัวได้) [=] ราคา×ราคา [คำประเภท] [กลับ]"
    const reverse = /กลับ/.test(s);
    const words = typeWordsIn(s.replace(/กลับ/g, ''));
    const eq = s.indexOf('=');
    let left, right;
    if (eq >= 0) { left = s.slice(0, eq); right = s.slice(eq + 1); }
    else {
      // ไม่มี "=" — รับเฉพาะรูปแบบที่ไม่กำกวม:
      //  (ก) มี × : เลขก่อนกลุ่ม × คือเลขโพย            เช่น "28 100×100"
      //  (ข) มีคำประเภทหลังเลข : เลขก่อนคำแรกคือเลขโพย   เช่น "123 บน100 โต๊ด50"
      //  (ค) มีตัวเลขแค่ 2 ตัว : ตัวแรกเลขโพย ตัวหลังราคา   เช่น "ล่าง 45 100"
      //  นอกนั้น (เช่น "12 34 56 20") → warn ไม่เดา
      const body = s.replace(/กลับ/g, ' ');
      const tIdx = body.search(/×/);
      const firstWordAfterNum = (() => {
        const m = body.match(/\d[^\dก-๙]*([ก-๙])/);
        return m ? body.indexOf(m[1], body.search(/\d/)) : -1;
      })();
      if (tIdx >= 0) {
        const before = body.slice(0, tIdx);
        const lastNum = before.match(/(\d+(?:\.\d+)?)\s*$/);
        const cut = lastNum ? tIdx - lastNum[0].length : tIdx;
        left = body.slice(0, cut); right = body.slice(cut);
      } else if (firstWordAfterNum > 0) {
        left = body.slice(0, firstWordAfterNum); right = body.slice(firstWordAfterNum);
      } else {
        const all = body.match(/\d+(?:\.\d+)?/g) || [];
        if (all.length !== 2) { L.status = 'warn'; L.note = 'ไม่มี "=" และแยกเลขกับราคาไม่ได้'; continue; }
        left = all[0]; right = all[1];
      }
    }
    const nums = left.match(/\d+/g) || [];
    if (!nums.length || nums.some((n) => n.length < 2 || n.length > 3)) {
      L.status = 'warn'; L.note = 'เลขโพยต้องเป็น 2 หรือ 3 หลัก'; continue;
    }
    const len = nums[0].length;
    if (nums.some((n) => n.length !== len)) { L.status = 'warn'; L.note = 'เลข 2 หลักกับ 3 หลักปนกัน'; continue; }

    const amtStr = right.replace(/[^\d.×]/g, ' ').trim();
    const amts = (amtStr.match(/\d+(?:\.\d+)?/g) || []).map(Number);
    const hasTimes = /×/.test(right);
    if (!amts.length || amts.some((a) => !(a > 0))) { L.status = 'warn'; L.note = 'ไม่พบราคา'; continue; }
    if (!hasTimes && amts.length > 1 && !words.length) {
      L.status = 'warn'; L.note = 'มีหลายตัวเลขแต่ไม่มี × หรือคำประเภท'; continue;
    }

    const bets = [];
    let problem = '';
    for (const num of nums) {
      if (len === 3) {
        const P = perms(num);
        if (reverse) {
          // 234=100×6 กลับ  → ตรงทุก perm ละ 100 · ตัวหลังต้องเท่าจำนวน perm ถ้ามี
          if (amts.length === 1 || (amts.length === 2 && amts[1] === P.length)) {
            for (const p of P) bets.push({ number: p, generic: 'ตรง', amount: amts[0] });
          } else problem = `กลับ ${num} ได้ ${P.length} แบบ แต่ราคาไม่ตรงรูปแบบ`;
        } else if (words.length) {
          // ระบุคำชัด เช่น "123 ตรง100 โต๊ด50" (จับคู่ตามลำดับ)
          const ws = words.map((w) => (w === 'บน' ? 'ตรง' : w));
          if (ws.some((w) => w === 'ล่าง')) problem = '3 ตัวล่าง ยังไม่รองรับ';
          else if (ws.length !== amts.length) problem = 'จำนวนคำประเภทไม่เท่าจำนวนราคา';
          else ws.forEach((w, i) => bets.push({ number: num, generic: w, amount: amts[i] }));
        } else if (amts.length >= 3 && amts.length === P.length) {
          // 232=100×100×100 → กลับทุกแบบ ราคาตามลำดับ
          P.forEach((p, i) => bets.push({ number: p, generic: 'ตรง', amount: amts[i] }));
        } else if (!slots3) {
          problem = 'หัวข้อด้านบนใช้กับเลข 2 ตัว · ระบุ ตรง/โต๊ด';
        } else if (amts.length <= slots3.length) {
          amts.forEach((a, i) => bets.push({ number: num, generic: slots3[i], amount: a }));
        } else problem = `ราคา ${amts.length} ตัว แต่ ${num} กลับได้ ${P.length} แบบ`;
      } else {
        let gens;
        if (words.length) {
          gens = words.filter((w) => w === 'บน' || w === 'ล่าง');
          if (gens.length !== words.length) problem = 'คำประเภทไม่ใช่ของ 2 ตัว';
          else if (gens.length === 1 && amts.length === 1) gens = gens;
          else if (gens.length !== amts.length) problem = 'จำนวนคำประเภทไม่เท่าจำนวนราคา';
        } else if (!slots2) {
          problem = 'หัวข้อด้านบนใช้กับเลข 3 ตัว · ระบุ บน/ล่าง';
        } else gens = slots2;
        if (!problem) {
          if (amts.length > gens.length) problem = `ราคา ${amts.length} ตัว แต่ประเภทมี ${gens.length}`;
          else amts.forEach((a, i) => bets.push({ number: num, generic: gens[i], amount: a }));
        }
        if (!problem && reverse) {
          const rev = num.split('').reverse().join('');
          if (rev !== num) bets.push(...bets.filter((b) => b.number === num).map((b) => ({ ...b, number: rev })));
        }
      }
      if (problem) break;
    }

    if (problem) { L.status = 'warn'; L.note = problem; continue; }
    L.status = 'ok';
    L.bets = bets.map((b) => ({ number: b.number, type: genericToType(b.generic, b.number.length, lottery), amount: b.amount }));
    sawBet = true;
  }

  const bets = lines.flatMap((l) => l.bets);
  return {
    customer,
    lines,
    bets,
    total: bets.reduce((s, b) => s + b.amount, 0),
    warnCount: lines.filter((l) => l.status === 'warn').length,
  };
}
})();

// "ถ้าออก 123 / 45" — มีแต่ 2 ตัวล่าง → "45" (เดิมขึ้น "null / 45")
const scenLabel = (x) => [x && x.num3, x && x.num2low].filter(Boolean).join(' / ') || '-';

function typeShort(type) {
  if (type === '3บน' || type === '3ตัว') return 'ตรง';
  if (type === '2บน') return 'บน';
  if (type === '2ล่าง') return 'ล่าง';
  if (type === 'โต๊ด') return 'โต๊ด';
  return type;
}

function typeFullName(type) {
  if (type === '3บน') return '3 ตัวบน';
  if (type === '3ตัว') return '3 ตัว';
  if (type === '2บน') return '2 ตัวบน';
  if (type === '2ล่าง') return '2 ตัวล่าง';
  if (type === 'โต๊ด') return '3 ตัวโต๊ด';
  return type;
}

// ==================== FORWARDING HELPERS ====================
// computeIntakePerCombo: คำนวณยอดรวมต่อเลข+type ก่อนหัก forward
function computeIntakePerCombo(bets) {
  const map = {}; // key = lotteryId|drawDate|number|type
  bets.forEach(b => {
    const key = b.lotteryId + '|' + b.drawDate + '|' + b.number + '|' + b.type;
    if (!map[key]) {
      map[key] = {
        lotteryId: b.lotteryId, drawDate: b.drawDate,
        number: b.number, type: b.type,
        intake: 0, betIds: []
      };
    }
    map[key].intake += parseFloat(b.amount) || 0;
    map[key].betIds.push(b.id);
  });
  return map;
}

// getMaxKeep: หา max keep ของเลข+type นี้ (เฉพาะของ override หรือ default)
function getMaxKeep(lotteryId, drawDate, number, type, forwards, settings) {
  // 1) Check explicit override per combo
  const explicit = forwards.find(f =>
    f.lotteryId === lotteryId && f.drawDate === drawDate &&
    f.number === number && f.type === type
  );
  if (explicit && explicit.maxKeep !== null && explicit.maxKeep !== undefined) {
    return explicit.maxKeep;
  }
  // 2) Default per group
  const is2digit = (type === '2บน' || type === '2ล่าง');
  const def = is2digit ? settings?.defaultMaxKeep2D : settings?.defaultMaxKeep3D;
  if (def !== null && def !== undefined && def > 0) return def;
  // 3) No cap
  return null;
}

// enrichBetsWithForwards: ปรับ b.amount เป็น kept amount + bake in rates
// Each bet's amount becomes the kept portion proportional to maxKeep/intake
function enrichBetsWithForwards(bets, forwards, settings, rates) {
  if (!bets || bets.length === 0) return [];
  const comboMap = computeIntakePerCombo(bets);
  // Use first bet to derive lottery/drawDate context for caps look-up — but we have it in b itself.
  return bets.map(b => {
    const comboKey = b.lotteryId + '|' + b.drawDate + '|' + b.number + '|' + b.type;
    const combo = comboMap[comboKey];
    const maxKeep = getMaxKeep(b.lotteryId, b.drawDate, b.number, b.type, forwards, settings);
    const intake = combo?.intake || 0;
    let keptAmount = parseFloat(b.amount) || 0;
    if (maxKeep !== null && intake > maxKeep) {
      // Proportional: this bet's share of kept = (b.amount / intake) * maxKeep
      const factor = maxKeep / intake;
      keptAmount = keptAmount * factor;
    }
    const currentRate = rates?.[b.type] ?? b.rate ?? 90;
    return { ...b, amount: keptAmount, rate: currentRate };
  });
}

// computeForwardsSummary: รวมยอดส่งต่อต่อเลข (สำหรับ section "เลขส่งต่อ" + ส่ง LINE)
function computeForwardsSummary(bets, forwards, settings) {
  if (!bets || bets.length === 0) return [];
  const comboMap = computeIntakePerCombo(bets);
  const result = [];
  Object.values(comboMap).forEach(combo => {
    const maxKeep = getMaxKeep(combo.lotteryId, combo.drawDate, combo.number, combo.type, forwards, settings);
    if (maxKeep === null || combo.intake <= maxKeep) return;
    const forwarded = combo.intake - maxKeep;
    result.push({
      lotteryId: combo.lotteryId, drawDate: combo.drawDate,
      number: combo.number, type: combo.type,
      intake: combo.intake, maxKeep, kept: maxKeep, forwarded,
      betCount: combo.betIds.length
    });
  });
  // Sort: 3บน/3ตัว/โต๊ด first, then 2บน/2ล่าง — within each by number
  const typeOrder = { '3บน': 1, '3ตัว': 2, 'โต๊ด': 3, '2บน': 4, '2ล่าง': 5 };
  result.sort((a, b) => {
    const ta = typeOrder[a.type] || 99;
    const tb = typeOrder[b.type] || 99;
    if (ta !== tb) return ta - tb;
    return a.number.localeCompare(b.number);
  });
  return result;
}

function computePayoutFor3D(num3, bets) {
  if (!num3 || num3.length !== 3) return { total: 0, breakdown: { direct: 0, two_up: 0, toad: 0 } };
  let total = 0;
  const breakdown = { direct: 0, two_up: 0, toad: 0 };
  const last2 = num3.slice(-2);
  const perms = new Set(getToadVariations(num3));
  bets.forEach(b => {
    const amt = parseFloat(b.amount) || 0;
    const rate = parseFloat(b.rate) || 0;
    const halfMult = b.halfPay ? 0.5 : 1;
    const pay = amt * rate * halfMult;
    if ((b.type === '3บน' || b.type === '3ตัว') && b.number === num3) {
      breakdown.direct += pay; total += pay;
    } else if (b.type === '2บน' && b.number === last2) {
      breakdown.two_up += pay; total += pay;
    } else if (b.type === 'โต๊ด' && perms.has(b.number) && b.number !== num3) {
      breakdown.toad += pay; total += pay;
    }
  });
  return { total, breakdown };
}

function computePayoutFor2DLow(num2, bets) {
  if (!num2 || num2.length !== 2) return 0;
  let total = 0;
  bets.forEach(b => {
    if (b.type === '2ล่าง' && b.number === num2) {
      const halfMult = b.halfPay ? 0.5 : 1;
      total += (parseFloat(b.amount) || 0) * (parseFloat(b.rate) || 0) * halfMult;
    }
  });
  return total;
}

function computeScenarios(bets) {
  if (bets.length === 0) return { best: null, worst: null, intake: 0 };
  const totalIntake = bets.reduce((s, b) => s + (parseFloat(b.amount) || 0), 0);

  // === 3-digit payout analysis ===
  // For "worst case" (max payout), check all 3-digit numbers that someone bet on.
  // For "best case" (min payout), if there's ANY 3-digit number not in bets, payout = 0.
  // Since 1000 possible 3-digit numbers exist, and bets typically cover < 1000 unique,
  // best case is almost always 0 — but we verify by checking coverage.
  const candidates3D = new Set();
  bets.forEach(b => {
    if (b.type === '3บน' || b.type === '3ตัว') {
      candidates3D.add(b.number);
    } else if (b.type === 'โต๊ด') {
      getToadVariations(b.number).forEach(p => candidates3D.add(p));
    } else if (b.type === '2บน') {
      // 2บน triggers on last 2 of 3-digit prize.
      // Best case for 2บน: any number that does NOT end with this 2-digit.
      // Just add one representative to compute worst case payout.
      candidates3D.add('0' + b.number);
    }
  });

  let max3 = { num: null, pay: 0 };
  let min3 = { num: null, pay: 0 };  // Best case = 0 by default (if not all 3-digit covered)

  if (candidates3D.size > 0) {
    // Find worst case payout (max)
    max3 = { num: null, pay: 0 };
    candidates3D.forEach(n => {
      const p = computePayoutFor3D(n, bets).total;
      if (p > max3.pay) max3 = { num: n, pay: p };
    });

    // Find best case payout (min)
    // First: check if any 3-digit number NOT in bets exists → those give payout 0
    // Since 3-digit space is 000-999 (1000 numbers), if bets cover less than 1000 distinct combos,
    // best case = 0
    // Need to also account for "2บน" coverage — a number not ending in any 2บน will be safer
    const all2BNs = new Set();
    bets.forEach(b => { if (b.type === '2บน') all2BNs.add(b.number); });

    // If we have less than 100 distinct 2บน + less than 1000 distinct 3-digit bets,
    // there exists at least one 3-digit number that:
    //   - is not in candidates3D AND last-2-digits not in all2BNs
    //   - that's an "untouched" number → payout 0
    // For practical purposes: just check candidates3D + look for non-matching
    let foundZero = false;
    // Quick check: scan some non-bet numbers
    for (let i = 0; i < 1000 && !foundZero; i++) {
      const n = i.toString().padStart(3, '0');
      if (candidates3D.has(n)) continue;
      const p = computePayoutFor3D(n, bets).total;
      if (p === 0) { min3 = { num: n, pay: 0 }; foundZero = true; }
    }
    // Fallback: if all numbers happen to be in candidates3D, find minimum among them
    if (!foundZero) {
      min3 = { num: null, pay: Infinity };
      candidates3D.forEach(n => {
        const p = computePayoutFor3D(n, bets).total;
        if (p < min3.pay) min3 = { num: n, pay: p };
      });
      if (min3.pay === Infinity) min3 = { num: null, pay: 0 };
    }
  }

  // === 2 ล่าง payout analysis ===
  const candidates2L = new Set();
  bets.forEach(b => { if (b.type === '2ล่าง') candidates2L.add(b.number); });

  let max2 = { num: null, pay: 0 };
  let min2 = { num: null, pay: 0 };  // Best case = 0 by default

  if (candidates2L.size > 0) {
    // Worst case
    max2 = { num: null, pay: 0 };
    candidates2L.forEach(n => {
      const p = computePayoutFor2DLow(n, bets);
      if (p > max2.pay) max2 = { num: n, pay: p };
    });

    // Best case: if not all 100 numbers in bets, there's a 0-payout number
    if (candidates2L.size < 100) {
      // Find one number not in bets
      for (let i = 0; i < 100; i++) {
        const n = i.toString().padStart(2, '0');
        if (!candidates2L.has(n)) { min2 = { num: n, pay: 0 }; break; }
      }
    } else {
      // All 100 covered — find minimum
      min2 = { num: null, pay: Infinity };
      candidates2L.forEach(n => {
        const p = computePayoutFor2DLow(n, bets);
        if (p < min2.pay) min2 = { num: n, pay: p };
      });
      if (min2.pay === Infinity) min2 = { num: null, pay: 0 };
    }
  }

  // === Detect what categories of bets exist ===
  // hasUpper3 = มีโพย 3 ตัวตรง/โต๊ด (รางวัลที่ 1 จ่ายเลขเต็ม)
  // hasUpper2 = มีโพย 2 ตัวบน (last-2 ของรางวัลที่ 1)
  // hasUpper = hasUpper3 || hasUpper2 (จัดกลุ่ม "บน" — ออกรางวัลที่ 1)
  // hasLower = มีโพย 2 ตัวล่าง (เลขท้าย 2 ตัว อิสระ)
  const hasUpper3 = bets.some(b => b.type === '3บน' || b.type === '3ตัว' || b.type === 'โต๊ด');
  const hasUpper2 = bets.some(b => b.type === '2บน');
  const hasUpper = hasUpper3 || hasUpper2;
  const hasLower = bets.some(b => b.type === '2ล่าง');

  // === Scenarios แสดงเฉพาะที่เกี่ยวข้อง ===
  // ถ้ามีแค่ "บน" — แสดง 2 scenarios (ไม่ถูก / ถูก)
  // ถ้ามีแค่ "ล่าง" — แสดง 2 scenarios (ไม่ถูก / ถูก)
  // ถ้ามีทั้งคู่ — แสดง 4 scenarios

  const noWinPay = 0;
  const onlyUpperPay = max3.pay;
  const onlyLowerPay = max2.pay;
  const bothWinPay = max3.pay + max2.pay;

  return {
    intake: totalIntake,
    // Legacy fields (best/worst) — keep for backward compat
    best: { num3: min3.num, num2low: min2.num, payout: min3.pay + min2.pay, net: totalIntake - (min3.pay + min2.pay) },
    worst: { num3: max3.num, num2low: max2.num, payout: max3.pay + max2.pay, net: totalIntake - (max3.pay + max2.pay) },
    // Flags: which categories have bets
    hasUpper,
    hasUpper3,
    hasUpper2,
    hasLower,
    // New: 4 explicit scenarios
    scenarios: {
      noWin: {
        label: 'ไม่มีใครถูกเลย',
        num3: min3.num, num2low: min2.num,
        payout: 0,
        net: totalIntake,
      },
      onlyUpper: {
        label: hasUpper3 ? 'ถูกแค่บน (3 ตัว/2 บน)' : 'ถูก 2 ตัวบน',
        num3: max3.num, num2low: min2.num,
        payout: onlyUpperPay,
        net: totalIntake - onlyUpperPay,
      },
      onlyLower: {
        label: 'ถูก 2 ตัวล่าง',
        num3: min3.num, num2low: max2.num,
        payout: onlyLowerPay,
        net: totalIntake - onlyLowerPay,
      },
      bothWin: {
        label: 'ถูกทั้งบนและล่าง',
        num3: max3.num, num2low: max2.num,
        payout: bothWinPay,
        net: totalIntake - bothWinPay,
      },
    },
  };
}

function formatListForLine(bets, lottery, drawDate) {
  if (bets.length === 0) return '';
  const byCust = {};
  bets.forEach(b => {
    const c = b.customer || '— ไม่ระบุชื่อ —';
    if (!byCust[c]) byCust[c] = [];
    byCust[c].push(b);
  });
  const lines = [
    `🎰 Royal 888`,
    `📋 ${lottery.name}`,
    `🗓 งวด ${formatDrawDateLong(drawDate)}`,
    '─────────────',
  ];
  let total = 0;
  const sortedCusts = Object.keys(byCust).sort((a, b) => {
    if (a.startsWith('—')) return 1;
    if (b.startsWith('—')) return -1;
    return a.localeCompare(b, 'th');
  });
  sortedCusts.forEach(cust => {
    const items = byCust[cust];
    lines.push('');
    lines.push(`👤 ${cust}`);
    const byNum = {};
    items.forEach(b => { if (!byNum[b.number]) byNum[b.number] = []; byNum[b.number].push(b); });
    let custTotal = 0;
    Object.entries(byNum).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([num, group]) => {
      const parts = group.map(b => `${typeShort(b.type)} ${fmt(b.amount)}`).join(' / ');
      lines.push(`  ${num}  ${parts}`);
      group.forEach(b => { custTotal += parseFloat(b.amount) || 0; }); // จำนวนที่แก้ในรายการเป็นข้อความ → ต้องแปลงก่อนบวก
    });
    lines.push(`  รวม: ฿${fmt(custTotal)} (${items.length} รายการ)`);
    total += custTotal;
  });
  lines.push('');
  lines.push('─────────────');
  lines.push(`💰 รวมทั้งหมด ฿${fmt(total)} · ${bets.length} รายการ`);
  return lines.join('\n');
}

function formatSummaryForLine(bets, lottery, drawDate) {
  if (bets.length === 0) return 'ยังไม่มีโพยในงวดนี้';
  const s = computeScenarios(bets);
  const totalMaxPayout = bets.reduce((s, b) => s + (parseFloat(b.amount) || 0) * (parseFloat(b.rate) || 0), 0);
  const fmtSigned = (n) => (n >= 0 ? '+' : '-') + '฿' + fmt(Math.abs(n));

  // Customer breakdown
  const byCust = {};
  bets.forEach(b => {
    const c = b.customer || '— ไม่ระบุ —';
    if (!byCust[c]) byCust[c] = { intake: 0, count: 0 };
    byCust[c].intake += parseFloat(b.amount) || 0;
    byCust[c].count++;
  });
  const custList = Object.entries(byCust).sort((a, b) => b[1].intake - a[1].intake);

  const lines = [
    '🎰 Royal 888',
    `📋 ${lottery.name}`,
    `🗓 งวด ${formatDrawDateLong(drawDate)}`,
    '━━━━━━━━━━━━━━━',
    '',
    '💰 ยอดเงิน',
    `   รับเข้ารวม:   ฿${fmt(s.intake)}`,
    `   จ่ายเพดาน:    ฿${fmt(totalMaxPayout)}`,
    '',
    '📊 ความเสี่ยง',
    `   เสี่ยงได้สูงสุด: ${fmtSigned(s.best.net)}`,
    `      (ถ้าออก ${scenLabel(s.best)})`,
    `   เสี่ยงเสียสุด:  ${fmtSigned(s.worst.net)}`,
    `      (ถ้าออก ${scenLabel(s.worst)})`,
    '',
  ];
  if (custList.length > 1 || (custList.length === 1 && !custList[0][0].startsWith('—'))) {
    lines.push(`👥 โพยแยกตามลูกค้า (${custList.length})`);
    custList.forEach(([name, info]) => {
      lines.push(`   ${name}: ฿${fmt(info.intake)} (${info.count} รายการ)`);
    });
    lines.push('');
  }

  // Half-pay summary
  const halfPayCombos = {};
  bets.forEach(b => {
    if (b.halfPay) {
      const key = b.number + '|' + b.type;
      halfPayCombos[key] = (halfPayCombos[key] || 0) + 1;
    }
  });
  if (Object.keys(halfPayCombos).length > 0) {
    lines.push('½ เลขอั้นจ่ายครึ่ง');
    Object.keys(halfPayCombos).forEach(key => {
      const [num, type] = key.split('|');
      lines.push('   ' + num + ' ' + typeShort(type));
    });
    lines.push('');
  }

  lines.push(`🎯 จำนวนโพยทั้งหมด: ${bets.length} รายการ`);
  lines.push('━━━━━━━━━━━━━━━');
  lines.push('#Royal888');
  return lines.join('\n');
}

function formatCutsForLine(cuts, lottery, drawDate) {
  if (cuts.length === 0) return '';
  const lines = [
    '🎰 Royal 888',
    '✂️ สรุปเลขที่ตัด',
    `📋 ${lottery.name}`,
    `🗓 งวด ${formatDrawDateLong(drawDate)}`,
    '━━━━━━━━━━━━━━━',
  ];

  // Aggregate by type for clarity
  // Group: { '3บน': { '223': {amount, count, reduceLogs, capToLatest} }, ... }
  const grouped = {};
  cuts.forEach(c => {
    c.items.forEach(it => {
      if (!grouped[it.type]) grouped[it.type] = {};
      const key = it.number;
      if (!grouped[it.type][key]) {
        grouped[it.type][key] = { amount: 0, count: 0, reduceLogs: [], capToLatest: null };
      }
      grouped[it.type][key].amount += it.amount || 0;
      grouped[it.type][key].count += it.count || 0;
      if (c.kind === 'reduce' && it.keepPercent !== undefined) {
        grouped[it.type][key].reduceLogs.push(it.keepPercent);
      }
      if (c.kind === 'cap-intake' && it.capTo !== undefined) {
        grouped[it.type][key].capToLatest = it.capTo;
      }
    });
  });

  let totalAmount = 0, totalCount = 0;
  const typeOrder = ['3บน', '3ตัว', 'โต๊ด', '2บน', '2ล่าง'];

  typeOrder.forEach(type => {
    if (!grouped[type]) return;
    const items = grouped[type];
    const entries = Object.entries(items).sort((a, b) => a[0].localeCompare(b[0]));
    if (entries.length === 0) return;
    lines.push('');
    lines.push(`◆ ${typeFullName(type)} (${entries.length} เลข)`);
    entries.forEach(([num, data]) => {
      let tag = '';
      if (data.capToLatest !== null) {
        tag = ` (จำกัด ฿${fmt(data.capToLatest)})`;
      } else if (data.reduceLogs.length > 0) {
        tag = ` (เหลือ ${data.reduceLogs[data.reduceLogs.length-1]}%)`;
      }
      lines.push(`   ${num}  ฿${fmt(data.amount)}${tag}`);
      totalAmount += data.amount;
      totalCount += data.count;
    });
  });

  lines.push('');
  lines.push('━━━━━━━━━━━━━━━');
  lines.push(`💰 ตัดออก/ลด รวม ฿${fmt(totalAmount)}`);
  lines.push(`📦 ${totalCount} รายการ`);
  lines.push('#Royal888');
  return lines.join('\n');
}

// ==================== STORAGE HOOK (localStorage) ====================
// เวลาใช้งานล่าสุด (ใช้ตัดสินว่ารีเฟรช/เปิดใหม่แล้วต้องใส่ PIN หรือไม่)
const ACTIVE_KEY = 'lotto888-active-at';
const readActiveAt = () => { try { return Number(localStorage.getItem(ACTIVE_KEY)) || 0; } catch { return 0; } };
const writeActiveAt = (t) => { try { localStorage.setItem(ACTIVE_KEY, String(t)); } catch {} };
const clearActiveAt = () => { try { localStorage.removeItem(ACTIVE_KEY); } catch {} };

// บันทึกลงเครื่อง: พื้นที่เต็ม → ทิ้งสำรองอัตโนมัติชุดเก่าแล้วลองใหม่ · ยังไม่พอ → แจ้งเตือน (เดิมบันทึกไม่ลงเงียบๆ รีเฟรชแล้วโพยหาย)
function saveLS(key, v) {
  const raw = JSON.stringify(v);
  for (let attempt = 0; attempt < 8; attempt++) {
    try { localStorage.setItem(key, raw); return true; }
    catch (e) {
      let snaps = [];
      try { snaps = JSON.parse(localStorage.getItem(STORAGE.backups) || '[]'); } catch (_) {}
      if (key === STORAGE.backups || !snaps.length) break;
      try { localStorage.setItem(STORAGE.backups, JSON.stringify(snaps.slice(0, snaps.length - 1))); } catch (_) { try { localStorage.removeItem(STORAGE.backups); } catch (__) {} }
    }
  }
  console.error('บันทึกไม่ได้ (พื้นที่เต็ม):', key);
  if (key !== STORAGE.backups) window.dispatchEvent(new CustomEvent('lotto-storage-full', { detail: key }));
  return false;
}

const useStorage = (key, initial) => {
  const [value, setValue] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      return raw !== null ? JSON.parse(raw) : initial;
    } catch { return initial; }
  });
  const save = (next) => {
    setValue(prev => {
      const v = typeof next === 'function' ? next(prev) : next;
      saveLS(key, v);
      return v;
    });
  };
  return [value, save];
};

// ==================== TOAST / CONFIRM SYSTEM ====================
const ToastContext = React.createContext(null);

function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const [confirmState, setConfirmState] = useState(null);

  const show = (msg, type = 'info', duration = 2800) => {
    const id = uid();
    setToasts(prev => [...prev, { id, msg, type }]);
    setTimeout(() => {
      setToasts(prev => prev.map(t => t.id === id ? { ...t, out: true } : t));
      setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 200);
    }, duration);
  };

  const askConfirm = (msg, opts = {}) => {
    return new Promise(resolve => {
      setConfirmState({
        msg,
        confirmLabel: opts.confirmLabel || 'ยืนยัน',
        cancelLabel: opts.cancelLabel || 'ยกเลิก',
        danger: opts.danger,
        onResolve: (v) => { setConfirmState(null); resolve(v); }
      });
    });
  };

  // Render toasts via portal-like approach in DOM
  useEffect(() => {
    const container = document.getElementById('toast-container');
    if (!container) return;
    container.innerHTML = '';
    toasts.forEach(t => {
      const div = document.createElement('div');
      const colors = {
        success: { bg: '#ffffff', border: '#86efac', text: '#15803d', icon: '✓' },
        error:   { bg: '#ffffff', border: '#fca5a5', text: '#b91c1c', icon: '⚠' },
        info:    { bg: '#ffffff', border: '#fcd34d', text: '#92400e', icon: 'ℹ' },
      };
      const c = colors[t.type] || colors.info;
      div.className = t.out ? 'toast-out' : 'toast-in';
      div.style.cssText = [
        'background:' + c.bg,
        'border:1px solid ' + c.border,
        'border-radius:14px',
        'padding:12px 18px',
        'color:' + c.text,
        'font-family:"Bai Jamjuree",sans-serif',
        'font-size:13px',
        'font-weight:500',
        'box-shadow:0 8px 20px rgba(0,0,0,0.08),0 2px 6px rgba(0,0,0,0.04)',
        'max-width:380px',
        'pointer-events:auto',
        'display:flex',
        'align-items:center',
        'gap:10px',
        'min-width:200px',
      ].join(';');
      div.innerHTML = '<span style="font-size:16px;font-weight:bold;flex-shrink:0">' + c.icon + '</span><span style="flex:1">' + t.msg.replace(/</g, '&lt;') + '</span>';
      container.appendChild(div);
    });
  }, [toasts]);

  return (
    <ToastContext.Provider value={{ show, askConfirm }}>
      {children}
      {confirmState && (
        <div className="fixed inset-0 z-[10020] flex items-center justify-center p-5" onClick={() => confirmState.onResolve(false)}>
          <div className="absolute inset-0 bg-stone-900/40 backdrop-blur-sm"/>
          <div onClick={e => e.stopPropagation()}
            className="relative max-w-sm w-full bg-white rounded-2xl shadow-2xl overflow-hidden toast-in"
            style={{ boxShadow: '0 20px 60px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.05)' }}>
            <div className="p-6">
              <div className={'w-12 h-12 rounded-full mx-auto mb-3 flex items-center justify-center ' + (confirmState.danger ? 'bg-red-50 text-red-600' : 'bg-stone-100 text-stone-700')}>
                {confirmState.danger
                  ? <AlertTriangle size={22}/>
                  : <AlertCircle size={22}/>}
              </div>
              <p className="text-center text-stone-800 font-display text-lg leading-relaxed whitespace-pre-line">{confirmState.msg}</p>
            </div>
            <div className="grid grid-cols-2 border-t border-stone-100">
              <button onClick={() => confirmState.onResolve(false)}
                className="py-4 text-stone-600 font-display text-lg border-r border-stone-100 active:bg-stone-50">
                {confirmState.cancelLabel}
              </button>
              <button onClick={() => confirmState.onResolve(true)}
                className={'py-4 font-display text-lg font-semibold active:bg-stone-50 ' + (confirmState.danger ? 'text-red-600' : 'text-red-700')}>
                {confirmState.confirmLabel}
              </button>
            </div>
          </div>
        </div>
      )}
    </ToastContext.Provider>
  );
}

const useToast = () => {
  const ctx = React.useContext(ToastContext);
  if (!ctx) return {
    show: (msg) => console.log('[toast]', msg),
    askConfirm: (msg) => Promise.resolve(window.confirm(msg))
  };
  return ctx;
};


// ==================== AUTH HELPERS ====================
// Simple hash for PIN (not cryptographically secure but enough for local PIN)
function hashPin(pin) {
  let hash = 5381;
  const str = 'lotto888-salt-' + pin;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) + hash) + str.charCodeAt(i);
    hash = hash & 0xFFFFFFFF;
  }
  return hash.toString(36) + '-' + str.length;
}

function LoginScreen({ auth, onSuccess, onSetup, onReset, onExport, onResetPinOnly, onSkip }) {
  const toast = useToast();
  const [pin, setPin] = useState('');
  const [confirmPin, setConfirmPin] = useState('');
  const [step, setStep] = useState(auth?.pinHash ? 'login' : 'setup'); // 'setup' | 'setup-confirm' | 'login'
  const [error, setError] = useState('');
  const [attempts, setAttempts] = useState(0);

  const handleDigit = (d) => {
    setError('');
    if (step === 'setup' || step === 'setup-confirm') {
      const target = step === 'setup' ? pin : confirmPin;
      const setter = step === 'setup' ? setPin : setConfirmPin;
      if (target.length < 6) setter(target + d);
    } else {
      // login — เดิมตรวจเฉพาะตอนครบ 6 หลัก → คนตั้ง PIN 4-5 หลักเข้าแอปไม่ได้เลย
      // ตอนนี้: ครบ 4 หลักขึ้นไปและตรง → เข้าทันที · ผิด → แจ้งเมื่อครบความยาว PIN ที่ตั้งไว้ (อ่านจากท้าย hash)
      if (pin.length < 6) {
        const newPin = pin + d;
        setPin(newPin);
        const m = String(auth?.pinHash || '').match(/-(\d+)$/);
        const setLen = m ? parseInt(m[1], 10) - 'lotto888-salt-'.length : 0;
        const expectLen = setLen >= 4 && setLen <= 6 ? setLen : 6;
        if (newPin.length >= 4 && hashPin(newPin) === auth.pinHash) onSuccess();
        else if (newPin.length === expectLen) checkLogin(newPin);
      }
    }
  };

  const checkLogin = (p) => {
    const h = hashPin(p);
    if (h === auth.pinHash) {
      onSuccess();
    } else {
      setError('PIN ไม่ถูกต้อง');
      setPin('');
      setAttempts(a => a + 1);
      if (navigator.vibrate) navigator.vibrate(200);
    }
  };

  const handleClear = () => {
    setError('');
    if (step === 'setup') setPin('');
    else if (step === 'setup-confirm') setConfirmPin('');
    else setPin('');
  };

  const handleBack = () => {
    setError('');
    if (step === 'setup') setPin(p => p.slice(0, -1));
    else if (step === 'setup-confirm') setConfirmPin(p => p.slice(0, -1));
    else setPin(p => p.slice(0, -1));
  };

  const proceedSetup = () => {
    setError('');
    if (step === 'setup') {
      if (pin.length < 4) { setError('PIN ต้องอย่างน้อย 4 หลัก'); return; }
      setStep('setup-confirm');
    } else {
      if (pin !== confirmPin) {
        setError('PIN ไม่ตรงกัน');
        setConfirmPin('');
        return;
      }
      onSetup(hashPin(pin));
    }
  };

  const [showRecovery, setShowRecovery] = useState(false);

  const skipSetup = async () => {
    const ok = await toast.askConfirm('ข้ามการตั้ง PIN ?\n\nใครก็ตามที่เปิดมือถือนี้จะเห็นโพยของคุณได้\nคุณตั้ง PIN ภายหลังได้ในเมนู', { confirmLabel: 'ข้าม' });
    if (ok) onSkip();
  };

  const handleExportBeforeReset = () => {
    onExport();
    toast.show('ดาวน์โหลดไฟล์สำรองแล้ว — เก็บไว้ในเครื่อง', 'success', 4000);
  };

  const handleRemovePinKeepData = async () => {
    const ok = await toast.askConfirm('เอา PIN ออก แต่เก็บข้อมูลทั้งหมดไว้ ?\n\nหลังจากนี้ใครก็ตามที่เปิดมือถือนี้\nจะเห็นโพยของคุณได้ทันที\n\nคุณตั้ง PIN ใหม่ได้ในเมนูภายหลัง', { danger: true, confirmLabel: 'เอา PIN ออก' });
    if (ok) onResetPinOnly();
