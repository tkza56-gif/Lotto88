<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สถิติหวย</title>
<meta name="description" content="สถิติผลหวยไทย (GLO) ลาว และฮานอย (XSMB) ย้อนหลัง พร้อมทดสอบความสุ่ม — เพื่อศึกษาสถิติ">
<meta name="theme-color" content="#d71f2b">
<link rel="preconnect" href="https://tlykaqoypstvdrlivwvu.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#1b2340; --ink2:#5b6478; --muted:#687185; --line:#e6e9f0; --soft:#eef1f6;
  --thai:#d71f2b; --lao:#1d5fd6; --hanoi:#b85600; --on-acc:#ffffff;
  --good:#16834a; --good-bg:#e5f5ec; --warn:#a15c00; --warn-bg:#fdf1de; --info-bg:#eaf0fb;
  --c-green:#16834a; --c-blue:#1d5fd6; --c-purple:#6b3fd1;
  --acc:var(--thai);
  --radius:18px; --shadow:0 1px 2px rgba(20,30,60,.06),0 6px 20px rgba(20,30,60,.06);
  --font:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1422; --card:#182033; --ink:#eef1f8; --ink2:#b4bccd; --muted:#8d97ab; --line:#283149; --soft:#202a40;
  --thai:#f0505a; --lao:#5a88f2; --hanoi:#d27420; --on-acc:#10141f;
  --good:#4fd38a; --good-bg:#16352a; --warn:#ffb648; --warn-bg:#3a2c12; --info-bg:#1c2a46;
  --c-green:#4fd38a; --c-blue:#6e9bff; --c-purple:#a98bff;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#0f1422; --card:#182033; --ink:#eef1f8; --ink2:#b4bccd; --muted:#8d97ab; --line:#283149; --soft:#202a40;
  --thai:#f0505a; --lao:#5a88f2; --hanoi:#d27420; --on-acc:#10141f;
  --good:#4fd38a; --good-bg:#16352a; --warn:#ffb648; --warn-bg:#3a2c12; --info-bg:#1c2a46;
  --c-green:#4fd38a; --c-blue:#6e9bff; --c-purple:#a98bff; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:520px;margin:0 auto;padding:14px 16px calc(92px + env(safe-area-inset-bottom))}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:var(--acc);display:grid;place-items:center;color:var(--on-acc);flex:none}
.brand h1{font-size:22px;line-height:1.1;margin:0;font-weight:700;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap}
.chip-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:6px 10px;border-radius:999px;background:var(--good-bg);color:var(--good);white-space:nowrap;border:0}
.chip-status .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip-status.warn{background:var(--warn-bg);color:var(--warn)}
.chip-status.load{background:var(--soft);color:var(--muted)}
/* lottery tabs */
.ltabs{display:grid;grid-template-columns:repeat(3,1fr);border-radius:14px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line)}
.ltabs button{border:0;background:transparent;padding:11px 4px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink2)}
.ltabs button[aria-pressed="true"]{color:var(--on-acc)}
.ltabs button[data-l="thai"][aria-pressed="true"]{background:var(--thai)}
.ltabs button[data-l="lao"][aria-pressed="true"]{background:var(--lao)}
.ltabs button[data-l="hanoi"][aria-pressed="true"]{background:var(--hanoi)}
.ltabs .sw{width:8px;height:8px;border-radius:50%}
/* chips row */
.chips{display:flex;gap:8px;margin:10px 0 0;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:1 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:600}
.chip .na{font-size:11px;opacity:.8}
/* cards */
.card{position:relative;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:16px;margin-top:12px}
.card h2{font-size:16px;margin:0 0 10px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 .ic{color:var(--acc);display:flex}
.sub{color:var(--muted);font-size:12.5px;margin:-6px 0 10px}
.hero{background:var(--acc);color:var(--on-acc);border-radius:var(--radius);padding:16px 18px 18px;margin-top:12px;position:relative;overflow:hidden}
.hero .lbl{font-size:14px;font-weight:600;opacity:.95}
.hero .big{font-size:52px;font-weight:700;letter-spacing:1px;line-height:1.05;margin-top:2px}
.hero .date{position:absolute;top:16px;right:18px;font-size:13px;font-weight:500;opacity:.95}
.hero .deco{position:absolute;right:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.kv .k{font-size:12.5px;color:var(--muted);font-weight:500}
.kv .v{font-size:26px;font-weight:700;color:var(--acc);line-height:1.2}
.kv .v.sm{font-size:20px}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-top:1px solid var(--line);font-size:14px}
.list li:first-child{border-top:0}
.list .d{color:var(--ink2);display:flex;align-items:center;gap:8px}
.list .n{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.list .n small{font-weight:500;font-size:12px;color:var(--muted);margin-right:6px}
.note{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12px;color:var(--ink2);background:var(--soft);border-radius:999px;padding:8px 12px;margin-top:12px;text-align:center}
.empty{text-align:center;color:var(--ink2);padding:22px 8px;font-size:14px;line-height:1.6}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600}
.badge.good{background:var(--good-bg);color:var(--good)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.na{background:var(--soft);color:var(--ink2)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;box-shadow:var(--shadow)}
.tile .t{font-size:24px;font-weight:700}
.tile .l{font-size:12px;color:var(--ink2)}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ref{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:4 4}
.chart .hit{fill:transparent}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.legend i.line{height:0;border-top:2px dashed var(--ink2);border-radius:0;vertical-align:3px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s;z-index:5}
.tip.on{opacity:1}
.tip:not(.on){visibility:hidden;left:0!important}
details.tbl{margin-top:8px;font-size:12.5px;color:var(--ink2)}
details.tbl summary{cursor:pointer;color:var(--muted)}
details.tbl table{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
details.tbl td,details.tbl th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:center}
/* heatmap */
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.heat button{aspect-ratio:1;border:0;border-radius:6px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.ramp{height:8px;border-radius:99px;margin:10px 0 2px}
.ramp-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.miss{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;text-align:center}
.miss .c{width:min(52px,100%);aspect-ratio:1;margin:0 auto;border-radius:50%;border:2px solid var(--acc);display:grid;place-items:center;font-weight:700;font-size:19px;color:var(--acc)}
.miss small{display:block;font-size:11.5px;color:var(--ink2);margin-top:4px}
/* bayes rows */
.brow{display:grid;grid-template-columns:20px 42px 54px 1fr;align-items:center;gap:6px;padding:7px 0;border-top:1px solid var(--line)}
.brow:first-of-type{border-top:0}
.brow .dot{width:14px;height:14px;border-radius:50%;background:var(--acc)}
.brow .num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.brow .pct{font-size:13px;font-weight:600;color:var(--ink2)}
/* odds */
.odds li{display:flex;justify-content:space-between;padding:10px 2px;border-top:1px solid var(--line);font-size:14px}
.odds li:first-child{border-top:0}
.odds b{font-variant-numeric:tabular-nums}
.facts{margin:0;padding:0;list-style:none;line-height:1.7;font-size:14px;color:var(--ink2)}
.src a{color:var(--acc)}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);max-width:520px;margin:0 auto;z-index:10}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--muted);padding:6px 0;border-radius:12px}
.nav button[aria-current="page"]{color:var(--acc);background:var(--soft);font-weight:700}
.skel{height:120px;border-radius:var(--radius);background:linear-gradient(90deg,var(--soft),var(--card),var(--soft));background-size:200% 100%;animation:sk 1.2s infinite linear;margin-top:12px}
@keyframes sk{to{background-position:-200% 0}}
.dim{opacity:.55;transition:opacity .2s}
@media (max-width:360px){.hero .big{font-size:44px}.brand h1{font-size:19px}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div>
      <div><h1>สถิติหวย</h1><small>ผลจริง · ตรวจหลายแหล่ง</small></div>

  <button data-t="analysis"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 20h18M6 16l4-5 3 3 5-7"/></svg>วิเคราะห์</button>

</nav>

<script>
"use strict";
// ═══ การเชื่อมต่อ (Supabase โปรเจกต์ Lotto888 — คีย์สาธารณะ อ่านอย่างเดียว) ═══
const SUPA = "https://tlykaqoypstvdrlivwvu.supabase.co";
const KEY = "sb_publishable_IAmYP1QeDb5otH0sjMZaMA_Bme1gxwG";
const APP_VER = "2.3.0";
const REFRESH_MS = 5 * 60 * 1000;

const $ = (s, el = document) => el.querySelector(s);
const pad = (n, w = 2) => String(n).padStart(w, "0");
const MON = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const thDate = (iso) => { const [y, m, d] = iso.split("-").map(Number); return `${d} ${MON[m - 1]} ${y + 543}`; };
const hhmm = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ═══ สถานะ ═══
const ALLOW = { lottery: ["thai", "lao", "hanoi"], round: ["r17", "r18", "r19"], range: ["3m", "1y", "2y", "5y"],
  tab: ["latest", "analysis", "freq", "map", "learn"], pick: ["top2", "bottom2", "top3"] };
const S = { lottery: "thai", round: "r18", range: "2y", tab: "latest", pick: "bottom2" };
{ const saved = store.get("lotto.ui") || {}; for (const k in ALLOW) if (ALLOW[k].includes(saved[k])) S[k] = saved[k]; }

// ═══ กรองข้อมูลที่ขอบเขต: เก็บเฉพาะแถวที่ทุกช่องเป็นตัวเลขตามรูปแบบ (กัน XSS/ข้อมูลเพี้ยน — แหล่งความจริงเดียว) ═══
const D = (v, n) => typeof v === "string" && new RegExp(`^\\d{${n}}$`).test(v);
const isDate = (v) => typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v);
const cleanThai = (rows) => (Array.isArray(rows) ? rows : []).filter((r) => r && isDate(r.draw_date) && D(r.first_prize, 6) && D(r.last2, 2) &&
  Array.isArray(r.front3) && r.front3.length === 2 && r.front3.every((x) => D(x, 3)) &&
  Array.isArray(r.back3) && r.back3.length === 2 && r.back3.every((x) => D(x, 3)));
const cleanHanoi = (rows) => (Array.isArray(rows) ? rows : []).filter((r) => r && isDate(r.draw_date) && D(r.special, 5) && D(r.prize1, 5) &&
  r.top3 === r.special.slice(-3) && r.top2 === r.special.slice(-2) && r.bottom2 === r.prize1.slice(-2));
// ลาว: ผลประกาศมีแค่เลข 6 ตัว (เลข 5/4/3/2 ตัว = หางของเลข 6 ตัว) → เก็บเฉพาะ six แล้วตัดหางเอง
const cleanLao = (rows) => (Array.isArray(rows) ? rows : []).filter((r) => r && isDate(r.draw_date) && D(r.six, 6));
// ฮานอยพิเศษ/VIP: ไม่มีผลทางการ → ฐานข้อมูลเก็บเฉพาะงวดที่เว็บรวมผล ≥ 2 แห่งตรงกัน (3 ตัวบน + 2 ตัวล่าง · 2 ตัวบน = หางของ 3 ตัว)
const cleanHx = (rows) => (Array.isArray(rows) ? rows : []).filter((r) => r && isDate(r.draw_date) && D(r.top3, 3) && D(r.bottom2, 2) && r.top2 === r.top3.slice(-2));
const cleanAll = (d) => ({ thai: cleanThai(d.thai), hanoi: cleanHanoi(d.hanoi), lao: cleanLao(d.lao), hsp: cleanHx(d.hsp), hvip: cleanHx(d.hvip) });
const hasData = (d) => d && ((d.thai || []).length || (d.hanoi || []).length || (d.lao || []).length || (d.hsp || []).length || (d.hvip || []).length);
// ฮานอย 3 รอบ: พิเศษ 17:30 · ปกติ 18:30 (ทางการ XSMB) · VIP 19:30
const ROUNDS = [
  { id: "r17", key: "hsp", name: "พิเศษ", time: "17:30" },
  { id: "r18", key: "hanoi", name: "ปกติ", time: "18:30" },
  { id: "r19", key: "hvip", name: "VIP", time: "19:30" },
];
const roundOf = () => ROUNDS.find((r) => r.id === S.round) || ROUNDS[1];
const rowsOf = (L) => (L === "thai" ? DATA.thai : L === "lao" ? DATA.lao : DATA[roundOf().key]) || [];
let DATA = { thai: [], hanoi: [], lao: [], hsp: [], hvip: [], log: null, at: null, offline: false };

// ═══ โหลดข้อมูล ═══
async function rest(path) {
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = await fetch(`${SUPA}/rest/v1/${path}`, { headers: { apikey: KEY, Authorization: `Bearer ${KEY}` }, signal: ctl.signal });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } finally { clearTimeout(to); }
}
async function loadAll(table, cols) {
  let all = [];
  for (let off = 0; off < 20000; off += 1000) {
    const rows = await rest(`${table}?select=${cols}&order=draw_date.desc&limit=1000&offset=${off}`);
    all = all.concat(rows);
    if (rows.length < 1000) break;
  }
  return all;
}
async function refresh() {
  setStatus("load", "กำลังอัปเดต…");
  $("#view").classList.add("dim");
  try {
    const HX = "draw_date,top3,top2,bottom2";
    const [thai, hanoi, lao, hsp, hvip, log] = await Promise.all([
      loadAll("thai_draws", "draw_date,first_prize,last2,front3,back3"),
      loadAll("hanoi_draws", "draw_date,special,prize1,top3,top2,bottom2"),
      loadAll("lao_draws", "draw_date,six").catch(() => null),
      loadAll("hanoi_sp_draws", HX).catch(() => null),
      loadAll("hanoi_vip_draws", HX).catch(() => null),
      rest("fetch_log?select=run_at,job,status&status=in.(ok,conflict)&order=id.desc&limit=1").catch(() => []),
    ]);
    if (!thai.length && !hanoi.length && !(lao || []).length) throw new Error("ไม่มีข้อมูล");
    // ลาว/ฮานอยพิเศษ/VIP โหลดไม่ได้ → ใช้ของเดิม (ในหน่วยความจำ หรือในแคช) ไม่ล้างทิ้ง และขึ้นป้ายเตือน
    const old = store.get("lotto.data") || {};
    const keep = (k, rows, clean) => rows !== null ? rows : ((DATA[k] && DATA[k].length) ? DATA[k] : clean(old[k]));
    const miss = [lao === null && "ลาว", hsp === null && "พิเศษ", hvip === null && "VIP"].filter(Boolean);
    DATA = { ...cleanAll({ thai, hanoi, lao: keep("lao", lao, cleanLao), hsp: keep("hsp", hsp, cleanHx), hvip: keep("hvip", hvip, cleanHx) }),
      miss, log: (log[0] && typeof log[0].run_at === "string") ? log[0] : null, at: new Date().toISOString(), offline: false };
    if (!hasData(DATA)) throw new Error("ข้อมูลไม่ผ่านการตรวจรูปแบบ");
    store.set("lotto.data", DATA);
  } catch (e) {
    const cached = store.get("lotto.data");
    if (hasData(cached)) { DATA = { ...cached, ...cleanAll(cached), offline: true }; }
    else { DATA.error = e.message || String(e); }
  }
  $("#view").classList.remove("dim");
  render();
}

// ═══ สถิติ ═══
function normalCdf(z) {
  const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return z > 0 ? 1 - p : p;
}
function chiP(chi2, df) { // Wilson–Hilferty
  if (chi2 <= 0) return 1;
  const z = (Math.cbrt(chi2 / df) - (1 - 2 / (9 * df))) / Math.sqrt(2 / (9 * df));
  return 1 - normalCdf(z);
}
function cutDate() {
  const days = { "3m": 92, "1y": 365, "2y": 730, "5y": 1826 }[S.range];
  return new Date(Date.now() + 7 * 3600e3 - (days ?? 730) * 864e5).toISOString().slice(0, 10); // วันที่ตามเวลาไทย
}
function draws() {
  const L = S.lottery;
  const all = rowsOf(L);
  const cut = cutDate();
  return all.filter((d) => d.draw_date > cut);
}
// ประเภทเลข: 2 บน · 2 ล่าง · 3 ตัวบน — ทุกหวย
// ไทย: 2/3 บน = ท้ายรางวัลที่ 1 · 2 ล่าง = เลขท้าย 2 ตัว
// ลาว: 2/3 บน = ท้ายเลข 6 ตัว · 2 ล่าง = หลักที่ 3–4 ของเลข 6 ตัว (ตรงกับคอลัมน์ bottom2 ในฐานครบ 314/314 งวด)
// ฮานอย: top2 / bottom2 / top3 จากฐาน
const PICKS = [["top2", "2 บน"], ["bottom2", "2 ล่าง"], ["top3", "3 ตัว"]];
const ND = () => (S.pick === "top3" ? 3 : 2);
function numOf(d) {
  const L = S.lottery, k = S.pick;
  if (L === "thai") return k === "top3" ? d.first_prize.slice(-3) : k === "top2" ? d.first_prize.slice(-2) : d.last2;
  if (L === "lao") return k === "top3" ? d.six.slice(-3) : k === "top2" ? d.six.slice(-2) : d.six.slice(2, 4);
  return k === "top3" ? d.top3 : k === "top2" ? d.top2 : d.bottom2;
}
// ผลรวมหลักตามทฤษฎี (%) สำหรับเลข nd หลัก
function sumTheory(nd) {
  let w = [1];
  for (let i = 0; i < nd; i++) { const n = Array(w.length + 9).fill(0); w.forEach((c, j) => { for (let k = 0; k < 10; k++) n[j + k] += c; }); w = n; }
  return w.map((c) => (c / 10 ** nd) * 100);
}
function stats(list) {
  const nd = ND(), K = 10 ** nd, p0 = 1 / K;   // 2 ตัว: 100 เลข โอกาส 1% · 3 ตัว: 1,000 เลข โอกาส 0.1%
  const N = list.length, counts = Array(K).fill(0), digit = Array(10).fill(0), sum = Array(9 * nd + 1).fill(0), mon = Array.from({ length: 12 }, () => [0, 0]);
  let even = 0;
  const lastIdx = Array(K).fill(-1);
  // list เรียงใหม่→เก่า : index 0 = งวดล่าสุด
  list.forEach((d, i) => {
    const t = numOf(d), n = Number(t);
    let ds = 0; for (const ch of t) { const x = Number(ch); digit[x]++; ds += x; }
    counts[n]++; sum[ds]++; if (n % 2 === 0) even++;
    if (lastIdx[n] < 0) lastIdx[n] = i;
    const m = Number(d.draw_date.slice(5, 7)) - 1; mon[m][0] += ds; mon[m][1]++;
  });
  const expD = (nd * N) / 10;
  const chiD = expD > 0 ? digit.reduce((s, o) => s + (o - expD) ** 2 / expD, 0) : 0;
  const exp2 = N / K;
  const chi2 = exp2 > 0 ? counts.reduce((s, o) => s + (o - exp2) ** 2 / exp2, 0) : 0;
  const gap = lastIdx.map((i) => (i < 0 ? N : i)); // จำนวนงวดที่ยังไม่ออก
  const beta = (c) => { const a = c + 1, b = N - c + K - 1, m = a / (a + b), sd = Math.sqrt((a * b) / ((a + b) ** 2 * (a + b + 1))); return { m, lo: Math.max(0, m - 1.96 * sd), hi: m + 1.96 * sd }; };
  const post = counts.map((c) => ({ c, ...beta(c) }));
  // จำนวนเลขที่ "คาดว่า" ช่วง 95% จะไม่คร่อมค่าทฤษฎีถ้าสุ่มจริง: Σ P(c | Binom(N,p0)) × [ช่วงของ c ไม่คร่อม p0] × K
  let expOut = 0;
  if (N > 0) {
    let pmf = Math.pow(1 - p0, N);
    for (let c = 0; c <= N; c++) {
      const b = beta(c);
      if (b.lo > p0 || b.hi < p0) expOut += pmf;
      pmf *= ((N - c) / (c + 1)) * (p0 / (1 - p0));
      if (c > N * p0 * 3 + 60 && pmf < 1e-12) break;
    }
    expOut *= K;
  }
  return {
    nd, K, p0, N, counts, digit, sum, even, odd: N - even, mon, gap, post, expOut,
    expD, chiD, pD: expD >= 5 ? chiP(chiD, 9) : null,
    exp2, chi2, p2: exp2 >= 5 ? chiP(chi2, K - 1) : null,
  };
}

function vAnalysis(st) {

  const p2txt = st.p2 === null ? `${rng}: ต้องมี ≥ ${(st.K * 5).toLocaleString()} งวด` : `${rng}: χ² ${st.chi2.toFixed(1)} · p ${st.p2.toFixed(3)}`;

  const p0 = st.p0, th = st.nd === 3 ? "0.1%" : "1%", dp = st.nd === 3 ? 2 : 1;

        <line x1="${x(p0)}" x2="${x(p0)}" y1="0" y2="14" stroke="var(--ink2)" stroke-width="1.2" stroke-dasharray="3 2" vector-effect="non-scaling-stroke"/>
        <line x1="${x(t.lo)}" x2="${x(t.hi)}" y1="7" y2="7" stroke="var(--acc)" stroke-width="2" vector-effect="non-scaling-stroke"/>
        <line x1="${x(t.lo)}" x2="${x(t.lo)}" y1="3" y2="11" stroke="var(--acc)" stroke-width="2" vector-effect="non-scaling-stroke"/>

// กราฟแท่ง (ซีรีส์เดียว สีเดียว) + เส้นค่าทฤษฎี
function barChart(id, labels, values, theory, fmt, tipFmt, label = "") {
  const W = 340, H = 170, L = 26, R = 6, T = 10, B = 22;
  const vmax = Math.max(...values, ...theory) * 1.12 || 1;
  const n = values.length, step = (W - L - R) / n, bw = Math.max(4, step - 3);
  const y = (v) => T + (H - T - B) * (1 - v / vmax);
  const ticks = [0, vmax / 2, vmax].map((v) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 4}" y="${y(v) + 3}" text-anchor="end">${fmt(v)}</text>`).join("");
  const bars = values.map((v, i) => {
    const x0 = L + i * step + (step - bw) / 2, h = Math.max(0, y(0) - y(v)), r = Math.min(4, bw / 2, h);
    const path = h > 0 ? `M${x0},${y(0)} V${y(v) + r} Q${x0},${y(v)} ${x0 + r},${y(v)} H${x0 + bw - r} Q${x0 + bw},${y(v)} ${x0 + bw},${y(v) + r} V${y(0)} Z` : "";
    return `<path d="${path}" fill="var(--acc)"/><rect class="hit" x="${L + i * step}" y="${T}" width="${step}" height="${H - T - B}" data-tip="${esc(tipFmt(i))}" data-x="${x0 + bw / 2}" data-y="${y(v)}"/>` +
      `<text class="ax" x="${x0 + bw / 2}" y="${H - 8}" text-anchor="middle">${labels[i]}</text>`;
  }).join("");
  let ref = "";
  if (theory.every((t) => t === theory[0])) ref = `<line class="ref" x1="${L}" x2="${W - R}" y1="${y(theory[0])}" y2="${y(theory[0])}"/>`;
  else ref = `<polyline class="ref" fill="none" points="${theory.map((t, i) => `${L + i * step + step / 2},${y(t)}`).join(" ")}"/>`;
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${ticks}<line class="grid" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--muted)"/>${bars}${ref}</svg><div class="tip" role="status"></div></div>`;
}

    table(["เลข", "ครั้ง", "%", "ทฤษฎี"], st.digit.map((c, i) => [i, c, pct[i].toFixed(1), "10.0"])) + `</div>`;
  const SM = 9 * st.nd, sp = st.sum.map((c) => (st.N ? (c / st.N) * 100 : 0)), th = sumTheory(st.nd), thf = (v) => (st.nd === 3 ? v.toFixed(1) : String(Math.round(v)));
  html += `<div class="card"><h2><span class="ic">${IC.bars}</span>ผลรวมหลัก 0–${SM}</h2>` +
    barChart("c-sum", [...Array(SM + 1).keys()].map((k) => (k % 3 === 0 ? k : "")), sp, th, (v) => v.toFixed(0) + "%", (i) => `ผลรวม ${i}: ${st.sum[i]} งวด (${sp[i].toFixed(1)}%) · ทฤษฎี ${thf(th[i])}%`, `กราฟผลรวมหลัก 0 ถึง ${SM} เทียบทฤษฎี`) +
    `<div class="legend"><span><i style="background:var(--acc)"></i>สัดส่วนจริง</span><span><i class="line"></i>ทฤษฎี (ยอดที่ ${st.nd === 3 ? "13–14" : "9"})</span></div>` +
    table(["ผลรวม", "งวด", "%", "ทฤษฎี %"], st.sum.map((c, i) => [i, c, sp[i].toFixed(1), thf(th[i])])) + `</div>`;
  const ma = st.mon.map(([s, c]) => (c ? s / c : 0));
  html += `<div class="card"><h2><span class="ic">${IC.bars}</span>ผลรวมหลักเฉลี่ย รายเดือน</h2>` +
    barChart("c-mon", MON, ma, Array(12).fill(4.5 * st.nd), (v) => v.toFixed(0), (i) => `${MON[i]}: เฉลี่ย ${ma[i].toFixed(2)} (${st.mon[i][1]} งวด)`, `กราฟผลรวมหลักเฉลี่ยรายเดือน เทียบทฤษฎี ${4.5 * st.nd}`) +
    `<div class="legend"><span><i style="background:var(--acc)"></i>ค่าเฉลี่ยจริง</span><span><i class="line"></i>ทฤษฎี ${(4.5 * st.nd).toFixed(1)}</span></div></div>`;
  html += `<div class="card" style="display:flex;align-items:center;justify-content:center;gap:14px;font-size:20px;font-weight:700">
    <span style="color:var(--c-blue)">คู่ ${st.even}</span><span style="color:var(--muted)">:</span><span style="color:var(--thai)">คี่ ${st.odd}</span></div>`;
  return html + NOTE;
}

function mix(hexA, hexB, t) {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const a = p(hexA), b = p(hexB);
  return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(",")})`;
}
function vMap3(st) {
  const cs = getComputedStyle(document.documentElement);
  const surf = cs.getPropertyValue("--soft").trim(), acc = cs.getPropertyValue("--acc").trim();
  const accHex = acc.startsWith("#") ? acc : "#d71f2b", surfHex = surf.startsWith("#") ? surf : "#eef1f6";
  const dark = cs.getPropertyValue("--on-acc").trim() !== "#ffffff";
  // ช่อง [หลักร้อย][หลักสิบ] = รวมจำนวนครั้งของ 10 เลข (เช่น 47x = 470–479) · ทฤษฎีต่อช่อง = N/100
  const cell = Array.from({ length: 100 }, (_, i) => st.counts.slice(i * 10, i * 10 + 10).reduce((a, b) => a + b, 0));
  const max = Math.max(1, ...cell);
  let html = headRow(st) + `<div class="card"><h2 style="font-size:15px">ตาราง 000–999 · ช่องละ 10 เลข (เช่น 47x = 470–479)</h2><div class="heat" id="heat">` + cell.map((c, i) => {
    const t = c / max, bg = mix(surfHex, accHex, 0.08 + t * 0.92), fg = t > 0.55 ? (dark ? "#10141f" : "#ffffff") : "var(--ink)";
    return `<button style="background:${bg};color:${fg}" data-tip="${pad(i)}x: ${c} ครั้ง" aria-label="${pad(i)}x ออก ${c} ครั้ง">${pad(i)}x</button>`;
  }).join("") + `</div><div class="ramp" style="background:linear-gradient(90deg,${mix(surfHex, accHex, 0.08)},${accHex})"></div>
    <div class="ramp-l"><span>0 ครั้ง</span><span>${max} ครั้ง</span></div><div class="tip" id="htip"></div></div>`;
  const drawn = st.counts.filter((c) => c > 0).length;
  html += `<div class="stat3" style="margin-top:12px">
    <div class="tile"><div class="t" style="color:var(--c-green)">${drawn}<span style="font-size:14px;color:var(--ink2)">/1000</span></div><div class="l">เคยออก</div></div>
    <div class="tile"><div class="t" style="color:var(--c-blue)">${1000 - drawn}</div><div class="l">ไม่เคยออก</div></div>
    <div class="tile"><div class="t" style="color:var(--c-purple)">${(st.N / 1000).toFixed(2)}</div><div class="l">เฉลี่ย/เลข</div></div></div>`;
  const hot = st.counts.map((c, n) => ({ c, n })).filter((x) => x.c > 0).sort((a, b) => b.c - a.c || st.gap[a.n] - st.gap[b.n] || a.n - b.n).slice(0, 5);
  html += `<div class="card"><h2 style="justify-content:center">ออกบ่อยสุด</h2><div class="miss">` +
    hot.map((m) => `<div><div class="c">${pad(m.n, 3)}</div><small>${m.c} ครั้ง</small></div>`).join("") + `</div></div>`;
  const miss = st.gap.map((g, n) => ({ g, n })).sort((a, b) => b.g - a.g || a.n - b.n);
  const never = miss.filter((m) => m.g === st.N).length;
  html += `<div class="card"><h2 style="justify-content:center">ไม่ออกนานสุด</h2>` +
    (never ? `<p class="sub" style="text-align:center;margin:0">ยังไม่เคยออกเลย ${never} เลข (ในช่วงที่เลือก)</p>` : `<div class="miss">` +
    miss.slice(0, 5).map((m) => `<div><div class="c">${pad(m.n, 3)}</div><small>${m.g} งวด</small></div>`).join("") + `</div>`) +
    `<p class="sub" style="margin:10px 0 0;text-align:center">ไม่ออกนาน ≠ ใกล้ออก — โอกาสงวดหน้ายังเท่าเดิม</p></div>`;
  return html + NOTE;
}
function vMap(st) {
  if (st.nd === 3) return vMap3(st);
  const cs = getComputedStyle(document.documentElement);
  const surf = cs.getPropertyValue("--soft").trim(), acc = cs.getPropertyValue("--acc").trim();
  const accHex = acc.startsWith("#") ? acc : "#d71f2b", surfHex = surf.startsWith("#") ? surf : "#eef1f6";
  const max = Math.max(1, ...st.counts), dark = cs.getPropertyValue("--on-acc").trim() !== "#ffffff";
  let html = headRow(st) + `<div class="card"><div class="heat" id="heat">` + st.counts.map((c, n) => {
    const t = c / max, bg = mix(surfHex, accHex, 0.08 + t * 0.92);
    const fg = t > 0.55 ? (dark ? "#10141f" : "#ffffff") : "var(--ink)";
    return `<button style="background:${bg};color:${fg}" data-tip="${pad(n)}: ${c} ครั้ง · ไม่ออกมา ${st.gap[n]} งวด" aria-label="${pad(n)} ออก ${c} ครั้ง">${pad(n)}</button>`;
  }).join("") + `</div><div class="ramp" style="background:linear-gradient(90deg,${mix(surfHex, accHex, 0.08)},${accHex})"></div>
    <div class="ramp-l"><span>0 ครั้ง</span><span>${max} ครั้ง</span></div><div class="tip" id="htip"></div></div>`;
  const drawn = st.counts.filter((c) => c > 0).length;
  html += `<div class="stat3" style="margin-top:12px">
    <div class="tile"><div class="t" style="color:var(--c-green)">${drawn}<span style="font-size:14px;color:var(--ink2)">/100</span></div><div class="l">เคยออก</div></div>
    <div class="tile"><div class="t" style="color:var(--c-blue)">${100 - drawn}</div><div class="l">ไม่เคยออก</div></div>
    <div class="tile"><div class="t" style="color:var(--c-purple)">${(st.N / 100).toFixed(1)}</div><div class="l">เฉลี่ย/เลข</div></div></div>`;
  const miss = st.gap.map((g, n) => ({ g, n })).sort((a, b) => b.g - a.g || a.n - b.n).slice(0, 5);
  html += `<div class="card"><h2 style="justify-content:center">ไม่ออกนานสุด</h2><div class="miss">` +
    miss.map((m) => `<div><div class="c">${pad(m.n)}</div><small>${m.g}${m.g === st.N ? "+" : ""} งวด</small></div>`).join("") +
    `</div><p class="sub" style="margin:10px 0 0;text-align:center">ไม่ออกนาน ≠ ใกล้ออก — โอกาสงวดหน้ายังเท่าเดิม</p></div>`;
  return html + NOTE;
}

function vLearn() {
  const last = DATA.log ? new Date(DATA.log.run_at) : null;
  return `<div class="card"><h2>โอกาสถูกจริง</h2><ul class="list odds">
    <li><span>รางวัลที่ 1 (6 หลัก)</span><b>1 ใน 1,000,000</b></li>
    <li><span>3 ตัว (ต่อ 1 ชุด)</span><b>1 ใน 1,000</b></li>
    <li><span>2 ตัว</span><b>1 ใน 100</b></li></ul></div>
  <div class="card"><h2>สถิติบอกอะไรได้</h2><ul class="facts">
    <li>✓ ตรวจว่าผลออก “สุ่มจริง” ไหม (Chi-square)</li>
    <li>✓ ดูความถี่ย้อนหลังแบบมีช่วงความเชื่อมั่น</li>
    <li>✗ ทำนายงวดหน้าไม่ได้ — แต่ละงวดไม่ขึ้นต่อกัน</li>
    <li>✗ เลขไม่ออกนาน ไม่ได้แปลว่าใกล้ออก</li>
    <li>✗ เล่นนานไป ค่าคาดหวังติดลบเสมอ</li></ul></div>
  <div class="card src"><h2>แหล่งข้อมูล</h2><ul class="facts" style="list-style:none;padding:0">
    <li><b style="color:var(--thai)">ไทย</b> · <a href="https://gdcatalog.glo.or.th/dataset/dataset_c4-9_01" target="_blank" rel="noopener">API สำนักงานสลากฯ (GLO)</a></li>
    <li><b style="color:var(--hanoi)">ฮานอยปกติ</b> · ผลทางการ XSMB · <a href="https://github.com/khiemdoan/vietnam-lottery-xsmb-analysis" target="_blank" rel="noopener">ชุดข้อมูลรายวัน</a></li>
    <li><b style="color:var(--hanoi)">ฮานอยพิเศษ · VIP</b> · เว็บรวมผล ≥ 2 แห่งตรงกัน</li>
    <li><b style="color:var(--lao)">ลาว</b> · ผลจากข่าว (ข่าวสด·สนุก·กะปุก) · ไม่มี API ทางการ</li>
    <li style="color:var(--muted)">ดึงผลอัตโนมัติทุก 5–10 นาที ช่วง 15:00–03:50 น.${last ? ` · ดึงล่าสุด ${thDate(`${last.getFullYear()}-${pad(last.getMonth() + 1)}-${pad(last.getDate())}`)} ${hhmm(last)}` : ""}</li>
    <li style="color:var(--muted)">เวอร์ชัน ${APP_VER}</li></ul></div>` + NOTE;
}

// ═══ render ═══
function render() {
  document.documentElement.style.setProperty("--acc", `var(--${S.lottery})`);
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).getPropertyValue("--" + S.lottery).trim();
  store.set("lotto.ui", { lottery: S.lottery, round: S.round, range: S.range, tab: S.tab, pick: S.pick });
  document.querySelectorAll("#ltabs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.l === S.lottery)));
  document.querySelectorAll("#nav button").forEach((b) => { if (b.dataset.t === S.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  const rounds = $("#rounds");
  rounds.hidden = S.lottery !== "hanoi";
  rounds.innerHTML = ROUNDS.map((r) =>
    `<button class="chip" data-r="${r.id}" aria-pressed="${S.round === r.id}">${r.name} <span class="na">${r.time}</span></button>`).join("");
  $("#ranges").innerHTML = [["3m", "3 เดือน"], ["1y", "1 ปี"], ["2y", "2 ปี"], ["5y", "5 ปี"]].map(([id, t]) =>
    `<button class="chip" data-g="${id}" aria-pressed="${S.range === id}">${t}</button>`).join("");
  $("#ranges").hidden = S.tab === "latest" || S.tab === "learn";

  if (DATA.offline) setStatus("warn", `ออฟไลน์ · ${hhmm(new Date(DATA.at))}`);
  else if (DATA.at && DATA.miss && DATA.miss.length) setStatus("warn", `${DATA.miss.join("·")} โหลดไม่ได้ · ${hhmm(new Date(DATA.at))}`);
  else if (DATA.at) setStatus("ok", `อัปเดต ${hhmm(new Date(DATA.at))}`);
  else if (DATA.error) setStatus("warn", "เชื่อมต่อไม่ได้");

  let html;
  if (S.tab === "learn") html = vLearn();
  else html = viewBlocked() || (() => {
    if (S.tab === "latest") return vLatest();
    const st = stats(draws());
    if (!rowsOf(S.lottery).length) return emptyCard("ยังไม่มีข้อมูลหวยนี้", "ต่อเน็ตแล้วกดป้ายสถานะมุมขวาบนเพื่อรีเฟรช");
    if (!st.N) return emptyCard("ไม่มีงวดในช่วงนี้", "ลองเลือกช่วงเวลาที่ยาวขึ้น");
    return S.tab === "analysis" ? vAnalysis(st) : S.tab === "freq" ? vFreq(st) : vMap(st);
  })();
  $("#view").innerHTML = html;
}

// ═══ events ═══
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.l) { S.lottery = b.dataset.l; render(); window.scrollTo(0, 0); }
  else if (b.dataset.t) { S.tab = b.dataset.t; render(); window.scrollTo(0, 0); }
  else if (b.dataset.g) { S.range = b.dataset.g; render(); }
  else if (b.dataset.r) { S.round = b.dataset.r; render(); }
  else if (b.dataset.pick) { S.pick = b.dataset.pick; render(); }
  else if (b.id === "status") refresh();
  else if (b.dataset.tip) showTip(b, $("#htip"), b.offsetLeft + b.offsetWidth / 2, b.offsetTop);
});
function showTip(el, tip, x, y) {
  tip.textContent = el.dataset.tip; tip.style.display = "block";
  const half = tip.offsetWidth / 2 + 4, maxX = tip.offsetParent ? tip.offsetParent.clientWidth - half : x;
  tip.style.left = Math.max(half, Math.min(x, maxX)) + "px"; tip.style.top = y + "px"; tip.classList.add("on"); clearTimeout(tip._t); tip._t = setTimeout(() => tip.classList.remove("on"), 2200); }
function chartTip(e) {
  const hit = e.target.closest && e.target.closest(".hit"); if (!hit) return;
  const box = hit.closest(".chart"), svg = box.querySelector("svg"), tip = box.querySelector(".tip");
  const k = svg.getBoundingClientRect().width / svg.viewBox.baseVal.width;
  showTip(hit, tip, Number(hit.dataset.x) * k, Number(hit.dataset.y) * k);
}
document.addEventListener("pointerover", chartTip);
document.addEventListener("pointerdown", chartTip);

// ═══ start ═══
const cached = store.get("lotto.data");
if (hasData(cached)) { DATA = { ...cached, ...cleanAll(cached), miss: [], offline: false }; render(); }
refresh();
setInterval(() => { if (document.visibilityState === "visible") refresh(); }, REFRESH_MS);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && (!DATA.at || Date.now() - Date.parse(DATA.at) > 60000)) refresh();
});
</script>
</body>
</html>
