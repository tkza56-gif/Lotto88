//  ข. แรงเด้ง: วัดจากราคาสูงสุดใน 10 วันหลังแตะ หารด้วย ATR · ≥ 2 ATR = เด้งแรง · < 1 ATR = เด้งเบา · เด้งเบาลงทุกครั้ง = แรงซื้อหมด
//  ค. จุดสูงต่ำลง: ยอดก่อนแตะครั้งแรก / ระหว่างแตะ / หลังแตะครั้งล่าสุด ต่ำลงต่อเนื่อง ≥ 3 ยอด = สามเหลี่ยมขาลง (ฝั่งขายกดหนักขึ้น)
//  เพิ่ม: เคยเป็นแนวต้านแล้วราคาทะลุขึ้นมา (แนวต้านกลายเป็นแนวรับ) = แข็งขึ้น · ราคากำลังลงมาแตะซ้ำอีกครั้ง = นับเป็นครั้งถัดไป
function supQuality(rows, lv, a, resAll, p) {
  if (!lv || !a) return null;

  const bounces = pts.map(t => { const end = Math.min(rows.length - 1, t.i + 10); return end - t.i < 5 ? null : (H(t.i + 1, end) - t.v) / a; });

  const pk = [HI(pts[0].i - 20, pts[0].i - 1)];
  for (let j = 0; j < n - 1; j++) pk.push(HI(pts[j].i + 1, pts[j + 1].i - 1));
  if (rows.length - 1 - pts[n - 1].i >= 5) pk.push(HI(pts[n - 1].i + 1, rows.length - 1));

  let lh = 0; for (let j = peaks.length - 1; j > 0 && peaks[j].v < peaks[j - 1].v - a * 0.25; j--) lh++;

  if (n >= 4) { score -= 2; why.push(`⚠️ แตะมาแล้ว ${n} ครั้ง แรงซื้อถูกใช้ไปมาก${n >= 6 ? ' (มากเกินจะเชื่อได้)' : ''}`); }
  else if (n === 3) { score -= 1; why.push(`⚠️ แตะมาแล้ว 3 ครั้ง แรงซื้อเริ่มน้อยลง`); }
  else why.push(n === 1 ? 'แตะมาแล้ว 1 ครั้ง (ยังสด)' : 'แตะมาแล้ว 2 ครั้ง (ยืนยันแล้ว)');

    if (lastB >= 2) { score += 1; why.push(`ครั้งล่าสุดเด้งแรง ✓ ${fmt(lastB, 1)} ATR`); }

  if (flip) { score += 1; why.push('เคยเป็นแนวต้าน แล้วราคาทะลุขึ้นมา (แนวต้านกลายเป็นแนวรับ)'); }

function analyze(rows, q, C = '$') {

    else if (p < m50 && m50 < m200 && slope50 < 0) { trend = 'ขาลง'; tcls = 'down'; why = 'ราคาอยู่ใต้เส้นเฉลี่ย 50 และ 200 วัน และเส้น 50 วันชี้ลง'; }
    else { trend = 'ไซด์เวย์/ผสม'; tcls = ''; why = 'สัญญาณจากเส้นเฉลี่ยยังขัดกัน'; }
  } else if (m50 != null) {
    trend = p > m50 && m20 > m50 ? 'ขาขึ้นระยะสั้น' : p < m50 && m20 < m50 ? 'ขาลงระยะสั้น' : 'ไซด์เวย์';
    tcls = trend.startsWith('ขาขึ้น') ? 'up' : trend.startsWith('ขาลง') ? 'down' : '';

  } else { trend = 'ข้อมูลยังน้อย'; tcls = ''; why = 'มีราคาไม่ถึง 50 วัน'; }

  else if (m50 != null && m50 < p) { buy = [m50 - a / 2, m50 + a / 2]; buyWhy = 'รอบเส้นเฉลี่ย 50 วัน ± ครึ่ง ATR (ยังไม่มีแนวรับชัดใน 25% ใต้ราคา)'; }
  else { buy = [p - 2 * a, p - a]; buyWhy = 'ยังไม่มีแนวรับชัด ใช้ราคาปัจจุบันลบ 1–2 ATR'; }

    targetWhy: res.length ? `แนวต้าน (จุดสูงล่าสุดแถวนี้ ${thDate(res[0].d)})` : 'จุดสูงสุด 52 สัปดาห์', rr, Q, inZone: p >= buy[0] && p <= buy[1] };
}

async function loadDaily(sym, n) {
  const have = S.daily[sym];
  if (have && have.length >= Math.min(n, have.full ? 0 : n)) return have;
  const rows = [];
  for (let off = 0; off < n; off += 1000) {
    const page = await api(`stk_daily?select=d,o,h,l,c&symbol=eq.${encodeURIComponent(sym)}&order=d.desc&limit=${Math.min(1000, n - off)}&offset=${off}`);
    rows.push(...page);
    if (page.length < Math.min(1000, n - off)) { rows.full = true; break; }
  }
  const asc = rows.reverse(); asc.full = rows.full || false;
  S.daily[sym] = asc;
  return asc;
}
async function loadBase() {
  const [syms, quotes] = await Promise.all([api('stk_symbols?select=symbol,name,sector,market,kind&active=eq.true&order=symbol'), api('stk_quote?select=*')]);
  S.symbols = syms; S.quotes = Object.fromEntries(quotes.map(q => [q.symbol, q]));

}

function spark(rows) {

  const pts = c.map((v, i) => `${(i / (c.length - 1) * W).toFixed(1)},${(H - 2 - (v - mn) / (mx - mn || 1) * (H - 4)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(${c[c.length - 1] >= c[0] ? '--up' : '--down'})" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}

function newsItem(n) {

  const tags = (n.tags || []).map(t => `<span class="pill">${esc(TAG_TH[t] || t)}</span>`).join('');
  return `<div class="news"><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a>
    <div class="meta">${[n.symbol ? '<b>' + esc(n.symbol) + '</b>' : '🌍 ข่าวโลก', n.source ? esc(n.source) : '', ago(n.published_at)].filter(Boolean).join(' · ')}</div>
    <div class="chips">${sc}${tags}${imp}</div></div>`;

function newsSummary(list, keys) {

  const rows = Object.entries(m).filter(([, v]) => v.p + v.n > 0).sort((a, b) => (b[1].p + b[1].n) - (a[1].p + a[1].n));
  if (!rows.length) return '';
  return `<div class="zone" style="background:var(--soft);border-color:transparent;margin-bottom:6px"><div class="t">🤖 บอทสรุป (${list.length} ข่าว)</div>${rows.map(([k, v]) => {
    const net = v.p - v.n, lab = net > 0 ? '<b class="up">เอียงบวก</b>' : net < 0 ? '<b class="down">เอียงลบ</b>' : '<b>ก้ำกึ่ง</b>';
    return `<div class="r">${esc(k)}: ข่าวบวก ${v.p} · ลบ ${v.n} → ${lab}</div>`; }).join('')}</div>`;

// ===================== บอทเรียนผลกระทบ (rpc stk_impact_study) =====================
async function loadStudy() { if (!S.study) S.study = await api('rpc/stk_impact_study', { method: 'POST', body: '{}' }); return S.study; }
// dir = ทิศของคำตัดสิน (เส้นสีตามคำตัดสิน ไม่ใช่ตามวันสุดท้าย)
function carSpark(car, sig, dir) {
  const W = 90, H = 26, v = car.map(Number), mx = Math.max(0.5, ...v.map(Math.abs));
  const pts = v.map((x, k) => `${(k / 10 * W).toFixed(1)},${(H / 2 - x / mx * (H / 2 - 2)).toFixed(1)}`).join(' ');
  const last = v[v.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" stroke="var(--line)"/><polyline points="${pts}" fill="none" stroke="var(${sig ? ((dir ?? last) >= 0 ? '--up' : '--down') : '--muted'})" stroke-width="1.6"/></svg>`;
}
function studyLine(r) {
  const v = verdict(r), C = v.car;
  // เกิดน้อยกว่า 3 ครั้ง: ทดสอบสถิติไม่ได้ แต่แสดงการขยับจริงไว้ประกอบ (เช่น DeepSeek 2025 ที่ NVDA ร่วงแรงวันเดียว)
  if (r.n < 3) {
    const big = r.car.map(Number).reduce((m, x, k) => Math.abs(x) > Math.abs(m[0]) ? [x, k] : m, [0, 0]);
    return `<span class="${cls(big[0])}">${big[0] >= 0 ? '⬆' : '⬇'} ${fmt(Math.abs(big[0]))}% เทียบตลาด (มากสุดวันที่ ${big[1]})</span> <span class="nm">· เกิดแค่ ${r.n} ครั้ง ใช้ประกอบ ยังสรุปไม่ได้</span>`;
  }
  if (!v.sig && !v.lean) return `<span class="nm">ไม่พบผลกระทบชัดเจน (${r.n} ครั้ง)</span>`;
  const when = v.first === 0 ? 'เห็นผลวันเดียวกับข่าว' : `เริ่มเห็นผลวันทำการที่ ${v.first}`;
  return `<b class="${v.sig ? cls(C) : ''}">${v.sig ? '' : 'มีแนวโน้ม '}${C > 0 ? '⬆ ขึ้น' : '⬇ ลง'} ${fmt(Math.abs(C))}% เทียบตลาด</b> <span class="nm">· ${when} · มากสุดวันที่ ${v.k} · ${r.n} ครั้ง${v.sig ? '' : ' · ยังไม่ชัด'}</span>`;
}
function studyForSymbol(st, sym) {
  const rows = (st.rows || []).filter(r => r.symbol === sym && r.n > 0);
  if (!rows.length) return `<div class="empty">ยังไม่มีวันข่าวพุ่งในช่วงที่หุ้นนี้มีราคา · บอทเก็บข่าวเพิ่มทุกวัน${sym === 'SPCX' ? ' (SPCX เพิ่งเข้าตลาด มิ.ย. 2026 ไม่มีในเหตุการณ์เก่า)' : ''}</div>`;
  rows.sort((a, b) => Math.abs(verdict(b).t) - Math.abs(verdict(a).t));
  const sig = rows.filter(r => verdict(r).sig).length, lean = rows.filter(r => verdict(r).lean).length;
  return `<div class="zone" style="background:var(--soft);border-color:transparent;margin:6px 0"><div class="t">${sig ? `พบผลกระทบชัด ${sig} แบบ` : `ยังไม่พบข่าวแบบไหนที่กระทบ ${esc(sym)} ชัดเจน`}${lean ? ` · มีแนวโน้ม ${lean} แบบ` : ''} (ทดสอบ ${rows.length} แบบ)</div></div>` +
    rows.map(r => `<div class="row" style="padding:7px 0;border-bottom:1px dashed var(--line)"><div class="grow"><div style="font-weight:600;font-size:14px">${esc(SRC_TH(r.tag))}</div><div style="font-size:13px">${studyLine(r)}</div></div>${carSpark(r.car, verdict(r).sig || verdict(r).lean, verdict(r).car)}</div>`).join('') +
    `<div class="note">เส้นเล็ก = ผลตอบแทนส่วนเกินสะสม วันที่ 0–10 · "ชัด" = เกิด ≥ 5 ครั้งและผ่านเกณฑ์สถิติ 99% · "มีแนวโน้ม" = เกิด ≥ 3 ครั้งและผ่าน 95% (ยังอาจบังเอิญได้) · ข่าวรายวันทั่วโลกย้อนได้ ~3 เดือน (GDELT) · ยิ่งเก็บนาน ยิ่งน่าเชื่อถือ</div>`;
}

const GCH = { W: 360, H: 200, L: 32, R: 8, T: 12, B: 20 };
function goldChart(rows, k) {

  const step = mx > 20000 ? 20000 : mx > 2000 ? 1000 : 500, ticks = [];

  const yrs = rows.map((r, i) => [r[0], i]).filter(([m]) => m.endsWith('-01'));

    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${t >= 1000 ? (t / 1000) + 'k' : t}</text>`).join('')}
    ${yrs.filter((_, j) => j % 2 === 0).map(([m, i]) => `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${+m.slice(0, 4) + 543}</text>`).join('')}

    <circle cx="${x(pk)}" cy="${y(v[pk])}" r="3.5" fill="var(--down)" stroke="var(--card)" stroke-width="2"/>
    <g id="ghov"></g></svg>`;
}

    <div class="card"><h2>🗓️ ทุกเดือน</h2><div class="sub">เรียงจากเดือนล่าสุด · แถวสีส้ม = สูงสุดตลอด 10 ปี</div>
      <div class="gwrap"><table class="num"><thead><tr><th>เดือน (แตะดูรายวัน)</th><th>ทองไทย (บาท)</th><th>ทองโลก (USD)</th></tr></thead><tbody>${rows.slice().reverse().map(r => `<tr class="${r === pkRow ? 'gpk' : ''}"><td><button class="chip" data-gm="${r[0]}" style="padding:2px 9px">${thMon(r[0])}</button></td><td>${fmt(r[2], 0)}</td><td>${fmt(r[1], 0)}</td></tr>`).join('')}</tbody></table></div>
      <div class="note">ทองไทย = ทองคำแท่ง 96.5% บาทละ <b>โดยประมาณ</b> คำนวณจากราคาทองโลกสูงสุดรายวัน × ค่าเงินบาทวันนั้น × 0.473 (ทอง 1 บาท = 15.244 กรัม) อาจต่างจากราคาสมาคมค้าทองคำราว 1–2% · ข้อมูลถึง ${esc(thDate(G.last_day))} · อัปเดตอัตโนมัติทุกวัน 17:23 น.</div>
      <div class="disc">ราคาสูงสุดในอดีตไม่ได้บอกว่าราคาจะขึ้นหรือลงต่อ</div></div>`);
  document.querySelectorAll('#gunit .chip').forEach(b => b.onclick = () => { S.goldUnit = b.dataset.u; renderGold(); });
  document.querySelectorAll('[data-gm]').forEach(b => b.onclick = () => { S.goldDay = b.dataset.gm; renderGoldDay(); document.getElementById('gday').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  renderGoldDay();
  const svg = document.getElementById('gch'), hov = document.getElementById('ghov'), tip = document.getElementById('gtip');
  const { W, L, R, T, H, B } = GCH;
  const pick = (ev) => {
    const rc = svg.getBoundingClientRect(), px = (ev.clientX - rc.left) / rc.width * W;
    const i = Math.max(0, Math.min(rows.length - 1, Math.round((px - L) / (W - L - R) * (rows.length - 1)))), r = rows[i];
    const xx = L + i * (W - L - R) / (rows.length - 1);
    hov.innerHTML = `<line x1="${xx}" x2="${xx}" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
    tip.textContent = `${thMon(r[0])} · สูงสุด ${fmt(r[k], 0)} ${unit}${k === 2 ? ' · ทองโลก ' + fmt(r[1], 0) + ' USD' : ' · ทองไทย ' + fmt(r[2], 0) + ' บาท'}`;
  };
  svg.addEventListener('pointermove', pick); svg.addEventListener('pointerdown', pick);
}

const TH_WD = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
async function loadGoldDaily() {
  if (!S.goldDaily) { const r = await fetch('./gold_daily.json', { cache: 'no-cache' }); if (!r.ok) throw new Error('gold_daily'); S.goldDaily = await r.json(); }
  return S.goldDaily;
}
async function renderGoldDay() {
  const el = document.getElementById('gdayBody');
  if (!el) return;
  let D;
  try { D = await loadGoldDaily(); } catch (e) { el.className = 'empty'; el.textContent = 'ยังไม่มีข้อมูลรายวัน · บอทจะดึงให้ในรอบอัปเดตถัดไป (ทุกวัน 17:23 น.)'; return; }
  const all = D.rows, months = [...new Set(all.map(r => r[0].slice(0, 7)))].sort().reverse();
  if (!months.includes(S.goldDay)) S.goldDay = months[0];
  const mi = months.indexOf(S.goldDay), rows = all.filter(r => r[0].startsWith(S.goldDay));
  const prevClose = (d) => { const i = all.findIndex(r => r[0] === d); for (let j = i - 1; j >= 0; j--) if (all[j][2] != null) return all[j][2]; return null; };
  const top = rows.reduce((a, b) => ((b[3] ?? -1) > (a[3] ?? -1) || ((b[3] ?? -1) === (a[3] ?? -1) && b[1] > a[1]) ? b : a), rows[0]);
  const wd = (d) => TH_WD[new Date(d + 'T00:00:00Z').getUTCDay()];
  el.className = '';
  el.innerHTML = `<div class="row" style="gap:6px;margin-top:8px;flex-wrap:nowrap">
      <button class="chip" id="gdPrev" ${mi >= months.length - 1 ? 'disabled' : ''} aria-label="เดือนก่อน">◀</button>
      <select id="gdSel" class="grow" aria-label="เลือกเดือน" style="min-width:0;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:7px 10px;font:inherit">${months.map(m => `<option value="${m}" ${m === S.goldDay ? 'selected' : ''}>${thMon(m)}</option>`).join('')}</select>
      <button class="chip" id="gdNext" ${mi <= 0 ? 'disabled' : ''} aria-label="เดือนถัดไป">▶</button></div>
    <div class="gwrap"><table class="num"><thead><tr><th>วันที่</th><th>ทองไทย สูงสุด (บาท)</th><th>ทองโลก สูงสุด</th><th>ทองโลก ปิด</th><th>เทียบวันก่อน</th></tr></thead><tbody>${rows.slice().reverse().map(r => {
      const pc = prevClose(r[0]), ch = r[2] != null && pc ? (r[2] / pc - 1) * 100 : null;
      return `<tr class="${r === top ? 'gpk' : ''}"><td style="white-space:nowrap">${wd(r[0])} ${+r[0].slice(8)}</td><td>${r[3] == null ? '–' : fmt(r[3], 0)}</td><td>${fmt(r[1], 1)}</td><td>${r[2] == null ? '–' : fmt(r[2], 1)}</td><td class="${ch == null ? '' : ch >= 0 ? 'up' : 'down'}">${ch == null ? '–' : (ch > 0 ? '+' : '') + fmt(ch, 2) + '%'}</td></tr>`;
    }).join('')}</tbody></table></div>
    <div class="note">ทองโลกเป็น USD/ออนซ์ · วันที่ตามตลาดนิวยอร์ก · "–" = วันนั้นไม่มีค่าเงินบาทหรือราคาปิด · ทองไทยเป็นค่าประมาณ (ทองโลก × USD/THB × 0.473)</div>`;
  document.getElementById('gdSel').onchange = (e) => { S.goldDay = e.target.value; renderGoldDay(); };
  document.getElementById('gdPrev').onclick = () => { S.goldDay = months[mi + 1]; renderGoldDay(); };
  document.getElementById('gdNext').onclick = () => { S.goldDay = months[mi - 1]; renderGoldDay(); };
}

// ===================== สลับแท็บ =====================
function go(tab) {
  S.tab = tab;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  window.scrollTo({ top: 0 });
  ({ list: renderList, stock: renderStock, news: renderNews, impact: renderImpact, gold: renderGold })[tab]();
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));
loadBase().then(() => go('list')).catch(() => { $main.innerHTML = '<div class="card empty">โหลดข้อมูลไม่ได้ · ตรวจอินเทอร์เน็ตแล้วลองใหม่</div>'; });
</script>
