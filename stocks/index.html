<div class="wrap">

<script>
// ===================== ข้อมูล (Supabase · อ่านอย่างเดียว) =====================
// ราคา/ข่าวเก็บโดย Edge Function stk-crawl (บอทของเราเอง ไม่ใช้ AI ภายนอก) · pg_cron ทุก 15 นาที
const REST = 'https://tlykaqoypstvdrlivwvu.supabase.co/rest/v1/';
const KEY = 'sb_publishable_IAmYP1QeDb5otH0sjMZaMA_Bme1gxwG';
async function api(path, opt = {}) {
  const r = await fetch(REST + path, { ...opt, headers: { apikey: KEY, 'Content-Type': 'application/json', ...(opt.headers || {}) }, cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
const TAG_TH = {
  mideast_war: 'สงครามตะวันออกกลาง/อิหร่าน', war_other: 'ความขัดแย้งอื่น', oil: 'น้ำมัน/OPEC', rates: 'ดอกเบี้ย/เงินเฟ้อ',
  tariffs: 'ภาษีนำเข้า/การค้า', defense: 'งบ/สัญญากลาโหม', earnings: 'งบการเงิน', supply: 'หุ้นเพิ่ม/ปลดล็อก',
  space: 'อวกาศ/ดาวเทียม', ai_chips: 'AI/ชิป', legal: 'คดี/หน่วยงานกำกับ',
};
const SECTORS = ['อวกาศ', 'พลังงาน', 'กลาโหม', 'สายการบิน', 'ทองคำ', 'ตลาดรวม', 'เทคโนโลยี'];
// ข้อมูลเฉพาะหุ้น (ตรวจจากเอกสาร IPO ก่อนใช้จริง)
const NOTES = {
  SPCX: 'เข้าตลาด Nasdaq 12 มิ.ย. 2026 ราคา IPO $135 · ระยะห้ามขายของผู้ถือหุ้นเดิม (lock-up) ปกติราว 180 วัน ≈ ต้น–กลาง ธ.ค. 2026 ช่วงนั้นมักมีแรงขายเพิ่ม (ตรวจวันจริงจากเอกสาร IPO)',
};
const IPO = { SPCX: 135 };

const S = { tab: 'list', symbols: [], quotes: {}, daily: {}, sel: 'SPCX', range: 250, news: null, newsFilter: 'all', events: null, learn: null, evSel: null };
const $main = document.getElementById('main');
const fmt = (n, d = 2) => n == null || isNaN(n) ? '–' : Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (a, b) => (a / b - 1) * 100;
const sgn = (v) => (v > 0 ? '+' : '') + fmt(v) + '%';
const cls = (v) => v > 0 ? 'up' : v < 0 ? 'down' : '';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const thDate = (iso) => { const d = new Date(iso + (iso.length === 10 ? 'T00:00:00' : '')); return d.getDate() + ' ' + TH_M[d.getMonth()] + ' ' + String((d.getFullYear() + 543) % 100); };
const ago = (iso) => { const m = Math.round((Date.now() - new Date(iso)) / 6e4); return m < 60 ? m + ' นาทีที่แล้ว' : m < 1440 ? Math.round(m / 60) + ' ชม.ที่แล้ว' : Math.round(m / 1440) + ' วันที่แล้ว'; };

// ===================== ตัวชี้วัด =====================
const sma = (a, n) => a.map((_, i) => i + 1 < n ? null : a.slice(i + 1 - n, i + 1).reduce((s, x) => s + x, 0) / n);
function rsi(c, n = 14) {
  const out = Array(c.length).fill(null); let g = 0, l = 0;
  for (let i = 1; i < c.length; i++) {
    const ch = c[i] - c[i - 1], up = Math.max(ch, 0), dn = Math.max(-ch, 0);
    if (i <= n) { g += up; l += dn; if (i === n) { g /= n; l /= n; out[i] = 100 - 100 / (1 + g / (l || 1e-9)); } }
    else { g = (g * (n - 1) + up) / n; l = (l * (n - 1) + dn) / n; out[i] = 100 - 100 / (1 + g / (l || 1e-9)); }
  }
  return out;
}
function atr(rows, n = 14) {
  const tr = rows.map((r, i) => i ? Math.max(r.h - r.l, Math.abs(r.h - rows[i - 1].c), Math.abs(r.l - rows[i - 1].c)) : r.h - r.l);
  return tr.slice(-n).reduce((s, x) => s + x, 0) / Math.min(n, tr.length);
}
// แนวรับ/ต้าน = จุดต่ำ/สูงเฉพาะที่ (หน้าต่าง ±5 วัน) ใน 250 วันล่าสุด รวมระดับที่ห่างกันไม่เกิน 1.5%
function levels(rows) {
  const r = rows.slice(-250), k = 5, lows = [], highs = [];
  for (let i = k; i < r.length - k; i++) {
    const w = r.slice(i - k, i + k + 1);
    if (r[i].l === Math.min(...w.map(x => x.l))) lows.push({ v: r[i].l, d: r[i].d });
    if (r[i].h === Math.max(...w.map(x => x.h))) highs.push({ v: r[i].h, d: r[i].d });
  }
  const merge = (arr) => { const s = [...arr].sort((a, b) => a.v - b.v), out = [];
    for (const x of s) { const last = out[out.length - 1]; if (last && x.v / last.v - 1 < 0.015) { last.v = (last.v * last.n + x.v) / (last.n + 1); last.n++; if (x.d > last.d) last.d = x.d; } else out.push({ ...x, n: 1 }); }
    return out; };
  return { sup: merge(lows), res: merge(highs) };
}
function analyze(rows, q) {
  const c = rows.map(r => r.c), p = q?.price ?? c[c.length - 1];
  const s20 = sma(c, 20), s50 = sma(c, 50), s200 = sma(c, 200), R = rsi(c);
  const last = (a) => a[a.length - 1];
  const m20 = last(s20), m50 = last(s50), m200 = last(s200), rs = last(R), a = atr(rows);
  const slope50 = m50 != null && s50[s50.length - 21] != null ? pct(m50, s50[s50.length - 21]) : null;
  let trend, tcls, why;
  if (m200 != null) {
    if (p > m50 && m50 > m200 && slope50 > 0) { trend = 'ขาขึ้น'; tcls = 'up'; why = 'ราคาอยู่เหนือเส้นเฉลี่ย 50 และ 200 วัน และเส้น 50 วันชันขึ้น'; }
    else if (p < m50 && m50 < m200 && slope50 < 0) { trend = 'ขาลง'; tcls = 'down'; why = 'ราคาอยู่ใต้เส้นเฉลี่ย 50 และ 200 วัน และเส้น 50 วันชี้ลง'; }
    else { trend = 'ไซด์เวย์/ผสม'; tcls = ''; why = 'สัญญาณจากเส้นเฉลี่ยยังขัดกัน'; }
  } else if (m50 != null) {
    trend = p > m50 && m20 > m50 ? 'ขาขึ้นระยะสั้น' : p < m50 && m20 < m50 ? 'ขาลงระยะสั้น' : 'ไซด์เวย์';
    tcls = trend.startsWith('ขาขึ้น') ? 'up' : trend.startsWith('ขาลง') ? 'down' : '';
    why = 'ข้อมูลยังไม่ถึง 200 วัน ใช้เส้นเฉลี่ย 20 และ 50 วันแทน';
  } else { trend = 'ข้อมูลยังน้อย'; tcls = ''; why = 'มีราคาไม่ถึง 50 วัน'; }
  const rsiTxt = rs == null ? '' : rs >= 70 ? 'ซื้อมากเกินไป (RSI ≥ 70) มักย่อตัว' : rs <= 30 ? 'ขายมากเกินไป (RSI ≤ 30) มักเด้ง' : 'ปกติ';
  const L = levels(rows);
  const sup = L.sup.filter(x => x.v < p && x.v > p * 0.75).sort((x, y) => y.v - x.v);
  const res = L.res.filter(x => x.v > p * 1.005).sort((x, y) => x.v - y.v);
  let buy, buyWhy;
  if (sup.length) { buy = [sup[0].v, Math.min(sup[0].v + a, p)]; buyWhy = `แนวรับ $${fmt(sup[0].v)} (จุดต่ำล่าสุดแถวนี้ ${thDate(sup[0].d)}${sup[0].n > 1 ? ' · ราคาเด้งที่ระดับนี้ ' + sup[0].n + ' ครั้ง' : ''}) + ความผันผวน 1 ATR`; }
  else if (m50 != null && m50 < p) { buy = [m50 - a / 2, m50 + a / 2]; buyWhy = 'รอบเส้นเฉลี่ย 50 วัน ± ครึ่ง ATR (ยังไม่มีแนวรับชัดใน 25% ใต้ราคา)'; }
  else { buy = [p - 2 * a, p - a]; buyWhy = 'ยังไม่มีแนวรับชัด ใช้ราคาปัจจุบันลบ 1–2 ATR'; }
  const stop = buy[0] - a;
  const target = res.length ? res[0].v : q?.high52 > p ? q.high52 : null;
  const mid = (buy[0] + buy[1]) / 2, rr = target ? (target - mid) / (mid - stop) : null;
  return { p, s20, s50, s200, R, m20, m50, m200, rs, rsiTxt, a, trend, tcls, why, sup, res, buy, buyWhy, stop, target,
    targetWhy: res.length ? `แนวต้าน (จุดสูงล่าสุดแถวนี้ ${thDate(res[0].d)})` : 'จุดสูงสุด 52 สัปดาห์', rr, inZone: p >= buy[0] && p <= buy[1] };
}

// ===================== โหลดข้อมูล =====================
async function loadDaily(sym, n) {
  const have = S.daily[sym];
  if (have && have.length >= Math.min(n, have.full ? 0 : n)) return have;
  const rows = [];
  for (let off = 0; off < n; off += 1000) {
    const page = await api(`stk_daily?select=d,o,h,l,c&symbol=eq.${encodeURIComponent(sym)}&order=d.desc&limit=${Math.min(1000, n - off)}&offset=${off}`);
    rows.push(...page);
    if (page.length < Math.min(1000, n - off)) { rows.full = true; break; }
  }
  const asc = rows.reverse(); asc.full = rows.full || false;
  S.daily[sym] = asc;
  return asc;
}
async function loadBase() {
  const [syms, quotes] = await Promise.all([api('stk_symbols?select=symbol,name,sector&active=eq.true&order=symbol'), api('stk_quote?select=*')]);
  S.symbols = syms; S.quotes = Object.fromEntries(quotes.map(q => [q.symbol, q]));
  const t = quotes.map(q => q.updated_at).sort().pop();
  document.getElementById('upd').textContent = t ? 'อัปเดต ' + ago(t) : '';
}

// ===================== วาด =====================
function spark(rows) {
  const c = rows.slice(-60).map(r => r.c); if (c.length < 2) return '';
  const mn = Math.min(...c), mx = Math.max(...c), W = 64, H = 26;
  const pts = c.map((v, i) => `${(i / (c.length - 1) * W).toFixed(1)},${(H - 2 - (v - mn) / (mx - mn || 1) * (H - 4)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(${c[c.length - 1] >= c[0] ? '--up' : '--down'})" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
async function renderList() {
  const groups = {};
  S.symbols.forEach(s => (groups[s.sector || 'อื่นๆ (เพิ่มเอง)'] ??= []).push(s));
  const order = [...SECTORS, ...Object.keys(groups).filter(k => !SECTORS.includes(k))].filter(k => groups[k]);
  $main.innerHTML = `<div class="card"><h2>หุ้นที่ติดตาม</h2><div class="sub">แตะที่หุ้นเพื่อดูแนวโน้ม โซนราคา และข่าว · ราคาจาก Yahoo Finance (อาจช้า ~15 นาที)</div>
    ${order.map(g => `<div class="sec">${esc(g)}</div>` + groups[g].map(s => {
      const q = S.quotes[s.symbol], ch = q && q.prev_close ? pct(q.price, q.prev_close) : null;
      return `<div class="stock" data-sym="${esc(s.symbol)}"><div class="grow"><div class="sym">${esc(s.symbol)}</div><div class="nm">${esc(s.name || '')}</div></div>
        <span data-spark="${esc(s.symbol)}"></span>

function chartSvg(rows, A, n) {
  const view = rows.slice(-n), off = rows.length - view.length, W = 340, H = 200, L = 40, R = 6, T = 8, B = 18;
  const series = [['s200', '--s-200'], ['s50', '--s-50'], ['s20', '--s-20']];
  const vals = view.map(r => r.c).concat(series.flatMap(([k]) => A[k].slice(off).filter(v => v != null)), A.buy, [A.stop]);
  if (A.target) vals.push(A.target);
  const mn = Math.min(...vals) * 0.99, mx = Math.max(...vals) * 1.01;
  const x = (i) => L + i * (W - L - R) / Math.max(1, view.length - 1), y = (v) => T + (1 - (v - mn) / (mx - mn)) * (H - T - B);
  const path = (arr) => { let d = '', on = false; arr.forEach((v, i) => { if (v == null) { on = false; return; } d += (on ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); on = true; }); return d; };
  const ticks = [mn, (mn + mx) / 2, mx].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 4}" y="${y(v) + 3}" font-size="9" text-anchor="end" fill="var(--muted)">${fmt(v, v >= 100 ? 0 : 1)}</text>`).join('');
  const hline = (v, col, dash, lab) => v == null ? '' : `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(${col})" stroke-width="1" stroke-dasharray="${dash}"/><text x="${W - R - 2}" y="${y(v) - 3}" font-size="9" text-anchor="end" fill="var(${col})">${lab}</text>`;
  return `<svg id="chart" viewBox="0 0 ${W} ${H}" style="width:100%;display:block;touch-action:pan-y" role="img" aria-label="กราฟราคา ${esc(S.sel)}">
    ${ticks}
    <rect x="${L}" width="${W - L - R}" y="${y(A.buy[1])}" height="${Math.max(2, y(A.buy[0]) - y(A.buy[1]))}" fill="var(--zone)"/>
    ${hline(A.stop, '--down', '4 3', 'ตัดขาดทุน')}${hline(A.target, '--s-50', '4 3', 'เป้า')}${IPO[S.sel] ? hline(IPO[S.sel], '--muted', '2 3', 'IPO $' + IPO[S.sel]) : ''}
    ${series.map(([k, col]) => `<path d="${path(A[k].slice(off))}" fill="none" stroke="var(${col})" stroke-width="1.3"/>`).join('')}
    <path d="${path(view.map(r => r.c))}" fill="none" stroke="var(--s-price)" stroke-width="2" stroke-linejoin="round"/>
    <g id="hov"></g>
    <text x="${L}" y="${H - 4}" font-size="9" fill="var(--muted)">${thDate(view[0].d)}</text><text x="${W - R}" y="${H - 4}" font-size="9" text-anchor="end" fill="var(--muted)">${thDate(view[view.length - 1].d)}</text>
  </svg>`;
}
function rsiSvg(R, n) {
  const v = R.slice(-n), W = 340, H = 60, L = 40, R2 = 6;
  const x = (i) => L + i * (W - L - R2) / Math.max(1, v.length - 1), y = (r) => 4 + (1 - r / 100) * (H - 8);
  let d = '', on = false; v.forEach((r, i) => { if (r == null) { on = false; return; } d += (on ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(r).toFixed(1); on = true; });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block" role="img" aria-label="RSI">
    <rect x="${L}" width="${W - L - R2}" y="${y(70)}" height="${y(30) - y(70)}" fill="var(--soft)"/>
    ${[30, 70].map(t => `<text x="${L - 4}" y="${y(t) + 3}" font-size="9" text-anchor="end" fill="var(--muted)">${t}</text>`).join('')}
    <path d="${d}" fill="none" stroke="var(--s-50)" stroke-width="1.5"/></svg>`;
}

// ===================== ข่าว (บอทคัด) =====================
function newsItem(n) {
  const sc = n.score >= 0.2 ? '<span class="pill up">บวก</span>' : n.score <= -0.2 ? '<span class="pill down">ลบ</span>' : '<span class="pill">กลาง</span>';
  const imp = Object.entries(n.impacts || {}).map(([k, d]) => `<span class="pill ${d === '+' ? 'up' : d === '-' ? 'down' : ''}">${esc(k)} ${d === '+' ? '⬆' : d === '-' ? '⬇' : '↕'}</span>`).join('');
  const tags = (n.tags || []).map(t => `<span class="pill">${esc(TAG_TH[t] || t)}</span>`).join('');
  return `<div class="news"><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a>
    <div class="meta">${n.symbol ? '<b>' + esc(n.symbol) + '</b> · ' : '🌍 ข่าวโลก · '}${esc(n.source || '')} · ${ago(n.published_at)}</div>
    <div class="chips">${sc}${tags}${imp}</div></div>`;
}
// สรุปของบอท: นับข่าวบวก/ลบต่อกลุ่ม/หุ้น ในชุดข่าวที่แสดง
function newsSummary(list, keys) {
  const m = {};
  list.forEach(n => Object.entries(n.impacts || {}).forEach(([k, d]) => { if (keys && !keys.includes(k)) return; (m[k] ??= { p: 0, n: 0 }); if (d === '+') m[k].p++; if (d === '-') m[k].n++; }));
  const rows = Object.entries(m).filter(([, v]) => v.p + v.n > 0).sort((a, b) => (b[1].p + b[1].n) - (a[1].p + a[1].n));
  if (!rows.length) return '';
  return `<div class="zone" style="background:var(--soft);border-color:transparent;margin-bottom:6px"><div class="t">🤖 บอทสรุป (${list.length} ข่าว)</div>${rows.map(([k, v]) => {
    const net = v.p - v.n, lab = net > 0 ? '<b class="up">เอียงบวก</b>' : net < 0 ? '<b class="down">เอียงลบ</b>' : '<b>ก้ำกึ่ง</b>';
    return `<div class="r">${esc(k)}: ข่าวบวก ${v.p} · ลบ ${v.n} → ${lab}</div>`; }).join('')}</div>`;
}

    }
    document.getElementById('ev').className = '';
    document.getElementById('ev').innerHTML = `<div class="chips" style="margin:8px 0">${[['iran', '🇮🇷 สรุปเหตุการณ์อิหร่าน'], ...evs.map(e => [String(e.id), thDate(e.d) + ' ' + e.name])].map(([k, l]) =>
      `<button class="chip" data-e="${esc(k)}" aria-pressed="${String(S.evSel) === k}" style="text-align:left">${esc(l)}</button>`).join('')}</div>${table}
      <div class="note">SPCX เพิ่งเข้าตลาด มิ.ย. 2026 จึงไม่มีในเหตุการณ์เก่า · อดีตไม่รับประกันอนาคต แต่ละเหตุการณ์ตลาดตอบสนองต่างกัน (ขึ้นกับว่าตลาดคาดไว้ก่อนแค่ไหน)</div>`;
    document.querySelectorAll('#ev .chip').forEach(b => b.onclick = () => { S.evSel = b.dataset.e; renderImpact(); });
  } catch (e) { document.getElementById('ev').textContent = 'คำนวณไม่ได้ · ลองใหม่'; }
  try {
    if (!S.learn) S.learn = await api('rpc/stk_bot_learn', { method: 'POST', body: '{}' });
    const L = S.learn, el = document.getElementById('learn'), by = {};
    (L.rows || []).forEach(r => (by[r.tag] ??= []).push(r));
    el.className = '';
    el.innerHTML = !Object.keys(by).length ? '<div class="empty">ยังมีข้อมูลข่าวไม่พอ · บอทเก็บข่าวเพิ่มทุกวัน</div>' :
      `<div class="note">ข้อมูลข่าว ${L.since ? thDate(L.since) + ' – ' + thDate(L.until) : ''} · "ต่างจากปกติ" = ผลตอบแทนวันถัดไปหลังวันข่าวพุ่ง ลบด้วยค่าเฉลี่ยทุกวัน</div>` +
      Object.entries(by).map(([t, rs]) => `<div class="sec">${esc(TAG_TH[t] || t)} · ข่าวพุ่ง ${rs[0].n} วัน</div>
        <table class="num"><tbody>${rs.sort((a, b) => b.excess - a.excess).map(r => `<tr><td><b>${esc(r.symbol)}</b></td><td class="${cls(r.excess)}">${sgn(+r.excess)} จากปกติ</td><td>ขึ้น ${r.up}%</td></tr>`).join('')}</tbody></table>`).join('') +
      `<div class="disc">ตัวอย่างยังน้อย (ไม่กี่วันต่อหมวด) ตัวเลขแกว่งได้มาก · บอทเก็บข่าวและเรียนเพิ่มทุกวัน ยิ่งนานยิ่งน่าเชื่อถือ</div>`;
  } catch (e) { document.getElementById('learn').textContent = 'คำนวณไม่ได้ · ลองใหม่'; }
}

// ===================== สลับแท็บ =====================
function go(tab) {
  S.tab = tab;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  window.scrollTo({ top: 0 });
  ({ list: renderList, stock: renderStock, news: renderNews, impact: renderImpact })[tab]();
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));
loadBase().then(() => go('list')).catch(() => { $main.innerHTML = '<div class="card empty">โหลดข้อมูลไม่ได้ · ตรวจอินเทอร์เน็ตแล้วลองใหม่</div>'; });
</script>
</body>
